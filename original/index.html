// ===== Scorecard — KPI การทำงาน (รับเรื่อง → ส่งงาน) =====
const ScorecardPage = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const slaCfg = useSLAConfig();

  // ====== Work performance per user (จากการรับเรื่องไปจนถึงส่งงาน) ======
  // กฎ: นับเฉพาะคำขอที่มีการรับเรื่อง (receivedAt) และไม่ใช่โหมด "รับและจบ" (workMode='close')
  const blankStats = () => ({
    received: 0, completed: 0, onTime: 0, late: 0,
    inProgress: 0, overduePending: 0, totalWorkDays: 0,
    byMode: {
      'from-create': { received: 0, completed: 0, onTime: 0, late: 0 },
      'from-approve': { received: 0, completed: 0, onTime: 0, late: 0 },
      'from-receive': { received: 0, completed: 0, onTime: 0, late: 0 }
    }
  });
  const workerStats = {};
  const now = new Date();
  state.requests.forEach(r => {
    if (!r.receivedAt || !r.receivedBy) return;
    if (r.workMode === 'close') return; // โหมด "รับและจบ" ไม่นับ KPI ทำงาน
    const uid = r.receivedBy;
    workerStats[uid] = workerStats[uid] || { id: uid, ...blankStats() };
    const s = workerStats[uid];
    s.received++;
    const dlInfo = computeWorkDeadline(r, slaCfg);
    if (!dlInfo) return;
    const mode = dlInfo.mode;
    s.byMode[mode].received++;
    if (r.status === 'done' && r.completedAt) {
      s.completed++;
      s.byMode[mode].completed++;
      const recv = parseTh(r.receivedAt);
      const comp = parseTh(r.completedAt);
      if (recv && comp) s.totalWorkDays += Math.max(0, (comp - recv) / 86400000);
      const onTime = comp && comp <= dlInfo.deadline;
      if (onTime) { s.onTime++; s.byMode[mode].onTime++; }
      else { s.late++; s.byMode[mode].late++; }
    } else if (r.status === 'progress') {
      s.inProgress++;
      if (now > dlInfo.deadline) s.overduePending++;
    }
  });
  const rows = Object.values(workerStats).map(s => ({
    ...s,
    onTimeRate: s.completed > 0 ? Math.round(s.onTime / s.completed * 100) : 0,
    avgDays: s.completed > 0 ? (s.totalWorkDays / s.completed) : 0
  })).sort((a, b) => b.received - a.received);
  const me = rows.find(r => r.id === currentUser.id) || { id: currentUser.id, ...blankStats(), onTimeRate: 0, avgDays: 0 };

  // ====== คะแนน KPI (0-100) — เน้นการส่งงานทันเวลา ======
  // 70% จากอัตราตรงเวลา · 20% โทษงานค้างเกินกำหนด · 10% โบนัสจำนวนงาน
  const score = (() => {
    if (me.received === 0) return 0;
    let s = 0;
    s += me.onTimeRate * 0.7; // 0-70
    const overduePenalty = me.received > 0 ? Math.min(20, (me.overduePending / me.received) * 100) : 0;
    s += 20 - overduePenalty; // 0-20
    s += Math.min(10, me.received); // 0-10 (1 คะแนนต่อ 1 งาน, สูงสุด 10)
    return Math.max(0, Math.min(100, Math.round(s)));
  })();
  const grade = me.received === 0 ? '—' : score >= 90 ? 'A+' : score >= 80 ? 'A' : score >= 70 ? 'B+' : score >= 60 ? 'B' : score >= 50 ? 'C' : 'D';
  const gradeColor = me.received === 0 ? 'var(--ink-3)' : score >= 80 ? 'var(--green)' : score >= 60 ? 'var(--brand)' : score >= 50 ? 'var(--amber)' : 'var(--red)';

  // ====== ข้อมูลรองสำหรับคนนี้ ======
  const myReqs = state.requests.filter(r => r.requester === currentUser.id);
  const myTotalAmount = myReqs.reduce((s, r) => s + (r.amount || 0), 0);
  const myTypeStats = ['event','expense','borrow','purchase','overtime','leave','withdrawal','general','hire'].map(t => ({ type: t, label: TYPE_LABEL[t].th, color: TYPE_LABEL[t].color, count: myReqs.filter(r => r.type === t).length })).filter(t => t.count > 0);

  // ====== Approver stats (ผลงานการอนุมัติ — รอง) ======
  const apprStat = {};
  state.requests.forEach(r => r.flow.forEach(s => {
    if (!s.userId || (s.status !== 'approved' && s.status !== 'rejected')) return;
    apprStat[s.userId] = apprStat[s.userId] || { id: s.userId, approved: 0, rejected: 0 };
    if (s.status === 'approved') apprStat[s.userId].approved++; else apprStat[s.userId].rejected++;
  }));
  const apprRows = Object.values(apprStat).map(s => ({
    ...s, total: s.approved + s.rejected,
    rate: s.approved + s.rejected ? Math.round(s.approved / (s.approved + s.rejected) * 100) : 0
  })).sort((a, b) => b.total - a.total);
  const meAppr = apprRows.find(r => r.id === currentUser.id) || { approved: 0, rejected: 0, total: 0, rate: 0 };

  // ====== Achievements — เน้นการทำงาน ======
  const achievements = [
    { key: 'first-work', icon: 'check', name: 'รับงานแรก', desc: 'รับเรื่อง 1 งานขึ้นไป', earned: me.received >= 1 },
    { key: 'first-done', icon: 'send', name: 'ส่งงานแรก', desc: 'ส่งงานเสร็จ 1 งาน', earned: me.completed >= 1 },
    { key: 'ontime-master', icon: 'clock', name: 'ตรงต่อเวลา', desc: 'อัตราตรงเวลา 90%+ (>=5 งาน)', earned: me.completed >= 5 && me.onTimeRate >= 90 },
    { key: 'no-overdue', icon: 'shield', name: 'ไร้งานค้าง', desc: 'ไม่มีงานค้างเกินกำหนด', earned: me.overduePending === 0 && me.received >= 1 },
    { key: 'busy', icon: 'zap', name: 'ทำงานไว', desc: 'ทำเสร็จเฉลี่ย ≤ 2 วัน (>=3 งาน)', earned: me.completed >= 3 && me.avgDays <= 2 },
    { key: 'workhorse', icon: 'users', name: 'ผู้ขยัน', desc: 'รับงาน 10+ รายการ', earned: me.received >= 10 },
    { key: 'approver', icon: 'fileCheck', name: 'นักอนุมัติ', desc: 'อนุมัติคำขอ 10+ ขั้น', earned: meAppr.total >= 10 }
  ];
  const earned = achievements.filter(a => a.earned).length;

  // ====== Dept leaderboard — แผนกไหนทำงานเสร็จทันเวลามากที่สุด ======
  const deptWork = {};
  Object.values(state.users).forEach(u => { deptWork[u.deptKey] = deptWork[u.deptKey] || { dept: u.dept, deptKey: u.deptKey, received: 0, completed: 0, onTime: 0, late: 0, overduePending: 0, totalWorkDays: 0, memberCount: 0 }; deptWork[u.deptKey].memberCount++; });
  Object.values(workerStats).forEach(s => {
    const u = state.users[s.id]; if (!u || !deptWork[u.deptKey]) return;
    const d = deptWork[u.deptKey];
    d.received += s.received; d.completed += s.completed; d.onTime += s.onTime; d.late += s.late; d.overduePending += s.overduePending;
    d.totalWorkDays += s.totalWorkDays || 0;
  });
  // ⚡ v3.1: โหมด 1/2 deadline เริ่มเดินก่อนมีคนกดรับ — งานอนุมัติแล้วที่ "ยังไม่มีใครรับ" และเกิน
  // deadline ตามโหมดที่เลือก ต้องนับเป็นงานค้างของแผนกที่ต้องรับเรื่อง (เดิมหลุดจาก KPI เพราะไม่มี receivedBy)
  state.requests.forEach(r => {
    if (r.status !== 'progress' || r.receivedAt || r.workMode === 'close') return;
    const dlInfo = computeWorkDeadline(r, slaCfg);
    if (!dlInfo || now <= dlInfo.deadline) return;
    const dk = getReceiveDeptForReq(r, state.users);
    if (dk && deptWork[dk]) { deptWork[dk].overduePending++; deptWork[dk].received++; }
  });
  const deptRanking = Object.values(deptWork).filter(d => d.received > 0).map(d => ({
    ...d, onTimeRate: d.completed > 0 ? Math.round(d.onTime / d.completed * 100) : 0, avgDays: d.completed > 0 ? (d.totalWorkDays / d.completed) : 0
  })).sort((a, b) => b.onTimeRate - a.onTimeRate || b.completed - a.completed);

  // ====== My dept stats — สำหรับ comparison ======
  const myDeptKey = currentUser.deptKey;
  const myDeptRaw = deptWork[myDeptKey] || { dept: currentUser.dept, received: 0, completed: 0, onTime: 0, late: 0, overduePending: 0, totalWorkDays: 0, memberCount: 0 };
  const myDept = {
    ...myDeptRaw,
    onTimeRate: myDeptRaw.completed > 0 ? Math.round(myDeptRaw.onTime / myDeptRaw.completed * 100) : 0,
    avgDays: myDeptRaw.completed > 0 ? (myDeptRaw.totalWorkDays / myDeptRaw.completed) : 0,
    rank: deptRanking.findIndex(d => d.deptKey === myDeptKey) + 1,
    totalDepts: deptRanking.length
  };
  // คะแนนของแผนก (ใช้ formula เดียวกับ personal)
  const deptScore = (() => {
    if (myDept.received === 0) return 0;
    let s = 0;
    s += myDept.onTimeRate * 0.7;
    const op = myDept.received > 0 ? Math.min(20, (myDept.overduePending / myDept.received) * 100) : 0;
    s += 20 - op;
    s += Math.min(10, myDept.received / Math.max(1, myDept.memberCount));
    return Math.max(0, Math.min(100, Math.round(s)));
  })();
  const deptGrade = myDept.received === 0 ? '—' : deptScore >= 90 ? 'A+' : deptScore >= 80 ? 'A' : deptScore >= 70 ? 'B+' : deptScore >= 60 ? 'B' : deptScore >= 50 ? 'C' : 'D';
  const deptGradeColor = myDept.received === 0 ? 'var(--ink-3)' : deptScore >= 80 ? 'var(--green)' : deptScore >= 60 ? 'var(--brand)' : deptScore >= 50 ? 'var(--amber)' : 'var(--red)';
  // เพื่อนร่วมแผนก (ไม่รวมตัวเอง)
  const deptMembers = Object.values(state.users).filter(u => u.deptKey === myDeptKey);
  const deptMemberStats = deptMembers.map(u => {
    const s = workerStats[u.id] || { received: 0, completed: 0, onTime: 0, overduePending: 0, totalWorkDays: 0 };
    return {
      id: u.id, name: u.name, roleTh: u.roleTh, user: u,
      received: s.received, completed: s.completed,
      onTimeRate: s.completed > 0 ? Math.round(s.onTime / s.completed * 100) : 0,
      overduePending: s.overduePending || 0,
      avgDays: s.completed > 0 ? (s.totalWorkDays / s.completed) : 0,
      isMe: u.id === currentUser.id
    };
  }).sort((a, b) => b.received - a.received);

  const [viewScope, setViewScope] = usePersistedState('scorecard.viewScope', 'both'); // 'mine' | 'dept' | 'both'

  // ====== 14-day work activity for me (จากกิจกรรม) ======
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const myTrend = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(today); d.setDate(d.getDate() - (13 - i));
    const ds = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    return state.activities.filter(a => a.user === currentUser.id && a.at && a.at.startsWith(ds)).length;
  });

  const MODE_LABEL = {
    'from-create': { th: 'โหมด 1: นับจากวันสร้าง', short: 'จากวันขอ', color: 'var(--blue)' },
    'from-approve': { th: 'โหมด 2: นับจากวันอนุมัติครบ', short: 'จากวันอนุมัติ', color: 'var(--violet)' },
    'from-receive': { th: 'โหมด 3: นับจากวันรับเรื่อง', short: 'จากวันรับเรื่อง', color: 'var(--green)' }
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title" style={{ fontWeight: 500 }}>ผลงานการทำงาน (KPI)</h1>
          <div className="page-sub">วัดจากการ "รับเรื่อง → ส่งงาน" ตามโหมด SLA ที่ตั้งค่าไว้ · โหมดปัจจุบัน: <span className="medium" style={{ color: MODE_LABEL[slaCfg.deadlineMode]?.color }}>{MODE_LABEL[slaCfg.deadlineMode]?.th || slaCfg.deadlineMode}</span></div>
        </div>
        <div className="tabs" style={{ margin: 0 }}>
          <button className={`tab ${viewScope === 'mine' ? 'active' : ''}`} onClick={() => setViewScope('mine')}><Icon name="user" size={12} /> ของฉัน</button>
          <button className={`tab ${viewScope === 'dept' ? 'active' : ''}`} onClick={() => setViewScope('dept')}><Icon name="users" size={12} /> แผนก{currentUser.dept}</button>
          <button className={`tab ${viewScope === 'both' ? 'active' : ''}`} onClick={() => setViewScope('both')}><Icon name="copy" size={12} /> เทียบ</button>
        </div>
      </div>

      {/* Hero: Personal + Dept (toggleable) */}
      <div className={viewScope === 'both' ? 'grid grid-2 mb-20' : 'mb-20'} style={{ gap: 16 }}>
        {(viewScope === 'mine' || viewScope === 'both') && (
          <TiltCard className="card" intensity={4} style={{ background: `linear-gradient(135deg, color-mix(in oklch, ${gradeColor} 12%, var(--surface)) 0%, var(--surface) 70%)`, border: `1px solid color-mix(in oklch, ${gradeColor} 30%, transparent)`, padding: 24, overflow: 'hidden', position: 'relative', borderRadius: 12 }}>
            <div className="row gap-16" style={{ alignItems: 'center' }}>
              <div style={{ position: 'relative', width: 100, height: 100, flexShrink: 0 }}>
                <svg width="100" height="100" style={{ transform: 'rotate(-90deg)' }}>
                  <circle cx="50" cy="50" r="44" fill="none" stroke="var(--surface-3)" strokeWidth="8" />
                  <circle cx="50" cy="50" r="44" fill="none" stroke={gradeColor} strokeWidth="8" strokeDasharray={`${score * 2.765} 1000`} strokeLinecap="round" />
                </svg>
                <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' }}>
                  <div className="center">
                    <div className="en bold" style={{ fontSize: 28, color: gradeColor, lineHeight: 1 }}>{grade}</div>
                    <div className="text-xs muted en">{score}/100</div>
                  </div>
                </div>
              </div>
              <div className="flex-1">
                <div className="row gap-8 mb-8"><Avatar user={currentUser} size="md" /><div><div className="text-sm bold">{currentUser.name}</div><div className="text-xs muted">ของฉัน · {currentUser.roleTh}</div></div></div>
                <div className="grid grid-2" style={{ gap: 8 }}>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">รับ/เสร็จ</div>
                    <div className="en bold" style={{ fontSize: 16 }}>{me.received}/{me.completed}</div>
                  </div>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">ตรงเวลา</div>
                    <div className="en bold" style={{ fontSize: 16, color: me.onTimeRate >= 80 ? 'var(--green-ink)' : me.onTimeRate >= 50 ? 'var(--amber-ink)' : 'var(--red-ink)' }}>{me.onTimeRate}%</div>
                  </div>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">ค้างเกิน</div>
                    <div className="en bold" style={{ fontSize: 16, color: me.overduePending > 0 ? 'var(--red-ink)' : 'var(--ink)' }}>{me.overduePending}</div>
                  </div>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">เฉลี่ย/งาน</div>
                    <div className="en bold" style={{ fontSize: 16 }}>{me.avgDays.toFixed(1)}<span className="text-xs muted"> วัน</span></div>
                  </div>
                </div>
              </div>
            </div>
          </TiltCard>
        )}

        {(viewScope === 'dept' || viewScope === 'both') && (
          <TiltCard className="card" intensity={4} style={{ background: `linear-gradient(135deg, color-mix(in oklch, ${deptGradeColor} 12%, var(--surface)) 0%, var(--surface) 70%)`, border: `1px solid color-mix(in oklch, ${deptGradeColor} 30%, transparent)`, padding: 24, overflow: 'hidden', position: 'relative', borderRadius: 12 }}>
            <div className="row gap-16" style={{ alignItems: 'center' }}>
              <div style={{ position: 'relative', width: 100, height: 100, flexShrink: 0 }}>
                <svg width="100" height="100" style={{ transform: 'rotate(-90deg)' }}>
                  <circle cx="50" cy="50" r="44" fill="none" stroke="var(--surface-3)" strokeWidth="8" />
                  <circle cx="50" cy="50" r="44" fill="none" stroke={deptGradeColor} strokeWidth="8" strokeDasharray={`${deptScore * 2.765} 1000`} strokeLinecap="round" />
                </svg>
                <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' }}>
                  <div className="center">
                    <div className="en bold" style={{ fontSize: 28, color: deptGradeColor, lineHeight: 1 }}>{deptGrade}</div>
                    <div className="text-xs muted en">{deptScore}/100</div>
                  </div>
                </div>
              </div>
              <div className="flex-1">
                <div className="row gap-8 mb-8" style={{ alignItems: 'center' }}>
                  <div style={{ width: 36, height: 36, borderRadius: 8, background: 'var(--brand-soft)', color: 'var(--brand-ink)', display: 'grid', placeItems: 'center' }}><Icon name="users" size={18} /></div>
                  <div><div className="text-sm bold">แผนก{myDept.dept}</div><div className="text-xs muted">{myDept.memberCount} คน · {myDept.rank > 0 ? `อันดับ ${myDept.rank}/${myDept.totalDepts}` : 'ยังไม่มีอันดับ'}</div></div>
                </div>
                <div className="grid grid-2" style={{ gap: 8 }}>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">รับ/เสร็จ</div>
                    <div className="en bold" style={{ fontSize: 16 }}>{myDept.received}/{myDept.completed}</div>
                  </div>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">ตรงเวลา</div>
                    <div className="en bold" style={{ fontSize: 16, color: myDept.onTimeRate >= 80 ? 'var(--green-ink)' : myDept.onTimeRate >= 50 ? 'var(--amber-ink)' : 'var(--red-ink)' }}>{myDept.onTimeRate}%</div>
                  </div>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">ค้างเกิน</div>
                    <div className="en bold" style={{ fontSize: 16, color: myDept.overduePending > 0 ? 'var(--red-ink)' : 'var(--ink)' }}>{myDept.overduePending}</div>
                  </div>
                  <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: 8 }}>
                    <div className="text-xs muted">เฉลี่ย/งาน</div>
                    <div className="en bold" style={{ fontSize: 16 }}>{myDept.avgDays.toFixed(1)}<span className="text-xs muted"> วัน</span></div>
                  </div>
                </div>
              </div>
            </div>
          </TiltCard>
        )}
      </div>

      {/* Comparison strip when 'both' */}
      {viewScope === 'both' && myDept.completed > 0 && me.completed > 0 && (
        <div className="card card-pad mb-20">
          <h3 className="card-title mb-12">เทียบ "ฉัน" กับ "แผนก{myDept.dept}"</h3>
          <div className="grid grid-4" style={{ gap: 12 }}>
            {[
              { lbl: 'ตรงเวลา', mine: me.onTimeRate, dept: myDept.onTimeRate, suffix: '%', higherBetter: true },
              { lbl: 'เฉลี่ยวัน/งาน', mine: me.avgDays, dept: myDept.avgDays, suffix: ' วัน', higherBetter: false, dp: 1 },
              { lbl: 'รับเข้ามา', mine: me.received, dept: Math.round(myDept.received / Math.max(1, myDept.memberCount) * 10) / 10, suffix: '', higherBetter: true, deptLabel: ' /คน' },
              { lbl: 'งานค้างเกิน', mine: me.overduePending, dept: Math.round(myDept.overduePending / Math.max(1, myDept.memberCount) * 10) / 10, suffix: '', higherBetter: false, deptLabel: ' /คน' }
            ].map((k, i) => {
              const better = k.higherBetter ? k.mine > k.dept : k.mine < k.dept;
              const same = k.mine === k.dept;
              return (
                <div key={i} style={{ padding: 12, background: 'var(--surface-2)', borderRadius: 8, borderLeft: `3px solid ${same ? 'var(--ink-3)' : better ? 'var(--green)' : 'var(--amber)'}` }}>
                  <div className="text-xs muted mb-4">{k.lbl}</div>
                  <div className="row gap-12">
                    <div>
                      <div className="text-xs" style={{ color: 'var(--brand-ink)' }}>ฉัน</div>
                      <div className="en bold" style={{ fontSize: 16 }}>{k.dp ? k.mine.toFixed(k.dp) : k.mine}{k.suffix}</div>
                    </div>
                    <div className="muted" style={{ alignSelf: 'center' }}>·</div>
                    <div>
                      <div className="text-xs muted">แผนก{k.deptLabel || ''}</div>
                      <div className="en" style={{ fontSize: 16 }}>{k.dp ? k.dept.toFixed(k.dp) : k.dept}{k.suffix}</div>
                    </div>
                  </div>
                  {!same && <div className="text-xs mt-4" style={{ color: better ? 'var(--green-ink)' : 'var(--amber-ink)', fontWeight: 600 }}>{better ? '↑ เหนือกว่าแผนก' : '↓ ต่ำกว่าแผนก'}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Dept member ranking — เห็นเมื่อ viewScope = 'dept' หรือ 'both' */}
      {(viewScope === 'dept' || viewScope === 'both') && deptMemberStats.length > 1 && (
        <div className="card mb-20" style={{ overflow: 'hidden' }}>
          <div className="card-head"><h3 className="card-title">เพื่อนร่วมแผนก{currentUser.dept} ({deptMemberStats.length} คน)</h3></div>
          <table className="table">
            <thead><tr><th>ชื่อ</th><th className="right">รับ</th><th className="right">เสร็จ</th><th className="right">ตรงเวลา</th><th className="right">ค้างเกิน</th><th className="right">เฉลี่ย</th></tr></thead>
            <tbody>
              {deptMemberStats.map(m => (
                <tr key={m.id} style={{ background: m.isMe ? 'var(--brand-soft)' : undefined, fontWeight: m.isMe ? 600 : undefined }}>
                  <td><div className="row gap-8"><Avatar user={m.user} size="sm" /><div><div className="text-sm">{m.name}{m.isMe && ' (คุณ)'}</div><div className="text-xs muted">{m.roleTh}</div></div></div></td>
                  <td className="num-cell right">{m.received}</td>
                  <td className="num-cell right">{m.completed}</td>
                  <td className="num-cell right" style={{ color: m.onTimeRate >= 80 ? 'var(--green-ink)' : m.onTimeRate >= 50 ? 'var(--amber-ink)' : m.completed > 0 ? 'var(--red-ink)' : 'var(--ink-3)' }}>{m.completed > 0 ? `${m.onTimeRate}%` : '–'}</td>
                  <td className="num-cell right" style={{ color: m.overduePending > 0 ? 'var(--red-ink)' : 'var(--ink-3)' }}>{m.overduePending}</td>
                  <td className="num-cell right">{m.completed > 0 ? `${m.avgDays.toFixed(1)} วัน` : '–'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* Breakdown by SLA mode */}
      <div className="card card-pad mb-20">
        <div className="spread mb-12">
          <div>
            <h3 className="card-title">แยกตามโหมด SLA ของแต่ละคำขอ</h3>
            <div className="card-sub mt-2">คำขอแต่ละใบอาจตั้งโหมดเป็นของตัวเอง · ค่าด้านล่างคือสถิติของคุณ</div>
          </div>
        </div>
        <div className="grid grid-3" style={{ gap: 12 }}>
          {Object.entries(MODE_LABEL).map(([key, ml]) => {
            const m = me.byMode[key] || { received: 0, completed: 0, onTime: 0, late: 0 };
            const rate = m.completed > 0 ? Math.round(m.onTime / m.completed * 100) : 0;
            return (
              <div key={key} style={{ padding: 14, border: `1px solid color-mix(in oklch, ${ml.color} 25%, var(--border))`, borderRadius: 10, background: `color-mix(in oklch, ${ml.color} 6%, var(--surface))` }}>
                <div className="row gap-6 mb-6" style={{ alignItems: 'center' }}>
                  <span style={{ width: 8, height: 8, borderRadius: 100, background: ml.color }}></span>
                  <span className="text-xs medium" style={{ color: ml.color }}>{ml.th}</span>
                </div>
                <div className="grid grid-2" style={{ gap: 8 }}>
                  <div>
                    <div className="text-xs muted">รับเข้า</div>
                    <div className="en bold" style={{ fontSize: 16 }}>{m.received}</div>
                  </div>
                  <div>
                    <div className="text-xs muted">เสร็จ</div>
                    <div className="en bold" style={{ fontSize: 16 }}>{m.completed}</div>
                  </div>
                  <div>
                    <div className="text-xs muted">ตรงเวลา</div>
                    <div className="en bold" style={{ fontSize: 16, color: rate >= 80 ? 'var(--green-ink)' : rate >= 50 ? 'var(--amber-ink)' : 'var(--red-ink)' }}>{rate}%</div>
                  </div>
                  <div>
                    <div className="text-xs muted">ช้า</div>
                    <div className="en bold" style={{ fontSize: 16, color: m.late > 0 ? 'var(--red-ink)' : 'var(--ink)' }}>{m.late}</div>
                  </div>
                </div>
                {m.completed > 0 && (
                  <div className="progress mt-8" style={{ height: 6 }}>
                    <div style={{ width: rate + '%', background: ml.color, height: '100%' }}></div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Achievements */}
      <div className="card card-pad mb-20">
        <div className="spread mb-16">
          <div>
            <h3 className="card-title">เครื่องหมายเกียรติยศ</h3>
            <div className="card-sub mt-2">ได้รับแล้ว {earned} จาก {achievements.length}</div>
          </div>
        </div>
        <div className="grid" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: 10 }}>
          {achievements.map(a => (
            <Spotlight key={a.key} className="center" style={{ padding: 14, border: '1px solid var(--border)', borderRadius: 10, background: a.earned ? 'var(--brand-soft)' : 'var(--surface)', opacity: a.earned ? 1 : 0.5, cursor: 'default', transition: 'transform 0.2s cubic-bezier(.22,1,.36,1)' }}
              onMouseEnter={(e) => { if (a.earned) e.currentTarget.style.transform = 'translateY(-3px) scale(1.02)'; }}
              onMouseLeave={(e) => { e.currentTarget.style.transform = ''; }}>
              <div style={{ width: 44, height: 44, borderRadius: 100, background: a.earned ? 'var(--brand)' : 'var(--surface-3)', color: 'white', display: 'grid', placeItems: 'center', margin: '0 auto 8px' }}>
                <Icon name={a.icon} size={20} />
              </div>
              <div className="medium text-sm">{a.name}</div>
              <div className="text-xs muted mt-2" style={{ lineHeight: 1.4 }}>{a.desc}</div>
              {a.earned && <div className="badge badge-green mt-8"><Icon name="check" size={10} /> ได้รับ</div>}
            </Spotlight>
          ))}
        </div>
      </div>

      {/* Activity Heatmap — 90 วันย้อนหลัง */}
      <div className="card card-pad mb-20">
        <div className="spread mb-12">
          <div>
            <h3 className="card-title">🔥 กิจกรรมของคุณ 90 วันย้อนหลัง</h3>
            <div className="card-sub mt-2">แต่ละช่อง = 1 วัน · สีเข้มขึ้นตามจำนวนกิจกรรม</div>
          </div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'center', overflowX: 'auto' }}>
          <Heatmap days={90} cellSize={13} gap={3} color="var(--brand)" getValue={(date) => {
            const ds = `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
            return state.activities.filter(a => a.user === currentUser.id && a.at && a.at.startsWith(ds)).length;
          }} />
        </div>
        <div className="row gap-12 mt-12" style={{ justifyContent: 'space-between', fontSize: 11, color: 'var(--ink-3)' }}>
          <span>{(() => { const acts = state.activities.filter(a => a.user === currentUser.id); return `รวม ${acts.length} กิจกรรมในช่วง 90 วัน · เฉลี่ย ${(acts.length / 90).toFixed(1)} ครั้ง/วัน`; })()}</span>
          <div className="row gap-6" style={{ alignItems: 'center' }}>
            <span>น้อย</span>
            {[0.2, 0.4, 0.6, 0.8, 1].map((op, i) => (
              <span key={i} style={{ width: 11, height: 11, borderRadius: 2, background: `color-mix(in oklch, var(--brand) ${op * 100}%, var(--surface-3))` }}></span>
            ))}
            <span>มาก</span>
          </div>
        </div>
      </div>

      {/* Activity + Type breakdown */}
      <div className="grid" style={{ gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 20 }}>
        <div className="card card-pad">
          <h3 className="card-title mb-4">14 วันที่ผ่านมา</h3>
          <div className="text-xs muted mb-12">รับเรื่อง + ส่งงาน + อนุมัติของคุณ</div>
          <div className="row spread" style={{ alignItems: 'flex-end' }}>
            <div className="en bold" style={{ fontSize: 28 }}>{myTrend.reduce((s, x) => s + x, 0)}</div>
            <Sparkline data={myTrend} color="var(--brand)" width={180} height={50} />
          </div>
        </div>

        <div className="card card-pad">
          <h3 className="card-title mb-12">คำขอที่ฉันสร้าง (แยกประเภท)</h3>
          {myTypeStats.length === 0 ? <Empty title="ยังไม่มีคำขอ" sub="กดสร้างคำขอใหม่เพื่อเริ่ม" /> : (
            <div className="col gap-6">
              {myTypeStats.map((t, i) => {
                const max = Math.max(...myTypeStats.map(x => x.count));
                return (
                  <div key={i} className="row gap-10" style={{ alignItems: 'center' }}>
                    <span style={{ width: 80, fontSize: 12 }}>{t.label}</span>
                    <div className="progress" style={{ background: 'var(--surface-3)', height: 12, flex: 1, borderRadius: 6, overflow: 'hidden' }}>
                      <div style={{ width: (t.count/max*100) + '%', background: t.color, height: '100%' }}></div>
                    </div>
                    <span className="en tnum medium" style={{ width: 24, textAlign: 'right' }}>{t.count}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* Dept leaderboard — work performance */}
      <div className="card mb-20" style={{ overflow: 'hidden' }}>
        <div className="card-head">
          <h3 className="card-title">อันดับผลงานตามแผนก</h3>
          <div className="row gap-8">
            <span className="text-xs muted">เรียงตามอัตราส่งงานทันเวลา</span>
            <button className="btn btn-outline btn-sm" onClick={() => {
              const out = deptRanking.map((d, i) => [i+1, d.dept, d.received, d.completed, d.onTime, d.late, d.overduePending, d.onTimeRate + '%']);
              exportCSV(`dept-kpi-${new Date().toISOString().slice(0,10)}.csv`, ['อันดับ', 'แผนก', 'รับเข้า', 'เสร็จ', 'ตรงเวลา', 'ช้า', 'ค้าง', 'อัตราตรงเวลา'], out);
            }}><Icon name="download" size={12} /> CSV</button>
          </div>
        </div>
        {deptRanking.length === 0 ? (
          <div style={{ padding: 40 }}><Empty title="ยังไม่มีข้อมูลการทำงาน" sub="ยังไม่มีใครรับเรื่องและทำงานเสร็จ" /></div>
        ) : (
          <table className="table">
            <thead><tr><th>อันดับ</th><th>แผนก</th><th className="right">รับเข้า</th><th className="right">เสร็จ</th><th className="right">ทัน</th><th className="right">ช้า</th><th className="right">ค้างเกินกำหนด</th><th style={{ minWidth: 140 }}>อัตราตรงเวลา</th></tr></thead>
            <tbody>
              {deptRanking.map((d, i) => (
                <tr key={d.deptKey} style={d.deptKey === currentUser.deptKey ? { background: 'var(--brand-soft)' } : undefined}>
                  <td className="num-cell"><span className="en bold" style={{ color: i === 0 ? '#facc15' : i === 1 ? '#94a3b8' : i === 2 ? '#fb923c' : 'var(--ink-3)', fontSize: 16 }}>{['🥇','🥈','🥉'][i] || `#${i+1}`}</span></td>
                  <td><div className="row gap-8"><span style={{ width: 10, height: 10, borderRadius: 3, background: MOCK.deptColor(d.deptKey, 65, 0.13) }}></span><span className="medium text-sm">{d.dept}</span>{d.deptKey === currentUser.deptKey && <span className="badge badge-brand">ของคุณ</span>}</div></td>
                  <td className="num-cell right">{d.received}</td>
                  <td className="num-cell right">{d.completed}</td>
                  <td className="num-cell right" style={{ color: 'var(--green-ink)' }}>{d.onTime}</td>
                  <td className="num-cell right" style={{ color: 'var(--red-ink)' }}>{d.late}</td>
                  <td className="num-cell right" style={{ color: d.overduePending > 0 ? 'var(--red-ink)' : 'var(--ink-3)' }}>{d.overduePending}</td>
                  <td><div className="row gap-8"><div className="progress" style={{ flex: 1, background: 'var(--surface-3)', height: 6 }}><div style={{ width: `${d.onTimeRate}%`, background: d.onTimeRate >= 80 ? 'var(--green)' : d.onTimeRate >= 50 ? 'var(--amber)' : 'var(--red)', height: '100%' }}></div></div><span className="text-xs en tnum" style={{ width: 34 }}>{d.onTimeRate}%</span></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {/* Worker ranking — per user */}
      <div className="card mb-20" style={{ overflow: 'hidden' }}>
        <div className="card-head">
          <h3 className="card-title">ผลงานรายคน — KPI การทำงาน</h3>
          <div className="row gap-8">
            <span className="text-xs muted">{rows.length} คน · ไม่นับโหมด "รับและจบ"</span>
            <button className="btn btn-outline btn-sm" onClick={() => {
              const out = rows.map(r => { const u = state.users[r.id]; return [u?.name || r.id, u?.dept || '', r.received, r.completed, r.onTime, r.late, r.overduePending, r.avgDays.toFixed(1), r.onTimeRate + '%']; });
              exportCSV(`work-kpi-${new Date().toISOString().slice(0,10)}.csv`, ['พนักงาน', 'แผนก', 'รับเข้า', 'เสร็จ', 'ตรงเวลา', 'ช้า', 'ค้าง', 'เฉลี่ย(วัน)', 'อัตราตรงเวลา'], out);
            }}><Icon name="download" size={12} /> CSV</button>
          </div>
        </div>
        {rows.length === 0 ? (
          <div style={{ padding: 40 }}><Empty title="ยังไม่มีข้อมูล" sub="ยังไม่มีใครรับเรื่อง" /></div>
        ) : (
          <table className="table">
            <thead><tr><th>พนักงาน</th><th>แผนก</th><th className="right">รับเข้า</th><th className="right">เสร็จ</th><th className="right">ตรงเวลา</th><th className="right">ช้า</th><th className="right">ค้าง</th><th className="right">เฉลี่ย (วัน)</th><th style={{ minWidth: 130 }}>อัตราตรงเวลา</th></tr></thead>
            <tbody>
              {rows.map(r => {
                const u = state.users[r.id];
                const isMe = r.id === currentUser.id;
                return (
                  <tr key={r.id} style={isMe ? { background: 'var(--brand-soft)' } : undefined}>
                    <td><div className="row gap-10"><Avatar user={u} size="sm" /><span className="medium text-sm">{u?.name}</span>{isMe && <span className="badge badge-brand">คุณ</span>}</div></td>
                    <td className="text-sm muted">{u?.dept}</td>
                    <td className="num-cell right">{r.received}</td>
                    <td className="num-cell right">{r.completed}</td>
                    <td className="num-cell right" style={{ color: 'var(--green-ink)' }}>{r.onTime}</td>
                    <td className="num-cell right" style={{ color: 'var(--red-ink)' }}>{r.late}</td>
                    <td className="num-cell right" style={{ color: r.overduePending > 0 ? 'var(--red-ink)' : 'var(--ink-3)' }}>{r.overduePending}</td>
                    <td className="num-cell right">{r.avgDays > 0 ? r.avgDays.toFixed(1) : '—'}</td>
                    <td>
                      <div className="row gap-8">
                        <div className="progress" style={{ flex: 1, background: 'var(--surface-3)' }}><div style={{ width: `${r.onTimeRate}%`, background: r.onTimeRate >= 80 ? 'var(--green)' : r.onTimeRate >= 50 ? 'var(--amber)' : 'var(--red)', height: '100%' }}></div></div>
                        <span className="text-xs en tnum" style={{ width: 34 }}>{r.onTimeRate}%</span>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {/* Secondary: Approver stats — เก็บไว้ดูเป็น KPI การอนุมัติ */}
      <div className="card" style={{ overflow: 'hidden' }}>
        <div className="card-head">
          <h3 className="card-title">ผลงานการอนุมัติ (เพิ่มเติม)</h3>
          <span className="text-xs muted">{apprRows.length} คน · นับเฉพาะ flow ที่ตัดสินใจแล้ว</span>
        </div>
        {apprRows.length === 0 ? (
          <div style={{ padding: 40 }}><Empty title="ยังไม่มีการอนุมัติ" sub="รอให้ผู้อนุมัติคนแรกกดอนุมัติ/ปฏิเสธ" /></div>
        ) : (
          <table className="table">
            <thead><tr><th>ผู้อนุมัติ</th><th>แผนก</th><th className="right">อนุมัติ</th><th className="right">ตีกลับ</th><th className="right">รวม</th><th style={{ minWidth: 140 }}>อัตราอนุมัติ</th></tr></thead>
            <tbody>
              {apprRows.map(r => {
                const u = state.users[r.id];
                const isMe = r.id === currentUser.id;
                return (
                  <tr key={r.id} style={isMe ? { background: 'var(--brand-soft)' } : undefined}>
                    <td><div className="row gap-10"><Avatar user={u} size="sm" /><span className="medium text-sm">{u?.name}</span>{isMe && <span className="badge badge-brand">คุณ</span>}</div></td>
                    <td className="text-sm muted">{u?.dept}</td>
                    <td className="num-cell right" style={{ color: 'var(--green-ink)' }}>{r.approved}</td>
                    <td className="num-cell right" style={{ color: 'var(--red-ink)' }}>{r.rejected}</td>
                    <td className="num-cell right bold">{r.total}</td>
                    <td>
                      <div className="row gap-8">
                        <div className="progress" style={{ flex: 1, background: 'var(--surface-3)' }}><div style={{ width: `${r.rate}%`, background: 'var(--green)', height: '100%' }}></div></div>
                        <span className="text-xs en tnum" style={{ width: 34 }}>{r.rate}%</span>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
};

// ===== รอรับเรื่อง — Workflow 3 ขั้น (รอรับเรื่อง → กำลังทำงาน → งานเสร็จเรียบร้อย) =====
// ใช้สำหรับ "ทุกแผนก" — กรองตาม DEFAULT_RECEIVE_DEPT mapping
const IntakePage = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const myDeptName = MOCK.DEPTS[currentUser.deptKey]?.th || currentUser.deptKey;

  // กลุ่มประเภทคำขอที่แผนกของฉันรับ
  const cfg = getReceiveDeptConfig();
  const myReceiveTypes = Object.entries(cfg).filter(([type, target]) => {
    if (target === 'requester') return false;
    return target === currentUser.deptKey;
  }).map(([type]) => type);

  // 3 ขั้นตอน — ใช้กับทุกแผนก
  // (1) รอรับเรื่อง: status=progress, receivedAt=null, dept ตรง
  const toReceive = state.requests.filter(r => canReceiveRequest(r, currentUser, state.users));
  // (2) กำลังทำงาน: receivedAt!=null, completedAt=null, ฉันรับ หรือคนในแผนกฉันรับ
  const inProgress = state.requests.filter(r =>
    r.status === 'progress' && r.receivedAt && !r.completedAt &&
    (r.receivedBy === currentUser.id || (state.users[r.receivedBy]?.deptKey === currentUser.deptKey))
  );
  // (3) งานเสร็จเรียบร้อย: status=done, ฉันรับ หรือคนในแผนกฉันรับ (ช่วง 30 วันล่าสุด)
  const cutoff = Date.now() - 30 * 86400000;
  const completed = state.requests.filter(r => {
    if (r.status !== 'done' || !r.completedAt) return false;
    if (r.receivedBy !== currentUser.id && state.users[r.receivedBy]?.deptKey !== currentUser.deptKey) return false;
    const d = parseTh(r.completedAt);
    return !d || d.getTime() >= cutoff;
  });

  const [tab, setTab] = usePersistedState('intake.tab', 'receive');
  const isHigh = (r) => r.priority === 'high' || r.priority === 'critical';
  // เรียง: ด่วนก่อนเสมอ, แล้วตามวันที่ครบกำหนด
  const sortUrgentFirst = (arr) => [...arr].sort((a, b) => {
    const ah = isHigh(a) ? 1 : 0, bh = isHigh(b) ? 1 : 0;
    if (ah !== bh) return bh - ah;
    const da = parseTh(a.dueDate)?.getTime() || Infinity;
    const db = parseTh(b.dueDate)?.getTime() || Infinity;
    return da - db;
  });
  const toReceiveSorted = sortUrgentFirst(toReceive);
  const inProgressSorted = sortUrgentFirst(inProgress);
  const tabs = [
    { key: 'receive', label: 'รอรับเรื่อง', icon: 'truck', list: toReceiveSorted, empty: 'ยังไม่มีงานรอรับ', urgentCount: toReceive.filter(isHigh).length },
    { key: 'inprogress', label: 'กำลังทำงาน', icon: 'clock', list: inProgressSorted, empty: 'ไม่มีงานกำลังทำ', urgentCount: inProgress.filter(isHigh).length },
    { key: 'completed', label: 'งานเสร็จเรียบร้อย', icon: 'check', list: completed, empty: 'ยังไม่มีงานที่เสร็จ', urgentCount: 0 }
  ];
  const activeTab = tabs.find(t => t.key === tab) || tabs[0];
  const list = activeTab.list;
  const urgentList = list.filter(isHigh);
  const normalList = list.filter(r => !isHigh(r));
  const splitView = (tab === 'receive' || tab === 'inprogress') && urgentList.length > 0 && normalList.length > 0;

  const doReceiveContinue = (id) => {
    const target = state.requests.find(r => r.id === id);
    if (!target) return;
    setState({
      requests: state.requests.map(r => r.id === id ? { ...r, receivedAt: nowTh(), receivedBy: currentUser.id, workMode: 'continue', lastActivity: 'รับเรื่อง · กำลังดำเนินการ' } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'qr-scan', refId: id, summary: 'รับเรื่อง — เริ่มดำเนินการ' }, ...state.activities]
    });
    window.toast?.(`รับเรื่อง ${id} เรียบร้อย — เริ่มนับเวลาทำงาน`, { level: 'success' });
  };
  const doReceiveClose = (id) => {
    if (!confirm('ยืนยัน "รับและจบงาน"? คำขอจะถูกปิดทันที (ไม่ต้องส่งงาน)')) return;
    setState({
      requests: state.requests.map(r => r.id === id ? { ...r, status: 'done', receivedAt: nowTh(), receivedBy: currentUser.id, completedAt: nowTh(), completedBy: currentUser.id, workMode: 'close', lastActivity: 'รับและปิดงาน', pendingClear: (r.type === 'expense' && r.clearingStatus !== 'verified' && (r.cleared || 0) < r.amount) ? r.pendingClear : false } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'check', refId: id, summary: 'รับเรื่อง — ปิดงานทันที (ไม่ดำเนินการต่อ)' }, ...state.activities]
    });
    window.toast?.(`รับและปิดงาน ${id} เรียบร้อย`, { level: 'success' });
  };
  const doComplete = (id) => {
    if (!confirm('ยืนยันส่งงาน? คำขอจะถูกปิดเป็น "เสร็จสมบูรณ์"')) return;
    setState({
      requests: state.requests.map(r => r.id === id ? { ...r, status: 'done', completedAt: nowTh(), completedBy: currentUser.id, lastActivity: 'ส่งงานเสร็จ', pendingClear: (r.type === 'expense' && r.clearingStatus !== 'verified' && (r.cleared || 0) < r.amount) ? r.pendingClear : false } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'check', refId: id, summary: 'ส่งงานเสร็จ — ปิดคำขอ' }, ...state.activities]
    });
    window.toast?.(`ส่งงาน ${id} เรียบร้อย`, { level: 'success' });
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">รับเรื่อง — แผนก{myDeptName}</h1>
          <div className="page-sub">
            จัดการคำขอที่เข้ามายังแผนก: <span className="medium">รอรับเรื่อง → กำลังทำงาน → งานเสร็จเรียบร้อย</span>
            {myReceiveTypes.length > 0 && <> · ประเภทที่แผนกคุณดูแล: <span className="medium">{myReceiveTypes.map(t => TYPE_LABEL[t]?.th || t).join(', ')}</span></>}
          </div>
        </div>
      </div>

      {/* 3 KPI การ์ดสรุป */}
      <div className="grid grid-3 mb-16" style={{ gap: 12 }}>
        {tabs.map(t => (
          <div key={t.key} className="card card-pad" style={{ cursor: 'pointer', borderLeft: `3px solid ${t.key === 'receive' ? 'var(--amber)' : t.key === 'inprogress' ? 'var(--blue)' : 'var(--green)'}`, background: tab === t.key ? 'color-mix(in oklch, var(--brand) 5%, var(--surface))' : 'var(--surface)' }} onClick={() => setTab(t.key)}>
            <div className="row gap-8" style={{ alignItems: 'center' }}>
              <div style={{ width: 36, height: 36, borderRadius: 8, background: t.key === 'receive' ? 'var(--amber-soft)' : t.key === 'inprogress' ? 'var(--blue-soft)' : 'var(--green-soft)', color: t.key === 'receive' ? 'var(--amber-ink)' : t.key === 'inprogress' ? 'var(--blue-ink)' : 'var(--green-ink)', display: 'grid', placeItems: 'center', flexShrink: 0 }}>
                <Icon name={t.icon} size={18} />
              </div>
              <div style={{ flex: 1 }}>
                <div className="text-xs muted">{t.label}</div>
                <div className="en bold" style={{ fontSize: 24, lineHeight: 1 }}>{t.list.length}</div>
                {t.urgentCount > 0 && <div className="text-xs" style={{ color: 'var(--red-ink)', fontWeight: 700, marginTop: 4 }}>⚡ ด่วน {t.urgentCount} รายการ</div>}
              </div>
            </div>
          </div>
        ))}
      </div>

      {myReceiveTypes.length === 0 && toReceive.length === 0 && inProgress.length === 0 && completed.length === 0 && (
        <div className="alert alert-info mb-16">
          <Icon name="info" size={14} style={{ marginTop: 1 }} />
          <div className="text-xs flex-1">
            แผนก{myDeptName}ยังไม่ได้รับผิดชอบรับเรื่องประเภทใด · ตั้งค่าที่ <span className="medium" onClick={() => { setState({ route: 'settings' }); try { localStorage.setItem('fd-settings.tab', JSON.stringify('receive')); } catch (e) {} }} style={{ cursor: 'pointer', textDecoration: 'underline' }}>Settings → การรับเรื่อง</span>
          </div>
        </div>
      )}

      <div className="tabs">
        {tabs.map(t => (
          <button key={t.key} className={`tab ${tab === t.key ? 'active' : ''}`} onClick={() => setTab(t.key)}>
            <Icon name={t.icon} size={12} /> {t.label} <span className="tab-count">{t.list.length}</span>
          </button>
        ))}
      </div>

      <div className="card" style={{ overflow: 'hidden' }}>
        {list.length === 0 ? <div style={{ padding: 40 }}><Empty icon={activeTab.icon} title={activeTab.empty} sub="" /></div> : (
          <table className="table">
            <thead>
              <tr>
                <th>คำขอ</th>
                <th>ผู้ขอ</th>
                <th>ประเภท</th>
                <th className="right">มูลค่า/จำนวน</th>
                {tab === 'receive' && <th>ครบกำหนด · SLA</th>}
                {tab === 'inprogress' && <th>รับเรื่องเมื่อ · กำหนดส่ง</th>}
                {tab === 'completed' && <th>เสร็จเมื่อ</th>}
                <th>การดำเนินการ</th>
              </tr>
            </thead>
            <tbody>
              {(() => {
                const renderRow = (r) => {
                  const u = state.users[r.requester];
                  const itemCount = (r.items || []).reduce((s, i) => s + (i.qty || 0), 0);
                  const workSLA = (tab === 'inprogress') ? workDeadlineInfo(r) : null;
                  const receivedByUser = state.users[r.receivedBy];
                  const completedByUser = state.users[r.completedBy];
                  const urgent = isHigh(r);
                  return (
                    <tr key={r.id} className="clickable" onClick={() => setState({ route: 'detail', selectedId: r.id })} style={{ background: urgent ? 'color-mix(in oklch, var(--red) 5%, var(--surface))' : undefined, borderLeft: urgent ? '3px solid var(--red)' : undefined }}>
                      <td><div className="row gap-12"><TypeIcon type={r.type} size={28} /><div><div className="row gap-6"><span className="en tnum text-xs muted">{r.id}</span>{urgent && <span style={{ fontSize: 10, color: 'var(--red-ink)', fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: 2 }}><Icon name="flame" size={10} />{r.priority === 'critical' ? 'วิกฤต' : 'ด่วน'}{r.autoUrgent && ' ⚡'}</span>}</div><div className="medium text-sm">{r.title}</div></div></div></td>
                      <td><div className="row gap-8"><Avatar user={u} size="sm" /><div><div className="text-sm">{u?.name?.split(' ')[0]}</div><div className="text-xs muted">{u?.dept}</div></div></div></td>
                      <td><TypeBadge type={r.type} /></td>
                      <td className="num-cell right"><div>{fmtBaht(r.amount)}</div>{itemCount > 0 && <div className="text-xs muted">{itemCount} ชิ้น</div>}</td>
                      {tab === 'receive' && <td><div className="col gap-2"><span className="num-cell text-sm">{r.dueDate}</span><SLABadge dueDate={r.dueDate} compact /></div></td>}
                      {tab === 'inprogress' && (
                        <td>
                          <div className="text-xs muted en">รับ: {r.receivedAt}</div>
                          {receivedByUser && <div className="text-xs muted">โดย {receivedByUser.name?.split(' ')[0]}</div>}
                          {workSLA && <div className="text-xs" style={{ color: workSLA.level === 'overdue' ? 'var(--red-ink)' : workSLA.level === 'urgent' ? 'var(--amber-ink)' : 'var(--ink-2)', fontWeight: 600 }}>{workSLA.label}</div>}
                        </td>
                      )}
                      {tab === 'completed' && (
                        <td>
                          <div className="text-xs muted en">{r.completedAt}</div>
                          {completedByUser && <div className="text-xs muted">โดย {completedByUser.name?.split(' ')[0]}</div>}
                          {r.workMode === 'close' && <span className="badge badge-brand" style={{fontSize:10}}>รับและจบ</span>}
                        </td>
                      )}
                      <td onClick={(e) => e.stopPropagation()}>
                        {tab === 'receive' && (
                          <div className="row gap-6">
                            <button className="btn btn-outline btn-sm" onClick={() => doReceiveClose(r.id)} title="รับและปิดงานทันที"><Icon name="check" size={12} /> รับและจบ</button>
                            <button className={urgent ? "btn btn-danger btn-sm" : "btn btn-primary btn-sm"} onClick={() => doReceiveContinue(r.id)}><Icon name="truck" size={12} /> รับและทำต่อ</button>
                          </div>
                        )}
                        {tab === 'inprogress' && r.receivedBy === currentUser.id && (
                          <button className="btn btn-success btn-sm" onClick={() => doComplete(r.id)}><Icon name="check" size={12} /> ส่งงาน</button>
                        )}
                        {tab === 'inprogress' && r.receivedBy !== currentUser.id && (
                          <span className="text-xs muted">รอ {receivedByUser?.name?.split(' ')[0]}</span>
                        )}
                        {tab === 'completed' && (
                          <span className="badge badge-green"><Icon name="check" size={9}/> เสร็จเรียบร้อย</span>
                        )}
                      </td>
                    </tr>
                  );
                };
                const colSpan = 5 + (tab === 'receive' || tab === 'inprogress' || tab === 'completed' ? 1 : 0);
                if (!splitView) return list.map(renderRow);
                return (
                  <>
                    <tr><td colSpan={colSpan} style={{ background: 'var(--red)', color: 'white', padding: '8px 12px', fontSize: 12, fontWeight: 700 }}>⚡ ด่วน · {urgentList.length} รายการ — เคลียร์ให้เสร็จก่อน</td></tr>
                    {urgentList.map(renderRow)}
                    <tr><td colSpan={colSpan} style={{ background: 'var(--ink-3)', color: 'white', padding: '8px 12px', fontSize: 12, fontWeight: 700 }}>ปกติ · {normalList.length} รายการ</td></tr>
                    {normalList.map(renderRow)}
                  </>
                );
              })()}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
};

Object.assign(window, { InboxPage, InsightsPage, ScorecardPage, IntakePage });
  </script>

  <!-- ===== Pages: Extra 2 ===== -->
  <script type="text/babel" data-presets="react">
const TEMPLATES = [

            </div>
            <div className="field"><label className="field-label">ความถี่</label>
              <select className="select" value={newItem.freq} onChange={(e) => setNewItem({ ...newItem, freq: e.target.value })}>
                <option value="weekly">ทุกสัปดาห์</option>
                <option value="monthly">ทุกเดือน</option>
                <option value="quarterly">ทุกไตรมาส</option>
              </select>
            </div>
          </div>
          <div className="field"><label className="field-label">หัวข้อคำขอ (ตอนสร้างจริง)</label><input className="input" value={newItem.title} onChange={(e) => setNewItem({ ...newItem, title: e.target.value })} placeholder="เว้นว่าง = ใช้ชื่อคำขอประจำ" /></div>
          <div className="field"><label className="field-label">วัตถุประสงค์</label><textarea className="textarea" value={newItem.purpose} onChange={(e) => setNewItem({ ...newItem, purpose: e.target.value })} style={{ minHeight: 60 }} placeholder="เว้นว่าง = ใช้ชื่อคำขอประจำ" /></div>
          {isMoneyNewType && (
            <div className="field"><label className="field-label spread"><span>รายการงบประมาณ <span className="req">*</span></span><button type="button" className="btn btn-ghost btn-sm" onClick={() => setNewItem({ ...newItem, breakdown: [...newItem.breakdown, { label: '', amount: 0 }] })}><Icon name="plus" size={12} /> เพิ่ม</button></label>
              <table className="table table-compact"><tbody>
                {newItem.breakdown.map((b, i) => (
                  <tr key={i}>
                    <td><OptionSelect value={b.label} onChange={(v) => { const bd = [...newItem.breakdown]; bd[i] = { ...bd[i], label: v }; setNewItem({ ...newItem, breakdown: bd }); }} options={getOptionItems(state, 'breakdown')} onAdd={(v) => addOptionItem(state, setState, 'breakdown', v)} placeholder="-- เลือกรายการ --" height={32} /></td>
                    <td style={{ width: 120 }}><input className="input" style={{ height: 32, textAlign: 'right' }} type="number" value={b.amount} onChange={(e) => { const bd = [...newItem.breakdown]; bd[i] = { ...bd[i], amount: Number(e.target.value) }; setNewItem({ ...newItem, breakdown: bd }); }} /></td>
                    <td style={{ width: 36 }}><button type="button" className="btn btn-ghost btn-sm btn-icon-only" disabled={newItem.breakdown.length === 1} onClick={() => setNewItem({ ...newItem, breakdown: newItem.breakdown.filter((_, j) => j !== i) })}><Icon name="trash" size={13} /></button></td>
                  </tr>
                ))}
                <tr style={{ background: 'var(--surface-2)' }}><td className="right bold text-sm">รวม</td><td className="num-cell right bold">{fmtBaht(newItem.breakdown.reduce((s, b) => s + (Number(b.amount) || 0), 0))}</td><td></td></tr>
              </tbody></table>
            </div>
          )}
          {newItem.type === 'overtime' && (
            <div className="grid grid-2">
              <div className="field"><label className="field-label">เวลาเริ่ม OT</label><TimeInput value={newItem.otStart} onChange={(v) => setNewItem({ ...newItem, otStart: v })} /></div>
              <div className="field"><label className="field-label">เวลาสิ้นสุด</label><TimeInput value={newItem.otEnd} onChange={(v) => setNewItem({ ...newItem, otEnd: v })} /></div>
            </div>
          )}
          <div className="alert alert-info"><Icon name="info" size={14} style={{ marginTop: 1 }} /><div className="text-xs">รอบถัดไปจะคำนวณจากวันนี้ตามความถี่ · กด "รันเลย" เพื่อสร้างคำขอทันทีได้ทุกเมื่อ · เห็นเฉพาะคำขอประจำของตัวเอง</div></div>
        </div>
      </Modal>
    </div>
  );
};

const CalendarPage = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const today = new Date();
  const [view, setView] = React.useState({ year: today.getFullYear(), month: today.getMonth() });
  const { year, month } = view;
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const monthLabel = `${monthNames[month]} ${year}`;
  const prev = () => setView(v => v.month === 0 ? { year: v.year - 1, month: 11 } : { year: v.year, month: v.month - 1 });
  const next = () => setView(v => v.month === 11 ? { year: v.year + 1, month: 0 } : { year: v.year, month: v.month + 1 });
  const goToday = () => setView({ year: today.getFullYear(), month: today.getMonth() });
  const isToday = (d) => d === today.getDate() && month === today.getMonth() && year === today.getFullYear();

  const allTypes = ['event','borrow','expense','purchase','overtime','leave','withdrawal','general','hire'];
  const [activeTypes, setActiveTypes] = usePersistedState('cal.types', allTypes);
  const activeSet = new Set(activeTypes);
  const [hoveredReq, setHoveredReq] = React.useState(null);
  // v3.2: modal ดูงานทั้งหมดของวัน — แก้ปัญหา "+N" ไม่รู้ว่างานอะไร
  const [dayModal, setDayModal] = React.useState(null); // เลขวัน (1-31) หรือ null
  const [viewMode, setViewMode] = usePersistedState('cal.viewMode', 'event'); // 'event' | 'person'
  const [personFilter, setPersonFilter] = React.useState(''); // '' = ทุกคน, หรือ userId

  // รายชื่อคนที่ "ไปงาน" จริง (event.eventStaff) + ผู้ขอของ non-event (เช่นยื่นใบลา)
  const eventPeople = React.useMemo(() => {
    const ids = new Set();
    state.requests.forEach(r => {
      if (r.type === 'event') {
        // event: เฉพาะคนที่ระบุว่าไปงาน — ไม่รวมผู้ขอ
        if (r.eventStaff) r.eventStaff.forEach(uid => ids.add(uid));
      } else if (r.requester) {
        // non-event: รวมผู้ขอเพราะคำขอแสดงในปฏิทินด้วย (ลา/OT/borrow ฯลฯ)
        ids.add(r.requester);
      }
    });
    return Array.from(ids).map(id => state.users[id]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, 'th'));
  }, [state.requests, state.users]);

  // คำขอเกี่ยวข้องกับคนที่เลือก
  const involvesPerson = (r, uid) => {
    if (!uid) return true;
    if (r.type === 'event') {
      // event: เฉพาะคนที่ไปงานจริง (ไม่ใช่ผู้ขอ ไม่ใช่ผู้อนุมัติ)
      return !!(r.eventStaff && r.eventStaff.includes(uid));
    }
    // non-event: เป็นผู้ขอ
    return r.requester === uid;
  };

  const toggleType = (t) => {
    setActiveTypes(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);
  };
  const setOnly = (t) => setActiveTypes([t]);
  const setAll = () => setActiveTypes(allTypes);

  const reqByDay = {};
  const inMonth = (m, y) => m === month + 1 && y === year;
  // ใช้ canViewRequest — กฎกำหนดได้ใน Settings → การมองเห็น
  state.requests.filter(r => {
    if (!activeSet.has(r.type)) return false;
    if (viewMode === 'person') return involvesPerson(r, personFilter) && canViewRequest(r, currentUser, state.users);
    return canViewRequest(r, currentUser, state.users);
  }).forEach(r => {
    if (r.type === 'event' && r.eventStartDate) {
      const s = parseTh(r.eventStartDate);
      const e = parseTh(r.eventEndDate || r.eventStartDate);
      if (!s || !e) return;
      for (let cur = new Date(s); cur <= e; cur.setDate(cur.getDate() + 1)) {
        if (inMonth(cur.getMonth() + 1, cur.getFullYear())) {
          const d = cur.getDate();
          (reqByDay[d] = reqByDay[d] || []).push({ req: r, kind: 'event' });
        }
      }
    } else if (r.type === 'borrow' && r.borrowStartDate) {
      // v3.3: ยืม-คืน — ขยายทุกวันในช่วงยืม (เหมือนอีเว้นท์) + หมุดวันเคลียร์ยอด
      const s = parseTh(r.borrowStartDate);
      const e = parseTh(r.borrowEndDate || r.borrowStartDate);
      if (s && e) {
        for (let cur = new Date(s); cur <= e; cur.setDate(cur.getDate() + 1)) {
          if (inMonth(cur.getMonth() + 1, cur.getFullYear())) {
            const d = cur.getDate();
            (reqByDay[d] = reqByDay[d] || []).push({ req: r, kind: 'borrow' });
          }
        }
      }
      if (r.clearDueDate) {
        const m2 = r.clearDueDate.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (m2 && inMonth(Number(m2[2]), Number(m2[3]))) {
          (reqByDay[Number(m2[1])] = reqByDay[Number(m2[1])] || []).push({ req: r, kind: 'clear' });
        }
      }
    } else if (r.type === 'leave') {
      // ใบลา — ขยายทุกวันในช่วง startDate → endDate (fallback dueDate ถ้าไม่มี start)
      const sDateStr = r.startDate || r.dueDate;
      const eDateStr = r.endDate || sDateStr;
      const s = parseTh(sDateStr);
      const e = parseTh(eDateStr);
      if (!s || !e) return;
      for (let cur = new Date(s); cur <= e; cur.setDate(cur.getDate() + 1)) {
        if (inMonth(cur.getMonth() + 1, cur.getFullYear())) {
          const d = cur.getDate();
          (reqByDay[d] = reqByDay[d] || []).push({ req: r, kind: 'leave' });
        }
      }
    } else {
      // วันครบกำหนดทั่วไป
      const dateStr = r.eventStartDate || r.dueDate || '';
      const m = dateStr.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m && inMonth(Number(m[2]), Number(m[3]))) {
        const d = Number(m[1]);
        (reqByDay[d] = reqByDay[d] || []).push({ req: r, kind: 'due' });
      }
      // expense: เพิ่ม clearDueDate เป็นอีกหมุด
      if (r.type === 'expense' && r.clearDueDate) {
        const m2 = r.clearDueDate.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (m2 && inMonth(Number(m2[2]), Number(m2[3]))) {
          const d = Number(m2[1]);
          (reqByDay[d] = reqByDay[d] || []).push({ req: r, kind: 'clear' });
        }
      }
    }
  });
  const weekdays = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

  const hReq = hoveredReq ? state.requests.find(r => r.id === hoveredReq) : null;

  // ===== Export to .ics — งานในเดือนปัจจุบัน =====
  const exportICS = () => {
    const pad = (n) => String(n).padStart(2, '0');
    const monthEvents = state.requests.filter(r => {
      if (!activeSet.has(r.type)) return false;
      // Use eventStartDate for event, dueDate for others
      const dateStr = r.type === 'event' ? (r.eventStartDate || r.dueDate) : r.dueDate;
      const d = parseTh(dateStr);
      return d && d.getMonth() === month && d.getFullYear() === year;
    });
    const fmtDate = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    const escape = (s) => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
    const stamp = `${fmtDate(new Date())}T${pad(new Date().getHours())}${pad(new Date().getMinutes())}00Z`;
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//FlowDesk//TH', 'CALSCALE:GREGORIAN'];
    monthEvents.forEach(r => {
      const u = state.users[r.requester];
      const isEvent = r.type === 'event';
      const sd = parseTh(isEvent ? (r.eventStartDate || r.dueDate) : r.dueDate);
      const ed = parseTh(isEvent ? (r.eventEndDate || r.eventStartDate || r.dueDate) : r.dueDate) || sd;
      if (!sd) return;
      const endNext = new Date(ed); endNext.setDate(endNext.getDate() + 1);
      const summary = `[${TYPE_LABEL[r.type]?.th || r.type}] ${r.title}`;
      const desc = `รหัส: ${r.id}\\nผู้ขอ: ${u?.name || r.requester}\\nสถานะ: ${STATUS_LABEL[r.status]?.th || r.status}${r.amount ? '\\nมูลค่า: ฿' + r.amount.toLocaleString() : ''}${r.purpose ? '\\n\\nวัตถุประสงค์:\\n' + r.purpose : ''}`;
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:${r.id}@flowdesk`);
      lines.push(`DTSTAMP:${stamp}`);
      lines.push(`DTSTART;VALUE=DATE:${fmtDate(sd)}`);
      lines.push(`DTEND;VALUE=DATE:${fmtDate(endNext)}`);
      lines.push(`SUMMARY:${escape(summary)}`);
      lines.push(`DESCRIPTION:${escape(desc)}`);
      if (r.venue) lines.push(`LOCATION:${escape(r.venue)}`);
      lines.push(`CATEGORIES:${TYPE_LABEL[r.type]?.th || r.type}`);
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    const ics = lines.join('\r\n');
    try {
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `flowdesk-${year}-${pad(month + 1)}.ics`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      window.toast(`Export ${monthEvents.length} กิจกรรม → เปิดไฟล์เพื่อเพิ่มเข้า Google/Outlook Calendar`, { level: 'success', duration: 6000 });
    } catch (e) { window.toast('Export ไม่สำเร็จ: ' + e.message, { level: 'error' }); }
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">ปฏิทิน</h1>
          <div className="page-sub">กำหนดการคำขอ — วันครบกำหนด / วันจัดงาน · {monthLabel}</div>
        </div>
        <div className="row gap-8">
          <button className="btn btn-outline btn-sm" onClick={exportICS} title="ดาวน์โหลด .ics เพื่อเพิ่มเข้า Google/Outlook Calendar"><Icon name="download" size={13} /> .ics</button>
          <button className="btn btn-outline btn-sm" onClick={goToday}>วันนี้</button>
          <button className="btn btn-outline btn-icon-only" onClick={prev} title="เดือนก่อนหน้า"><Icon name="chevronLeft" size={14} /></button>
          <span className="medium" style={{ minWidth: 140, textAlign: 'center' }}>{monthLabel}</span>
          <button className="btn btn-outline btn-icon-only" onClick={next} title="เดือนถัดไป"><Icon name="chevronRight" size={14} /></button>
        </div>
      </div>

      <div className="card card-pad mb-16">
        <div className="row gap-12 flex-wrap" style={{ alignItems: 'center', marginBottom: 10 }}>
          <span className="text-xs muted" style={{ marginRight: 4 }}>มุมมอง:</span>
          <div style={{ display: 'inline-flex', background: 'var(--surface-2)', borderRadius: 8, padding: 3, border: '1px solid var(--border)' }}>
            <button type="button" aria-pressed={viewMode === 'event'} onClick={() => { setViewMode('event'); setPersonFilter(''); }} style={{ padding: '6px 14px', borderRadius: 6, border: 'none', cursor: 'pointer', background: viewMode === 'event' ? 'var(--brand)' : 'transparent', color: viewMode === 'event' ? 'white' : 'var(--ink-2)', fontSize: 12, fontWeight: 600, boxShadow: viewMode === 'event' ? '0 2px 6px color-mix(in oklch, var(--brand) 35%, transparent)' : 'none', transition: 'all 0.18s' }}>
              <Icon name="calendar" size={11} /> ตามงาน
            </button>
            <button type="button" aria-pressed={viewMode === 'person'} onClick={() => setViewMode('person')} style={{ padding: '6px 14px', borderRadius: 6, border: 'none', cursor: 'pointer', background: viewMode === 'person' ? 'var(--brand)' : 'transparent', color: viewMode === 'person' ? 'white' : 'var(--ink-2)', fontSize: 12, fontWeight: 600, boxShadow: viewMode === 'person' ? '0 2px 6px color-mix(in oklch, var(--brand) 35%, transparent)' : 'none', transition: 'all 0.18s' }}>
              <Icon name="users" size={11} /> ตามคน
            </button>
          </div>
          {viewMode === 'person' && (
            <>
              <span className="text-xs muted" style={{ marginLeft: 8 }}>เลือกพนักงาน:</span>
              <select className="select" value={personFilter} onChange={(e) => setPersonFilter(e.target.value)} style={{ maxWidth: 260, height: 32, fontSize: 12 }}>
                <option value="">ทุกคน (แสดงชื่อในการ์ด)</option>
                {eventPeople.map(u => <option key={u.id} value={u.id}>{u.name} · {u.dept}</option>)}
              </select>
              {personFilter && (
                <button className="chip" onClick={() => setPersonFilter('')} title="ล้างตัวกรอง">
                  <Icon name="x" size={10} /> ล้าง
                </button>
              )}
            </>
          )}
        </div>
        <div className="row gap-8 flex-wrap" style={{ alignItems: 'center' }}>
          <span className="text-xs muted" style={{ marginRight: 4 }}>ประเภท:</span>
          <button className={`chip ${activeSet.size === allTypes.length ? 'active' : ''}`} onClick={setAll}>ทั้งหมด</button>
          {allTypes.map(t => {
            const ty = TYPE_LABEL[t];
            const on = activeSet.has(t);
            return (
              <button key={t} className={`chip ${on ? 'active' : ''}`}
                onClick={(e) => e.shiftKey ? setOnly(t) : toggleType(t)}
                style={on ? { borderColor: ty.color, background: ty.color + '18', color: ty.color } : {}}
                title={`คลิกเพื่อ toggle · Shift+คลิกเพื่อดูเฉพาะ ${ty.th}`}>
                <Icon name={ty.icon} size={11} /> {ty.th}
              </button>
            );
          })}
        </div>
      </div>

      {(() => {
        // ===== ตัวช่วยค้นหา: ถ้าเดือน/ตัวกรองปัจจุบันไม่มีคำขอ แต่มีคำขอในระบบ → แนะนำ =====
        const hasAnyThisMonth = Object.keys(reqByDay).length > 0;
        if (hasAnyThisMonth) return null;
        // คำขอทั้งหมดที่ผู้ใช้มองเห็นได้ พร้อมวันตัวแทน (event=วันเริ่มงาน, อื่นๆ=ครบกำหนด)
        const allVisibleDated = state.requests
          .filter(r => canViewRequest(r, currentUser, state.users))
          .map(r => {
            const dstr = r.type === 'event' ? (r.eventStartDate || r.dueDate) : (r.dueDate || r.eventStartDate);
            const d = parseTh(dstr);
            return d ? { r, d } : null;
          })
          .filter(Boolean);
        if (allVisibleDated.length === 0) return null;
        const typeFiltered = activeSet.size < allTypes.length;
        // มีคำขอในเดือนนี้ไหม (ถ้าไม่กรอง type)
        const thisMonthCount = allVisibleDated.filter(x => x.d.getMonth() === month && x.d.getFullYear() === year).length;
        const viewMid = new Date(year, month, 15).getTime();
        // คำขอที่ใกล้ที่สุด (ต่างเดือน) ที่ผ่าน type filter
        const nearest = allVisibleDated
          .filter(x => activeSet.has(x.r.type))
          .filter(x => x.d.getMonth() !== month || x.d.getFullYear() !== year)
          .sort((a, b) => Math.abs(a.d.getTime() - viewMid) - Math.abs(b.d.getTime() - viewMid))[0];
        const monthNamesTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        return (
          <div className="alert alert-info mb-16" style={{ borderColor: 'var(--brand)' }}>
            <Icon name="calendar" size={16} style={{ marginTop: 1, color: 'var(--brand-ink)' }} />
            <div className="flex-1">
              <div className="medium">ไม่มีคำขอแสดงในเดือน{monthLabel} ตามตัวกรองปัจจุบัน</div>
              <div className="text-xs muted mt-2">
                {thisMonthCount > 0 && typeFiltered
                  ? `มี ${thisMonthCount} คำขอในเดือนนี้ แต่ถูกซ่อนด้วยตัวกรองประเภท`
                  : `มีทั้งหมด ${allVisibleDated.length} คำขอในระบบ`}
              </div>
              <div className="row gap-6 mt-8 flex-wrap">
                {typeFiltered && <button className="btn btn-outline btn-sm" onClick={setAll}><Icon name="filter" size={12} /> แสดงทุกประเภท</button>}
                {nearest && (
                  <button className="btn btn-primary btn-sm" onClick={() => setView({ year: nearest.d.getFullYear(), month: nearest.d.getMonth() })}>
                    <Icon name="arrowRight" size={12} /> ไปเดือนที่มีคำขอ ({monthNamesTH[nearest.d.getMonth()]} {nearest.d.getFullYear()})
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      <div className="grid cal-grid" style={{ gridTemplateColumns: '1fr 320px', gap: 16 }}>
        <div className="card card-pad">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 6 }}>
            {weekdays.map((w, i) => <div key={'h' + i} className="text-xs muted center" style={{ padding: '4px 0', fontWeight: 600 }}>{w}</div>)}
            {cells.map((d, i) => (

const MasterDataPage = ({ ctx }) => {
  const { state, setState } = ctx;
  const [tab, setTab] = usePersistedState('master.tab', 'products');
  const [search, setSearch] = React.useState('');
  const [addOpen, setAddOpen] = React.useState(false);
  const [pForm, setPForm] = React.useState({ sku: '', nameTh: '', name: '', unit: 'ขวด', price: 0, stock: 0, minStock: 0, category: '' });
  const [cForm, setCForm] = React.useState({ name: '', type: 'ร้านค้า', tier: 'B' });
  const [drawerItem, setDrawerItem] = React.useState(null); // { kind, data }
  const fileInputRef = React.useRef(null);

  const addProduct = () => {
    if (!pForm.sku.trim() || !pForm.nameTh.trim()) return;
    if (state.products.some(p => p.sku === pForm.sku.trim())) return alert('SKU นี้มีอยู่แล้ว');
    setState({ products: [...state.products, {
      sku: pForm.sku.trim(),
      nameTh: pForm.nameTh.trim(),
      name: (pForm.name || pForm.nameTh).trim(),
      unit: pForm.unit, price: Number(pForm.price) || 0,
      stock: Number(pForm.stock) || 0,
      minStock: Number(pForm.minStock) || 0,
      category: pForm.category || ''
    }] });
    setPForm({ sku: '', nameTh: '', name: '', unit: 'ขวด', price: 0, stock: 0, minStock: 0, category: '' });
    setAddOpen(false);
    window.toast?.(`เพิ่มสินค้า ${pForm.sku} เรียบร้อย`, { level: 'success' });
  };

  // ===== CSV Parser & Import =====
  const parseCSV = (text) => {
    const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
    return lines.slice(1).map(line => {
      // simple CSV — handle quoted fields with commas
      const cells = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cells.push(cur); cur = ''; }
        else { cur += ch; }
      }
      cells.push(cur);
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (cells[i] || '').trim(); });
      return obj;
    });
  };

  const importProductsCSV = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const rows = parseCSV(e.target.result);
        if (rows.length === 0) { window.toast?.('CSV ว่างหรือไม่มี header', { level: 'warning' }); return; }
        const existing = new Set(state.products.map(p => p.sku));
        let added = 0, skipped = 0, updated = 0;
        const newProducts = [...state.products];
        rows.forEach(r => {
          if (!r.sku) { skipped++; return; }
          const product = {
            sku: r.sku, nameTh: r.nameth || r.namethai || r.name || r.sku,
            name: r.name || r.nameth || r.sku, unit: r.unit || 'ชิ้น',
            price: Number(r.price) || 0, stock: Number(r.stock) || 0,
            minStock: Number(r.minstock || r['min stock']) || 0,
            category: r.category || ''
          };
          if (existing.has(r.sku)) {
            const idx = newProducts.findIndex(p => p.sku === r.sku);
            newProducts[idx] = { ...newProducts[idx], ...product }; updated++;
          } else { newProducts.push(product); added++; }
        });
        setState({ products: newProducts });
        window.toast?.(`Import: เพิ่ม ${added} · อัปเดต ${updated}${skipped ? ` · ข้าม ${skipped}` : ''}`, { level: 'success', duration: 6000 });
      } catch (err) { window.toast?.('ไม่สามารถอ่านไฟล์: ' + err.message, { level: 'error' }); }
    };
    reader.readAsText(file, 'utf-8');

          <button className={`tab ${tab === 'depts' ? 'active' : ''}`} onClick={() => setTab('depts')}>แผนก <span className="tab-count">{Object.keys(MOCK.DEPTS).length}</span></button>

        {tab !== 'depts' && (
