              </div>
              <div className="grid grid-3">
                <div className="card-pad" style={{ background: 'var(--surface-2)', borderRadius: 8, padding: 12 }}><div className="text-xs muted">คำขอที่เกี่ยวข้อง</div><div className="en bold" style={{ fontSize: 20 }}>{relatedReqs.length}</div></div>
                <div className="card-pad" style={{ background: 'var(--surface-2)', borderRadius: 8, padding: 12 }}><div className="text-xs muted">มูลค่ารวม</div><div className="en bold" style={{ fontSize: 18 }}>{fmtBaht(totalAmount)}</div></div>
                <div className="card-pad" style={{ background: 'var(--surface-2)', borderRadius: 8, padding: 12 }}><div className="text-xs muted">ยอดขายจริง</div><div className="en bold" style={{ fontSize: 20, color: 'var(--green-ink)' }}>{fmtNum(totalSold)}</div></div>
              </div>
              <div>
                <h3 className="card-title mb-12">ประวัติคำขอ ({relatedReqs.length})</h3>
                {relatedReqs.length === 0 ? <Empty title="ยังไม่มีคำขอ" sub="ลูกค้านี้ยังไม่มีประวัติการยืม/ขาย" /> : (
                  <table className="table table-compact">
                    <thead><tr><th>ID</th><th>หัวข้อ</th><th>ผู้ขอ</th><th>วันที่</th><th className="right">มูลค่า</th><th>สถานะ</th></tr></thead>
                    <tbody>
                      {relatedReqs.slice(0, 8).map(r => { const u = state.users[r.requester]; return (
                        <tr key={r.id} className="clickable" onClick={() => { setDrawerItem(null); setState({ route: 'detail', selectedId: r.id }); }}>
                          <td className="num-cell text-xs">{r.id}</td>
                          <td className="text-sm">{r.title}</td>
                          <td className="text-sm">{u?.name?.split(' ')[0]}</td>
                          <td className="num-cell text-xs">{r.createdAt?.split(' ')[0]}</td>
                          <td className="num-cell right">{fmtBaht(r.amount)}</td>
                          <td><StatusBadge status={r.status} /></td>
                        </tr>
                      );})}
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          );
        })()}
      </Modal>
    </div>
  );
};

// ===== Workflow Editor — แก้สายอนุมัติได้เอง =====
const ROLE_OPTIONS = [
  { value: 'teamHead', label: 'หัวหน้าทีมของผู้ขอ (ตาม team)' },
  { value: 'head', label: 'หัวหน้าแผนกของผู้ขอ' },
  { value: 'manager', label: 'ผู้จัดการแผนกของผู้ขอ' },
  { value: 'director', label: 'ผู้อำนวยการแผนกของผู้ขอ' },
  { value: 'mktHead', label: 'หัวหน้าการตลาด (ใช้สำหรับ event)' },
  { value: 'accDirector', label: 'ผู้อำนวยการบัญชี' }
];
const TYPE_OPTIONS = [
  { value: 'all', label: 'ทุกประเภท' },
  { value: 'event', label: 'อีเว้นท์' },
  { value: 'general', label: 'อนุมัติทั่วไป' },
  { value: 'purchase', label: 'จัดซื้อ' },
  { value: 'expense', label: 'เบิกเงิน' },
  { value: 'overtime', label: 'OT' },
  { value: 'leave', label: 'ใบลา' },
  { value: 'withdrawal', label: 'เบิกตัดขาด' },
  { value: 'borrow', label: 'ยืม-คืน' }
];

const WorkflowEditor = ({ ctx }) => {
  const { state } = ctx;
  const [rules, setRules] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('fd-workflow-rules') || '[]'); } catch (e) { return []; }
  });
  const [editing, setEditing] = React.useState(null); // rule object or null

  const persist = (next) => {
    setRules(next);
    try { localStorage.setItem('fd-workflow-rules', JSON.stringify(next)); } catch (e) {}
  };

  const createRule = () => {
    setEditing({
      id: 'r-' + Date.now(),
      name: 'กฎใหม่',
      type: 'all',
      deptKey: '',
      team: '',
      steps: [{ kind: 'role', role: 'head', label: '' }]
    });
  };
  const saveRule = (rule) => {
    if (!rule.name?.trim() || !rule.steps?.length) {
      window.toast('กรุณาตั้งชื่อกฎและเพิ่มอย่างน้อย 1 ขั้น', { level: 'warning' });
      return;
    }
    const exists = rules.findIndex(r => r.id === rule.id);
    const next = exists >= 0 ? rules.map(r => r.id === rule.id ? rule : r) : [...rules, rule];
    persist(next);
    setEditing(null);
    window.toast('บันทึกกฎ workflow เรียบร้อย — มีผลกับคำขอใหม่', { level: 'success' });
  };
  const deleteRule = (id) => {
    if (!confirm('ลบกฎนี้?')) return;
    persist(rules.filter(r => r.id !== id));
    window.toast('ลบกฎแล้ว', { level: 'info' });
  };

  const stepPreview = (s) => {
    if (s.kind === 'user') { const u = state.users[s.userId]; return u ? u.name.split(' ')[0] : 'ไม่พบ'; }
    if (s.kind === 'users-and') {
      const names = (s.userIds || []).map(id => state.users[id]?.name?.split(' ')[0]).filter(Boolean);
      return names.length === 0 ? '(ยังไม่เลือก)' : names.join(' + ') + ' (ทุกคน)';
    }
    if (s.kind === 'users-or') {
      const names = (s.userIds || []).map(id => state.users[id]?.name?.split(' ')[0]).filter(Boolean);
      return names.length === 0 ? '(ยังไม่เลือก)' : names.join(' / ') + ' (คนใดก็ได้)';
    }
    if (s.kind === 'role-any') {
      return (ROLE_OPTIONS.find(r => r.value === s.role)?.label || s.role) + ' (ใครก็ได้)';
    }
    return ROLE_OPTIONS.find(r => r.value === s.role)?.label || s.role;
  };
  const ruleScope = (r) => {
    const parts = [];
    parts.push(TYPE_OPTIONS.find(t => t.value === r.type)?.label || r.type);
    if (r.deptKey) parts.push(`แผนก: ${MOCK.DEPTS[r.deptKey]?.th || r.deptKey}`);
    if (r.team) parts.push(`ทีม: ${r.team}`);
    return parts.join(' · ');
  };

  return (
    <div className="col gap-16">
      <div className="card card-pad">
        <div className="spread mb-12">
          <div>
            <h3 className="card-title"><Icon name="settings" size={14} /> Workflow Editor</h3>
            <div className="card-sub mt-2">กำหนดสายอนุมัติเฉพาะตามประเภท/แผนก/ทีม — เลือกระดับหรือบุคคลก็ได้</div>
          </div>
          <button className="btn btn-primary btn-sm" onClick={createRule}><Icon name="plus" size={13} /> เพิ่มกฎ</button>
        </div>
        <div className="alert alert-info">
          <Icon name="info" size={14} style={{ marginTop: 1 }} />
          <div className="text-xs flex-1">หากไม่มีกฎที่ตรงกับคำขอ ระบบจะใช้สายอนุมัติพื้นฐาน (default) · ลำดับความสำคัญ: type+แผนก+ทีม &gt; type+แผนก &gt; type อย่างเดียว</div>
        </div>
      </div>

      <div className="card" style={{ overflow: 'hidden' }}>
        <div className="card-head">
          <h3 className="card-title">กฎที่ตั้งไว้ ({rules.length})</h3>
        </div>
        {rules.length === 0 ? (
          <div style={{ padding: 30 }}><Empty icon="settings" title="ยังไม่มีกฎที่ตั้งเอง" sub="ระบบใช้สายอนุมัติพื้นฐาน · กดเพิ่มกฎเพื่อปรับให้ตรงกับธุรกิจของคุณ" /></div>
        ) : (
          <table className="table">
            <thead><tr><th>ชื่อกฎ</th><th>ใช้กับ</th><th>สายอนุมัติ</th><th></th></tr></thead>
            <tbody>
              {rules.map(r => (
                <tr key={r.id}>
                  <td><div className="medium text-sm">{r.name}</div></td>
                  <td><div className="text-xs muted">{ruleScope(r)}</div></td>
                  <td>
                    <div className="text-xs">{r.steps.map((s, i) => (
                      <span key={i}>
                        {i > 0 && <span className="muted" style={{ margin: '0 6px' }}>→</span>}
                        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '2px 8px', background: (s.kind === 'user' || s.kind === 'users-and' || s.kind === 'users-or') ? 'var(--brand-soft)' : 'var(--surface-2)', borderRadius: 100, fontSize: 11 }}>
                          <Icon name={s.kind === 'user' ? 'user' : 'users'} size={10} />
                          {stepPreview(s)}
                        </span>
                      </span>
                    ))}</div>
                  </td>
                  <td>
                    <div className="row gap-4">
                      <button className="btn btn-ghost btn-sm" onClick={() => setEditing(r)}><Icon name="edit" size={12} /> แก้</button>
                      <button className="btn btn-ghost btn-sm btn-icon-only" onClick={() => deleteRule(r.id)} title="ลบ"><Icon name="trash" size={12} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {/* Default reference */}
      <div className="card card-pad">
        <h3 className="card-title mb-12">สายอนุมัติพื้นฐาน (Default)</h3>
        <div className="col gap-8">
          {[
            { t: 'อีเว้นท์', d: 'หัวหน้าต้นสังกัด (ถ้าไม่ใช่การตลาด/อีเว้นท์) → หัวหน้าการตลาด → ผู้อำนวยการบัญชี', c: 'oklch(64% 0.16 25)' },
            { t: 'ขอซื้อ / เบิกเงิน / ทั่วไป', d: 'หัวหน้าทีม/แผนก → ผู้จัดการ → ผู้อำนวยการแผนก → ผู้อำนวยการบัญชี', c: 'var(--brand)' },
            { t: 'ใบลา / OT', d: 'อนุมัติตามสายงานต้นสังกัด (ไม่ผ่านบัญชี)', c: 'oklch(60% 0.13 165)' }
          ].map((p, i) => (
            <div key={i} className="row gap-12" style={{ padding: 12, border: '1px solid var(--border)', borderRadius: 8 }}>
              <span style={{ width: 6, alignSelf: 'stretch', borderRadius: 3, background: p.c, flexShrink: 0 }}></span>
              <div><div className="medium text-sm">{p.t}</div><div className="text-xs muted mt-2" style={{ lineHeight: 1.5 }}>{p.d}</div></div>
            </div>
          ))}
        </div>
      </div>

      {editing && <WorkflowRuleEditor rule={editing} onClose={() => setEditing(null)} onSave={saveRule} users={state.users} />}
    </div>
  );
};

const WorkflowRuleEditor = ({ rule, onClose, onSave, users }) => {
  const [draft, setDraft] = React.useState(rule);
  const update = (patch) => setDraft(d => ({ ...d, ...patch }));
  const updateStep = (i, patch) => setDraft(d => ({ ...d, steps: d.steps.map((s, idx) => idx === i ? { ...s, ...patch } : s) }));
  const addStep = () => setDraft(d => ({ ...d, steps: [...d.steps, { kind: 'role', role: 'manager', label: '' }] }));
  const removeStep = (i) => setDraft(d => ({ ...d, steps: d.steps.filter((_, idx) => idx !== i) }));
  const moveStep = (i, dir) => setDraft(d => {
    const next = [...d.steps];
    const j = i + dir;
    if (j < 0 || j >= next.length) return d;
    [next[i], next[j]] = [next[j], next[i]];
    return { ...d, steps: next };
  });

  const sortedUsers = React.useMemo(() => Object.values(users).sort((a, b) => a.dept.localeCompare(b.dept, 'th') || a.name.localeCompare(b.name, 'th')), [users]);
  const teams = ['T1','T2','T3','T4','T5'];

  return (
    <Modal open={true} onClose={onClose} wide title={rule.id.startsWith('r-') && !rule.name ? 'เพิ่มกฎ Workflow ใหม่' : `แก้กฎ: ${draft.name}`}
      footer={<><button className="btn btn-outline" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={() => onSave(draft)}><Icon name="check" size={13} /> บันทึก</button></>}>
      <div className="col gap-16">
        <div className="field">
          <label className="field-label">ชื่อกฎ <span className="req">*</span></label>
          <input className="input" value={draft.name} onChange={e => update({ name: e.target.value })} placeholder="เช่น Sales T2 → หัวหน้าทีมเท่านั้น" autoFocus />
        </div>

        <div className="grid grid-3">
          <div className="field">
            <label className="field-label">ประเภทคำขอ</label>
            <select className="select" value={draft.type} onChange={e => update({ type: e.target.value })}>
              {TYPE_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
            </select>
          </div>
          <div className="field">
            <label className="field-label">แผนกผู้ขอ (ไม่บังคับ)</label>
            <select className="select" value={draft.deptKey} onChange={e => update({ deptKey: e.target.value, team: '' })}>
              <option value="">ทุกแผนก</option>
              {Object.values(MOCK.DEPTS).map(d => <option key={d.key} value={d.key}>{d.th}</option>)}
            </select>
          </div>
          <div className="field">
            <label className="field-label">ทีม (เฉพาะ Sales)</label>
            <select className="select" value={draft.team} onChange={e => update({ team: e.target.value })} disabled={draft.deptKey !== 'sales'}>
              <option value="">ทุกทีม</option>
              {teams.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
        </div>

        <div>
          <div className="spread mb-8">
            <label className="field-label" style={{ margin: 0 }}>ลำดับขั้นอนุมัติ ({draft.steps.length})</label>
            <button className="btn btn-outline btn-sm" onClick={addStep}><Icon name="plus" size={12} /> เพิ่มขั้น</button>
          </div>
          <div className="col gap-8">
            {draft.steps.map((s, i) => {
              const k = s.kind || 'role';
              const isUser = k === 'user';
              const isMulti = k === 'users-and' || k === 'users-or';
              const isRole = k === 'role' || k === 'role-any';
              const setKind = (newKind) => {
                const patch = { kind: newKind };
                // ค่าเริ่มต้นเมื่อเปลี่ยน mode
                if (newKind === 'users-and' || newKind === 'users-or') {
                  patch.userIds = s.userIds && s.userIds.length > 0 ? s.userIds : (s.userId ? [s.userId] : []);
                }
                if (newKind === 'role' || newKind === 'role-any') {
                  patch.role = s.role || 'head';
                }
                updateStep(i, patch);
              };
              const toggleUserId = (uid) => {
                const cur = s.userIds || [];
                const next = cur.includes(uid) ? cur.filter(x => x !== uid) : [...cur, uid];
                updateStep(i, { userIds: next });
              };
              return (
              <div key={i} className="col gap-10" style={{ padding: 12, border: '1px solid var(--border)', borderRadius: 8, background: 'var(--surface-2)' }}>
                <div className="row gap-8" style={{ alignItems: 'flex-start' }}>
                  <div style={{ width: 28, height: 28, borderRadius: 100, background: 'var(--brand)', color: 'white', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{i+1}</div>
                  <div style={{ flex: 1 }} className="col gap-8">
                    {/* Mode selector — 3 ตัวเลือกหลัก */}
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, background: 'var(--surface)', borderRadius: 6, padding: 3, border: '1px solid var(--border)' }}>
                      {[
                        { key: 'user', lbl: 'คนเดียว' },
                        { key: 'users-and', lbl: 'หลายคน (ทุกคน) ' },
                        { key: 'users-or', lbl: 'หลายคน (คนใดก็ได้)' },
                        { key: 'role', lbl: 'ตำแหน่ง' },
                        { key: 'role-any', lbl: 'ตำแหน่ง (ใครก็ได้)' }
                      ].map(opt => (
                        <button key={opt.key} onClick={() => setKind(opt.key)}
                          style={{
                            padding: '4px 10px', borderRadius: 4, border: 'none',
                            background: k === opt.key ? 'var(--brand)' : 'transparent',
                            color: k === opt.key ? 'white' : 'var(--ink-2)',
                            cursor: 'pointer', fontSize: 11, fontWeight: 600
                          }}>{opt.lbl}</button>
                      ))}
                    </div>

                    {/* Content per mode */}
                    {isUser && (
                      <select className="select" value={s.userId || ''} onChange={e => updateStep(i, { userId: e.target.value })}>
                        <option value="">-- เลือกพนักงาน --</option>
                        {sortedUsers.map(u => <option key={u.id} value={u.id}>{u.name} · {u.roleTh} ({u.dept})</option>)}
                      </select>
                    )}

                    {isMulti && (
                      <div className="col gap-6">
                        <div className="alert alert-info" style={{ padding: '8px 10px' }}>
                          <Icon name="info" size={12} style={{ marginTop: 1 }} />
                          <div className="text-xs flex-1">
                            {k === 'users-and'
                              ? <><span className="medium">โหมด AND:</span> ทุกคนที่เลือกต้องอนุมัติตามลำดับ (ระบบจะสร้างขั้นต่อกัน)</>
                              : <><span className="medium">โหมด OR:</span> คนใดคนหนึ่งจากที่เลือกอนุมัติก็ได้ (เพียง 1 ขั้น)</>
                            }
                          </div>
                        </div>
                        <div className="text-xs muted">เลือกได้หลายคน — กดเพื่อ toggle:</div>
                        <div style={{ maxHeight: 180, overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 6, background: 'var(--surface)' }}>
                          {sortedUsers.map(u => {
                            const checked = (s.userIds || []).includes(u.id);
                            return (
                              <label key={u.id} className="row gap-8" style={{ padding: '6px 10px', cursor: 'pointer', borderBottom: '1px solid var(--border)', background: checked ? 'var(--brand-soft)' : 'transparent' }}>
                                <input type="checkbox" checked={checked} onChange={() => toggleUserId(u.id)} />
                                <Avatar user={u} size="sm" />
                                <div style={{ flex: 1, minWidth: 0 }}>
                                  <div className="text-sm" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{u.name}</div>
                                  <div className="text-xs muted">{u.roleTh} · {u.dept}</div>
                                </div>
                              </label>
                            );
                          })}
                        </div>
                        <div className="text-xs muted">เลือกแล้ว <span className="medium en">{(s.userIds || []).length}</span> คน</div>
                      </div>
                    )}

                    {isRole && (
                      <div className="col gap-6">
                        {k === 'role-any' && (
                          <div className="alert alert-info" style={{ padding: '8px 10px' }}>
                            <Icon name="info" size={12} style={{ marginTop: 1 }} />
                            <div className="text-xs flex-1"><span className="medium">โหมด ใครก็ได้:</span> ทุกคนที่มีตำแหน่งนี้ในแผนกผู้ขอ สามารถอนุมัติแทนกันได้</div>
                          </div>
                        )}
                        <select className="select" value={s.role || 'head'} onChange={e => updateStep(i, { role: e.target.value })}>
                          {ROLE_OPTIONS.map(r => <option key={r.value} value={r.value}>{r.label}</option>)}
                        </select>
                      </div>
                    )}

                    <input className="input" value={s.label || ''} onChange={e => updateStep(i, { label: e.target.value })} placeholder="ป้ายชื่อขั้น (เว้นว่างได้)" style={{ fontSize: 12, height: 30 }} />
                  </div>
                  <div className="col gap-2" style={{ flexShrink: 0 }}>
                    <button className="btn btn-ghost btn-sm btn-icon-only" onClick={() => moveStep(i, -1)} disabled={i === 0} title="เลื่อนขึ้น"><Icon name="chevronUp" size={12} /></button>
                    <button className="btn btn-ghost btn-sm btn-icon-only" onClick={() => moveStep(i, 1)} disabled={i === draft.steps.length - 1} title="เลื่อนลง"><Icon name="chevronDown" size={12} /></button>
                    <button className="btn btn-ghost btn-sm btn-icon-only" onClick={() => removeStep(i)} title="ลบ" style={{ color: 'var(--red-ink)' }}><Icon name="trash" size={12} /></button>
                  </div>
                </div>
              </div>
              );
            })}
          </div>
        </div>

        <div className="alert alert-amber">
          <Icon name="warning" size={14} style={{ marginTop: 1 }} />
          <div className="text-xs flex-1"><strong>ตัวอย่าง:</strong> เพื่อบังคับว่า "Sales ทีม T2 ขอเบิกเงิน ต้องผ่าน วิโรจน์ (SA-005) เท่านั้นก่อนผู้อำนวยการบัญชี" → ตั้ง: ประเภท=เบิกเงิน, แผนก=ฝ่ายขาย, ทีม=T2, ขั้น 1=ระบุบุคคล (SA-005), ขั้น 2=ตามบทบาท (ผอ.บัญชี)</div>
        </div>
      </div>
    </Modal>
  );
};

// === SLA Settings — กำหนดเวลาทำงาน ===
// === Cloud Sync Settings — ซิงค์ข้อมูลข้ามเครื่อง ===
const CloudSyncSettings = () => {
  const [cfg, setCfg] = React.useState(getSyncConfig);
  const [creating, setCreating] = React.useState(false);
  const [joinUrl, setJoinUrl] = React.useState('');
  const [showSecret, setShowSecret] = React.useState(false);
  // JSONBin API key — เก็บใน localStorage เครื่องผู้ใช้เอง
  const jsonbinKey = useApiKey('jsonbin');
  const [keyDraft, setKeyDraft] = React.useState(jsonbinKey);
  const [showKey, setShowKey] = React.useState(false);
  React.useEffect(() => { setKeyDraft(jsonbinKey); }, [jsonbinKey]);
  const saveApiKey = () => {
    setApiKey('jsonbin', keyDraft.trim());
    window.toast?.(keyDraft.trim() ? 'บันทึก API key เรียบร้อย' : 'ลบ API key แล้ว', { level: 'success' });
  };
  // Firebase URL
  const fbUrl = useFirebaseUrl();
  const [fbDraft, setFbDraft] = React.useState(fbUrl);
  React.useEffect(() => { setFbDraft(fbUrl); }, [fbUrl]);
  const saveFbUrl = () => {
    let v = fbDraft.trim().replace(/\/+$/, '');
    setFirebaseUrl(v);
    window.toast?.(v ? 'บันทึก Firebase URL เรียบร้อย' : 'ลบ Firebase URL แล้ว', { level: 'success' });
  };
  const testFbConnection = async () => {
    if (!fbUrl) return;
    try {
      const url = fbUrl.replace(/\/+$/, '') + '/.json?shallow=true';
      const res = await fetch(url);
      if (res.ok) window.toast?.('✅ เชื่อมต่อ Firebase สำเร็จ', { level: 'success' });
      else window.toast?.(`❌ Firebase ตอบกลับ HTTP ${res.status} — เช็ค URL และ Rules`, { level: 'error', duration: 6000 });
    } catch (e) { window.toast?.('❌ เชื่อมต่อไม่ได้: ' + e.message, { level: 'error', duration: 6000 }); }
  };

  React.useEffect(() => {
    const h = () => setCfg(getSyncConfig());
    window.addEventListener('fd-sync-config-changed', h);
    return () => window.removeEventListener('fd-sync-config-changed', h);
  }, []);

  const deviceId = cfg.deviceId || (() => {
    const id = 'dev-' + Math.random().toString(36).slice(2, 8);
    return id;
  })();

  const createRoom = async () => {
    setCreating(true);
    try {
      const url = await createSyncBucket();
      const newCfg = { enabled: true, bucketUrl: url, deviceId, lastPushAt: 0, lastPullAt: 0, lastVersion: 0 };
      setSyncConfig(newCfg);
      setCfg(newCfg);
      window.toast('สร้างห้องซิงค์เรียบร้อย — คัดลอกลิงก์แล้วส่งให้คนอื่นในทีม', { level: 'success', duration: 6000 });
    } catch (e) {
      window.toast(e.message || 'สร้างห้องไม่สำเร็จ', { level: 'error', duration: 6000 });
    } finally { setCreating(false); }
  };

  const joinRoom = async () => {
    const url = joinUrl.trim();
    const isFirebase = /firebasedatabase\.app|firebaseio\.com/.test(url);
    const validPrefixes = ['https://jsonbin.io/', 'https://api.jsonbin.io/', 'https://jsonblob.com/api/', 'https://api.npoint.io/'];
    if (!isFirebase && !validPrefixes.some(p => url.startsWith(p))) {
      window.toast('URL ไม่ถูกต้อง — ต้องเป็น Firebase, JSONBin, jsonblob หรือ npoint', { level: 'error', duration: 8000 });
      return;
    }
    if (!confirm('การเข้าร่วมจะดึงข้อมูลจากห้องนี้มาทับข้อมูลปัจจุบัน — ยืนยัน?')) return;
    const newCfg = { enabled: true, bucketUrl: url, deviceId, lastPushAt: 0, lastPullAt: 0, lastVersion: 0 };
    setSyncConfig(newCfg); setCfg(newCfg);
    // Pull ทันที
    const data = await pullFromCloud(url);
    if (data) {
      try {
        Object.keys(data).forEach(k => { if (k.startsWith('_')) return; if (k === 'currentUserId' || k === 'users' || k === 'products' || k === 'customers' || k === 'requests' || k === 'activities') {} });
        // เขียน fd-app-state ใหม่
        const subset = {};
        ['requests','activities','users','products','customers','currentUserId'].forEach(k => { if (k in data) subset[k] = data[k]; });
        if (Object.keys(subset).length > 0) {
          localStorage.setItem(PERSIST_KEY, JSON.stringify(subset));
          window.toast('เข้าร่วมห้องเรียบร้อย — กำลัง reload เพื่อโหลดข้อมูลใหม่', { level: 'success' });
          setTimeout(() => location.reload(), 800);
        } else {
          window.toast('เข้าร่วมห้องเรียบร้อย (ห้องยังว่างเปล่า)', { level: 'success' });
        }
      } catch (e) {
        window.toast('ข้อมูลในห้องไม่ถูกรูปแบบ', { level: 'error' });
      }
    } else {
      window.toast('เข้าร่วมห้องเรียบร้อย (ยังไม่มีข้อมูล)', { level: 'success' });
    }
    setJoinUrl('');
  };

  const leaveRoom = () => {
    if (!confirm('ออกจากห้องซิงค์? ข้อมูลในเครื่องจะคงเดิม แต่จะไม่ซิงค์กับคนอื่นแล้ว')) return;
    setSyncConfig({ enabled: false, bucketUrl: '', deviceId, lastPushAt: 0, lastPullAt: 0, lastVersion: 0 });
    setCfg(getSyncConfig());
    window.toast('ออกจากห้องแล้ว — ข้อมูลในเครื่องคงอยู่', { level: 'info' });
  };

  const copyUrl = () => {
    if (!cfg.bucketUrl) return;
    navigator.clipboard.writeText(cfg.bucketUrl).then(() => {
      window.toast('คัดลอก URL แล้ว — ส่งให้ทีมงานที่จะใช้ข้อมูลร่วมกัน', { level: 'success' });
    }).catch(() => { window.toast('คัดลอกไม่สำเร็จ — เลือกข้อความเอง', { level: 'warning' }); });
  };

  return (
    <div className="col gap-16" style={{ maxWidth: 760 }}>
      <div className="card card-pad">
        <div className="row spread mb-4">
          <h3 className="card-title">ซิงค์ข้อมูลข้ามเครื่อง</h3>
          {cfg.enabled && <span className="badge badge-green"><Icon name="check" size={10} /> เปิดใช้งาน</span>}
        </div>
        <div className="text-xs muted mb-16">เก็บข้อมูลร่วมกันบน cloud (kvdb.io) — ทุกคนในทีมใช้ลิงก์เดียวกัน ข้อมูลซิงค์อัตโนมัติทุก 10 วินาที</div>

        {!cfg.enabled ? (
          <div className="col gap-12">
            <div className="alert alert-info">
              <Icon name="info" size={14} style={{ marginTop: 1 }} />
              <div className="text-xs flex-1">
                <div className="medium mb-2">ทำไมต้องเปิด Cloud Sync?</div>
                ระบบเก็บข้อมูลใน browser ของคุณเอง — ถ้าโยนไฟล์ HTML ให้คนอื่น เขาจะเห็นข้อมูลของเครื่องเขา ไม่เห็นของคุณ · เปิดซิงค์เพื่อใช้ข้อมูลร่วมกันแบบ realtime
              </div>
            </div>

            {/* File:// warning — แสดงเด่นๆเมื่อเปิดจาก file:// */}
            {typeof location !== 'undefined' && location.protocol === 'file:' && (
              <div className="alert alert-red" style={{ borderColor: 'var(--red)' }}>
                <Icon name="warning" size={16} style={{ marginTop: 1, color: 'var(--red)' }} />
                <div className="text-xs flex-1">
                  <div className="medium mb-2" style={{ color: 'var(--red-ink)' }}>⚠️ คุณกำลังเปิดไฟล์จาก file:// — Cloud Sync จะไม่ทำงาน!</div>
                  <div style={{ lineHeight: 1.6 }}>
                    Browser block การเชื่อมต่อข้าม origin เมื่อเปิดไฟล์ตรงๆ จากเครื่อง · ทางแก้ <span className="medium">เลือก 1 ใน 3</span>:
                  </div>
                  <ol style={{ margin: '6px 0 0 18px', padding: 0, lineHeight: 1.7 }}>
                    <li><a href="https://tiiny.host" target="_blank" rel="noreferrer" style={{ color: 'var(--brand-ink)', fontWeight: 600 }}>tiiny.host</a> — drag-drop HTML ฟรี ได้ URL ทันที (แนะนำสุด ใช้เวลา 30 วินาที)</li>
                    <li><a href="https://app.netlify.com/drop" target="_blank" rel="noreferrer" style={{ color: 'var(--brand-ink)', fontWeight: 600 }}>Netlify Drop</a> — drag-drop ได้ HTTPS URL ฟรี ตลอดไป</li>
                    <li>ใช้ <span className="medium">"ส่งออก/นำเข้า JSON"</span> ใน tab "ทั่วไป" แทน (ส่งไฟล์ JSON ให้กันแบบ manual)</li>
                  </ol>
                </div>
              </div>
            )}

            {/* Firebase Realtime DB — แนะนำสำหรับทีม 10+ คน */}
            <div style={{ padding: 14, border: `2px solid ${fbUrl ? 'var(--green)' : 'var(--amber)'}`, borderRadius: 10, background: fbUrl ? 'color-mix(in oklch, var(--green) 4%, var(--surface))' : 'color-mix(in oklch, var(--amber) 4%, var(--surface))' }}>
              <div className="row gap-8 mb-12" style={{ alignItems: 'center' }}>
                <Icon name={fbUrl ? 'check' : 'zap'} size={16} style={{ color: fbUrl ? 'var(--green)' : 'var(--amber)' }} />
                <div className="medium" style={{ fontSize: 14 }}>{fbUrl ? '✅ Firebase พร้อมใช้งาน' : '🔥 Firebase Realtime Database (แนะนำสำหรับทีม 10+ คน)'}</div>
              </div>
              {!fbUrl && (
                <div className="text-xs muted mb-12" style={{ lineHeight: 1.7 }}>
                  ฟรี ตลอดไป · รองรับ <span className="medium">100,000 ops/วัน</span> (3M/เดือน) · sync real-time
                  <ol style={{ margin: '6px 0 0 20px', padding: 0 }}>
                    <li>ไปที่ <a href="https://console.firebase.google.com" target="_blank" rel="noreferrer" style={{ color: 'var(--brand-ink)', fontWeight: 600 }}>console.firebase.google.com</a> → กด "Create a project" (ใช้ Google account)</li>
                    <li>ตั้งชื่อโปรเจ็กต์ เช่น <span className="medium">flowdesk-mycompany</span> → ปิด Analytics ก็ได้ → Create</li>
                    <li>เมนูซ้าย: <span className="medium">Build → Realtime Database</span> → กด "Create Database"</li>
                    <li>เลือก location <span className="medium">asia-southeast1 (Singapore)</span> → "Start in test mode" → Enable</li>
                    <li>คัดลอก URL ที่ขึ้นต้นด้วย <span className="en">https://...firebasedatabase.app</span> ที่หัวหน้า → วางในช่องด้านล่าง</li>
                    <li>กด "บันทึก URL" → กด "ทดสอบเชื่อมต่อ" → ✅ → กด "สร้างห้องใหม่"</li>
                  </ol>
                  <div className="mt-8" style={{ padding: 8, background: 'var(--surface-2)', borderRadius: 6 }}>
                    <span className="medium">⚠️ Security:</span> Test mode เปิด public 30 วัน · หลังจากนั้นไปแก้ Rules ให้ "read/write": true (สำหรับทีมภายใน) หรือใช้ Firebase Auth (ขั้นสูง)
                  </div>
                </div>
              )}
              <div className="row gap-6" style={{ alignItems: 'stretch' }}>
                <input
                  type="text"
                  className="input"
                  value={fbDraft}
                  onChange={(e) => setFbDraft(e.target.value)}
                  placeholder="https://flowdesk-xxxxx-default-rtdb.asia-southeast1.firebasedatabase.app"
                  style={{ flex: 1, fontFamily: 'monospace', fontSize: 12 }}
                />
                <button className="btn btn-primary btn-sm" onClick={saveFbUrl} style={{ height: 38 }} disabled={fbDraft.trim().replace(/\/+$/, '') === fbUrl}>
                  <Icon name="check" size={13} /> บันทึก URL
                </button>
              </div>
              {fbUrl && (
                <div className="row gap-6 mt-8" style={{ alignItems: 'center' }}>
                  <button className="btn btn-outline btn-sm" onClick={testFbConnection}><Icon name="zap" size={12} /> ทดสอบเชื่อมต่อ</button>
                  <button className="btn btn-ghost btn-sm" onClick={() => { if (confirm('ลบ Firebase URL?')) setFirebaseUrl(''); }} style={{ color: 'var(--red-ink)' }}><Icon name="x" size={12} /> ลบ URL</button>
                  <span className="text-xs muted" style={{ marginLeft: 'auto' }}>✓ จะใช้ Firebase ก่อนเสมอเมื่อกด "สร้างห้องใหม่"</span>
                </div>
              )}
            </div>

            {/* JSONBin API Key — รองสำรอง */}
            <div style={{ padding: 14, border: `2px solid ${jsonbinKey ? 'var(--green)' : 'var(--brand)'}`, borderRadius: 10, background: jsonbinKey ? 'color-mix(in oklch, var(--green) 4%, var(--surface))' : 'color-mix(in oklch, var(--brand) 4%, var(--surface))' }}>
              <div className="row gap-8 mb-12" style={{ alignItems: 'center' }}>
                <Icon name={jsonbinKey ? 'check' : 'shield'} size={16} style={{ color: jsonbinKey ? 'var(--green)' : 'var(--brand)' }} />
                <div className="medium" style={{ fontSize: 14 }}>{jsonbinKey ? '✅ JSONBin API Key พร้อมใช้งาน' : 'JSONBin API Key (แนะนำ — เสถียร 100%)'}</div>
              </div>
              {!jsonbinKey && (
                <div className="text-xs muted mb-12" style={{ lineHeight: 1.7 }}>
                  Service ฟรีแบบไม่ต้องสมัครส่วนใหญ่ปิดบริการแล้ว — วิธีที่เสถียรที่สุดคือใช้ <span className="medium">JSONBin.io free tier</span> (10,000 requests/เดือน):
                  <ol style={{ margin: '6px 0 0 20px', padding: 0 }}>
                    <li>ไปที่ <a href="https://jsonbin.io" target="_blank" rel="noreferrer" style={{ color: 'var(--brand-ink)', fontWeight: 600 }}>jsonbin.io</a> → กด "Sign Up Free" (ใช้ Gmail/GitHub ได้)</li>
                    <li>เข้าหน้า <a href="https://jsonbin.io/app/api-keys" target="_blank" rel="noreferrer" style={{ color: 'var(--brand-ink)', fontWeight: 600 }}>API Keys</a> → คัดลอก <span className="medium">X-Master-Key</span></li>
                    <li>วางในช่องด้านล่าง → กด "บันทึก Key"</li>
                    <li>กลับมากด "สร้างห้องใหม่" → จะใช้งานได้ทันที</li>
                  </ol>
                </div>
              )}
              <div className="row gap-6" style={{ alignItems: 'stretch' }}>
                <input
                  type={showKey ? 'text' : 'password'}
                  className="input"
                  value={keyDraft}
                  onChange={(e) => setKeyDraft(e.target.value)}
                  placeholder="วาง X-Master-Key จาก jsonbin.io เช่น $2a$10$..."
                  style={{ flex: 1, fontFamily: 'monospace', fontSize: 12 }}
                />
                <button type="button" className="btn btn-outline btn-sm" onClick={() => setShowKey(s => !s)} style={{ height: 38 }}>{showKey ? '👁️ ซ่อน' : '👁️ แสดง'}</button>
                <button className="btn btn-primary btn-sm" onClick={saveApiKey} style={{ height: 38 }} disabled={keyDraft === jsonbinKey}>
                  <Icon name="check" size={13} /> บันทึก Key
                </button>
              </div>
              {jsonbinKey && (
                <div className="text-xs muted mt-8">
                  ✓ Key ของคุณถูกเก็บใน localStorage ของเครื่องนี้เท่านั้น (ไม่ sync ขึ้น cloud) · ผู้ใช้คนอื่นในทีมต้องตั้ง Key ของตัวเองหรือใช้ Key เดียวกัน
                </div>
              )}
            </div>

            <div className="row spread" style={{ padding: 14, border: '1px solid var(--border)', borderRadius: 10, alignItems: 'center' }}>
              <div style={{ flex: 1 }}>
                <div className="medium text-sm">เริ่มต้นใหม่ — สร้างห้องซิงค์</div>
                <div className="text-xs muted mt-2">ลองสร้างห้องที่ <span className="en">jsonbin.io</span> (ต้องมี API key) → <span className="en">jsonblob.com</span> → <span className="en">npoint.io</span> → ได้ URL ลับ → ส่งให้คนอื่นเข้าร่วม</div>
              </div>
              <button className="btn btn-primary" onClick={createRoom} disabled={creating}>
                {creating ? <><Icon name="clock" size={13} /> กำลังสร้าง...</> : <><Icon name="plus" size={13} /> สร้างห้องใหม่</>}
              </button>
            </div>
            <div className="row spread" style={{ padding: 14, border: '1px solid var(--border)', borderRadius: 10, alignItems: 'center', gap: 12 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="medium text-sm mb-4">เข้าร่วมห้องที่มีอยู่</div>
                <input className="input" value={joinUrl} onChange={(e) => setJoinUrl(e.target.value)} placeholder="วาง URL จากทีม (api.jsonbin.io/v3/b/... · jsonblob.com/api/... · api.npoint.io/...)" />
              </div>
              <button className="btn btn-outline" onClick={joinRoom} disabled={!joinUrl.trim()}><Icon name="upload" size={13} /> เข้าร่วม</button>
            </div>
          </div>
        ) : (
          <div className="col gap-12">
            <div className="alert alert-green">
              <Icon name="check" size={14} style={{ marginTop: 1 }} />
              <div className="text-xs flex-1">
                <div className="medium mb-2">ซิงค์เปิดอยู่ — ข้อมูลทุกการเปลี่ยนแปลงจะถูกส่งขึ้น cloud ใน 2 วินาที</div>
                เครื่องของคุณ: <span className="en medium">{deviceId}</span> · ดึงข้อมูลทุก 10 วินาทีอัตโนมัติ
              </div>
            </div>
            {/* 🆕 Invite Link — แชร์ลิงก์เดียวจบ ไม่ต้องตั้งค่าอะไร */}
            {(() => {
              const inviteUrl = buildInviteUrl();
              const copyInvite = () => {
                if (!inviteUrl) return;
                navigator.clipboard?.writeText(inviteUrl).then(() => {
                  window.toast?.('คัดลอก Invite Link เรียบร้อย — ส่งให้ทีมได้เลย!', { level: 'success', duration: 6000 });
                }).catch(() => {
                  prompt('คัดลอก URL นี้:', inviteUrl);
                });
              };
              return inviteUrl ? (
                <div style={{ padding: 14, border: '2px solid var(--brand)', borderRadius: 10, background: 'color-mix(in oklch, var(--brand) 6%, var(--surface))' }}>
                  <div className="row gap-8 mb-12" style={{ alignItems: 'center' }}>
                    <span style={{ fontSize: 18 }}>🔗</span>
                    <div className="medium" style={{ fontSize: 14, color: 'var(--brand-ink)' }}>Invite Link — ส่งให้ทีมแล้วใช้งานได้เลย ไม่ต้องตั้งค่า</div>
                  </div>
                  <div className="text-xs muted mb-10" style={{ lineHeight: 1.6 }}>
                    ✨ ลิงก์นี้ <span className="medium">รวมทุกอย่าง</span> ในตัว (Firebase URL + room URL + API keys) · ทีมเปิด URL → ระบบ auto-config ให้เอง → login → ใช้ได้ทันที
                  </div>
                  <div className="row gap-6" style={{ alignItems: 'stretch' }}>
                    <input className="input en" value={inviteUrl} readOnly style={{ flex: 1, fontSize: 11, fontFamily: 'monospace' }} onClick={(e) => e.target.select()} />
                    <button className="btn btn-primary btn-sm" onClick={copyInvite} style={{ height: 38 }}><Icon name="copy" size={13} /> คัดลอก Link</button>
                  </div>
                  <div className="text-xs mt-8" style={{ color: 'var(--brand-ink)', lineHeight: 1.6 }}>
                    📲 ส่งผ่าน <span className="medium">LINE / Email / Slack</span> → ทีมกดเปิด → เข้า login → เห็นข้อมูลของทีมทันที (sync อัตโนมัติ)
                  </div>
                </div>
              ) : null;
            })()}

            <div className="field">
              <label className="field-label">URL ของห้อง (สำหรับ advanced — ปกติใช้ Invite Link ด้านบนพอ)</label>
              <div className="row gap-6">
                <input className="input en" value={showSecret ? cfg.bucketUrl : cfg.bucketUrl.replace(/(.{30}).+(.{6})/, '$1••••••••••$2')} readOnly style={{ flex: 1, fontSize: 12 }} />
                <button className="btn btn-outline btn-sm" onClick={() => setShowSecret(s => !s)} title={showSecret ? 'ซ่อน' : 'แสดง'}><Icon name={showSecret ? 'x' : 'check'} size={12} /> {showSecret ? 'ซ่อน' : 'แสดง'}</button>
                <button className="btn btn-outline btn-sm" onClick={copyUrl}><Icon name="copy" size={12} /> คัดลอก</button>
              </div>
              <div className="text-xs muted mt-4">URL แบบเปล่า — สำหรับคนที่ต้องการ paste เองที่ "เข้าร่วมห้องที่มีอยู่"</div>
            </div>
            <div className="grid grid-2 text-xs muted">
              <div>ดันข้อมูลล่าสุด: <span className="medium">{cfg.lastPushAt ? new Date(cfg.lastPushAt).toLocaleString('th-TH') : 'ยังไม่เคย'}</span></div>
              <div>รับข้อมูลล่าสุด: <span className="medium">{cfg.lastPullAt ? new Date(cfg.lastPullAt).toLocaleString('th-TH') : 'ยังไม่เคย'}</span></div>
            </div>
            <div className="alert alert-amber">
              <Icon name="warning" size={14} style={{ marginTop: 1 }} />

              </select>
              {target && overrideCount > 0 && <button className="btn btn-outline btn-sm" onClick={resetAll}><Icon name="repeat" size={12} /> คืนค่าตามตำแหน่ง ({overrideCount} ข้อ)</button>}

              <div className="grid grid-2" style={{ gap: 8 }}>

// ===== v3.1: จัดการรายการตัวเลือก (dropdown ในฟอร์มต่างๆ) =====
const OptionListsSettings = ({ ctx }) => {
  const { state, setState } = ctx;
  const [newVals, setNewVals] = React.useState({});
  const setList = (key, items) => setState({ optionLists: { ...(state.optionLists || {}), [key]: { items, updatedAt: Date.now() } } });
  const add = (key) => {
    const v = (newVals[key] || '').trim();
    const cur = getOptionItems(state, key);
    if (!v) return;
    if (cur.includes(v)) { window.toast('มีตัวเลือกนี้อยู่แล้ว', { level: 'warning' }); return; }
    setList(key, [...cur, v]);
    setNewVals({ ...newVals, [key]: '' });
    window.toast(`เพิ่ม "${v}" แล้ว`, { level: 'success' });
  };
  const del = (key, item) => {
    if (!confirm(`ลบ "${item}" ออกจากรายการ?\n(คำขอเดิมที่ใช้ค่านี้ไม่ได้รับผลกระทบ — ยังแสดงค่าเดิมได้)`)) return;
    setList(key, getOptionItems(state, key).filter(x => x !== item));
  };
  const rename = (key, item) => {
    const v = (prompt(`แก้ไขตัวเลือก`, item) || '').trim();
    if (!v || v === item) return;
    const cur = getOptionItems(state, key);
    if (cur.includes(v)) { window.toast('มีตัวเลือกนี้อยู่แล้ว', { level: 'warning' }); return; }
    setList(key, cur.map(x => x === item ? v : x));
  };
  return (
    <div className="col gap-16">
      <div className="alert alert-info">
        <Icon name="info" size={14} style={{ marginTop: 1 }} />
        <div className="text-xs flex-1">รายการตัวเลือกของช่อง dropdown ในฟอร์มต่างๆ — เพิ่มได้ทั้งจากที่นี่ และจากปุ่ม "➕ เพิ่มตัวเลือกใหม่" ในตัว dropdown ตอนกรอกฟอร์ม · ข้อมูล sync ข้ามเครื่องอัตโนมัติ · การลบไม่กระทบคำขอเดิมที่ใช้ค่านั้นไปแล้ว</div>
      </div>
      <div className="grid grid-2" style={{ gap: 16, alignItems: 'start' }}>
        {Object.keys(OPTION_LIST_META).map(key => {
          const meta = OPTION_LIST_META[key];
          const items = getOptionItems(state, key);
          return (
            <div key={key} className="card card-pad">
              <div className="row gap-10 mb-4">
                <div style={{ width: 34, height: 34, borderRadius: 8, background: 'var(--brand-soft)', display: 'grid', placeItems: 'center', color: 'var(--brand-ink)' }}><Icon name={meta.icon} size={16} /></div>
                <div className="flex-1">
                  <div className="medium text-sm">{meta.th}</div>
                  <div className="text-xs muted">{meta.desc} · {items.length} ตัวเลือก</div>
                </div>
              </div>
              <div className="row gap-6 flex-wrap mt-8 mb-10">
                {items.length === 0 && <span className="text-xs muted">ยังไม่มีตัวเลือก — เพิ่มด้านล่าง</span>}
                {items.map(item => (
                  <span key={item} className="chip" style={{ cursor: 'default', display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                    <span onClick={() => rename(key, item)} style={{ cursor: 'pointer' }} title="คลิกเพื่อแก้ไข">{item}</span>
                    <span onClick={() => del(key, item)} style={{ cursor: 'pointer', color: 'var(--red-ink)', display: 'inline-flex' }} title="ลบ"><Icon name="x" size={10} /></span>
                  </span>
                ))}
              </div>
              <div className="row gap-6">
                <input className="input" style={{ height: 34, flex: 1 }} value={newVals[key] || ''}
                  onChange={(e) => setNewVals({ ...newVals, [key]: e.target.value })}
                  onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); add(key); } }}
                  placeholder="พิมพ์ตัวเลือกใหม่..." />
                <button className="btn btn-primary btn-sm" style={{ height: 34 }} onClick={() => add(key)}><Icon name="plus" size={12} /> เพิ่ม</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

                ถ้าเปลี่ยนไฟล์, เปลี่ยน browser, หรือเปลี่ยน URL → ข้อมูลจะแยก
                <span className="medium" style={{ color: 'var(--amber-ink)' }}> แนะนำให้กดดาวน์โหลดทุกครั้งก่อนเปลี่ยนไฟล์</span>

            <div className="col gap-10">
              <div className="row spread" style={{ padding: 12, border: '1px solid var(--border)', borderRadius: 10, alignItems: 'center' }}>

                  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: nowTh(), data: dump }, null, 2)], { type: 'application/json' });
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = `flowdesk-backup-${nowTh().replace(/[/:\s]/g, '-')}.json`;
                  document.body.appendChild(a); a.click(); document.body.removeChild(a);
                  URL.revokeObjectURL(a.href);

                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      try {
                        const parsed = JSON.parse(ev.target.result);
                        if (!parsed.data || typeof parsed.data !== 'object') throw new Error('ไฟล์ไม่ถูกต้อง');
                        Object.keys(localStorage).filter(k => k.startsWith('fd-')).forEach(k => localStorage.removeItem(k));
                        Object.entries(parsed.data).forEach(([k, v]) => { if (typeof v === 'string') localStorage.setItem(k, v); });

                      } catch (err) {
                        window.toast('นำเข้าไม่สำเร็จ: ' + err.message, { level: 'error' });

                    };
                    reader.readAsText(file);
                    e.target.value = '';
                  }} />

              </div>

                <span><Icon name="info" size={11} /> ขนาดข้อมูล: <span className="en medium">{(() => {
                  let bytes = 0;
                  Object.keys(localStorage).filter(k => k.startsWith('fd-')).forEach(k => { bytes += (localStorage.getItem(k) || '').length; });
                  return bytes < 1024 ? `${bytes} B` : bytes < 1024*1024 ? `${(bytes/1024).toFixed(1)} KB` : `${(bytes/1024/1024).toFixed(2)} MB`;
                })()}</span></span>
                <span>คำขอ: <span className="en medium">{state.requests.length}</span></span>
                <span>กิจกรรม: <span className="en medium">{state.activities.length}</span></span>
              </div>
            </div>
          </div>

          <div className="card card-pad">
            <h3 className="card-title mb-4"><Icon name="warning" size={14} /> เขตอันตราย (Reset Data)</h3>
            <div className="text-xs muted mb-16">การกระทำในส่วนนี้ไม่สามารถย้อนกลับได้</div>
            <div className="col gap-10">
              <div className="row spread" style={{ padding: 12, border: '1px solid var(--border)', borderRadius: 10, alignItems: 'center' }}>
                <div style={{ flex: 1 }}>
                  <div className="medium text-sm">ล้างคำขอและกิจกรรมทั้งหมด</div>
                  <div className="text-xs muted mt-2">ลบ requests + activities + import history แต่ <strong>เก็บ</strong> พนักงาน/สินค้า/ลูกค้า/Workflow rules/ลายเซ็น ไว้</div>
                </div>
                <button className="btn btn-outline btn-sm" style={{ color: 'var(--amber-ink)' }} onClick={() => {
                  if (!confirm('ลบคำขอและกิจกรรมทั้งหมด?')) return;
                  ctx.setState({ requests: [], activities: [], selectedId: null, importTarget: null, clearTarget: null });
                  window.toast('ล้างคำขอและกิจกรรมแล้ว', { level: 'info' });
                }}><Icon name="trash" size={12} /> ล้างคำขอ</button>
              </div>
              <div className="row spread" style={{ padding: 12, border: '1px solid oklch(85% 0.05 25)', borderRadius: 10, alignItems: 'center', background: 'var(--red-soft)' }}>
                <div style={{ flex: 1 }}>
                  <div className="medium text-sm" style={{ color: 'var(--red-ink)' }}>รีเซ็ตข้อมูลทั้งหมด (Factory Reset)</div>
                  <div className="text-xs muted mt-2">ลบทุกอย่าง: คำขอ, กิจกรรม, พนักงาน, สินค้า, ลูกค้า, การตั้งค่า, ลายเซ็น, Workflow rules และ pinned items — กลับสู่สถานะเริ่มต้น</div>
                </div>
                <button className="btn btn-danger btn-sm" onClick={() => {
                  if (!confirm('⚠️ รีเซ็ตข้อมูลทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้')) return;
                  if (!confirm('แน่ใจอีกครั้ง? ระบบจะ reload หน้าหลังจากรีเซ็ต')) return;
                  try {
                    Object.keys(localStorage).filter(k => k.startsWith('fd-')).forEach(k => localStorage.removeItem(k));
                  } catch (e) {}
                  window.toast('รีเซ็ตข้อมูลแล้ว — กำลัง reload...', { level: 'success' });
                  setTimeout(() => location.reload(), 800);
                }}><Icon name="trash" size={12} /> รีเซ็ตทั้งหมด</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

  <script type="text/babel" data-presets="react">
const NAV = [
  { section: 'ภาพรวม' },
  { key: 'dashboard',   icon: 'home',     label: 'หน้าแรก' },
  { key: 'inbox',       icon: 'inbox',    label: 'กล่องงาน', badgeKey: 'approvals' },

  { section: 'ระบบ' },
  { key: 'settings',    icon: 'settings', label: 'ตั้งค่า' }
];

const Sidebar = ({ state, setState, currentUser, onClose }) => {
  // wrap setState — ถ้าเป็นมือถือ (drawer open) ปิด drawer หลังกด
  const isDrawerMode = typeof window !== 'undefined' && window.innerWidth <= 768;
  const navigate = (patch) => {
    setState(patch);
    if (isDrawerMode && onClose) setTimeout(onClose, 50);
  };
  const route = state.route;
  const perms = getPermissions(currentUser);
  const pendingForMe = state.requests.filter(r =>
    r.status === 'pending' && canApproveStep(r.flow[r.currentStep], currentUser.id)
  ).length;
  // นับ clearing badge — รวมของผู้ขอ + ของบัญชีที่ต้องตรวจ
  const myPendingClears = state.requests.filter(r =>
    r.requester === currentUser.id && r.type === 'expense' && r.pendingClear &&
    (!r.clearingStatus || r.clearingStatus === 'rejected') && (r.cleared || 0) < r.amount
  ).length;
  const accountingVerifyCount = currentUser.deptKey === 'accounting'
    ? state.requests.filter(r => r.type === 'expense' && r.clearingStatus === 'submitted').length
    : 0;
  const clearingBadge = myPendingClears + accountingVerifyCount;
  // จำนวนงานที่แผนกของฉัน "รอรับเรื่อง" — ใช้ canReceiveRequest แทน (dept-aware ทุกแผนก)
  const intakeCount = state.requests.filter(r => canReceiveRequest(r, currentUser, state.users)).length;

  // Map nav key → permission key
  const navPerm = {
    'dashboard': 'canDashboard', 'inbox': 'canInbox', 'insights': 'canInsights',
    'my-requests': 'canMyRequests', 'scorecard': 'canScorecard', 'templates': 'canTemplates',
    'recurring': 'canRecurring', 'calendar': 'canCalendar',
    'approvals': 'canViewApprovalsPage', 'intake': 'canViewIntake', 'clearing': 'canViewClearing',
    'exec': 'canViewExecReport', 'stock': 'canViewStockReport', 'master': 'canViewMaster',
    'audit': 'canViewAudit', 'settings': 'canViewSettings'
  };

  const badgeFor = (k) => k === 'approvals' ? pendingForMe : k === 'clearing' ? clearingBadge : k === 'intake' ? intakeCount : 0;

  return (
    <aside className="sidebar">
      <div className="sidebar-logo">
        <div className="sidebar-logo-mark">FD</div>
        <div>
          <div className="sidebar-logo-name">FlowDesk</div>
          <div className="sidebar-logo-sub">{state.requests.length > 0 ? `${state.requests.length} คำขอ · v3.4-dark` : 'ระบบคำขออนุมัติ · v3.4-dark'}</div>
        </div>
      </div>
      <nav className="sidebar-nav">
        {(() => {
          // กรอง NAV ตาม permission และซ่อน section ที่ไม่มี item เหลือ
          const result = [];
          let currentSection = null;
          let sectionHasItems = false;
          NAV.forEach((item, i) => {
            if (item.section) {
              if (currentSection !== null && sectionHasItems) result.push(currentSection);
              currentSection = <div key={i} className="nav-section">{item.section}</div>;
              sectionHasItems = false;
              return;
            }
            const permKey = navPerm[item.key];
            if (permKey && perms[permKey] === false) return; // hide
            sectionHasItems = true;
            if (currentSection) { result.push(currentSection); currentSection = null; }
            const isActive = route === item.key || (item.key === 'my-requests' && route === 'detail');
            const badge = item.badgeKey ? badgeFor(item.badgeKey) : 0;
            result.push(
              <button
                key={item.key}
                className={`nav-item ${isActive ? 'active' : ''}`}
                onClick={() => navigate({ route: item.key, selectedId: null, importTarget: null, clearTarget: null })}
              >
                <Icon name={item.icon} size={16} className="icon" />
                {item.label}
                {badge > 0 && <span className="nav-badge">{badge}</span>}
              </button>
            );
          });
          return result;
        })()}
      </nav>
      <div className="sidebar-foot" style={{ flexDirection: 'column', alignItems: 'stretch', gap: 10, padding: 12 }}>
        {pendingForMe > 0 && (
          <button className="row gap-8" onClick={() => navigate({ route: 'approvals' })} style={{ padding: '8px 10px', background: 'var(--amber-soft)', border: '1px solid oklch(85% 0.05 80)', borderRadius: 8, cursor: 'pointer', textAlign: 'left' }}>
            <Icon name="bell" size={14} style={{ color: 'var(--amber-ink)' }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="text-xs medium" style={{ color: 'var(--amber-ink)' }}>{pendingForMe} คำขอรออนุมัติ</div>
              <div className="text-xs muted">กดเพื่อพิจารณา</div>
            </div>
          </button>
        )}
        <div className="row gap-10">
          <Avatar user={currentUser} size="md" />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="text-sm medium" style={{ color: 'var(--ink)' }}>{currentUser.name.split(' ')[0]}</div>
            <div className="text-xs muted" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{currentUser.roleTh}</div>
          </div>
          <button className="btn btn-ghost btn-icon-only btn-sm" title="ตั้งค่า" onClick={() => navigate({ route: 'settings' })}>
            <Icon name="settings" size={14} />
          </button>
          <button className="btn btn-ghost btn-icon-only btn-sm" title="ออกจากระบบ" onClick={() => { if (window.__fdLogout) window.__fdLogout(); }}>
            <Icon name="x" size={14} />
          </button>
        </div>
      </div>
    </aside>
  );
};

const TopBar = ({ state, setState, currentUser, onMenu, onHelp }) => {
  const [userMenu, setUserMenu] = React.useState(false);
  const [userSearch, setUserSearch] = React.useState('');
  const [notifOpen, setNotifOpen] = React.useState(false);
  const [theme, setTheme] = React.useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [spin, setSpin] = React.useState(false);
  const [globalQ, setGlobalQ] = React.useState('');
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [syncCfg, setSyncCfg] = React.useState(getSyncConfig);
  const userMenuRef = React.useRef(null);
  const notifRef = React.useRef(null);
  const userSearchRef = React.useRef(null);
  const searchRef = React.useRef(null);

  React.useEffect(() => {
    const h = () => setSyncCfg(getSyncConfig());
    window.addEventListener('fd-sync-config-changed', h);
    const id = setInterval(() => setSyncCfg(getSyncConfig()), 5000);
    return () => { window.removeEventListener('fd-sync-config-changed', h); clearInterval(id); };
  }, []);

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'Escape') setSearchOpen(false);
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);

  const toggleTheme = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    setTheme(next);
    if (next === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('fd-theme', next); } catch (e) {}
  };
  const doRefresh = () => { setSpin(true); setTimeout(() => setSpin(false), 700); };

  React.useEffect(() => {
    const handler = (e) => {
      if (userMenuRef.current && !userMenuRef.current.contains(e.target)) { setUserMenu(false); setUserSearch(''); }
      if (notifRef.current && !notifRef.current.contains(e.target)) setNotifOpen(false);
    };
    window.addEventListener('mousedown', handler);
    return () => window.removeEventListener('mousedown', handler);
  }, []);

  React.useEffect(() => {
    if (userMenu && userSearchRef.current) setTimeout(() => userSearchRef.current?.focus(), 50);
    if (!userMenu) setUserSearch('');
  }, [userMenu]);

  const myReqIds = new Set(state.requests.filter(r => r.requester === currentUser.id).map(r => r.id));
  const notifs = [
    ...state.requests.filter(r => r.status === 'pending' && canApproveStep(r.flow[r.currentStep], currentUser.id)).slice(0, 5).map(r => ({ at: r.lastActivity || 'รอ', text: `${r.id} ${r.title} — รออนุมัติของคุณ`, type: 'approve', reqId: r.id })),
    // 🆕 คำขอที่อนุมัติครบ — รอแผนกของฉันกดรับเรื่อง
    ...state.requests.filter(r => canReceiveRequest(r, currentUser, state.users)).slice(0, 5).map(r => ({ at: r.lastActivity || 'พร้อมรับ', text: `${r.id} ${r.title} — อนุมัติครบแล้ว รอรับเรื่อง`, type: 'qr', reqId: r.id })),
    ...state.activities.filter(a => myReqIds.has(a.refId) && a.user !== currentUser.id).slice(0, 5).map(a => { const u = state.users[a.user]; return { at: a.at.split(' ')[1] || a.at, text: `${u?.name?.split(' ')[0] || a.user} ${a.summary} ${a.refId}`, type: a.action === 'approve' ? 'approve' : a.action === 'reject' ? 'reject' : 'qr', reqId: a.refId }; }),
    ...state.requests.filter(r => r.requester === currentUser.id && r.pendingClear && r.type === 'expense' && (r.status === 'progress' || r.status === 'done') && r.clearDueDate).slice(0, 3).map(r => { const sla = slaInfo(r.clearDueDate); return sla && (sla.level === 'overdue' || sla.level === 'urgent' || sla.level === 'today') ? { at: 'SLA', text: `${r.id} ต้องเคลียร์เอกสาร — ${sla.label}`, type: 'warn', reqId: r.id } : null; }).filter(Boolean)
  ].slice(0, 10);
  const hasNotifs = notifs.length > 0;

  const q = globalQ.trim().toLowerCase();
  const matched = q ? (() => {
    const reqMatches = state.requests.filter(r => (r.id + r.title + (r.purpose || '')).toLowerCase().includes(q)).slice(0, 6);
    const userMatches = Object.values(state.users).filter(u => (u.name + u.id + u.dept + u.roleTh).toLowerCase().includes(q)).slice(0, 5);
    const productMatches = state.products.filter(p => (p.sku + p.nameTh).toLowerCase().includes(q)).slice(0, 4);
    return { reqMatches, userMatches, productMatches };
  })() : null;

  return (
    <header className="topbar">
      <button className="btn btn-ghost btn-icon-only menu-btn" onClick={onMenu} title="เมนู"><Icon name="menu" size={18} /></button>
      <div className="search" ref={searchRef} style={{ position: 'relative' }}>
        <Icon name="search" size={14} className="search-icon" />
        <input placeholder="ค้นหาคำขอ, พนักงาน, สินค้า... (Ctrl+K)" value={globalQ}
          onChange={e => { setGlobalQ(e.target.value); setSearchOpen(true); }}
          onFocus={() => setSearchOpen(true)}
          onBlur={() => setTimeout(() => setSearchOpen(false), 150)} />
        {searchOpen && q && matched && (
          <div className="dropdown-menu" style={{ position: 'absolute', top: 'calc(100% + 4px)', left: 0, right: 0, maxHeight: 480, overflowY: 'auto', padding: 4 }}>
            {matched.reqMatches.length === 0 && matched.userMatches.length === 0 && matched.productMatches.length === 0 && (
              <div className="text-xs muted center" style={{ padding: 24 }}>ไม่พบผลลัพธ์สำหรับ "{q}"</div>
            )}
            {matched.reqMatches.length > 0 && (
              <div>
                <div className="text-xs muted" style={{ padding: '8px 10px 4px', fontWeight: 600, textTransform: 'uppercase' }}>คำขอ · {matched.reqMatches.length}</div>
                {matched.reqMatches.map(r => (
                  <button key={r.id} className="dropdown-item" onMouseDown={() => { setState({ route: 'detail', selectedId: r.id }); setSearchOpen(false); setGlobalQ(''); }}>
                    <TypeIcon type={r.type} size={28} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="row gap-8"><span className="en tnum text-xs muted">{r.id}</span><StatusBadge status={r.status} /></div>
                      <div className="text-sm medium" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.title}</div>
                    </div>
                  </button>
                ))}
              </div>
            )}
            {matched.userMatches.length > 0 && (
              <div>
                <div className="text-xs muted" style={{ padding: '8px 10px 4px', fontWeight: 600, textTransform: 'uppercase', borderTop: '1px solid var(--border)', marginTop: 4 }}>พนักงาน · {matched.userMatches.length}</div>
                {matched.userMatches.map(u => (
                  <button key={u.id} className="dropdown-item" onMouseDown={() => { setState({ currentUserId: u.id, route: 'dashboard' }); setSearchOpen(false); setGlobalQ(''); }}>
                    <Avatar user={u} size="sm" />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="text-sm medium" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{u.name}</div>
                      <div className="text-xs muted">{u.roleTh} · {u.dept}</div>
                    </div>
                  </button>
                ))}
              </div>
            )}
            {matched.productMatches.length > 0 && (
              <div>
                <div className="text-xs muted" style={{ padding: '8px 10px 4px', fontWeight: 600, textTransform: 'uppercase', borderTop: '1px solid var(--border)', marginTop: 4 }}>สินค้า · {matched.productMatches.length}</div>
                {matched.productMatches.map(p => (
                  <button key={p.sku} className="dropdown-item" onMouseDown={() => { setState({ route: 'master' }); setSearchOpen(false); setGlobalQ(''); }}>
                    <div style={{ width: 28, height: 28, borderRadius: 6, background: 'var(--brand-soft)', color: 'var(--brand-ink)', display: 'grid', placeItems: 'center' }}><Icon name="package" size={14} /></div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="text-sm medium" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.nameTh}</div>
                      <div className="text-xs muted en">{p.sku} · {fmtBaht(p.price)}</div>
                    </div>
                  </button>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
      <div className="topbar-actions">
        <button className="btn btn-primary btn-sm" onClick={() => setState({ createOpen: true })} title="สร้างคำขอ">
          <Icon name="plus" size={13} /> <span className="topbar-mobile-hide">สร้างคำขอ</span>
        </button>

        <button className="btn btn-ghost btn-icon-only topbar-mobile-hide" title="รีเฟรช" onClick={doRefresh}>
          <span style={{ display: 'inline-flex', transition: 'transform 0.7s', transform: spin ? 'rotate(360deg)' : 'none' }}>
            <Icon name="refresh" size={16} />
          </span>
        </button>
        <button className="btn btn-ghost btn-icon-only" title={theme === 'dark' ? 'โหมดสว่าง' : 'โหมดมืด'} onClick={toggleTheme}>
          <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={16} />
        </button>
        <button className="btn btn-ghost btn-icon-only" style={{ position: 'relative' }} title={syncCfg.enabled ? `Cloud Sync: เปิด · ดันล่าสุด ${syncCfg.lastPushAt ? new Date(syncCfg.lastPushAt).toLocaleTimeString('th-TH') : 'ยังไม่เคย'}` : 'Cloud Sync: ปิด (กดเพื่อตั้งค่า)'} onClick={() => { setState({ route: 'settings' }); try { localStorage.setItem('fd-settings.tab', JSON.stringify('sync')); } catch (e) {} }}>
          <Icon name="cloud" size={16} style={{ color: syncCfg.enabled ? 'var(--green-ink)' : 'var(--ink-3)' }} />
          {syncCfg.enabled && <span style={{ position: 'absolute', top: 8, right: 8, width: 6, height: 6, borderRadius: 100, background: 'var(--green)', border: '1.5px solid var(--surface)' }}></span>}
        </button>
        <button className="btn btn-ghost btn-icon-only topbar-mobile-hide" title="ทางลัด (?)" onClick={onHelp}>
          <Icon name="info" size={16} />
        </button>

        <div className="dropdown" ref={notifRef}>
          <button className="btn btn-ghost btn-icon-only" onClick={() => setNotifOpen(!notifOpen)} style={{ position: 'relative' }}>
            <Icon name="bell" size={16} />
            {hasNotifs && <span style={{
              position: 'absolute', top: 6, right: 6,
              width: 8, height: 8, borderRadius: 100,
              background: 'var(--red)',
              border: '2px solid var(--surface)'
            }}></span>}
          </button>
          {notifOpen && (() => {
            const [notifTab, _setNotifTab] = [window.__notifTab || 'all', (v) => { window.__notifTab = v; setNotifOpen(false); setTimeout(() => setNotifOpen(true), 0); }];
            const grouped = {
              all: notifs,
              approve: notifs.filter(n => n.type === 'approve' || n.type === 'reject'),
              warn: notifs.filter(n => n.type === 'warn'),
              other: notifs.filter(n => n.type !== 'approve' && n.type !== 'reject' && n.type !== 'warn')
            };
            const tabList = grouped[notifTab] || notifs;
            return (
            <div className="dropdown-menu" style={{ width: 360, maxHeight: 540, overflowY: 'auto' }}>
              <div className="spread" style={{ padding: '8px 10px', borderBottom: '1px solid var(--border)' }}>
                <span className="bold text-sm">การแจ้งเตือน</span>
                <span className="text-xs muted en">{notifs.length} รายการ</span>
              </div>
              {/* Tabs */}
              <div className="row gap-4" style={{ padding: '6px 8px', borderBottom: '1px solid var(--border)' }}>
                {[
                  ['all', `ทั้งหมด · ${grouped.all.length}`],
                  ['approve', `อนุมัติ · ${grouped.approve.length}`],
                  ['warn', `แจ้งเตือน · ${grouped.warn.length}`],
                  ['other', `อื่นๆ · ${grouped.other.length}`]
                ].map(([key, lbl]) => (
                  <button key={key} onClick={() => _setNotifTab(key)} style={{ padding: '4px 8px', borderRadius: 5, border: 'none', cursor: 'pointer', background: notifTab === key ? 'var(--brand-soft)' : 'transparent', color: notifTab === key ? 'var(--brand-ink)' : 'var(--ink-3)', fontSize: 11, fontWeight: 500 }}>{lbl}</button>
                ))}
              </div>
              {tabList.length === 0 && <div className="text-xs muted center" style={{ padding: 30 }}>ไม่มีการแจ้งเตือนในหมวดนี้</div>}
              {tabList.map((n, i) => (
                <button key={i} className="dropdown-item" style={{ alignItems: 'flex-start', padding: '10px 10px' }}
                  onClick={() => { if (n.reqId) setState({ route: 'detail', selectedId: n.reqId }); setNotifOpen(false); }}>
                  <div style={{
                    width: 26, height: 26, borderRadius: 100,
                    background: n.type === 'approve' ? 'var(--green-soft)' : n.type === 'reject' ? 'var(--red-soft)' : n.type === 'warn' ? 'var(--amber-soft)' : 'var(--brand-soft)',
                    color: n.type === 'approve' ? 'var(--green-ink)' : n.type === 'reject' ? 'var(--red-ink)' : n.type === 'warn' ? 'var(--amber-ink)' : 'var(--brand-ink)',
                    display: 'grid', placeItems: 'center', flexShrink: 0
                  }}>
                    <Icon name={n.type === 'approve' ? 'check' : n.type === 'reject' ? 'x' : n.type === 'warn' ? 'warning' : 'qr'} size={12} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                    <div className="text-sm" style={{ lineHeight: 1.4, whiteSpace: 'normal' }}>{n.text}</div>
                    <div className="text-xs muted en mt-2">{n.at}</div>
                  </div>
                </button>
              ))}
              <div className="dropdown-sep"></div>
              <button className="dropdown-item center" style={{ color: 'var(--brand-ink)', justifyContent: 'center' }} onClick={() => { setState({ route: 'audit' }); setNotifOpen(false); }}>ดู Audit Log ทั้งหมด</button>
            </div>
            );
          })()}
        </div>

        <div className="dropdown" ref={userMenuRef}>
          <button
            className="btn btn-ghost btn-sm"
            onClick={() => setUserMenu(!userMenu)}
            style={{ padding: '4px 8px', height: 36, gap: 8 }}
          >
            <Avatar user={currentUser} size="sm" />
            <div className="role-switcher-text" style={{ textAlign: 'left' }}>
              <div className="text-xs muted" style={{ fontSize: 10, lineHeight: 1 }}>{currentUser.dept}</div>
              <div className="text-sm medium" style={{ lineHeight: 1.2 }}>{currentUser.name?.split(' ')[0] || currentUser.role}</div>
            </div>
            <Icon name="chevronDown" size={13} />
          </button>
          {userMenu && (() => {
            // Quick KPI for current user — today
            const todayStr = (() => { const d = new Date(); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; })();
            const myToday = state.activities.filter(a => a.user === currentUser.id && a.at && a.at.startsWith(todayStr));
            const myPending = state.requests.filter(r => r.requester === currentUser.id && r.status === 'pending').length;
            const myApprovals = state.requests.filter(r => r.status === 'pending' && canApproveStep(r.flow[r.currentStep], currentUser.id)).length;
            const logout = () => {
              if (!confirm('ออกจากระบบ?')) return;
              try { localStorage.removeItem('fd-session-user'); } catch (e) {}
              if (window.__fdLogout) window.__fdLogout();
              else window.location.reload();
            };
            return (
              <div className="dropdown-menu" style={{ width: 280 }}>
                {/* User Card */}
                <div style={{ padding: 14, background: 'linear-gradient(135deg, color-mix(in oklch, var(--brand) 8%, var(--surface)) 0%, var(--surface) 100%)', borderBottom: '1px solid var(--border)' }}>
                  <div className="row gap-10 mb-12" style={{ alignItems: 'center' }}>
                    <Avatar user={currentUser} size="lg" />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="medium" style={{ fontSize: 14 }}>{currentUser.name}</div>
                      <div className="text-xs muted">{currentUser.roleTh}</div>
                      <div className="text-xs muted en">{currentUser.id} · {currentUser.dept}</div>
                    </div>
                  </div>
                  <div className="grid grid-3" style={{ gap: 6 }}>
                    <div style={{ padding: 6, background: 'var(--surface)', borderRadius: 6, textAlign: 'center', border: '1px solid var(--border)' }}>
                      <div className="en bold" style={{ fontSize: 16, color: myApprovals > 0 ? 'var(--amber-ink)' : 'var(--ink-3)', lineHeight: 1 }}>{myApprovals}</div>
                      <div className="text-xs muted mt-2" style={{ fontSize: 10 }}>รออนุมัติ</div>
                    </div>
                    <div style={{ padding: 6, background: 'var(--surface)', borderRadius: 6, textAlign: 'center', border: '1px solid var(--border)' }}>
                      <div className="en bold" style={{ fontSize: 16, color: myPending > 0 ? 'var(--blue-ink)' : 'var(--ink-3)', lineHeight: 1 }}>{myPending}</div>
                      <div className="text-xs muted mt-2" style={{ fontSize: 10 }}>รอผล</div>
                    </div>
                    <div style={{ padding: 6, background: 'var(--surface)', borderRadius: 6, textAlign: 'center', border: '1px solid var(--border)' }}>
                      <div className="en bold" style={{ fontSize: 16, color: myToday.length > 0 ? 'var(--green-ink)' : 'var(--ink-3)', lineHeight: 1 }}>{myToday.length}</div>
                      <div className="text-xs muted mt-2" style={{ fontSize: 10 }}>วันนี้</div>
                    </div>
                  </div>
                  {isUserOOO(currentUser.id) && (
                    <div className="row gap-6 mt-8" style={{ padding: '4px 8px', background: 'var(--amber-soft)', borderRadius: 6, alignItems: 'center' }}>
                      <Icon name="bellOff" size={11} style={{ color: 'var(--amber-ink)' }} />
                      <span className="text-xs medium" style={{ color: 'var(--amber-ink)', fontSize: 11 }}>โหมด OOO เปิดอยู่</span>
                    </div>
                  )}
                </div>

                {/* Menu items */}
                <button className="dropdown-item" onClick={() => { setState({ route: 'scorecard' }); setUserMenu(false); }}>
                  <Icon name="trophy" size={14} /> ผลงานของฉัน
                </button>
                <button className="dropdown-item" onClick={() => { setState({ route: 'my-requests' }); setUserMenu(false); }}>
                  <Icon name="list" size={14} /> คำขอที่ฉันส่ง
                </button>
                <button className="dropdown-item" onClick={() => { setState({ route: 'settings' }); try { localStorage.setItem('fd-settings.tab', JSON.stringify('ooo')); } catch (e) {} setUserMenu(false); }}>
                  <Icon name="bellOff" size={14} /> ตั้งค่า Out of Office
                </button>
                <button className="dropdown-item" onClick={() => { setState({ route: 'settings' }); try { localStorage.setItem('fd-settings.tab', JSON.stringify('signature')); } catch (e) {} setUserMenu(false); }}>
                  <Icon name="edit" size={14} /> ลายเซ็นของฉัน
                </button>
                <div className="dropdown-sep"></div>
                <button className="dropdown-item" onClick={logout} style={{ color: 'var(--red-ink)' }}>
                  <Icon name="x" size={14} /> ออกจากระบบ (Logout)
                </button>
              </div>
            );
          })()}
        </div>
      </div>
    </header>
  );
};

// ===== Command Palette (Ctrl+K) — Action center + search =====
const CommandPalette = ({ ctx, open, onClose }) => {
  const { state, setState } = ctx;
  const [q, setQ] = React.useState('');
  const [idx, setIdx] = React.useState(0);
  const inputRef = React.useRef(null);
  const listRef = React.useRef(null);
  // ===== Saved searches (per-user) =====
  const SAVED_KEY = 'fd-saved-searches';
  const [savedSearches, setSavedSearches] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch (e) { return []; }
  });
  const saveCurrentSearch = () => {
    if (!q.trim()) return;
    const next = [{ q: q.trim(), at: nowTh() }, ...savedSearches.filter(s => s.q !== q.trim())].slice(0, 10);
    setSavedSearches(next);
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(next)); } catch (e) {}
    window.toast?.(`บันทึก "${q}" แล้ว`, { level: 'success' });
  };
  const deleteSavedSearch = (s) => {
    const next = savedSearches.filter(x => x.q !== s);
    setSavedSearches(next);
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(next)); } catch (e) {}
  };

  React.useEffect(() => {
    if (open) { setQ(''); setIdx(0); setTimeout(() => inputRef.current?.focus(), 50); }
  }, [open]);

  // Build action list
  const actions = React.useMemo(() => {
    const goto = (route) => () => { setState({ route, selectedId: null }); onClose(); };
    const create = (type) => () => { setState({ createOpen: true, createTemplate: { type, preset: {} } }); onClose(); };
    const toggleTheme = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      if (next === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('fd-theme', next); } catch (e) {}
      onClose();
    };
    return [
      { id: 'a-new', kind: 'action', label: 'สร้างคำขอใหม่', hint: 'เลือกประเภทคำขอ', icon: 'plus', keywords: 'new create เพิ่ม', onSelect: () => { setState({ createOpen: true, createTemplate: null }); onClose(); } },
      { id: 'a-new-event', kind: 'action', label: 'สร้างคำขออีเว้นท์', hint: 'จัดงาน · งบประมาณ', icon: 'calendar', keywords: 'event อีเวนท์ จัดงาน', onSelect: create('event') },
      { id: 'a-new-expense', kind: 'action', label: 'สร้างคำขอเบิกเงิน', hint: 'เบิกเงินสดล่วงหน้า', icon: 'wallet', keywords: 'expense เบิกเงิน iou', onSelect: create('expense') },
      { id: 'a-new-purchase', kind: 'action', label: 'สร้างคำขอจัดซื้อ', hint: 'อนุมัติซื้อของ', icon: 'tag', keywords: 'purchase ซื้อ', onSelect: create('purchase') },
      { id: 'a-new-borrow', kind: 'action', label: 'สร้างใบยืม-คืน', hint: 'ยืมสินค้าออกบูธ', icon: 'repeat', keywords: 'borrow ยืม', onSelect: create('borrow') },
      { id: 'a-new-ot', kind: 'action', label: 'สร้างคำขอ OT', hint: 'ทำงานล่วงเวลา', icon: 'clock', keywords: 'overtime ot โอที', onSelect: create('overtime') },
      { id: 'a-new-leave', kind: 'action', label: 'สร้างใบลา', hint: 'ลาป่วย · ลากิจ · ลาพักร้อน', icon: 'user', keywords: 'leave ลา', onSelect: create('leave') },
      { id: 'g-dashboard', kind: 'nav', label: 'ไปหน้าแรก', hint: 'g d', icon: 'home', keywords: 'home dashboard', onSelect: goto('dashboard') },
      { id: 'g-inbox', kind: 'nav', label: 'ไปกล่องงาน', hint: 'g i', icon: 'inbox', keywords: 'inbox', onSelect: goto('inbox') },
      { id: 'g-approvals', kind: 'nav', label: 'ไปรออนุมัติ', hint: 'g a', icon: 'check', keywords: 'approval', onSelect: goto('approvals') },
      { id: 'g-my', kind: 'nav', label: 'ไปคำขอที่ส่ง', hint: 'g m', icon: 'list', keywords: 'my requests', onSelect: goto('my-requests') },
      { id: 'g-calendar', kind: 'nav', label: 'ไปปฏิทิน', hint: 'g c', icon: 'calendar', keywords: 'calendar ปฏิทิน', onSelect: goto('calendar') },
