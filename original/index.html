<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="oklch(70% 0.17 55)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FlowDesk" />
  <title>FlowDesk — ระบบแจ้งงานและติดตามงาน</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
/* ============================================
   FlowDesk — Work Request System
   Design tokens & base styles
   ============================================ */

:root {
  --brand: oklch(70% 0.17 55);
  --brand-hover: oklch(64% 0.18 52);
  --brand-soft: oklch(96% 0.04 60);
  --brand-soft-2: oklch(92% 0.06 58);
  --brand-ink: oklch(38% 0.13 50);

  --bg: oklch(98.5% 0.005 60);
  --surface: oklch(100% 0 0);
  --surface-2: oklch(97.5% 0.006 60);
  --surface-3: oklch(95% 0.008 60);
  --border: oklch(91% 0.008 60);
  --border-strong: oklch(85% 0.01 60);
  --ink: oklch(22% 0.012 60);
  --ink-2: oklch(38% 0.012 60);
  --ink-3: oklch(55% 0.012 60);
  --ink-4: oklch(68% 0.012 60);

  --green: oklch(62% 0.14 150);
  --green-soft: oklch(95% 0.04 150);
  --green-ink: oklch(36% 0.11 150);
  --amber: oklch(76% 0.15 80);
  --amber-soft: oklch(96% 0.05 85);
  --amber-ink: oklch(45% 0.13 70);
  --red: oklch(60% 0.20 25);
  --red-soft: oklch(96% 0.04 25);
  --red-ink: oklch(40% 0.16 25);
  --blue: oklch(60% 0.14 240);
  --blue-soft: oklch(96% 0.03 240);
  --blue-ink: oklch(38% 0.12 240);
  --violet: oklch(58% 0.15 290);
  --violet-soft: oklch(96% 0.03 290);
  --violet-ink: oklch(38% 0.13 290);

  --r-xs: 4px; --r-sm: 6px; --r: 10px; --r-lg: 14px; --r-xl: 20px;
  --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.04), 0 1px 1px oklch(0% 0 0 / 0.03);
  --shadow: 0 4px 14px oklch(0% 0 0 / 0.06), 0 1px 2px oklch(0% 0 0 / 0.04);
  --shadow-lg: 0 24px 48px oklch(0% 0 0 / 0.12), 0 4px 10px oklch(0% 0 0 / 0.06);

  --sidebar-w: 240px;
  --topbar-h: 60px;
  --font-thai: 'IBM Plex Sans Thai Looped', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --font-en: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; -webkit-text-size-adjust: 100%; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-thai);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
.en, .mono, code, .num { font-family: var(--font-en); font-feature-settings: "tnum" 1; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: 100vh; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; overflow-y: auto; position: sticky; top: 0; }
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.sidebar-logo-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; color: var(--surface); font-weight: 600; font-family: var(--font-en); font-size: 13px; letter-spacing: 0; }
.sidebar-logo-name { font-family: var(--font-en); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.sidebar-logo-sub { font-size: 11px; color: var(--ink-3); margin-top: -2px; }
.sidebar-nav { padding: 12px 12px; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.nav-section { font-size: 11px; color: var(--ink-4); text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 10px 6px; font-family: var(--font-en); font-weight: 500; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--ink-2); cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; font-size: 13.5px; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-ink); font-weight: 500; }
.nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }
.nav-item .nav-badge { margin-left: auto; background: var(--brand); color: white; font-size: 10.5px; font-family: var(--font-en); font-weight: 600; padding: 1px 6px; border-radius: 100px; min-width: 18px; text-align: center; }
.nav-item.active .nav-badge { background: var(--brand-ink); }
.sidebar-foot { padding: 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); }
.main { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
.topbar { height: var(--topbar-h); flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 85%, transparent); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; }
.search { flex: 1; max-width: 480px; position: relative; }
.search input { width: 100%; height: 36px; padding: 0 12px 0 36px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); outline: none; font-size: 13px; }
.search input:focus { border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 3px var(--brand-soft); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-4); }
.topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.content { padding: 24px 32px 80px; flex: 1; }
.content-narrow { max-width: 1280px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 26px; font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.2; }
.page-sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); font-size: 13px; font-weight: 500; border: 1px solid transparent; background: var(--surface-2); color: var(--ink); transition: background 0.12s, border-color 0.12s, transform 0.05s; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(0.5px); }
.btn-icon { width: 14px; height: 14px; }
.btn-primary { background: var(--brand); color: white; border-color: var(--brand); }
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-outline { background: var(--surface); border-color: var(--border-strong); }
.btn-outline:hover { background: var(--surface-2); }
.btn-danger { background: var(--red); color: white; border-color: var(--red); }
.btn-danger:hover { filter: brightness(0.95); }
.btn-success { background: var(--green); color: white; border-color: var(--green); }
.btn-success:hover { filter: brightness(0.95); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn-lg { height: 42px; padding: 0 18px; font-size: 14px; }
.btn-icon-only { width: 36px; padding: 0; }
.btn-icon-only.btn-sm { width: 30px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.card-pad { padding: 20px; }
.card-pad-sm { padding: 14px 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); gap: 10px; }
.card-title { font-size: 14px; font-weight: 600; margin: 0; }
.card-sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 100px; font-size: 11.5px; font-weight: 500; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; line-height: 1.6; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 100px; background: currentColor; opacity: 0.6; }
.badge.no-dot::before { display: none; }
.badge-green { background: var(--green-soft); color: var(--green-ink); }
.badge-amber { background: var(--amber-soft); color: var(--amber-ink); }
.badge-red { background: var(--red-soft); color: var(--red-ink); }
.badge-blue { background: var(--blue-soft); color: var(--blue-ink); }
.badge-violet { background: var(--violet-soft); color: var(--violet-ink); }
.badge-brand { background: var(--brand-soft); color: var(--brand-ink); }
.badge-ghost { background: transparent; border: 1px solid var(--border); }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 100px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; cursor: pointer; }
.chip:hover { background: var(--surface-3); }
.chip.active { background: var(--brand-soft); border-color: var(--brand-soft-2); color: var(--brand-ink); }

.avatar { width: 28px; height: 28px; border-radius: 100px; background: var(--brand-soft); color: var(--brand-ink); display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; font-family: var(--font-en); flex-shrink: 0; overflow: hidden; }
.avatar-sm { width: 22px; height: 22px; font-size: 10px; }
.avatar-lg { width: 40px; height: 40px; font-size: 14px; }
.avatar-xl { width: 56px; height: 56px; font-size: 18px; }
.avatar-stack { display: inline-flex; }
.avatar-stack .avatar { margin-left: -8px; border: 2px solid var(--surface); }
.avatar-stack .avatar:first-child { margin-left: 0; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12.5px; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.field-label .req { color: var(--red); }
.field-hint { font-size: 11.5px; color: var(--ink-3); }
.input, .select, .textarea { width: 100%; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; outline: none; height: 36px; }
.textarea { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.input-prefix { position: relative; }
.input-prefix .input { padding-left: 38px; }
.input-prefix .prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 12px; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); font-family: var(--font-en); }
.table td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tbody tr { transition: background 0.1s; }
.table tbody tr:hover { background: var(--surface-2); }
.table tr.clickable { cursor: pointer; }
.table .num-cell { font-family: var(--font-en); font-variant-numeric: tabular-nums; }
.table-compact th, .table-compact td { padding: 8px 12px; }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
.status .dot { width: 8px; height: 8px; border-radius: 100px; background: var(--ink-3); }
.status-pending .dot { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.status-approved .dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.status-rejected .dot { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.status-progress .dot { background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); animation: pulse 2s infinite; }
.status-done .dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.status-draft .dot { background: var(--ink-4); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; } .gap-20 { gap: 20px; } .gap-24 { gap: 24px; }
.mt-2 { margin-top: 2px; } .mt-4 { margin-top: 4px; } .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; } .mt-24 { margin-top: 24px; }
.mb-4 { margin-bottom: 4px; } .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; } .mb-20 { margin-bottom: 20px; } .mb-24 { margin-bottom: 24px; }
.flex-1 { flex: 1; } .flex-wrap { flex-wrap: wrap; }
.muted { color: var(--ink-3); } .muted-2 { color: var(--ink-4); }
.bold { font-weight: 600; } .medium { font-weight: 500; }
.text-sm { font-size: 12px; } .text-xs { font-size: 11.5px; } .text-lg { font-size: 16px; } .text-xl { font-size: 20px; } .text-2xl { font-size: 26px; letter-spacing: -0.01em; } .text-3xl { font-size: 34px; letter-spacing: -0.02em; line-height: 1.1; }
.center { text-align: center; } .right { text-align: right; } .hidden { display: none; }
.divider { height: 1px; background: var(--border); margin: 12px 0; }
.divider-v { width: 1px; background: var(--border); align-self: stretch; }

.grid { display: grid; }
.grid-2 { grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-12 { grid-template-columns: repeat(12, 1fr); gap: 16px; }

@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
    transform: translateX(-100%); transition: transform 0.25s ease; z-index: 60;
    box-shadow: var(--shadow-lg);
  }
  .app.sidebar-open .sidebar { transform: translateX(0); }
  .sidebar-backdrop { position: fixed; inset: 0; background: oklch(20% 0.01 60 / 0.45); z-index: 55; animation: fadeIn 0.15s; }
  .content { padding: 14px; }
  .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .menu-btn { display: inline-flex !important; }
  .search { max-width: 100% !important; min-width: 0 !important; }
  .page-head { flex-direction: column; align-items: stretch; gap: 12px; }
  .page-head > *:last-child { width: 100%; }
  .page-head .row { flex-wrap: wrap; }
  .cal-grid { grid-template-columns: 1fr !important; }

  /* Topbar mobile — ลดความสูง + ซ่อนปุ่มไม่จำเป็น + ย่อ */
  .topbar { padding: 8px 12px !important; gap: 8px !important; }
  .topbar-actions { gap: 4px !important; }
  .topbar-actions .btn-icon-only { width: 36px !important; height: 36px !important; }
  .topbar-mobile-hide { display: none !important; }
  /* role switcher — ซ่อนข้อความ เหลือ avatar */
  .topbar-actions .role-switcher-text { display: none !important; }

  /* Modal fullscreen-sheet บนมือถือ */
  .modal-backdrop { padding: 0 !important; align-items: flex-end !important; }
  .modal {
    max-width: 100% !important;
    max-height: 92vh !important;
    max-height: 92dvh !important; /* dynamic viewport — ตัดส่วนของ keyboard ออก */
    height: auto;
    border-radius: 16px 16px 0 0 !important;
    animation: slideUp 0.25s ease-out !important;
    display: flex !important;
    flex-direction: column !important;
  }
  .modal-wide { max-height: 92vh !important; max-height: 92dvh !important; }
  .modal-body {
    padding: 16px !important;
    -webkit-overflow-scrolling: touch;
    overflow-y: auto !important;
    flex: 1 1 auto !important;
    min-height: 0 !important;
  }
  .modal-head { padding: 14px 16px !important; position: sticky; top: 0; background: var(--surface); z-index: 1; flex-shrink: 0 !important; }
  .modal-foot {
    padding: 12px 16px !important;
    /* เพิ่ม safe-area สำหรับ iPhone notch + กัน BottomNav ทับ */
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0 !important;
    position: sticky !important;
    bottom: 0 !important;
    background: var(--surface-2) !important;
    z-index: 2 !important;
  }
  .modal-foot .btn { flex: 1; min-width: 110px; min-height: 44px; }
  /* ซ่อน BottomNav + FAB ตอนเปิด Modal — ใช้ :has() เพื่อกัน element ทับปุ่มยืนยัน */
  body:has(.modal-backdrop) .bottom-nav { display: none !important; }
  body:has(.modal-backdrop) .fab { display: none !important; }

  /* Touch targets — ปุ่มเล็กขยายขึ้น */
  .btn-sm { min-height: 36px; padding: 6px 12px !important; }
  .btn { min-height: 40px; }
  .btn-icon-only { min-width: 40px; }
  .chip { min-height: 32px; padding: 6px 12px !important; }
  input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; }

  /* Tables — horizontal scroll */
  .card > .table, .card > table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table { font-size: 13px; }
  .table th, .table td { padding: 8px 10px !important; white-space: nowrap; }
  .table .clickable td { min-height: 48px; }

  /* Detail page — stack 2-column grid */
  .content > div > .grid[style*="2fr 1fr"] { grid-template-columns: 1fr !important; }

  /* KPI cards on small */
  .kpi { padding: 12px !important; }
  .kpi-value { font-size: 22px !important; }
  .kpi-icon { width: 32px !important; height: 32px !important; }

  /* Fonts a bit smaller for headings */
  .page-title { font-size: 22px !important; }
  .text-2xl { font-size: 18px !important; }
  .text-xl { font-size: 16px !important; }
  .text-lg { font-size: 15px !important; }

  /* Calendar — เซลล์เล็กลง */
  .cal-grid > .card { padding: 10px !important; }

  /* Tabs scroll horizontally */
  .tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 10px 12px !important; font-size: 12.5px; }

  /* Flow Graph — แนวนอนเลื่อนแสดงเต็ม */
  .flow-graph-wrap { padding: 12px !important; }
  .flow-graph-wrap > div:last-child { padding: 4px !important; }
  /* ลูกศรเชื่อม node สั้นลงบนมือถือ */
  .flow-graph-wrap > div:last-child > div[style*="display: flex"][style*="alignItems: center"][style*="paddingBottom"] > div { width: 24px !important; }
}

@media (max-width: 600px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  /* Sidebar drawer แคบลง */
  .sidebar { width: 86vw !important; max-width: 320px; }
  /* Approval flow stepper ปรับ */
  .appr-step { grid-template-columns: 28px 1fr !important; }
  .appr-meta { grid-column: 2 / -1; font-size: 11px; }
  /* RequestRow gap เล็กลง */
  .content > div > .card > div[style*="gridTemplateColumns"] { gap: 8px !important; padding: 10px 12px !important; }
  /* Hide signature panel on Detail Document modal on mobile (text wraps) */
  #print-doc { padding: 24px 16px !important; }
  #print-doc table { font-size: 11px !important; }
  /* Add bottom padding for FAB + BottomNav so content not hidden */
  .content { padding-bottom: 150px !important; }
  /* sidebar ใช้ drawer pattern จาก @768px — ไม่ซ่อนทิ้ง */
  .app { grid-template-columns: 1fr !important; }
}

/* ===== Bottom Nav (mobile only) ===== */
.bottom-nav { display: none; }
@media (max-width: 768px) {
  .bottom-nav {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: color-mix(in oklch, var(--surface) 95%, transparent);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    z-index: 95;
    padding: 4px 0 max(4px, env(safe-area-inset-bottom)) 0;
    box-shadow: 0 -4px 20px oklch(0% 0 0 / 0.08);
  }

/* ===== Advanced hover effects ===== */

/* Spotlight: bright radial light following cursor — STRONG */
.hover-spot {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  transition: transform 0.2s cubic-bezier(.22,1,.36,1), box-shadow 0.25s, border-color 0.25s;
}
.hover-spot::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle 280px at var(--mx, -200px) var(--my, -200px),
    color-mix(in oklch, var(--brand) 30%, transparent) 0%,
    color-mix(in oklch, var(--brand) 8%, transparent) 35%,
    transparent 60%);
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
  z-index: 0;
}
.hover-spot:hover::before { opacity: 1; }
.hover-spot:hover {
  transform: translateY(-4px) scale(1.012);
  box-shadow:
    0 18px 36px -12px oklch(35% 0.04 60 / 0.22),
    0 6px 12px -4px oklch(35% 0.04 60 / 0.10),
    0 0 0 1px color-mix(in oklch, var(--brand) 30%, transparent);
  border-color: transparent !important;
}
.hover-spot > * { position: relative; z-index: 1; }

/* Border glow that follows cursor — VIVID & ANIMATED */
.hover-glow {
  position: relative;
  isolation: isolate;
  transition: transform 0.22s cubic-bezier(.22,1,.36,1), box-shadow 0.28s, border-color 0.28s;
}
/* Bright moving border ring */
.hover-glow::after {
  content: '';
  position: absolute; inset: -2px;
  border-radius: inherit;
  padding: 2px;
  background: radial-gradient(220px circle at var(--mx, -200px) var(--my, -200px),
    var(--brand) 0%,
    color-mix(in oklch, var(--brand) 60%, transparent) 30%,
    transparent 65%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.22s ease;
  pointer-events: none;
  z-index: 2;
}
.hover-glow:hover::after { opacity: 1; }
/* Inner radial sheen following cursor */
.hover-glow::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle 200px at var(--mx, -200px) var(--my, -200px),
    color-mix(in oklch, var(--brand) 12%, transparent) 0%,
    transparent 55%);
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
  z-index: 0;
}
.hover-glow:hover::before { opacity: 1; }
.hover-glow > * { position: relative; z-index: 1; }
.hover-glow:hover {
  transform: translateY(-5px) scale(1.015);
  box-shadow:
    0 24px 48px -16px oklch(56% 0.18 270 / 0.25),
    0 10px 20px -8px oklch(35% 0.04 60 / 0.15),
    0 4px 8px -4px oklch(35% 0.04 60 / 0.08);
}

/* Tilt 3D — used via inline transform */
.hover-tilt {
  transform-style: preserve-3d;
  transition: transform 0.2s cubic-bezier(.22,1,.36,1);
  will-change: transform;
}

/* Reveal hidden actions on row hover */
.row-hover .row-actions {
  opacity: 0;
  transform: translateX(8px);
  transition: opacity 0.18s ease, transform 0.2s cubic-bezier(.22,1,.36,1);
  pointer-events: none;
}
.row-hover:hover .row-actions, .row-hover:focus-within .row-actions {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}

/* Animated underline for links/labels */
.link-underline { position: relative; display: inline-block; }
.link-underline::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -2px;
  height: 1.5px; background: currentColor;
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.28s cubic-bezier(.22,1,.36,1);
}
.link-underline:hover::after { transform: scaleX(1); }

/* Avatar ring pulse on hover */
.avatar-ring { transition: transform 0.18s cubic-bezier(.22,1,.36,1), box-shadow 0.2s; }
.avatar-ring:hover { transform: scale(1.08); box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand) 25%, transparent); }

/* FAB magnetic + ripple */
.fab {
  position: relative;
  overflow: hidden;
  transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s, background 0.18s;
}
.fab::before {
  content: '';
  position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(circle at center, white 0%, transparent 70%);
  opacity: 0;
  transform: scale(0);
  transition: opacity 0.4s, transform 0.5s;
}
.fab:hover { transform: scale(1.08) translateY(-2px); box-shadow: 0 12px 28px oklch(56% 0.18 270 / 0.5); }
.fab:hover::before { opacity: 0.25; transform: scale(1); }
.fab:active { transform: scale(0.94); }

/* Button press ripple */
.btn { position: relative; overflow: hidden; }
.btn::after {
  content: '';
  position: absolute;
  border-radius: 100px;
  background: currentColor;
  opacity: 0;
  transform: scale(0);
  pointer-events: none;
  top: var(--ry, 50%); left: var(--rx, 50%);
  width: 12px; height: 12px;
  margin: -6px 0 0 -6px;
}
.btn:active::after { animation: ripple 0.5s ease-out; opacity: 0.18; }

/* Nav item active marker + hover slide — stronger */
.nav-item { position: relative; transition: background 0.18s, padding-left 0.24s cubic-bezier(.22,1,.36,1), color 0.18s; }
.nav-item::before {
  content: '';
  position: absolute; left: 0; top: 50%;
  width: 3px; height: 0;
  background: var(--brand);
  border-radius: 0 3px 3px 0;
  transform: translateY(-50%);
  transition: height 0.24s cubic-bezier(.22,1,.36,1), box-shadow 0.24s;
}

}

.nav-item .icon, .nav-item .lucide { transition: transform 0.22s cubic-bezier(.34,1.56,.64,1); }
.nav-item:hover .icon, .nav-item:hover .lucide { transform: scale(1.18) rotate(-4deg); }

/* Table row glow on hover — bold left accent */
.table tbody tr.clickable { position: relative; transition: background 0.18s ease, transform 0.18s ease; }
.table tbody tr.clickable:hover {
  background: color-mix(in oklch, var(--brand) 8%, var(--surface));
  transform: translateX(2px);
}

}

/* Chip hover — strong feedback */
.chip:not(.active):hover {
  background: color-mix(in oklch, var(--brand) 10%, var(--surface-2));

  color: var(--brand-ink);

  box-shadow: 0 4px 10px -4px color-mix(in oklch, var(--brand) 30%, transparent);
}
.chip.active:hover {
  filter: brightness(1.08);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px -2px color-mix(in oklch, var(--brand) 35%, transparent);
}

/* Card hover with rim light */
.card.lift { transition: transform 0.22s cubic-bezier(.22,1,.36,1), box-shadow 0.22s, border-color 0.22s; }
.card.lift:hover {
  transform: translateY(-4px);
  box-shadow:
    0 14px 32px -10px oklch(35% 0.04 60 / 0.22),
    0 4px 10px -2px oklch(35% 0.04 60 / 0.10);

/* Icon button hover rotate */

/* TypeIcon pop on hover within RequestRow */

.type-icon-wrap { transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), filter 0.28s; display: inline-flex; }

/* ChevronRight slide on row hover */
.row-hover .lucide { transition: transform 0.25s cubic-bezier(.34,1.56,.64,1); }
.row-hover:hover > .lucide:last-child { transform: translateX(6px); color: var(--brand-ink); }

/* Disable hover effects on touch devices */
@media (hover: none) {
  .hover-spot::before, .hover-glow::after, .row-hover .row-actions { display: none !important; }
  .row-hover .row-actions { opacity: 1; transform: none; pointer-events: auto; }
}

    mk('HR-001',  'สุนิสา จันทร์เจริญ',  'สน', 'hr',          'staff',    'พนักงานฝ่ายบุคคล'),
    mk('HR-002',  'วิมลรัตน์ ศรีสุข',    'วม', 'hr',          'head',     'หัวหน้าฝ่ายบุคคล'),
    mk('HR-003',  'สมศักดิ์ พัฒนกุล',    'สศ', 'hr',          'manager',  'ผู้จัดการฝ่ายบุคคล'),

    // ===== ฝ่ายขาย — 5 ทีม =====
    mk('SA-001', 'สมชาย บุญดี',        'สช', 'sales', 'head',     'หัวหน้าทีมขายกรุงเทพ',  'T1'),
    mk('SA-002', 'กนกวรรณ ศรีไทย',     'กน', 'sales', 'staff',    'พนักงานขายกรุงเทพ',      'T1'),
    mk('SA-003', 'ณัฐวุฒิ วงษ์ทอง',    'ณว', 'sales', 'staff',    'พนักงานขายกรุงเทพ',      'T1'),
    mk('SA-004', 'พรทิพย์ แสงจันทร์',   'พท', 'sales', 'staff',    'พนักงานขายกรุงเทพ',      'T1'),

    mk('SA-006', 'ชมพูนุท สุขสำราญ',   'ชพ', 'sales', 'staff',    'พนักงานขายภาคเหนือ',    'T2'),
    mk('SA-007', 'สุรชัย ดอกไม้งาม',   'สร', 'sales', 'staff',    'พนักงานขายภาคเหนือ',    'T2'),
    mk('SA-008', 'นิภาพร ทองคำ',       'นภ', 'sales', 'staff',    'พนักงานขายภาคเหนือ',    'T2'),
    mk('SA-009', 'ประเสริฐ ชัยชนะ',    'ปส', 'sales', 'head',     'หัวหน้าทีมขายภาคอีสาน', 'T3'),
    mk('SA-010', 'วัฒนา พรมเมือง',     'วฒ', 'sales', 'staff',    'พนักงานขายภาคอีสาน',    'T3'),
    mk('SA-011', 'กิตติพงษ์ หาญกล้า', 'กต', 'sales', 'staff',    'พนักงานขายภาคอีสาน',    'T3'),
    mk('SA-012', 'อัจฉรา โพธิ์ทอง',    'อจ', 'sales', 'staff',    'พนักงานขายภาคอีสาน',    'T3'),
    mk('SA-013', 'ยุพิน วิเศษสิงห์',   'ยพ', 'sales', 'head',     'หัวหน้าทีมขายภาคใต้',   'T4'),
    mk('SA-014', 'จิตตรา สมบูรณ์',     'จต', 'sales', 'staff',    'พนักงานขายภาคใต้',      'T4'),
    mk('SA-015', 'นพรัตน์ รัตนสุวรรณ', 'นพ', 'sales', 'staff',    'พนักงานขายภาคใต้',      'T4'),

    mk('SA-017', 'เกียรติศักดิ์ ใจเย็น','กร', 'sales', 'head',     'หัวหน้าทีมขายออนไลน์',  'T5'),

  ];

  const NON_REQUESTER_DEPTS = ['office'];
  const inDept = (deptKey) => userList.filter(u => u.deptKey === deptKey);
  const byLevel = (deptKey, level) => inDept(deptKey).find(u => u.level === level);
  const deptHead = (deptKey, forUserId = null) => {
    const u = forUserId ? users[forUserId] : null;
    if (u && u.team) {
      const th = inDept(deptKey).find(x => x.level === 'head' && x.team === u.team && x.id !== forUserId);
      if (th) return th;
    }
    return byLevel(deptKey, 'head') || byLevel(deptKey, 'manager') || byLevel(deptKey, 'director');
  };

    const r = users[requesterId];

      if (h && h.id !== requesterId) steps.push(step(h.id, 'หัวหน้าต้นสังกัด'));
    }
    // ขั้น 2: หัวหน้าการตลาด — ข้ามถ้าผู้ขอ = หัวหน้าการตลาดเอง
    if (requesterId !== MARKETING_HEAD) {
      steps.push(step(MARKETING_HEAD, 'หัวหน้าการตลาด'));
    }
    // ขั้น 3: ผู้อำนวยการบัญชี — ข้ามถ้าผู้ขอ = ผู้อำนวยการบัญชีเอง
    if (requesterId !== ACCOUNTING_DIRECTOR) {
      steps.push(step(ACCOUNTING_DIRECTOR, 'ผู้อำนวยการบัญชี'));
    }
    // ขั้นสุดท้าย: CEO/MD เป็นผู้อนุมัติคนสุดท้ายเสมอ
    if (CEO_ID && users[CEO_ID] && requesterId !== CEO_ID) {
      steps.push(step(CEO_ID, 'CEO/กรรมการผู้จัดการ'));
    }
    return dedupe(steps);
  };

  const deptFlow = (requesterId, withAccounting = true) => {
    const r = users[requesterId];
    const steps = [];
    if (r) {
      // กรณีแผนกมีทีม (เช่น Sales T1-T5)
      if (r.team) {
        const teamHead = inDept(r.deptKey).find(u => u.level === 'head' && u.team === r.team);
        if (teamHead && teamHead.id !== requesterId) {
          steps.push(step(teamHead.id, teamHead.roleTh || 'หัวหน้าทีม'));
        }
        // ถ้าผู้ขอเป็นหัวหน้าทีมเอง → ข้ามขั้นหัวหน้าทีม (ไม่ไปหัวหน้าทีมอื่น!)
      } else {
        // ไม่มีทีม → ใช้หัวหน้าแผนก
        const h = byLevel(r.deptKey, 'head');
        if (h && h.id !== requesterId) steps.push(step(h.id, 'หัวหน้าแผนก'));
      }
      const m = byLevel(r.deptKey, 'manager');
      const d = byLevel(r.deptKey, 'director');
      if (m && m.id !== requesterId) steps.push(step(m.id, 'ผู้จัดการแผนก'));
      if (d && d.id !== requesterId) steps.push(step(d.id, 'ผู้อำนวยการแผนก'));
    }
    if (withAccounting && requesterId !== ACCOUNTING_DIRECTOR) {
      steps.push(step(ACCOUNTING_DIRECTOR, 'ผู้อำนวยการบัญชี'));
    }
    // ขั้นสุดท้าย: CEO/MD เป็นผู้อนุมัติคนสุดท้ายเสมอ
    if (CEO_ID && users[CEO_ID] && requesterId !== CEO_ID) {
      steps.push(step(CEO_ID, 'CEO/กรรมการผู้จัดการ'));
    }
    const out = dedupe(steps);
    // กรณีพิเศษ: ถ้า flow ว่างทั้งหมด (เช่น ผู้บริหารระดับสูงสุดสร้างคำขอ) ให้ส่งไป director บัญชีเสมอ
    if (out.length === 0 && requesterId !== ACCOUNTING_DIRECTOR) {
      out.push(step(ACCOUNTING_DIRECTOR, 'ผู้อำนวยการบัญชี'));
    }
    return out;
  };

  // Flow สำหรับขอเพิ่มพนักงาน:
  // ผู้ขอ → ผู้อำนวยการแผนกของผู้ขอ → HR head → ผู้อำนวยการบัญชี (งบ) → CEO/MD (สุดท้ายเสมอ)
  const hireFlow = (requesterId) => {
    const r = users[requesterId];
    const steps = [];
    if (r) {
      const d = byLevel(r.deptKey, 'director');
      if (d && d.id !== requesterId) steps.push(step(d.id, 'ผู้อำนวยการแผนก'));
    }
    if (HR_HEAD_ID && users[HR_HEAD_ID] && requesterId !== HR_HEAD_ID) {
      steps.push(step(HR_HEAD_ID, 'ฝ่ายบุคคล'));
    }
    if (ACCOUNTING_DIRECTOR && requesterId !== ACCOUNTING_DIRECTOR) {
      steps.push(step(ACCOUNTING_DIRECTOR, 'ผู้อำนวยการบัญชี (งบประมาณ)'));
    }
    if (CEO_ID && users[CEO_ID] && requesterId !== CEO_ID) {
      steps.push(step(CEO_ID, 'CEO/กรรมการผู้จัดการ'));
    }
    return dedupe(steps);
  };

  const NON_FINANCIAL = ['leave', 'overtime'];
  const defaultFlow = (type, requesterId) =>
    type === 'event' ? eventFlow(requesterId)
      : type === 'hire' ? hireFlow(requesterId)
      : deptFlow(requesterId, !NON_FINANCIAL.includes(type));

  // === Custom workflow rules — เก็บใน localStorage ===
  // โครงสร้าง rule: { id, name, type, deptKey, team, steps: [{ kind: 'role'|'user', userId?, role?, label }] }
  const getCustomRules = () => {
    try { return JSON.parse(localStorage.getItem('fd-workflow-rules') || '[]'); } catch (e) { return []; }
  };
  const findCustomRule = (type, requesterId) => {
    const rules = getCustomRules();
    const u = users[requesterId];
    if (!u) return null;
    // match best: type+deptKey+team > type+deptKey > type+all
    const matches = rules.filter(r => r.type === type || r.type === 'all');
    const exact = matches.find(r => r.deptKey === u.deptKey && r.team && r.team === u.team);
    if (exact) return exact;
    const deptMatch = matches.find(r => r.deptKey === u.deptKey && !r.team);
    if (deptMatch) return deptMatch;
    const globalMatch = matches.find(r => !r.deptKey && !r.team);
    if (globalMatch) return globalMatch;
    return null;
  };
  // ค้นพนักงานในแผนกผู้ขอที่ตรงตำแหน่ง
  const usersInRole = (role, requesterDeptKey, requesterTeam) => {
    if (role === 'teamHead' && requesterTeam) return inDept(requesterDeptKey).filter(x => x.level === 'head' && x.team === requesterTeam);
    if (role === 'head') return inDept(requesterDeptKey).filter(x => x.level === 'head');
    if (role === 'manager') return inDept(requesterDeptKey).filter(x => x.level === 'manager');
    if (role === 'director') return inDept(requesterDeptKey).filter(x => x.level === 'director');
    if (role === 'mktHead') return users[MARKETING_HEAD] ? [users[MARKETING_HEAD]] : [];
    if (role === 'accDirector') return users[ACCOUNTING_DIRECTOR] ? [users[ACCOUNTING_DIRECTOR]] : [];
    return [];
  };

  // คืน array ของ step (รองรับ AND แตกหลาย step, OR/role-any รวมเป็น 1 step ที่มี userIds[])
  const resolveStep = (s, requesterId) => {
    const u = users[requesterId];

    // แบบ 1: คนเดียว
    if (s.kind === 'user') {
      const target = users[s.userId];
      if (!target || target.id === requesterId) return [];
      return [step(target.id, s.label || target.roleTh)];
    }

    // แบบ 2A: หลายคน AND — ทุกคนต้องอนุมัติ (แตกเป็นหลาย step ต่อกัน)
    if (s.kind === 'users-and') {
      const ids = (s.userIds || []).filter(id => id && id !== requesterId);
      return ids.map(id => {
        const t = users[id]; if (!t) return null;
        return step(t.id, s.label || t.roleTh);
      }).filter(Boolean);
    }

    // แบบ 2B: หลายคน OR — ใครคนใดอนุมัติได้ (1 step มี userIds[])
    if (s.kind === 'users-or') {
      const ids = (s.userIds || []).filter(id => id && id !== requesterId);
      const valid = ids.filter(id => users[id]);
      if (valid.length === 0) return [];
      if (valid.length === 1) return [step(valid[0], s.label || users[valid[0]].roleTh)];
      const first = step(valid[0], s.label || 'อนุมัติคนใดคนหนึ่ง');
      first.userIds = valid;
      return [first];
    }

    // แบบ 3A: ตำแหน่ง — หา 1 คนที่ตรง (เดิม)
    if (s.kind === 'role' && u) {
      const pool = usersInRole(s.role, u.deptKey, u.team).filter(x => x.id !== requesterId);
      if (pool.length === 0) return [];
      return [step(pool[0].id, s.label || pool[0].roleTh)];
    }

    // แบบ 3B: ตำแหน่งนี้ใครก็ได้ — รวมทุกคนในระดับนั้น
    if (s.kind === 'role-any' && u) {
      const pool = usersInRole(s.role, u.deptKey, u.team).filter(x => x.id !== requesterId);
      if (pool.length === 0) return [];
      if (pool.length === 1) return [step(pool[0].id, s.label || pool[0].roleTh)];
      const first = step(pool[0].id, s.label || (pool[0].roleTh + ' (คนใดก็ได้)'));
      first.userIds = pool.map(x => x.id);
      return [first];
    }

    return [];
  };

  // บังคับ CEO/MD เป็นผู้อนุมัติคนสุดท้ายเสมอ (กฎทอง)
  // ถ้า CEO ไม่อยู่ในรายการ → เติมต่อท้าย; ถ้าอยู่กลางๆ → ย้ายไปท้าย
  const enforceCEOLast = (steps, requesterId) => {
    if (!CEO_ID || !users[CEO_ID] || requesterId === CEO_ID) return steps;
    const ceoIdx = steps.findIndex(s => s.userId === CEO_ID);
    if (ceoIdx === steps.length - 1) return steps; // อยู่ท้ายแล้ว
    let ceoStep;
    let rest;
    if (ceoIdx === -1) {
      ceoStep = step(CEO_ID, 'CEO/กรรมการผู้จัดการ');
      rest = steps;
    } else {
      ceoStep = steps[ceoIdx];
      rest = steps.filter((_, i) => i !== ceoIdx);
    }
    return [...rest, ceoStep];
  };

  const buildFlow = (type, requesterId) => {
    const rule = findCustomRule(type, requesterId);
    if (rule && rule.steps && rule.steps.length > 0) {
      const resolved = rule.steps.flatMap(s => resolveStep(s, requesterId));
      // dedupe: ใช้ userId หลัก แต่กัน step OR/any ไม่ให้ชนกัน
      const seen = new Set();
      const out = resolved.filter(stp => {
        if (!stp || !stp.userId) return false;
        if (seen.has(stp.userId)) return false;
        seen.add(stp.userId);
        return true;
      });
      if (out.length > 0) return enforceCEOLast(out, requesterId);
    }
    return enforceCEOLast(defaultFlow(type, requesterId), requesterId);
  };

  const withStatus = (steps, statusList = []) =>
    steps.map((s, i) => ({
      ...s,
      status: statusList[i] || (i === 0 ? 'pending' : 'waiting'),
      at: statusList[i] === 'approved' ? `26/05/2026 ${(10 + i)}:${10 + i * 7}` : null
    }));

  const stepIndex = (flow) => {
    const i = flow.findIndex(s => s.status === 'pending');
    return i === -1 ? flow.length : i;
  };

  const products = [
    { sku: 'VITC-1000',    name: 'Vitamin C 1000mg',       nameTh: 'วิตามินซี 1000มก.',       unit: 'ขวด/60แคปซูล', price: 320,  stock: 1240 },
    { sku: 'MULTI-30',     name: 'Multivitamin Complex',    nameTh: 'มัลติวิตามินคอมเพล็กซ์', unit: 'ขวด/30เม็ด',   price: 450,  stock: 820  },
    { sku: 'COLLAGEN-100', name: 'Marine Collagen Peptide', nameTh: 'คอลลาเจนเปปไทด์',        unit: 'กล่อง/100ก.',  price: 890,  stock: 340  },
    { sku: 'PROB-30',      name: 'Probiotic 12 Strains',    nameTh: 'โพรไบโอติก 12 สายพันธุ์',unit: 'ขวด/30แคปซูล', price: 680,  stock: 510  },
    { sku: 'FISH-100',     name: 'Fish Oil Omega-3',        nameTh: 'น้ำมันปลาโอเมก้า 3',     unit: 'ขวด/100แคปซูล',price: 540,  stock: 920  },
    { sku: 'CAL-D3-90',    name: 'Calcium + D3',            nameTh: 'แคลเซียม + วิตามินดี 3', unit: 'ขวด/90เม็ด',   price: 380,  stock: 460  }
  ];

  const customers = [
    { id: 'C-001', name: 'ร้านยาเภสัชภัณฑ์ สาขาสีลม',  type: 'ร้านขายยา', tier: 'A' },
    { id: 'C-002', name: 'คลินิกสุขภาพอาวุโส',          type: 'คลินิก',    tier: 'A' },
    { id: 'C-003', name: 'บูธ Fitness Expo 2026',       type: 'อีเวนต์',   tier: 'B' },
    { id: 'C-004', name: 'โรงพยาบาลศรีบุญเรือง',        type: 'โรงพยาบาล', tier: 'A' }
  ];

  // ── ข้อมูลคำขอเริ่มต้นว่าง — ผู้ใช้สร้างคำขอจริงผ่านระบบ ──
  // (เก็บ master data: users, products, customers, departments ไว้ใช้สร้างคำขอ)
  const requests = [];
  const activities = [];

  return {
    users, userList, products, customers, requests, activities,
    DEPTS, NON_REQUESTER_DEPTS,
    deptHead, buildFlow, eventFlow, deptFlow, withStatus, stepIndex, deptColor,
    MARKETING_HEAD, ACCOUNTING_DIRECTOR
  };
})();
  </script>

const fmtBaht = (n) => '฿' + (n || 0).toLocaleString('en-US', { minimumFractionDigits: 0 });

const nowTh = () => { const d = new Date(); const p = (n) => String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const parseTh = (s) => { if (!s) return null; const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (!m) return null; return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])); };
// parseThDT: parse "DD/MM/YYYY HH:mm" รวมเวลา (parseTh ตัดเวลาทิ้ง → SLA รายชั่วโมงเพี้ยน)
const parseThDT = (s) => {
  if (!s) return null;
  const m = String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  if (!m) return null;
  return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4] || 0), Number(m[5] || 0));
};
// 🐛FIX ID ชนกัน: เดิมใช้ length ของ array (+300/+400/+500 ฐานต่างกันแต่ทับซ้อน)
// → สร้างพร้อมกัน 2 เครื่อง หรือ clone กับ create สลับกัน ได้ ID ซ้ำ → merge ทับกัน = ข้อมูลหาย
// ตอนนี้: สแกน ID เดิมทั้งหมดของ prefix → เลขสูงสุด + 1
const mintReqId = (prefix, requests) => {
  let maxN = 299;
  (requests || []).forEach(r => {
    if (!r || !r.id) return;
    const m = String(r.id).match(new RegExp('^' + prefix + '-26-0*(\\d+)$'));
    if (m) { const n = parseInt(m[1], 10); if (!isNaN(n) && n > maxN) maxN = n; }
  });
  return `${prefix}-26-${String(maxN + 1).padStart(4, '0')}`;
};

const getOptionItems = (state, key) => {
  const l = state && state.optionLists && state.optionLists[key];
  if (l && Array.isArray(l.items)) return l.items;
  return (DEFAULT_OPTION_LISTS[key] && DEFAULT_OPTION_LISTS[key].items) || [];
};
const addOptionItem = (state, setState, key, val) => {
  const v = String(val || '').trim();
  const cur = getOptionItems(state, key);
  if (!v || cur.includes(v)) return;
  const lists = { ...(state.optionLists || {}) };
  lists[key] = { items: [...cur, v], updatedAt: Date.now() };
  setState({ optionLists: lists });
};
// merge ต่อ list: updatedAt ใหม่กว่าชนะ (แบบเดียวกับ users)
const mergeOptionLists = (local, remote) => {
  const out = { ...(local || {}) };
  Object.entries(remote || {}).forEach(([k, v]) => {
    if (!v || !Array.isArray(v.items)) return;
    const loc = out[k];
    if (!loc || !Array.isArray(loc.items)) { out[k] = v; return; }
    out[k] = (v.updatedAt || 0) >= (loc.updatedAt || 0) ? v : loc;
  });
  return out;
};
// v3.3: SearchSelect — dropdown ที่พิมพ์ค้นหาได้ (ใช้กับลูกค้า/บูธ)

// Dropdown + "➕ เพิ่มตัวเลือกใหม่" ในตัว — ค่าเก่าที่ไม่อยู่ในรายการยังแสดงได้ (ไม่ทำข้อมูลเดิมพัง)
const OptionSelect = ({ value, onChange, options = [], onAdd, placeholder = '-- เลือก --', height = 32, allowEmpty = true, style }) => {
  const [adding, setAdding] = React.useState(false);
  const [text, setText] = React.useState('');
  const commit = () => {
    const v = text.trim();
    if (v) { if (onAdd) onAdd(v); onChange(v); }
    setAdding(false); setText('');
  };
  const cancel = () => { setAdding(false); setText(''); };
  if (adding) return (
    <div className="row gap-4" style={{ width: '100%', ...style }}>
      <input className="input" style={{ height, flex: 1, minWidth: 0 }} autoFocus value={text}
        onChange={(e) => setText(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') { e.preventDefault(); cancel(); } }}
        placeholder="พิมพ์ตัวเลือกใหม่ แล้วกด Enter..." />
      <button type="button" className="btn btn-primary btn-sm btn-icon-only" style={{ height, flexShrink: 0 }} onClick={commit} title="บันทึกเข้ารายการ"><Icon name="check" size={12} /></button>
      <button type="button" className="btn btn-outline btn-sm btn-icon-only" style={{ height, flexShrink: 0 }} onClick={cancel} title="ยกเลิก"><Icon name="x" size={12} /></button>
    </div>
  );
  const opts = (value && !options.includes(value)) ? [value, ...options] : options;
  return (
    <select className="select" style={{ height, width: '100%', ...style }} value={value || ''}
      onChange={(e) => { const v = e.target.value; if (v === '__add__') { setAdding(true); setText(''); } else onChange(v); }}>
      {allowEmpty && <option value="">{placeholder}</option>}
      {opts.map(o => <option key={o} value={o}>{o}</option>)}

// ===== CSV Export Helper =====
// Generates CSV and triggers download in browser
const exportCSV = (filename, headers, rows) => {
  const escape = (v) => {
    if (v == null) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(escape).join(',')];
  rows.forEach(row => lines.push(row.map(escape).join(',')));
  const bom = '﻿'; // UTF-8 BOM for Excel
  const csv = bom + lines.join('\n');
  try {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (window.toast) window.toast(`ดาวน์โหลด ${filename} เรียบร้อย`, { level: 'success' });
    return true;
  } catch (e) {
    if (window.toast) window.toast('ส่งออก CSV ไม่สำเร็จ: ' + e.message, { level: 'error' });
    return false;
  }
};

// บวกวันทำการ (ข้ามเสาร์-อาทิตย์)
const addBusinessDays = (date, days) => {
  const d = new Date(date);
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const day = d.getDay();
    if (day !== 0 && day !== 6) added++;
  }
  return d;
};
// คำนวณ approved date จาก flow (วันที่ flow ขั้นสุดท้าย approved)
const getApprovedAt = (req) => {
  if (req.status !== 'progress' && req.status !== 'done') return null;
  for (let i = req.flow.length - 1; i >= 0; i--) {
    if (req.flow[i].status === 'approved' && req.flow[i].at) return parseTh(req.flow[i].at);
  }
  return null;
};
// คำนวณ deadline ของงาน — ขึ้นกับ mode
// 🐛FIX: deadline = สิ้นวัน (23:59) — เดิมเที่ยงคืนทำให้งานเด้ง "เกินกำหนด" ตั้งแต่ 00:00 ของวันครบกำหนด
const _endOfDay = (d) => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
const computeWorkDeadline = (req, cfg) => {
  cfg = cfg || getSLAConfig();
  const mode = req.slaMode || cfg.deadlineMode;
  if (mode === 'from-create') {
    const d = parseTh(req.createdAt); if (!d) return null;
    return { mode, deadline: _endOfDay(addBusinessDays(d, cfg.approvalDays + cfg.workDaysFromCreate)), label: 'ตั้งแต่วันขอ' };
  }
  if (mode === 'from-approve') {
    const d = getApprovedAt(req); if (!d) return null;
    return { mode, deadline: _endOfDay(addBusinessDays(d, cfg.workDaysFromApprove)), label: 'หลังอนุมัติ' };
  }
  if (mode === 'from-receive') {
    if (!req.receivedAt) return null;
    const d = parseTh(req.receivedAt); if (!d) return null;
    return { mode, deadline: _endOfDay(addBusinessDays(d, cfg.workDaysFromReceive)), label: 'หลังรับเรื่อง' };
  }
  return null;
};
// คำนวณ SLA ของขั้นอนุมัติแต่ละขั้น
const approvalStepSLA = (req, stepIdx, cfg) => {
  cfg = cfg || getSLAConfig();
  const step = req.flow[stepIdx]; if (!step || step.status !== 'pending') return null;
  // 🐛FIX: ใช้ parseThDT (รวมเวลา) — เดิม parseTh ตัดเวลาเป็นเที่ยงคืน ทำให้ label ชั่วโมงเพี้ยน/เกินก่อนจริง
  const prevTime = stepIdx > 0 && req.flow[stepIdx - 1].at
    ? parseThDT(req.flow[stepIdx - 1].at)
    : parseThDT(req.createdAt);
  if (!prevTime) return null;
  const deadline = addBusinessDays(prevTime, cfg.approvalDays);
  const now = new Date();
  const diffMs = deadline - now;
  const hours = Math.floor(diffMs / 3600000);
  if (diffMs < 0) return { level: 'overdue', label: `เกิน ${Math.abs(Math.floor(diffMs/3600000))} ชม.`, deadline };
  if (hours < 4) return { level: 'urgent', label: `เหลือ ${hours} ชม.`, deadline };
  if (hours < 24) return { level: 'soon', label: `เหลือ ${hours} ชม.`, deadline };
  return { level: 'ok', label: `เหลือ ${Math.floor(hours/24)} วัน`, deadline };
};
// === Auto-urgent: หากกำหนดวันส่งงานเร็วกว่า SLA → บังคับ priority=high ===
// Buffer ต่อประเภท (วันทำการ): approvalDays + workDays
const URGENT_BUFFER_DEFAULT = {
  withdrawal: 2,  // 1 approve + 2 work = ต้องมีเวลาอย่างน้อย 3 วันทำการก่อนกำหนด
  borrow:     2,
  expense:    3,
  purchase:   5,
  event:      5,
  overtime:   1,
  leave:      1,
  general:    2,
  hire:       7,
};
const getUrgentBuffer = (type) => {
  try {
    const raw = JSON.parse(localStorage.getItem('fd-urgent-buffer'));
    return { ...URGENT_BUFFER_DEFAULT, ...(raw || {}) }[type] ?? 3;
  } catch (e) { return URGENT_BUFFER_DEFAULT[type] ?? 3; }
};
// คำนวณวันที่เร็วสุดที่ยังถือว่า "ปกติ" (ไม่ด่วน)
// ⚡ v3.1: ใช้สูตรโหมด 1 (นับตั้งแต่วันขอ) เสมอ = วันอนุมัติ + วันทำงาน จากตั้งค่า SLA
// (เดิมใช้ buffer รายประเภท — แทนที่ตามที่ผู้ใช้กำหนด · getUrgentBuffer คงไว้เผื่ออ้างอิง แต่ไม่ใช้แล้ว)
const earliestNormalDate = (type, fromDate) => {
  const cfg = getSLAConfig();
  const buffer = (cfg.approvalDays || 1) + (cfg.workDaysFromCreate || 4);
  return addBusinessDays(fromDate || new Date(), buffer);
};
// ตรวจว่ากำหนด dueDate (TH string DD/MM/YYYY) เร็วเกินจนต้องบังคับเป็น "ด่วน" หรือไม่
// ⚡ v3.2: เสาร์/อาทิตย์ไม่ใช่วันทำการ — ถ้ากำหนดวันตรงเสาร์/อาทิตย์ งานต้องเสร็จภายในศุกร์ก่อนหน้า
// → เลื่อนวันเทียบกลับเป็นวันทำการล่าสุดก่อนเทียบกับ SLA (ทำให้เสาร์/อาทิตย์เข้าเกณฑ์ด่วนเหมือนวันศุกร์)
const shouldAutoUrgent = (type, dueDateStr, fromDate) => {
  if (!type || !dueDateStr) return false;
  const due = parseTh(dueDateStr); if (!due) return false;
  while (due.getDay() === 0 || due.getDay() === 6) due.setDate(due.getDate() - 1);
  const safe = earliestNormalDate(type, fromDate || new Date());
  // ถ้า dueDate (วันทำการจริง) มาก่อนหรือเท่ากับวันปลอดภัย → ต้องด่วน
  return due <= safe;
};
// ⚡ v3.2: วันที่ใช้ตัดสิน "ด่วน" ตามประเภท — ประเภทที่มีวันเฉพาะต้องใช้วันนั้นก่อน form.dueDate
// (🐛FIX: เดิม form.dueDate ถูก pre-fill จาก suggestDueDate ทุกประเภท → อีเว้นท์วันเริ่มใกล้ๆ ไม่เคยขึ้นด่วน)
const urgencyDateOf = (type, form) => {
  if (type === 'event') return form.eventStartDate;
  if (type === 'borrow') return form.borrowStartDate || form.dueDate; // v3.3: ยืม-คืน ใช้วันเริ่มยืม (fallback dueDate ของเดิม)
  if (type === 'overtime') return form.otDate;
  if (type === 'leave') return form.startDate;
  if (type === 'hire') return form.hireStartDate;
  return form.dueDate;
};

// SLA ของงาน (หลังอนุมัติ)
const workDeadlineInfo = (req) => {
  const info = computeWorkDeadline(req); if (!info) return null;
  const now = new Date();
  const diffMs = info.deadline - now;
  const days = Math.ceil(diffMs / 86400000);
  if (req.status === 'done') return { level: 'done', label: 'ส่งงานแล้ว', deadline: info.deadline, mode: info.mode };
  if (diffMs < 0) return { level: 'overdue', label: `เกินกำหนด ${Math.abs(days)} วัน`, deadline: info.deadline, mode: info.mode, fmtLabel: info.label };
  if (days <= 1) return { level: 'urgent', label: 'ต้องเสร็จวันนี้/พรุ่งนี้', deadline: info.deadline, mode: info.mode, fmtLabel: info.label };
  if (days <= 3) return { level: 'soon', label: `อีก ${days} วัน`, deadline: info.deadline, mode: info.mode, fmtLabel: info.label };
  return { level: 'ok', label: `อีก ${days} วัน`, deadline: info.deadline, mode: info.mode, fmtLabel: info.label };
};

  }, []);
  return cfg;
};
// แผนกที่จะรับเรื่องสำหรับ request ใดๆ — return deptKey หรือ 'requester'
const getReceiveDeptForReq = (req, users) => {
  const cfg = getReceiveDeptConfig();
  const target = cfg[req.type] || 'requester';
  if (target === 'requester') return users[req.requester]?.deptKey;
  return target;
};

// ตรวจว่าใครสามารถ "รับเรื่อง" ได้ — ต้องเป็นคนในแผนกที่รับผิดชอบประเภทนั้น
// (ผู้ขอจะเห็นเฉพาะกรณี general ที่ระบุ 'requester' เพราะแผนกของผู้ขอเป็น target อยู่แล้ว)
const canReceiveRequest = (req, currentUser, users) => {
  if (!currentUser || !req) return false;
  if (req.status !== 'progress') return false;
  if (req.receivedAt) return false;
  const targetDept = getReceiveDeptForReq(req, users);
  return currentUser.deptKey === targetDept;
};
// ตรวจว่าใครส่งงานได้
const canCompleteRequest = (req, currentUser, users) => {
  if (!currentUser || !req) return false;
  if (req.status !== 'progress') return false;
  if (!req.receivedAt) return false;
  // ผู้รับเรื่องเอง หรือคนในแผนกที่รับ
  if (req.receivedBy === currentUser.id) return true;
  const targetDept = getReceiveDeptForReq(req, users);
  return currentUser.deptKey === targetDept;
};
// ===== Visibility System — ใครเห็นคำขอประเภทไหน (แก้ได้ใน Settings) =====
// 5 mode: public | self | involved | sameDept | adminOnly
const VISIBILITY_MODES = {
  public:    { th: 'ทุกคน',                                icon: '🌐', desc: 'ใครก็เห็นได้' },
  self:      { th: 'เฉพาะของตัวเอง',                       icon: '👤', desc: 'แค่ผู้ขอเท่านั้น' },
  involved:  { th: 'ตัวเอง + ผู้อนุมัติ + ผู้รับเรื่อง',     icon: '👥', desc: 'คนที่เกี่ยวข้องกับคำขอ' },
  sameDept:  { th: 'เฉพาะแผนกของผู้ขอ',                  icon: '🏢', desc: 'คนในแผนกเดียวกับผู้ขอ' },
  depts:     { th: 'เลือกแผนกเอง',                         icon: '🏬', desc: 'ผู้เกี่ยวข้อง + แผนกที่ติ๊กเลือก' },
  adminOnly: { th: 'แอดมินเท่านั้น',                       icon: '🔒', desc: 'เฉพาะผู้ดูแลระบบ' }

// v3.3: config ต่อประเภทเป็นได้ทั้ง string (โหมดเดิม) หรือ { mode:'depts', depts:[...] }
const visModeOf = (val) => (val && typeof val === 'object') ? (val.mode || 'involved') : (val || 'involved');
const visDeptsOf = (val) => (val && typeof val === 'object' && Array.isArray(val.depts)) ? val.depts : [];
const DEFAULT_VISIBILITY = {
  event: 'public',      // งานอีเว้นท์ — ทุกคนเห็น
  expense: 'involved',
  purchase: 'involved',
  overtime: 'involved',
  leave: 'involved',
  hire: 'involved',
  withdrawal: 'involved',
  borrow: 'involved',
  general: 'sameDept'
};
const getVisibilityConfig = () => {
  try {
    const raw = JSON.parse(localStorage.getItem('fd-visibility-config'));
    return { ...DEFAULT_VISIBILITY, ...(raw || {}) };
  } catch (e) { return DEFAULT_VISIBILITY; }
};
const setVisibilityConfig = (cfg) => {
  try { localStorage.setItem('fd-visibility-config', JSON.stringify(cfg)); } catch (e) {}
  window.dispatchEvent(new CustomEvent('fd-visibility-changed'));
};
const useVisibilityConfig = () => {
  const [cfg, setCfg] = React.useState(getVisibilityConfig);
  React.useEffect(() => {
    const h = () => setCfg(getVisibilityConfig());

  }, []);
  return cfg;
};
// helper หลัก — ตรวจว่า user เห็นคำขอนี้มั้ย
const canViewRequest = (req, currentUser, users) => {
  if (!currentUser || !req) return false;
  const cfg = getVisibilityConfig();
  const rawVal = cfg[req.type] || 'involved';
  const mode = visModeOf(rawVal);
  // Admin เห็นได้หมด (ทุก mode)
  const perms = getPermissions ? getPermissions(currentUser) : { isAdmin: false };
  if (perms.isAdmin) return true;
  // ผู้เกี่ยวข้องโดยตรง — เห็นเสมอ (ไม่งั้นงานเดินไม่ได้)
  const isInvolved = () => {
    if (req.requester === currentUser.id) return true;
    // event staff — คนที่ไปร่วมงาน
    if (req.eventStaff && req.eventStaff.includes(currentUser.id)) return true;
    // ผู้อนุมัติในขั้นใดก็ตาม
    if (req.flow && req.flow.some(s => canApproveStep(s, currentUser.id))) return true;
    // ผู้รับเรื่อง / คนในแผนกที่รับเรื่อง
    if (req.receivedBy === currentUser.id) return true;
    const receiveDept = getReceiveDeptForReq(req, users);
    if (currentUser.deptKey === receiveDept) return true;
    // watcher
    if ((req.watchers || []).includes(currentUser.id)) return true;
    return false;
  };
  switch (mode) {
    case 'public': return true;
    case 'self': return req.requester === currentUser.id;
    case 'adminOnly': return perms.isAdmin === true;
    case 'sameDept': {
      const reqDept = users[req.requester]?.deptKey;
      return reqDept === currentUser.deptKey;
    }
    // v3.3: เลือกแผนกเอง — แผนกที่ติ๊ก + ผู้เกี่ยวข้องโดยตรง
    case 'depts': {
      if (visDeptsOf(rawVal).includes(currentUser.deptKey)) return true;
      return isInvolved();
    }
    case 'involved':
    default: return isInvolved();
  }
};

// ===== Password + Permission system =====
// hash function ง่ายๆ (ไม่ใช่ crypto-grade — ใช้แค่ obfuscate ใน localStorage)
const hashPassword = (pwd) => {
  if (!pwd) return '';
  let h = 5381;
  for (let i = 0; i < pwd.length; i++) h = ((h << 5) + h) ^ pwd.charCodeAt(i);
  return 'fdh:' + Math.abs(h).toString(36) + ':' + pwd.length;
};
const verifyPassword = (pwd, hash) => hashPassword(pwd) === hash;

// v3.3: สิทธิ์รายคน — ค่าเริ่มต้นจากตำแหน่ง (getPermissionsBase) + override ต่อ user (ติ๊กใน Settings)
// เก็บใน user.permOverrides = { key: true/false } → sync ข้ามเครื่องพร้อม users
const getPermissions = (user) => {
  const base = getPermissionsBase(user);
  if (!user || !user.permOverrides) return base;
  const merged = { ...base };
  Object.entries(user.permOverrides).forEach(([k, v]) => { if (typeof v === 'boolean' && k in base) merged[k] = v; });
  return merged;
};

const slaInfo = (dueDate) => {
  const d = parseTh(dueDate); if (!d) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { days: -diff, level: 'overdue', label: `เกิน ${-diff} วัน`, color: 'var(--red-ink)', bg: 'var(--red-soft)' };
  if (diff === 0) return { days: 0, level: 'today', label: 'วันนี้', color: 'var(--red-ink)', bg: 'var(--red-soft)' };
  if (diff <= 3) return { days: diff, level: 'urgent', label: `อีก ${diff} วัน`, color: 'var(--amber-ink)', bg: 'var(--amber-soft)' };
  if (diff <= 7) return { days: diff, level: 'soon', label: `อีก ${diff} วัน`, color: 'var(--ink-2)', bg: 'var(--surface-3)' };
  return { days: diff, level: 'normal', label: `อีก ${diff} วัน`, color: 'var(--ink-3)', bg: 'transparent' };
};

const SLABadge = ({ dueDate, compact = false }) => {

};

const downloadCSV = (filename, rows) => {
  if (!rows || !rows.length) return;
  const esc = (v) => { if (v == null) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = rows.map(r => r.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
};

// === Hover tracking — สำหรับ spotlight / glow effects ===
const useMouseTrack = () => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    };
    const onLeave = () => {
      el.style.setProperty('--mx', '-100px');
      el.style.setProperty('--my', '-100px');
    };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => { el.removeEventListener('mousemove', onMove); el.removeEventListener('mouseleave', onLeave); };
  }, []);
  return ref;
};

const Spotlight = ({ className = '', style, children, ...rest }) => {
  const ref = useMouseTrack();
  return <div ref={ref} className={`hover-spot ${className}`} style={style} {...rest}>{children}</div>;
};

const Glow = ({ className = '', style, children, ...rest }) => {
