              const newWatchers = [...new Set([...currentWatchers, currentUser.id, ...mentions])];
              const updated = state.requests.map(r => r.id === req.id ? { ...r, discussion: [...(r.discussion || []), newC], comments: (r.comments || 0) + 1, watchers: newWatchers, lastActivity: replyTo !== null ? `ตอบกลับความคิดเห็น` : (mentions.length > 0 ? `แท็ก ${mentions.length} คน` : 'ความคิดเห็นใหม่') } : r);
              const replySummary = replyTo !== null ? `ตอบกลับความคิดเห็น #${replyTo + 1}` : (mentions.length > 0 ? `เพิ่มความคิดเห็น · แท็ก ${mentions.map(id => state.users[id]?.name?.split(' ')[0] || id).join(', ')}` : 'เพิ่มความคิดเห็น');
              const acts = [{ at: nowTh(), user: currentUser.id, action: 'comment', refId: req.id, summary: replySummary }];
              setState({ requests: updated, activities: [...acts, ...state.activities] });
              setCommentText('');
              setReplyTo(null);
              if (mentions.length > 0) window.toast(`ส่งความคิดเห็น · แท็ก ${mentions.length} คน — เพิ่มเป็นผู้ติดตามอัตโนมัติ`, { level: 'success' });
            };
            return (
              <div className="card card-pad">
                <div className="col gap-16">
                  {watchers.length > 0 && (
                    <div className="row gap-8 flex-wrap" style={{ paddingBottom: 12, borderBottom: '1px solid var(--border)' }}>
                      <span className="text-xs muted"><Icon name="star" size={11} /> ผู้ติดตาม ({watchers.length}):</span>
                      {watchers.slice(0, 8).map(wid => { const wu = state.users[wid]; return wu ? <span key={wid} className="row gap-4" style={{ fontSize: 11 }}><Avatar user={wu} size="sm" /><span className="muted">{wu.name.split(' ')[0]}</span></span> : null; })}
                      {watchers.length > 8 && <span className="text-xs muted">+{watchers.length - 8}</span>}
                    </div>
                  )}
                  {discussion.length === 0 && <Empty icon="message" title="ยังไม่มีความคิดเห็น" sub={`เริ่มการสนทนาเป็นคนแรก · พิมพ์ @ตามด้วยชื่อ เพื่อแท็กคน`} />}
                  {(() => {
                    const REACTIONS = [{ k: 'thumb', e: '👍' }, { k: 'heart', e: '❤️' }, { k: 'smile', e: '😊' }, { k: 'pray', e: '🙏' }, { k: 'eye', e: '👀' }];
                    const toggleReact = (ci, key) => {
                      const updated = state.requests.map(r => {
                        if (r.id !== req.id) return r;
                        const newDisc = (r.discussion || []).map((cc, idx) => {
                          if (idx !== ci) return cc;
                          const reacts = { ...(cc.reactions || {}) };
                          const users = reacts[key] || [];
                          reacts[key] = users.includes(currentUser.id) ? users.filter(u => u !== currentUser.id) : [...users, currentUser.id];
                          if (reacts[key].length === 0) delete reacts[key];
                          return { ...cc, reactions: reacts };
                        });
                        return { ...r, discussion: newDisc };
                      });
                      setState({ requests: updated });
                    };
                    // Pin a comment to top — only owner of comment or owner of request
                    const togglePin = (ci) => {
                      const c = discussion[ci];
                      if (!c) return;
                      const isPinned = !!c.pinned;
                      if (c.by !== currentUser.id && req.requester !== currentUser.id) {
                        window.toast('เฉพาะเจ้าของความคิดเห็นหรือเจ้าของคำขอเท่านั้นที่ปักหมุดได้', { level: 'warning' });
                        return;
                      }
                      const updated = state.requests.map(r => {
                        if (r.id !== req.id) return r;
                        const newDisc = (r.discussion || []).map((cc, idx) => idx === ci ? { ...cc, pinned: !isPinned, pinnedAt: !isPinned ? nowTh() : null, pinnedBy: !isPinned ? currentUser.id : null } : cc);
                        return { ...r, discussion: newDisc };
                      });
                      setState({ requests: updated, activities: [{ at: nowTh(), user: currentUser.id, action: 'comment', refId: req.id, summary: isPinned ? 'ยกเลิกปักหมุดความคิดเห็น' : 'ปักหมุดความคิดเห็น' }, ...state.activities] });
                      window.toast(isPinned ? 'ยกเลิกปักหมุด' : 'ปักหมุดเรียบร้อย', { level: 'success' });
                    };
                    // Sort: pinned first, then by index (original order)
                    const sortedDiscussion = discussion.map((c, originalIdx) => ({ c, originalIdx })).sort((a, b) => {
                      if (!!a.c.pinned !== !!b.c.pinned) return a.c.pinned ? -1 : 1;
                      return a.originalIdx - b.originalIdx;
                    });
                    return sortedDiscussion.map(({ c, originalIdx }) => { const u = state.users[c.by]; const i = originalIdx; const canPin = c.by === currentUser.id || req.requester === currentUser.id; return (
                      <div key={i} className="row gap-10" style={{ alignItems: 'flex-start', background: c.pinned ? 'color-mix(in oklch, var(--amber) 7%, var(--surface))' : 'transparent', padding: c.pinned ? 10 : 0, borderRadius: c.pinned ? 8 : 0, border: c.pinned ? '1px solid color-mix(in oklch, var(--amber) 30%, var(--border))' : 'none' }}>
                        <Avatar user={u} size="md" />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div className="row gap-8" style={{ alignItems: 'center' }}>
                            <span className="medium text-sm">{u?.name || c.by}</span>
                            <span className="text-xs muted">{u?.roleTh}</span>
                            <span className="text-xs muted en">{c.at}</span>
                            {c.mentions && c.mentions.length > 0 && <span className="badge badge-brand">แท็ก {c.mentions.length}</span>}
                            {c.pinned && <span className="badge badge-amber" title={`ปักหมุดโดย ${state.users[c.pinnedBy]?.name || c.pinnedBy}`}><Icon name="starFill" size={9} style={{ color: '#facc15' }} /> ปักหมุด</span>}
                            {canPin && (
                              <button onClick={() => togglePin(i)} title={c.pinned ? 'ยกเลิกปักหมุด' : 'ปักหมุดความคิดเห็นนี้'} style={{ marginLeft: 'auto', background: 'none', border: 'none', cursor: 'pointer', padding: 2, color: c.pinned ? '#facc15' : 'var(--ink-4)' }}>
                                <Icon name={c.pinned ? 'starFill' : 'star'} size={12} />
                              </button>
                            )}
                          </div>
                          {/* Reply context — แสดงข้อความที่ตอบกลับ */}
                          {c.replyTo !== null && c.replyTo !== undefined && discussion[c.replyTo] && (() => {
                            const parent = discussion[c.replyTo];
                            const pu = state.users[parent.by];
                            return (
                              <div style={{ marginTop: 6, padding: '6px 10px', background: 'var(--surface-2)', borderLeft: '2px solid var(--brand)', borderRadius: 6, fontSize: 11.5 }}>
                                <div className="text-xs muted">↳ ตอบ <span className="medium" style={{ color: 'var(--brand-ink)' }}>{pu?.name?.split(' ')[0] || parent.by}</span>:</div>
                                <div style={{ color: 'var(--ink-2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{parent.text.slice(0, 80)}{parent.text.length > 80 ? '…' : ''}</div>
                              </div>
                            );
                          })()}
                          <div className="text-sm mt-4" style={{ color: 'var(--ink-2)', whiteSpace: 'pre-wrap', lineHeight: 1.6 }}>{renderCommentText(c.text)}</div>
                          {/* Reactions row + Reply button */}
                          <div className="row gap-4 mt-6 flex-wrap" style={{ alignItems: 'center' }}>
                            <button onClick={() => { setReplyTo(i); document.querySelector('textarea[placeholder*="เขียนความคิดเห็น"]')?.focus(); }} style={{ padding: '2px 8px', borderRadius: 100, border: '1px solid var(--border)', background: 'transparent', cursor: 'pointer', fontSize: 12, color: 'var(--ink-3)' }}><Icon name="message" size={10} /> ตอบกลับ</button>
                            {REACTIONS.map(r => {
                              const users = (c.reactions || {})[r.k] || [];
                              if (users.length === 0) return null;
                              const mine = users.includes(currentUser.id);
                              const names = users.map(uid => state.users[uid]?.name?.split(' ')[0] || uid).join(', ');
                              return (
                                <button key={r.k} onClick={() => toggleReact(i, r.k)} title={names} style={{ padding: '2px 8px', borderRadius: 100, border: `1px solid ${mine ? 'var(--brand)' : 'var(--border)'}`, background: mine ? 'var(--brand-soft)' : 'var(--surface-2)', cursor: 'pointer', fontSize: 12, display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                                  <span>{r.e}</span><span className="en tnum" style={{ color: mine ? 'var(--brand-ink)' : 'var(--ink-2)', fontWeight: 600 }}>{users.length}</span>
                                </button>
                              );
                            })}
                            {/* Add reaction picker */}
                            <div style={{ position: 'relative', display: 'inline-block' }}>
                              <button onClick={(e) => { const next = e.currentTarget.nextElementSibling; if (next) next.style.display = next.style.display === 'flex' ? 'none' : 'flex'; }} style={{ padding: '2px 6px', borderRadius: 100, border: '1px dashed var(--border)', background: 'transparent', cursor: 'pointer', fontSize: 11, color: 'var(--ink-3)' }}>+ 😊</button>
                              <div style={{ display: 'none', position: 'absolute', top: '100%', left: 0, marginTop: 4, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 8, padding: 4, gap: 2, boxShadow: 'var(--shadow)', zIndex: 5, flexDirection: 'row' }}>
                                {REACTIONS.map(r => (
                                  <button key={r.k} onClick={(e) => { toggleReact(i, r.k); e.currentTarget.parentElement.style.display = 'none'; }} style={{ padding: 6, borderRadius: 6, border: 'none', background: 'transparent', cursor: 'pointer', fontSize: 16 }} title={r.k}>{r.e}</button>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    );});
                  })()}
                  <div className="row gap-10" style={{ alignItems: 'flex-start', borderTop: '1px solid var(--border)', paddingTop: 16 }}>
                    <Avatar user={currentUser} size="md" />
                    <div style={{ flex: 1 }}>
                      {replyTo !== null && discussion[replyTo] && (() => {
                        const parent = discussion[replyTo];
                        const pu = state.users[parent.by];
                        return (
                          <div className="row gap-8 mb-8" style={{ alignItems: 'center', padding: '6px 10px', background: 'var(--brand-soft)', borderLeft: '2px solid var(--brand)', borderRadius: 6 }}>
                            <Icon name="message" size={12} style={{ color: 'var(--brand-ink)' }} />
                            <div className="text-xs flex-1" style={{ color: 'var(--brand-ink)' }}>
                              <span className="medium">กำลังตอบ {pu?.name?.split(' ')[0] || parent.by}:</span> <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{parent.text.slice(0, 60)}{parent.text.length > 60 ? '…' : ''}</span>
                            </div>
                            <button onClick={() => setReplyTo(null)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--ink-3)' }} title="ยกเลิกการตอบ"><Icon name="x" size={11} /></button>
                          </div>
                        );
                      })()}
                      <textarea className="textarea" placeholder={replyTo !== null ? 'ตอบกลับ... พิมพ์ @ชื่อ เพื่อแท็ก (Ctrl+Enter เพื่อส่ง)' : 'เขียนความคิดเห็น... พิมพ์ @ตามด้วยชื่อ เพื่อแท็กคน (Ctrl+Enter เพื่อส่ง)'} value={commentText}
                        onChange={(e) => setCommentText(e.target.value)}
                        onKeyDown={(e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitComment(); else if (e.key === 'Escape' && replyTo !== null) setReplyTo(null); }} />
                      {commentText.length > 0 && (() => {
                        const preview = parseMentions(commentText);
                        return preview.length > 0 ? (
                          <div className="text-xs muted mt-4">จะแท็ก: {preview.map(id => state.users[id]?.name?.split(' ')[0] || id).join(', ')}</div>
                        ) : null;
                      })()}
                      <div className="row gap-8 mt-8" style={{ justifyContent: 'space-between' }}>
                        <span className="text-xs muted">{commentText.length > 0 ? `${commentText.length} ตัวอักษร · พิมพ์ @ชื่อ` : 'พิมพ์ @ชื่อ เพื่อแท็ก · ทุกข้อความบันทึกใน Audit Log'}</span>
                        <button className="btn btn-primary btn-sm" disabled={!commentText.trim()} onClick={submitComment}><Icon name="send" size={12} /> ส่งความคิดเห็น</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}
          {tab==='audit'&&<div className="card"><table className="table table-compact"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>IP</th></tr></thead><tbody>{state.activities.filter(a=>a.refId===req.id).map((a,i)=>{const u=state.users[a.user];return(<tr key={i}><td className="num-cell text-xs">{a.at}</td><td><div className="row gap-8"><Avatar user={u} size="sm"/><span className="text-sm">{u?.name}</span></div></td><td className="text-sm">{a.summary}</td><td className="num-cell text-xs muted">192.168.1.{20+i}</td></tr>);})}</tbody></table></div>}
        </div>
        <div className="col gap-16">
          <div className="card card-pad">
            <div className="spread mb-16">
              <h3 className="card-title">Approval Flow</h3>
              <button className="btn btn-ghost btn-sm" onClick={() => setFlowVizOpen(true)} title="ดู Approval Flow แบบกราฟ"><Icon name="zap" size={12} /> Graph</button>
            </div>
            <ApprovalStepper flow={req.flow} users={state.users} createdAt={req.createdAt}/>
          </div>
          <div className="card card-pad"><h3 className="card-title mb-12">รายละเอียดอ้างอิง</h3><div className="col gap-8"><div className="spread"><span className="text-xs muted">ID</span><span className="text-xs en tnum">{req.id}</span></div><div className="spread"><span className="text-xs muted">แผนก</span><span className="text-xs">{u?.dept}</span></div><div className="spread"><span className="text-xs muted">สร้าง</span><span className="text-xs en">{req.createdAt}</span></div><div className="spread"><span className="text-xs muted">ครบกำหนด</span><span className="text-xs en">{req.dueDate}</span></div>{req.clearDueDate&&<div className="spread"><span className="text-xs muted">เคลียร์ภายใน</span><span className="text-xs en">{req.clearDueDate}</span></div>}</div></div>
          <div className="card card-pad center"><h3 className="card-title mb-12">QR สำหรับรับ-ส่งของ</h3><QRMock id={req.id}/><div className="text-xs muted mt-12 en tnum">{req.id}</div><button className="btn btn-outline btn-sm mt-12" onClick={() => window.print()}><Icon name="print" size={12}/> พิมพ์เอกสาร</button></div>
        </div>
      </div>
      <Modal open={actionModal==='approve'||actionModal==='reject'} onClose={() => {setActionModal(null);setActionComment('');}} title={actionModal==='approve'?`อนุมัติคำขอ ${req.id}`:`ปฏิเสธคำขอ ${req.id}`}
        footer={<><button className="btn btn-outline" onClick={() => setActionModal(null)}>ยกเลิก</button>{actionModal==='approve'?<button className="btn btn-success" onClick={doApprove}><Icon name="check" size={14}/> ยืนยันอนุมัติ</button>:<button className="btn btn-danger" onClick={doReject} disabled={!actionComment.trim()}><Icon name="x" size={14}/> ยืนยันปฏิเสธ</button>}</>}>
        <div className="col gap-16">
          <div className="alert alert-info"><Icon name="info" size={14} style={{marginTop:1}}/><div className="text-sm">{actionModal==='approve'?'คำขอจะถูกส่งต่อไปยังขั้นถัดไป':'โปรดระบุเหตุผลในการปฏิเสธ'}</div></div>
          {(actionModal==='reject' || actionModal==='approve') && (() => {
            const reasons = actionModal==='reject' ? getRejectReasons() : getApproveReasons();
            return (
              <div className="field">
                <label className="field-label">{actionModal==='reject' ? 'เหตุผลที่พบบ่อย — กดเลือกได้' : 'ข้อความที่พบบ่อย — กดเลือกได้ (ไม่บังคับ)'}</label>
                <div className="row gap-6 flex-wrap">
                  {reasons.map((r, i) => (
                    <button key={i} type="button" className="chip" onClick={() => setActionComment(actionComment ? actionComment + ' · ' + r : r)} style={{ cursor: 'pointer', fontSize: 12 }}>
                      <Icon name="plus" size={10} /> {r}
                    </button>
                  ))}
                </div>
                <div className="field-hint mt-4">แก้ไขเพิ่มเติมได้ในช่องด้านล่าง · กำหนดพรีเซ็ตได้ที่ Settings</div>
              </div>
            );
          })()}
          <div className="field"><label className="field-label">ความคิดเห็น{actionModal==='reject'&&<span className="req">*</span>}</label><textarea className="textarea" placeholder={actionModal==='approve'?'หมายเหตุ (ไม่บังคับ)':'ระบุเหตุผล...'} value={actionComment} onChange={(e) => setActionComment(e.target.value)} style={{minHeight:100}}/></div>
        </div>
      </Modal>

      <Modal open={flowVizOpen} onClose={() => setFlowVizOpen(false)} wide title={`Flow Graph — ${req.id}`}
        footer={<button className="btn btn-primary" onClick={() => setFlowVizOpen(false)}>ปิด</button>}>
        <div className="flow-graph-wrap" style={{ padding: 20, background: 'var(--surface-2)', borderRadius: 12, overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}>
          <div className="row gap-8 mb-16" style={{ alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap' }}>
            <span className="badge badge-ghost"><span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--green)', display: 'inline-block', marginRight: 4 }}></span>อนุมัติแล้ว</span>
            <span className="badge badge-ghost"><span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--amber)', display: 'inline-block', marginRight: 4 }}></span>กำลังพิจารณา</span>
            <span className="badge badge-ghost"><span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--ink-4)', display: 'inline-block', marginRight: 4 }}></span>รอคิว</span>
            <span className="badge badge-ghost"><span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--red)', display: 'inline-block', marginRight: 4 }}></span>ปฏิเสธ</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 0, padding: 12, justifyContent: 'flex-start', minWidth: 'fit-content' }}>
            {/* Start node — Requester */}
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', minWidth: 130, flexShrink: 0 }}>
              <div style={{ width: 60, height: 60, borderRadius: '50%', background: 'color-mix(in oklch, var(--brand) 15%, var(--surface))', border: '3px solid var(--brand)', display: 'grid', placeItems: 'center', boxShadow: '0 4px 12px color-mix(in oklch, var(--brand) 25%, transparent)' }}>
                <Icon name="plus" size={26} style={{ color: 'var(--brand)' }} />
              </div>
              <div className="text-xs medium mt-8 center" style={{ maxWidth: 120 }}>{u?.name || 'ผู้ขอ'}</div>
              <div className="text-xs muted center">ผู้ขอ</div>
              <div className="text-xs muted en center mt-2">{req.createdAt}</div>
            </div>
            {/* Arrows + flow steps */}
            {req.flow.map((step, i) => {
              const stepUser = state.users[step.userId] || (step.userIds && state.users[step.userIds[0]]);
              const isCurrent = req.currentStep === i && req.status === 'pending';
              const isApproved = step.status === 'approved';
              const isRejected = step.status === 'rejected';
              const isWaiting = step.status === 'waiting';
              const dotColor = isApproved ? 'var(--green)' : isRejected ? 'var(--red)' : isCurrent ? 'var(--amber)' : 'var(--ink-4)';
              const dotBg = isApproved ? 'color-mix(in oklch, var(--green) 15%, var(--surface))' : isRejected ? 'color-mix(in oklch, var(--red) 15%, var(--surface))' : isCurrent ? 'color-mix(in oklch, var(--amber) 15%, var(--surface))' : 'var(--surface-2)';
              const arrowColor = isApproved || (i < req.currentStep) ? 'var(--green)' : 'var(--ink-4)';
              return (
                <React.Fragment key={i}>
                  {/* Arrow connector */}
                  <div style={{ display: 'flex', alignItems: 'center', flexShrink: 0, paddingBottom: 32 }}>
                    <div style={{ width: 40, height: 3, background: arrowColor, position: 'relative' }}>
                      <div style={{ position: 'absolute', right: -1, top: -4, width: 0, height: 0, borderLeft: '10px solid ' + arrowColor, borderTop: '5px solid transparent', borderBottom: '5px solid transparent' }}></div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', minWidth: 130, flexShrink: 0 }}>
                    <div style={{ width: 60, height: 60, borderRadius: '50%', background: dotBg, border: `3px solid ${dotColor}`, display: 'grid', placeItems: 'center', boxShadow: isCurrent ? `0 0 0 6px color-mix(in oklch, ${dotColor} 20%, transparent)` : 'none', animation: isCurrent ? 'pulse 1.8s infinite' : 'none', position: 'relative' }}>
                      {stepUser ? <Avatar user={stepUser} size="lg" /> : <Icon name="user" size={26} style={{ color: dotColor }} />}
                      {isApproved && <div style={{ position: 'absolute', bottom: -4, right: -4, width: 22, height: 22, borderRadius: '50%', background: 'var(--green)', color: 'white', display: 'grid', placeItems: 'center', border: '2px solid var(--surface)' }}><Icon name="check" size={12} /></div>}
                      {isRejected && <div style={{ position: 'absolute', bottom: -4, right: -4, width: 22, height: 22, borderRadius: '50%', background: 'var(--red)', color: 'white', display: 'grid', placeItems: 'center', border: '2px solid var(--surface)' }}><Icon name="x" size={12} /></div>}
                    </div>
                    <div className="text-xs medium mt-8 center" style={{ maxWidth: 120 }}>{stepUser?.name || step.role}</div>
                    <div className="text-xs muted center" style={{ maxWidth: 120 }}>{step.role}</div>
                    {step.at && <div className="text-xs muted en center mt-2">{step.at}</div>}
                    {step.comment && <div className="text-xs mt-4 center" style={{ maxWidth: 120, fontStyle: 'italic', color: 'var(--ink-3)', lineHeight: 1.4 }}>"{step.comment.slice(0, 40)}{step.comment.length > 40 ? '…' : ''}"</div>}
                  </div>
                </React.Fragment>
              );
            })}
            {/* Final node */}
            {req.status === 'progress' || req.status === 'done' ? (
              <>
                <div style={{ display: 'flex', alignItems: 'center', flexShrink: 0, paddingBottom: 32 }}>
                  <div style={{ width: 40, height: 3, background: 'var(--green)', position: 'relative' }}>
                    <div style={{ position: 'absolute', right: -1, top: -4, width: 0, height: 0, borderLeft: '10px solid var(--green)', borderTop: '5px solid transparent', borderBottom: '5px solid transparent' }}></div>
                  </div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', minWidth: 130, flexShrink: 0 }}>
                  <div style={{ width: 60, height: 60, borderRadius: '50%', background: 'color-mix(in oklch, var(--green) 15%, var(--surface))', border: '3px solid var(--green)', display: 'grid', placeItems: 'center' }}>
                    <Icon name={req.status === 'done' ? 'check' : 'truck'} size={26} style={{ color: 'var(--green)' }} />
                  </div>
                  <div className="text-xs medium mt-8 center">{req.status === 'done' ? 'เสร็จสมบูรณ์' : 'ดำเนินการ'}</div>
                </div>
              </>
            ) : null}
          </div>
          <div className="text-xs muted center mt-16">รวม {req.flow.length} ขั้นตอน · ขั้นที่ <span className="medium en">{req.currentStep + 1}</span> · สถานะ: <StatusBadge status={req.status} /></div>
        </div>
      </Modal>

      <Modal open={snoozeOpen} onClose={() => setSnoozeOpen(false)} title={`Snooze ${req.id} — ซ่อนชั่วคราวจาก Inbox ของคุณ`}
        footer={<><button className="btn btn-outline" onClick={() => setSnoozeOpen(false)}>ปิด</button><button className="btn btn-primary" onClick={doSnooze} disabled={!snoozeUntil}><Icon name="clock" size={13}/> Snooze ถึงวันที่เลือก</button></>}>
        <div className="col gap-12">
          <div className="alert alert-info"><Icon name="info" size={14} style={{ marginTop: 1 }} /><div className="text-sm">คำขอนี้จะไม่ปรากฏใน Inbox ของคุณจนถึงเวลาที่ตั้งไว้ — ผู้อื่นยังเห็นได้ปกติ · เก็บใน localStorage ของคุณเท่านั้น</div></div>
          <div className="field">
            <label className="field-label">เลื่อนแบบด่วน</label>
            <div className="row gap-6 flex-wrap">
              {snoozePresets.map((p, i) => (
                <button key={i} type="button" className="chip" onClick={() => quickSnooze(p)} style={{ cursor: 'pointer', fontSize: 12 }}>
                  <Icon name="clock" size={10} /> {p.label}
                </button>
              ))}
            </div>
          </div>
          <div className="field">
            <label className="field-label">หรือเลือกวันที่</label>
            <input type="date" className="input" value={snoozeUntil} onChange={(e) => setSnoozeUntil(e.target.value)} min={new Date().toISOString().slice(0,10)} />
          </div>
        </div>
      </Modal>

      <Modal open={linkOpen} onClose={() => { setLinkOpen(false); setLinkQuery(''); }} title={`เชื่อมโยงคำขอ — ${req.id}`} wide
        footer={<button className="btn btn-primary" onClick={() => { setLinkOpen(false); setLinkQuery(''); }}>ปิด</button>}>
        <div className="col gap-16">
          {linkedReqs.length > 0 && (
            <div>
              <h4 className="card-title mb-8">เชื่อมไปยัง ({linkedReqs.length})</h4>
              <div className="col gap-6">
                {linkedReqs.map(lr => (
                  <div key={lr.id} className="row gap-10" style={{ padding: 10, border: '1px solid var(--border)', borderRadius: 8, alignItems: 'center', background: 'var(--surface-2)' }}>
                    <span className="en tnum text-xs muted">{lr.id}</span>
                    <TypeBadge type={lr.type} />
                    <span className="text-sm medium" style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lr.title}</span>
                    <StatusBadge status={lr.status} />
                    <button className="btn btn-ghost btn-sm" onClick={() => setState({ route: 'detail', selectedId: lr.id })}>ไปดู →</button>
                    <button className="btn btn-ghost btn-sm" onClick={() => removeLink(lr.id)} title="ยกเลิกเชื่อมโยง" style={{ color: 'var(--red-ink)' }}><Icon name="x" size={11} /></button>
                  </div>
                ))}
              </div>
            </div>
          )}
          {linkedFromOthers.length > 0 && (
            <div>
              <h4 className="card-title mb-8">ถูกเชื่อมโยงจาก ({linkedFromOthers.length}) <span className="text-xs muted">read-only</span></h4>
              <div className="col gap-6">
                {linkedFromOthers.map(lr => (
                  <div key={lr.id} className="row gap-10" style={{ padding: 10, border: '1px dashed var(--border)', borderRadius: 8, alignItems: 'center' }}>
                    <span className="en tnum text-xs muted">{lr.id}</span>
                    <TypeBadge type={lr.type} />
                    <span className="text-sm medium" style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lr.title}</span>
                    <button className="btn btn-ghost btn-sm" onClick={() => setState({ route: 'detail', selectedId: lr.id })}>ไปดู →</button>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div>
            <h4 className="card-title mb-8">เพิ่มการเชื่อมโยง</h4>
            <input className="input" placeholder="ค้นหา ID หรือหัวข้อ..." value={linkQuery} onChange={(e) => setLinkQuery(e.target.value)} />
            <div className="col gap-4 mt-8" style={{ maxHeight: 240, overflow: 'auto' }}>
              {linkCandidates.length === 0 ? (
                <div className="text-xs muted center" style={{ padding: 16 }}>{linkQuery ? 'ไม่พบคำขอตามที่ค้นหา' : 'พิมพ์เพื่อค้นหา...'}</div>
              ) : linkCandidates.map(lr => (
                <button key={lr.id} className="row gap-10 clickable" onClick={() => addLink(lr.id)} style={{ padding: 8, border: '1px solid var(--border)', borderRadius: 6, alignItems: 'center', background: 'var(--surface)', cursor: 'pointer', textAlign: 'left' }}>
                  <span className="en tnum text-xs muted">{lr.id}</span>
                  <TypeBadge type={lr.type} />
                  <span className="text-sm" style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lr.title}</span>
                  <Icon name="plus" size={11} style={{ color: 'var(--brand)' }} />
                </button>
              ))}
            </div>
          </div>
        </div>
      </Modal>

      <Modal open={rescheduleOpen} onClose={() => { setRescheduleOpen(false); setRescheduleReason(''); }} title={`เลื่อนวันครบกำหนด ${req.id}`}
        footer={<><button className="btn btn-outline" onClick={() => { setRescheduleOpen(false); setRescheduleReason(''); }}>ยกเลิก</button><button className="btn btn-primary" onClick={doReschedule} disabled={!newDueDate || !isValidThDate(newDueDate)}><Icon name="calendar" size={14}/> ยืนยันเลื่อน</button></>}>
        <div className="col gap-12">
          <div className="alert alert-info"><Icon name="info" size={14} style={{ marginTop: 1 }} /><div className="text-sm">วันครบกำหนดปัจจุบัน: <span className="medium en">{req.dueDate}</span> · จะถูกบันทึกใน activity log</div></div>
          <div className="field">
            <label className="field-label">วันครบกำหนดใหม่ <span className="req">*</span></label>
            <DateInput value={newDueDate} onChange={setNewDueDate} />
          </div>
          <div className="field">
            <label className="field-label">เหตุผล (ไม่บังคับ)</label>
            <textarea className="textarea" placeholder="เช่น ลูกค้าเลื่อนนัด · งบยังไม่อนุมัติ" value={rescheduleReason} onChange={(e) => setRescheduleReason(e.target.value)} style={{ minHeight: 70 }} />
          </div>
        </div>
      </Modal>

      <Modal open={tplModal} onClose={() => { setTplModal(false); setTplName(''); }} title={`บันทึก ${req.id} เป็นแม่แบบ`}
        footer={<><button className="btn btn-outline" onClick={() => { setTplModal(false); setTplName(''); }}>ยกเลิก</button><button className="btn btn-primary" onClick={doSaveTemplate} disabled={!tplName.trim()}><Icon name="bookmark" size={14}/> บันทึกแม่แบบ</button></>}>
        <div className="col gap-12">
          <div className="alert alert-info"><Icon name="info" size={14} style={{marginTop:1}}/><div className="text-sm">บันทึกคำขอนี้เป็นแม่แบบส่วนตัว — ใช้สร้างคำขอใหม่ได้รวดเร็วในอนาคต (ฟิลด์ที่บันทึก: หัวข้อ, วัตถุประสงค์, รายการ, มูลค่า, รายละเอียดเฉพาะประเภท)</div></div>
          <div className="field">
            <label className="field-label">ชื่อแม่แบบ<span className="req">*</span></label>
            <input className="input" placeholder="เช่น OT คอลเซ็นเตอร์เสาร์-อาทิตย์" value={tplName} onChange={(e) => setTplName(e.target.value)} autoFocus />
            <div className="field-hint">ดูแม่แบบทั้งหมดที่หน้า "แม่แบบ"</div>
          </div>
        </div>
      </Modal>

      {/* HR onboard new employee from hire request */}
      {req.type === 'hire' && (
        <Modal open={hireOnboardOpen} onClose={() => setHireOnboardOpen(false)} title={`🆕 สร้างพนักงานใหม่จากใบขอ ${req.id}`}
          footer={<><button className="btn btn-outline" onClick={() => setHireOnboardOpen(false)}>ข้าม (ยังไม่สร้าง)</button><button className="btn btn-primary" onClick={() => {
            if (!hireOnName.trim()) { window.toast?.('กรุณาใส่ชื่อพนักงาน', { level: 'warning' }); return; }
            if (hireOnPwd && hireOnPwd.length < 4) { window.toast?.('รหัสผ่านต้องอย่างน้อย 4 ตัวอักษร', { level: 'warning' }); return; }
            if (hireOnPwd !== hireOnPwd2) { window.toast?.('รหัสผ่านไม่ตรงกัน', { level: 'warning' }); return; }
            const DEPT_PREFIX_LOCAL = { accounting: 'ACC', marketing: 'MKT', callcenter: 'CC', warehouse: 'WH', procurement: 'PROC', office: 'OFF', hr: 'HR', sales: 'SA', events: 'EM', executive: 'EXE' };
            const prefix = DEPT_PREFIX_LOCAL[req.hireDeptKey] || 'EMP';
            const existing = Object.values(state.users).filter(u => u.id.startsWith(prefix + '-')).map(u => parseInt(u.id.split('-')[1], 10) || 0);
            const n = (existing.length ? Math.max(...existing) : 0) + 1;
            const id = `${prefix}-${String(n).padStart(3, '0')}`;
            const parts = hireOnName.trim().split(/\s+/);
            const initials = (parts[0]?.[0] || '') + (parts[1]?.[0] || parts[0]?.[1] || '');
            const dept = MOCK.DEPTS[req.hireDeptKey]?.th || req.hireDeptKey;
            const newUser = {
              id, name: hireOnName.trim(), initials,
              deptKey: req.hireDeptKey, dept,
              level: req.hireLevel || 'staff',
              role: { staff: 'Staff', head: 'Head', manager: 'Manager', director: 'Director' }[req.hireLevel || 'staff'],
              roleTh: req.hireRoleTh,
              color: MOCK.deptColor(req.hireDeptKey),
              startDate: req.hireStartDate || nowTh().split(' ')[0],
              email: hireOnEmail || id.toLowerCase().replace(/-/g, '') + '@flowdesk.co',
              passwordHash: hireOnPwd ? hashPassword(hireOnPwd) : ''
            };
            setState({
              users: { ...state.users, [id]: newUser },
              activities: [{ at: nowTh(), user: currentUser.id, action: 'create', refId: req.id, summary: `สร้างพนักงานใหม่ ${id} (${hireOnName}) จากใบขอ ${req.id}${hireOnPwd ? ' · มีรหัสผ่าน' : ''}` }, ...state.activities]
            });
            setHireOnboardOpen(false);
            window.toast?.(`✅ สร้างพนักงาน ${id} (${hireOnName}) เรียบร้อย${hireOnPwd ? ' — login ได้เลย' : ''}`, { level: 'success', duration: 8000 });
          }}><Icon name="check" size={13}/> สร้างพนักงาน</button></>}>
          <div className="col gap-12">
            <div className="alert alert-info"><Icon name="info" size={14} style={{ marginTop: 1 }} /><div className="text-xs flex-1">
              ใบขอเพิ่มพนักงานนี้ผ่านอนุมัติแล้ว · ต้องการ <span className="medium">สร้างบัญชีพนักงานใหม่ในระบบเลย</span> มั้ย? ระบบจะ pre-fill ข้อมูลจากใบขอให้
            </div></div>
            <div className="card card-pad" style={{ background: 'var(--surface-2)' }}>
              <div className="text-xs muted mb-6">ข้อมูลจากใบขอ:</div>
              <div className="grid grid-2" style={{ gap: 8, fontSize: 13 }}>
                <div><span className="muted">ตำแหน่ง:</span> <span className="medium">{req.hireRoleTh}</span></div>
                <div><span className="muted">แผนก:</span> <span className="medium">{MOCK.DEPTS[req.hireDeptKey]?.th}</span></div>
                <div><span className="muted">ระดับ:</span> <span className="medium">{{staff:'พนักงาน',head:'หัวหน้า',manager:'ผู้จัดการ',director:'ผู้อำนวยการ'}[req.hireLevel]}</span></div>
                <div><span className="muted">เริ่มงาน:</span> <span className="medium">{req.hireStartDate || '-'}</span></div>
              </div>
            </div>
            <div className="field"><label className="field-label">ชื่อ-นามสกุล พนักงานใหม่ <span className="req">*</span></label>
              <input className="input" value={hireOnName} onChange={(e) => setHireOnName(e.target.value)} placeholder="เช่น สมชาย ใจดี" autoFocus />
            </div>
            <div className="field"><label className="field-label">Email (เว้นว่างได้ — ระบบสร้างให้)</label>
              <input className="input" value={hireOnEmail} onChange={(e) => setHireOnEmail(e.target.value)} placeholder="user@company.com" />
            </div>
            <div style={{ padding: 12, background: 'var(--surface-2)', borderRadius: 8, border: '1px solid var(--border)' }}>
              <div className="row gap-8 mb-8" style={{ alignItems: 'center' }}>
                <Icon name="shield" size={14} style={{ color: 'var(--brand-ink)' }} />
                <span className="medium text-sm">รหัสผ่านสำหรับ Login (ไม่บังคับ)</span>
                <button type="button" className="btn btn-ghost btn-sm" onClick={() => { const p = Math.random().toString(36).slice(2, 8); setHireOnPwd(p); setHireOnPwd2(p); }} style={{ marginLeft: 'auto', height: 26 }}><Icon name="zap" size={11} /> สุ่ม</button>
              </div>
              <div className="grid grid-2" style={{ gap: 8 }}>
                <input className="input" type="text" value={hireOnPwd} onChange={(e) => setHireOnPwd(e.target.value)} placeholder="≥ 4 ตัวอักษร (เว้นว่าง = ไม่ตั้งรหัส)" />
                <input className="input" type="text" value={hireOnPwd2} onChange={(e) => setHireOnPwd2(e.target.value)} placeholder="ยืนยันรหัสผ่าน" />
              </div>
              {hireOnPwd && hireOnPwd === hireOnPwd2 && hireOnPwd.length >= 4 && <div className="text-xs mt-6" style={{ color: 'var(--green-ink)' }}>✓ รหัส: <span style={{ fontFamily: 'monospace' }}>{hireOnPwd}</span> — จดไว้ส่งให้พนักงาน</div>}
            </div>
          </div>
        </Modal>
      )}

      {/* v3.2: Modal ตีกลับ — บังคับใส่เหตุผล */}
      <Modal open={actionModal==='return'} onClose={() => {setActionModal(null);setActionComment('');}} title={`↩ ตีกลับคำขอ ${req.id} ให้แก้ไข`}
        footer={<><button className="btn btn-outline" onClick={() => {setActionModal(null);setActionComment('');}}>ยกเลิก</button><button className="btn" style={{ background: 'var(--amber)', color: 'white' }} onClick={doReturn} disabled={!actionComment.trim()}><Icon name="arrowLeft" size={14}/> ยืนยันตีกลับ</button></>}>
        <div className="col gap-12">
          <div className="alert alert-amber"><Icon name="warning" size={14} style={{marginTop:1}}/><div className="text-sm">คำขอจะกลับไปหาผู้ขอเพื่อแก้ไข แล้วส่งขออนุมัติใหม่ตั้งแต่ขั้นแรก — <strong>ต้องระบุเหตุผล</strong>เพื่อให้ผู้ขอแก้ได้ถูกจุด (ต่างจาก "ปฏิเสธ" ที่จบคำขอถาวร)</div></div>
          <div className="field"><label className="field-label">เหตุผลที่ตีกลับ / สิ่งที่ต้องแก้ <span className="req">*</span></label><textarea className="textarea" placeholder="เช่น งบหมวดค่าอาหารสูงเกินไป ปรับเหลือไม่เกิน 5,000 · แนบใบเสนอราคาเพิ่ม..." value={actionComment} onChange={(e) => setActionComment(e.target.value)} style={{minHeight:100}} autoFocus/></div>
        </div>
      </Modal>
      {/* v3.2: Modal แก้ไขและส่งใหม่ (ผู้ขอ หลังถูกตีกลับ) */}
      <Modal open={actionModal==='revise' && !!reviseForm} onClose={() => {setActionModal(null);setReviseForm(null);}} title={`แก้ไขคำขอ ${req.id} — ส่งขออนุมัติใหม่`}
        footer={<><button className="btn btn-outline" onClick={() => {setActionModal(null);setReviseForm(null);}}>ยกเลิก</button><button className="btn btn-primary" onClick={doResubmit}><Icon name="send" size={14}/> ส่งขออนุมัติใหม่</button></>}>
        {reviseForm && <div className="col gap-12">
          {req.reviseReason && <div className="alert alert-amber"><Icon name="info" size={14} style={{marginTop:1}}/><div className="text-sm"><strong>สิ่งที่ผู้อนุมัติให้แก้:</strong> {req.reviseReason}</div></div>}
          <div className="field"><label className="field-label">หัวข้อ</label><input className="input" value={reviseForm.title} onChange={(e)=>setReviseForm({...reviseForm,title:e.target.value})}/></div>
          <div className="field"><label className="field-label">วัตถุประสงค์ / รายละเอียด</label><textarea className="textarea" value={reviseForm.purpose} onChange={(e)=>setReviseForm({...reviseForm,purpose:e.target.value})} style={{minHeight:80}}/></div>
          {req.type==='event' ? (
            <div className="grid grid-2"><div className="field"><label className="field-label">วันเริ่มงาน</label><DateInput value={reviseForm.eventStartDate} onChange={(v)=>setReviseForm({...reviseForm,eventStartDate:v})}/></div><div className="field"><label className="field-label">วันสิ้นสุดงาน</label><DateInput value={reviseForm.eventEndDate} min={reviseForm.eventStartDate} onChange={(v)=>setReviseForm({...reviseForm,eventEndDate:v})}/></div></div>
          ) : req.type==='overtime' ? (
            <div className="field"><label className="field-label">วันทำ OT</label><DateInput value={reviseForm.otDate} onChange={(v)=>setReviseForm({...reviseForm,otDate:v})}/></div>
          ) : req.type==='leave' ? (
            <div className="grid grid-2"><div className="field"><label className="field-label">วันเริ่มลา</label><DateInput value={reviseForm.startDate} onChange={(v)=>setReviseForm({...reviseForm,startDate:v})}/></div><div className="field"><label className="field-label">ถึงวันที่</label><DateInput value={reviseForm.endDate} min={reviseForm.startDate} onChange={(v)=>setReviseForm({...reviseForm,endDate:v})}/></div></div>
          ) : req.type==='hire' ? (
            <div className="field"><label className="field-label">วันเริ่มงานที่ต้องการ</label><DateInput value={reviseForm.hireStartDate} onChange={(v)=>setReviseForm({...reviseForm,hireStartDate:v})}/></div>
          ) : (
            <div className="field"><label className="field-label">ครบกำหนด</label><DateInput value={reviseForm.dueDate} onChange={(v)=>setReviseForm({...reviseForm,dueDate:v})}/></div>
          )}
          {reviseForm.breakdown && (
            <div className="field"><label className="field-label spread"><span>รายการงบประมาณ</span><button type="button" className="btn btn-ghost btn-sm" onClick={()=>setReviseForm({...reviseForm,breakdown:[...reviseForm.breakdown,{label:'',amount:0}]})}><Icon name="plus" size={12}/> เพิ่ม</button></label>
              <table className="table table-compact"><tbody>
                {reviseForm.breakdown.map((b,i)=>(<tr key={i}>
                  <td><OptionSelect value={b.label} onChange={(v)=>{const bd=[...reviseForm.breakdown];bd[i]={...bd[i],label:v};setReviseForm({...reviseForm,breakdown:bd});}} options={getOptionItems(state,'breakdown')} onAdd={(v)=>setState && addOptionItem(state,setState,'breakdown',v)} placeholder="-- เลือกรายการ --" height={32}/></td>
                  <td style={{width:130}}><input className="input" style={{height:32,textAlign:'right'}} type="number" value={b.amount} onChange={(e)=>{const bd=[...reviseForm.breakdown];bd[i]={...bd[i],amount:Number(e.target.value)};setReviseForm({...reviseForm,breakdown:bd});}}/></td>
                  <td style={{width:36}}><button type="button" className="btn btn-ghost btn-sm btn-icon-only" disabled={reviseForm.breakdown.length===1} onClick={()=>setReviseForm({...reviseForm,breakdown:reviseForm.breakdown.filter((_,j)=>j!==i)})}><Icon name="trash" size={13}/></button></td>
                </tr>))}
                <tr style={{background:'var(--surface-2)'}}><td className="right bold text-sm">รวม</td><td className="num-cell right bold">{fmtBaht(reviseForm.breakdown.reduce((s,b)=>s+(Number(b.amount)||0),0))}</td><td></td></tr>
              </tbody></table>
            </div>
          )}
          <div className="alert alert-info"><Icon name="info" size={14} style={{marginTop:1}}/><div className="text-xs">ส่งใหม่แล้ว สายอนุมัติเริ่มนับจากขั้นแรก · ระบบตรวจ "ด่วนอัตโนมัติ" ใหม่ตามวันที่ที่แก้</div></div>
        </div>}

      </Modal>

      <Modal open={actionModal==='clone'} onClose={() => setActionModal(null)} title="คัดลอกเป็นคำขอใหม่"
        footer={<><button className="btn btn-outline" onClick={() => setActionModal(null)}>ยกเลิก</button><button className="btn btn-primary" onClick={doClone}><Icon name="copy" size={14}/> สร้างคำขอใหม่</button></>}>
        <div className="col gap-12">
          <div className="alert alert-info"><Icon name="info" size={14} style={{marginTop:1}}/><div className="text-sm flex-1">ระบบจะสร้างคำขอใหม่โดยคัดลอกรายละเอียด, งบประมาณ และรายการสินค้าจาก {req.id} — คุณเป็นผู้ขอคนใหม่ และจะเริ่มสายอนุมัติใหม่</div></div>
          <div className="row gap-10" style={{padding:12,border:'1px solid var(--border)',borderRadius:8,background:'var(--surface-2)'}}>
            <TypeIcon type={req.type} size={32}/>
            <div style={{flex:1,minWidth:0}}><div className="text-sm medium">{req.title}</div><div className="text-xs muted">{TYPE_LABEL[req.type]?.th} · {fmtBaht(req.amount)}</div></div>
          </div>
        </div>
      </Modal>

      <Modal open={actionModal==='delegate'} onClose={() => {setActionModal(null);setDelegateTo('');}} title="ส่งต่อการอนุมัติ"
        footer={<><button className="btn btn-outline" onClick={() => {setActionModal(null);setDelegateTo('');}}>ยกเลิก</button><button className="btn btn-primary" onClick={doDelegate} disabled={!delegateTo}><Icon name="send" size={14}/> ส่งต่อ</button></>}>
        <div className="col gap-12">
          <div className="alert alert-info"><Icon name="info" size={14} style={{marginTop:1}}/><div className="text-sm flex-1">มอบหมายให้คนอื่นพิจารณาอนุมัติขั้นนี้แทนคุณ — เหมาะเมื่อคุณไม่ว่างหรืออยู่นอกสถานที่</div></div>
          <div className="field">
            <label className="field-label">เลือกผู้รับมอบหมาย <span className="req">*</span></label>
            <select className="select" value={delegateTo} onChange={(e) => setDelegateTo(e.target.value)}>
              <option value="">-- เลือกพนักงาน --</option>
              {Object.values(state.users).filter(x => x.id !== currentUser.id && (x.level === 'head' || x.level === 'manager' || x.level === 'director')).map(x => <option key={x.id} value={x.id}>{x.name} · {x.roleTh}</option>)}
            </select>
          </div>
        </div>
      </Modal>

      {docOpen && <RequestDocument req={req} state={state} onClose={() => setDocOpen(false)} />}
    </div>
  );
};

const QRMock = ({ id, size = 120 }) => {
  const seed = id.split('').reduce((s,c) => s+c.charCodeAt(0),0);
  const cells = 21;
  const rand = (i) => (Math.sin(seed+i*37)*10000)%1;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${cells} ${cells}`} style={{borderRadius:6,border:'1px solid var(--border)',padding:2,background:'white'}}>
      {[[0,0],[14,0],[0,14]].map(([x,y],i)=><g key={i}><rect x={x} y={y} width="7" height="7" fill="black"/><rect x={x+1} y={y+1} width="5" height="5" fill="white"/><rect x={x+2} y={y+2} width="3" height="3" fill="black"/></g>)}
      {Array.from({length:cells*cells}).map((_,i)=>{const x=i%cells,y=Math.floor(i/cells);const inCorner=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);if(inCorner)return null;if(Math.abs(rand(i))>0.5)return <rect key={i} x={x} y={y} width="1" height="1" fill="black"/>;return null;})}
    </svg>
  );
};

const CreateRequest = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const [step, setStep] = React.useState(0);
  const [type, setType] = React.useState(null);
  const emptyForm = {title:'',purpose:'',dueDate:'',priority:'normal',items:[],customerId:'',breakdown:[],clearDueDate:'',eventStartDate:'',eventEndDate:'',venue:'',attendees:'',eventStaff:[],otDate:'',otStart:'',otEnd:'',otForUserId:'',leaveType:'ลาป่วย',startDate:'',endDate:'',hireRoleTh:'',hireDeptKey:'',hireTeam:'',hireLevel:'staff',hireCount:1,hireSalaryMin:'',hireSalaryMax:'',hireSkills:'',hireStartDate:'',borrowStartDate:'',borrowEndDate:''};
  const [form, setForm] = React.useState(emptyForm);
  const DRAFT_KEY = `fd-draft-${currentUser.id}`;
  const [hasDraft, setHasDraft] = React.useState(false);
  const [draftMeta, setDraftMeta] = React.useState(null);

  // Check for existing draft on open
  React.useEffect(() => {
    if (!state.createOpen) return;
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.type && d.form && d.form.title) {
          setHasDraft(true);
          setDraftMeta({ type: d.type, savedAt: d.savedAt, title: d.form.title });
        }
      }
    } catch (e) {}
  }, [state.createOpen]);

  const restoreDraft = () => {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      const d = JSON.parse(raw);
      if (d && d.type) {
        setType(d.type); setForm({ ...emptyForm, ...d.form }); setStep(1); setHasDraft(false);
        window.toast(`เรียกคืน draft "${d.form.title || d.type}"`, { level: 'success' });
      }
    } catch (e) {}
  };
  const discardDraft = () => {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    setHasDraft(false); setDraftMeta(null);
  };

  // Auto-save form (debounced)
  React.useEffect(() => {
    if (!state.createOpen || !type || step === 0) return;
    if (!form.title && !form.purpose) return; // ไม่บันทึกถ้าว่างเปล่า
    const t = setTimeout(() => {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ type, form, savedAt: nowTh() })); } catch (e) {}
    }, 800);
    return () => clearTimeout(t);
  }, [form, type, step, state.createOpen]);

  const close = () => {setStep(0);setType(null);setForm(emptyForm);setHasDraft(false);setState({createOpen:false,createTemplate:null});};
  const closeAndClearDraft = () => { discardDraft(); close(); };
  const pickType = (t) => {
    setType(t); setStep(1);
    // Smart due date by type
    const smartDue = suggestDueDate(t);
    setForm(f => ({ ...f, dueDate: smartDue }));
    // หาคำขอประเภทเดียวกันล่าสุดของผู้ใช้ — ใช้เป็น smart default
    const lastSame = state.requests.find(r => r.type === t && r.requester === currentUser.id);
    if (t === 'expense' || t === 'event' || t === 'purchase') {
      const defaultBreakdown = lastSame?.breakdown && lastSame.breakdown.length > 0
        ? lastSame.breakdown.map(b => ({ label: b.label, amount: 0 }))
        : [{ label: '', amount: 0 }];
      setForm(f => ({ ...f, breakdown: defaultBreakdown, priority: lastSame?.priority || 'normal', venue: t === 'event' ? (lastSame?.venue || '') : '' }));
      if (lastSame) window.toast(`เติมข้อมูลจากคำขอล่าสุด (${lastSame.id})`, { level: 'info', duration: 4000 });
    } else if (t === 'withdrawal' || t === 'borrow') {
      const defaultItems = lastSame?.items && lastSame.items.length > 0
        ? lastSame.items.map(it => ({ sku: it.sku, qty: 1, note: '' }))
        : [{ sku: state.products[0]?.sku || '', qty: 1, note: '' }];
      setForm(f => ({ ...f, items: defaultItems, priority: lastSame?.priority || 'normal', customerId: t === 'borrow' ? (lastSame?.customerId || '') : '' }));
      if (lastSame) window.toast(`เติมข้อมูลจากคำขอล่าสุด (${lastSame.id})`, { level: 'info', duration: 4000 });
    } else if (lastSame) {
      setForm(f => ({ ...f, priority: lastSame.priority || 'normal' }));
    }
  };

  React.useEffect(() => {
    const tpl = state.createTemplate;
    if (state.createOpen && tpl && tpl.type && step === 0) {
      const t = tpl.type; const preset = tpl.preset || {};
      let initialItems = [], initialBreakdown = [];
      if (t === 'withdrawal' || t === 'borrow') initialItems = [{ sku: state.products[0]?.sku || '', qty: 1, note: '' }];
      if (t === 'expense' || t === 'event' || t === 'purchase') initialBreakdown = preset.breakdown && preset.breakdown.length ? preset.breakdown : [{ label: '', amount: 0 }];
      setType(t);
      setForm({ ...emptyForm, items: initialItems, breakdown: initialBreakdown, ...preset });
      setStep(1);
    }
  }, [state.createOpen, state.createTemplate]);

  const validate = () => {
    const e = [];
    if (!form.title.trim()) e.push('กรุณาระบุหัวข้อคำขอ');
    if (!form.purpose.trim() || form.purpose.trim().length < 10) e.push('วัตถุประสงค์ต้องอย่างน้อย 10 ตัวอักษร');
    const needDue = ['withdrawal','expense','purchase','general'].includes(type);
    if (needDue) {
      if (!form.dueDate) e.push('กรุณาระบุวันครบกำหนด');
      else if (!isValidThDate(form.dueDate)) e.push('รูปแบบวันครบกำหนดต้องเป็น DD/MM/YYYY');
    }
    // v3.3: ยืม-คืน ใช้ช่วงวันยืม-คืนแบบอีเว้นท์
    if (type === 'borrow') {
      if (!form.borrowStartDate) e.push('กรุณาระบุวันเริ่มยืม / วันออกบูธ');
      else if (!isValidThDate(form.borrowStartDate)) e.push('รูปแบบวันเริ่มยืมต้องเป็น DD/MM/YYYY');
      if (form.borrowEndDate && !isValidThDate(form.borrowEndDate)) e.push('รูปแบบวันคืนของต้องเป็น DD/MM/YYYY');
      if (form.borrowStartDate && form.borrowEndDate && isValidThDate(form.borrowStartDate) && isValidThDate(form.borrowEndDate) && parseTh(form.borrowEndDate) < parseTh(form.borrowStartDate)) e.push('วันคืนของต้องไม่ก่อนวันเริ่มยืม');
      if (form.clearDueDate && !isValidThDate(form.clearDueDate)) e.push('รูปแบบวันเคลียร์ยอดต้องเป็น DD/MM/YYYY');
    }
    if (type === 'event') {
      if (!form.eventStartDate) e.push('กรุณาระบุวันเริ่มงาน');
      else if (!isValidThDate(form.eventStartDate)) e.push('รูปแบบวันเริ่มงานต้องเป็น DD/MM/YYYY');
      if (form.eventEndDate && !isValidThDate(form.eventEndDate)) e.push('รูปแบบวันสิ้นสุดงานต้องเป็น DD/MM/YYYY');
      if (form.eventStartDate && form.eventEndDate && isValidThDate(form.eventStartDate) && isValidThDate(form.eventEndDate) && parseTh(form.eventEndDate) < parseTh(form.eventStartDate)) e.push('วันสิ้นสุดต้องไม่ก่อนวันเริ่มงาน');
    }
    if (type === 'overtime') {
      if (!form.otDate || !isValidThDate(form.otDate)) e.push('กรุณาระบุวันที่ทำ OT (DD/MM/YYYY)');
      if (!form.otStart || !form.otEnd) e.push('กรุณาระบุเวลาเริ่ม-สิ้นสุด OT');
    }
    if (type === 'leave') {
      if (!form.startDate || !isValidThDate(form.startDate)) e.push('กรุณาระบุวันที่เริ่มลา (DD/MM/YYYY)');
      if (form.endDate && !isValidThDate(form.endDate)) e.push('รูปแบบวันสิ้นสุดต้องเป็น DD/MM/YYYY');
    }
    if (type === 'borrow' && !form.customerId) e.push('กรุณาเลือกลูกค้า/บูธปลายทาง');
    if ((type === 'withdrawal' || type === 'borrow')) {
      if (!form.items.length || form.items.some(i => !i.sku || !(Number(i.qty) > 0))) e.push('กรุณากรอกรายการสินค้าให้ครบ (จำนวน > 0)');
    }
    if ((type === 'expense' || type === 'event' || type === 'purchase')) {
      if (!form.breakdown.length || form.breakdown.some(b => !b.label.trim() || !(Number(b.amount) > 0))) e.push('กรุณากรอกรายการ + จำนวนเงิน (> 0) ให้ครบ');
    }
    if (type === 'expense' && form.clearDueDate && !isValidThDate(form.clearDueDate)) e.push('รูปแบบวันเคลียร์เอกสารต้องเป็น DD/MM/YYYY');
    return e;
  };
  const errors = step >= 1 && type ? validate() : [];
  const submit = () => {
    const isItemType=type==='withdrawal'||type==='borrow',isMoneyType=type==='expense'||type==='event'||type==='purchase';
    const amount=isItemType?form.items.reduce((s,i)=>{const p=state.products.find(p=>p.sku===i.sku);return s+(p?.price||0)*(Number(i.qty)||0);},0):isMoneyType?form.breakdown.reduce((s,b)=>s+(Number(b.amount)||0),0):0;
    const prefix={withdrawal:'WR',borrow:'BR',expense:'EX',event:'EV',purchase:'PO',overtime:'OT',leave:'LV',general:'GN',hire:'HR'}[type]||'RQ';
    const newId=mintReqId(prefix,state.requests);
    // OT: ถ้าระบุยื่นแทน — ใช้ user คนนั้นเป็น requester (เพื่อให้ flow คำนวณจากสายของพนักงาน)
    const effectiveRequesterId = (type === 'overtime' && form.otForUserId) ? form.otForUserId : currentUser.id;
    const submittedByDifferent = effectiveRequesterId !== currentUser.id;
    const flow=MOCK.buildFlow(type,effectiveRequesterId).map((s,i)=>({...s,status:i===0?'pending':'waiting',at:null,comment:null}));
    // === Auto-urgent: ตรวจ dueDate เร็วเกินกว่า SLA → บังคับ high + lock ===
    // 🐛FIX v3.2: ใช้วันตามประเภท (urgencyDateOf) — เดิม form.dueDate ที่ pre-fill บังหน้า
    // eventStartDate/otDate/startDate ทำให้อีเว้นท์วันใกล้ๆ ไม่ขึ้นด่วน
    const typeDate = urgencyDateOf(type, form);
    const userEnteredDate = typeDate || form.dueDate;
    const effectiveDueDate = userEnteredDate || suggestDueDate(type);
    const isAutoUrgent = userEnteredDate ? shouldAutoUrgent(type, userEnteredDate) : false;
    const finalPriority = isAutoUrgent ? 'high' : form.priority;
    const req={id:newId,type,title:form.title||'คำขอใหม่',requester:effectiveRequesterId,submittedBy:submittedByDifferent?currentUser.id:undefined,createdAt:nowTh(),dueDate:effectiveDueDate,priority:finalPriority,autoUrgent:isAutoUrgent||undefined,status:'pending',currentStep:0,flow,items:isItemType?form.items:undefined,breakdown:isMoneyType?form.breakdown:undefined,customerId:type==='borrow'?form.customerId:undefined,eventStartDate:type==='event'?form.eventStartDate:undefined,eventEndDate:type==='event'?(form.eventEndDate||form.eventStartDate):undefined,venue:type==='event'?form.venue:undefined,attendees:type==='event'?Number(form.attendees)||undefined:undefined,eventStaff:type==='event'&&form.eventStaff.length>0?form.eventStaff:undefined,otDate:type==='overtime'?form.otDate:undefined,otStart:type==='overtime'?form.otStart:undefined,otEnd:type==='overtime'?form.otEnd:undefined,leaveType:type==='leave'?form.leaveType:undefined,startDate:type==='leave'?form.startDate:undefined,endDate:type==='leave'?form.endDate:undefined,hireRoleTh:type==='hire'?form.hireRoleTh:undefined,hireDeptKey:type==='hire'?form.hireDeptKey:undefined,hireTeam:type==='hire'?form.hireTeam:undefined,hireLevel:type==='hire'?form.hireLevel:undefined,hireCount:type==='hire'?(Number(form.hireCount)||1):undefined,hireSalaryMin:type==='hire'?form.hireSalaryMin:undefined,hireSalaryMax:type==='hire'?form.hireSalaryMax:undefined,hireSkills:type==='hire'?form.hireSkills:undefined,hireStartDate:type==='hire'?form.hireStartDate:undefined,borrowStartDate:type==='borrow'?form.borrowStartDate:undefined,borrowEndDate:type==='borrow'?(form.borrowEndDate||form.borrowStartDate):undefined,amount,purpose:form.purpose,attachments:0,comments:0,lastActivity:isAutoUrgent?'เพิ่งสร้าง · ⚡ ด่วนอัตโนมัติ':'เพิ่งสร้าง',clearDueDate:type==='expense'?form.clearDueDate:(type==='borrow'?(form.clearDueDate||form.borrowEndDate||form.borrowStartDate):undefined),cleared:type==='expense'?0:undefined,pendingClear:type==='borrow'||type==='expense',discussion:[]};
    const actSummary = submittedByDifferent ? `สร้างคำขอ${type==='overtime'?' OT':''}ให้ ${state.users[effectiveRequesterId]?.name||effectiveRequesterId}` : 'สร้างคำขอ';
    setState({requests:[req,...state.requests],activities:[{at:req.createdAt,user:currentUser.id,action:'create',refId:req.id,summary:actSummary},...state.activities],createOpen:false,route:'detail',selectedId:req.id});
    // Clear draft after successful submit
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    setHasDraft(false); setDraftMeta(null);
    setStep(0);setType(null);setForm(emptyForm);
  };
  return (
    <Modal open={state.createOpen} onClose={close} title={step===0?'สร้างคำขอใหม่':`${TYPE_LABEL[type]?.th||''} — ${step===1?'กรอกข้อมูล':'ตรวจสอบ'}`} wide
      footer={step===0?<button className="btn btn-outline" onClick={close}>ยกเลิก</button>:step===1?<><button className="btn btn-outline" onClick={()=>setStep(0)}>ย้อนกลับ</button><button className="btn btn-primary" onClick={()=>setStep(2)} disabled={errors.length>0} title={errors.length>0?`ยังมีข้อผิดพลาด ${errors.length} จุด`:''}>ดำเนินการต่อ <Icon name="arrowRight" size={13}/></button></>:<><button className="btn btn-outline" onClick={()=>setStep(1)}>แก้ไข</button><button className="btn btn-success" onClick={submit} disabled={errors.length>0}><Icon name="send" size={13}/> ส่งคำขอ</button></>}>
      <div className="row gap-12 mb-20" style={{justifyContent:'center'}}>{['เลือกประเภท','กรอกข้อมูล','ตรวจสอบ'].map((lbl,i)=><React.Fragment key={i}><div className="row gap-6"><div style={{width:24,height:24,borderRadius:100,background:step>=i?'var(--brand)':'var(--surface-3)',color:step>=i?'white':'var(--ink-3)',display:'grid',placeItems:'center',fontSize:11,fontWeight:600}}>{step>i?<Icon name="check" size={12}/>:i+1}</div><span className={`text-sm ${step>=i?'medium':'muted'}`}>{lbl}</span></div>{i<2&&<div style={{width:32,height:2,background:step>i?'var(--brand)':'var(--border)'}}></div>}</React.Fragment>)}</div>
      {step===0&&<>
        {hasDraft && draftMeta && (
          <div className="alert alert-amber mb-16" style={{ borderColor: 'var(--amber)' }}>
            <Icon name="bookmark" size={16} style={{ marginTop: 1, color: 'var(--amber-ink)' }} />
            <div className="flex-1">
              <div className="medium">มี draft ที่ยังไม่ได้ส่ง: "{draftMeta.title}"</div>
              <div className="text-xs muted mt-2">ประเภท: {TYPE_LABEL[draftMeta.type]?.th || draftMeta.type} · บันทึกเมื่อ {draftMeta.savedAt}</div>
            </div>
            <div className="row gap-6">
              <button className="btn btn-ghost btn-sm" onClick={discardDraft}>ทิ้ง</button>
              <button className="btn btn-primary btn-sm" onClick={restoreDraft}><Icon name="repeat" size={12} /> เรียกคืน Draft</button>
            </div>
          </div>
        )}
        <PickType onPick={pickType}/>
      </>}
      {step===1&&<>{errors.length>0&&<div className="alert alert-red mb-16"><Icon name="warning" size={16} style={{marginTop:1}}/><div className="flex-1"><div className="medium mb-4">ตรวจสอบข้อมูลก่อนดำเนินการต่อ</div><ul style={{margin:0,paddingLeft:18,fontSize:12,color:'var(--red-ink)'}}>{errors.map((er,i)=><li key={i}>{er}</li>)}</ul></div></div>}<CreateForm type={type} form={form} setForm={setForm} state={state} setState={setState} currentUser={currentUser}/></>}
      {step===2&&<CreateReview type={type} form={form} state={state} currentUser={currentUser}/>}
    </Modal>
  );
};

const StaffPicker = ({ staff, setStaff, users }) => {
  const [open, setOpen] = React.useState(false);
  const [q, setQ] = React.useState('');
  const ref = React.useRef(null);

  React.useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    window.addEventListener('mousedown', h);
    return () => window.removeEventListener('mousedown', h);
  }, []);

  const all = Object.values(users);
  const grouped = {};
  all.forEach(u => { (grouped[u.dept] = grouped[u.dept] || []).push(u); });
  const depts = Object.keys(grouped).sort();

  const toggle = (uid) => {
    setStaff(staff.includes(uid) ? staff.filter(id => id !== uid) : [...staff, uid]);
  };
  const addDept = (dept) => {
    const ids = grouped[dept].map(u => u.id);
    const allIn = ids.every(id => staff.includes(id));
    if (allIn) setStaff(staff.filter(id => !ids.includes(id)));
    else setStaff([...new Set([...staff, ...ids])]);
  };
  const filtered = q.trim() ? all.filter(u => (u.name + u.dept + u.roleTh + u.id).toLowerCase().includes(q.toLowerCase())) : null;

  return (
    <div className="field">
      <label className="field-label spread">
        <span><Icon name="users" size={13}/> พนักงานที่ไปร่วมงาน</span>
        {staff.length > 0 && <span className="badge badge-brand">{staff.length} คน</span>}
      </label>

      {staff.length > 0 && (
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
          {staff.map(uid => {
            const u = users[uid];
            return u ? (
              <span key={uid} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 8px 3px 3px',background:'var(--brand-soft)',border:'1px solid var(--brand-soft-2)',borderRadius:100,fontSize:12,color:'var(--brand-ink)'}}>
                <Avatar user={u} size="sm"/>
                <span className="medium">{u.name.split(' ')[0]}</span>
                <span className="text-xs muted">{u.dept}</span>
                <button type="button" onClick={()=>toggle(uid)} style={{background:'none',border:'none',cursor:'pointer',padding:0,display:'flex',color:'var(--ink-3)'}}><Icon name="x" size={11}/></button>
              </span>
            ) : null;
          })}
          <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setStaff([])} style={{fontSize:11,padding:'2px 8px',height:26}}>
            <Icon name="x" size={10}/> ล้างทั้งหมด
          </button>
        </div>
      )}

      <div ref={ref} style={{position:'relative'}}>
        <div className="input row gap-8" style={{cursor:'pointer',height:38,alignItems:'center'}} onClick={()=>setOpen(!open)}>
          <Icon name="users" size={14} className="muted"/>
          <span className={staff.length?'text-sm':'text-sm muted'}>{staff.length ? `เลือกแล้ว ${staff.length} คน — คลิกเพื่อเพิ่ม/ลด` : 'คลิกเพื่อเลือกพนักงาน...'}</span>
          <Icon name={open?'chevronDown':'chevronRight'} size={12} className="muted" style={{marginLeft:'auto'}}/>
        </div>

        {open && (
          <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:50,marginTop:4,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,0.12)',maxHeight:340,display:'flex',flexDirection:'column'}}>
            <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)'}}>
              <div className="search" style={{width:'100%'}}>
                <Icon name="search" size={13} className="search-icon"/>
                <input value={q} onChange={(e)=>setQ(e.target.value)} placeholder="ค้นหาชื่อ, แผนก, รหัส..." autoFocus/>
              </div>
            </div>
            <div style={{overflowY:'auto',flex:1,padding:'4px 0'}}>
              {filtered ? (
                filtered.length === 0 ? (
                  <div className="text-sm muted center" style={{padding:20}}>ไม่พบ "{q}"</div>
                ) : (
                  filtered.map(u => {
                    const sel = staff.includes(u.id);
                    return (
                      <button key={u.id} type="button" onClick={()=>toggle(u.id)}
                        style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'7px 12px',border:'none',background:sel?'var(--brand-soft)':'transparent',cursor:'pointer',textAlign:'left',transition:'background 0.1s'}}
                        onMouseEnter={(e)=>{if(!sel)e.currentTarget.style.background='var(--surface-2)';}}
                        onMouseLeave={(e)=>{if(!sel)e.currentTarget.style.background='transparent';}}>
                        <div style={{width:18,height:18,borderRadius:4,border:sel?'none':'1.5px solid var(--border)',background:sel?'var(--brand)':'transparent',display:'grid',placeItems:'center',flexShrink:0}}>
                          {sel&&<Icon name="check" size={11} style={{color:'white'}}/>}
                        </div>
                        <Avatar user={u} size="sm"/>
                        <div style={{flex:1,minWidth:0}}>
                          <div className="text-sm medium">{u.name}</div>
                          <div className="text-xs muted">{u.roleTh}</div>

                        <span className="text-xs muted en">{u.dept}</span>
                      </button>
                    );
                  })
                )
              ) : (
                depts.map(dept => {
                  const members = grouped[dept];
                  const allSel = members.every(u => staff.includes(u.id));
                  const someSel = members.some(u => staff.includes(u.id));
                  return (
                    <div key={dept}>
                      <div onClick={()=>addDept(dept)}
                        style={{display:'flex',alignItems:'center',gap:8,padding:'6px 12px',background:'var(--surface-2)',cursor:'pointer',borderBottom:'1px solid var(--border)',position:'sticky',top:0,zIndex:1}}
                        onMouseEnter={(e)=>{e.currentTarget.style.background='var(--surface-3)';}}
                        onMouseLeave={(e)=>{e.currentTarget.style.background='var(--surface-2)';}}>
                        <div style={{width:16,height:16,borderRadius:3,border:allSel?'none':someSel?'1.5px solid var(--brand)':'1.5px solid var(--border)',background:allSel?'var(--brand)':someSel?'var(--brand-soft)':'transparent',display:'grid',placeItems:'center',flexShrink:0}}>
                          {allSel&&<Icon name="check" size={10} style={{color:'white'}}/>}
                          {someSel&&!allSel&&<div style={{width:8,height:2,background:'var(--brand)',borderRadius:1}}/>}
                        </div>
                        <span className="text-xs bold" style={{color:'var(--ink-2)'}}>{dept}</span>
                        <span className="text-xs muted en">{members.length} คน</span>
                        {someSel&&<span className="text-xs en" style={{marginLeft:'auto',color:'var(--brand-ink)'}}>{members.filter(u=>staff.includes(u.id)).length}/{members.length}</span>}
                      </div>
                      {members.map(u => {
                        const sel = staff.includes(u.id);
                        return (
                          <button key={u.id} type="button" onClick={()=>toggle(u.id)}
                            style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'7px 12px 7px 28px',border:'none',background:sel?'var(--brand-soft)':'transparent',cursor:'pointer',textAlign:'left',transition:'background 0.1s'}}
                            onMouseEnter={(e)=>{if(!sel)e.currentTarget.style.background='var(--surface-2)';}}
                            onMouseLeave={(e)=>{if(!sel)e.currentTarget.style.background='transparent';}}>
                            <div style={{width:18,height:18,borderRadius:4,border:sel?'none':'1.5px solid var(--border)',background:sel?'var(--brand)':'transparent',display:'grid',placeItems:'center',flexShrink:0}}>
                              {sel&&<Icon name="check" size={11} style={{color:'white'}}/>}
                            </div>
                            <Avatar user={u} size="sm"/>
                            <div style={{flex:1,minWidth:0}}>
                              <div className="text-sm">{u.name}</div>
                            </div>
                            <span className="text-xs muted">{u.roleTh}</span>
                          </button>

                      })}
                    </div>
                  );
                })
              )}
            </div>
            <div style={{padding:'8px 12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span className="text-xs muted">เลือกแล้ว <span className="en bold">{staff.length}</span> คน</span>
              <button type="button" className="btn btn-primary btn-sm" onClick={()=>setOpen(false)}>
                <Icon name="check" size={12}/> เสร็จสิ้น
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// v3.3: เลือก ลูกค้า/บูธ ในคำขอยืม-คืน — แยกประเภท + ค้นหาได้ + มองเห็นตาม role
// บูธ = customers ที่ type 'อีเวนต์' · ลูกค้า = ที่เหลือ
// แผนกอีเว้นท์ → เห็นแค่บูธ · ฝ่ายขาย → เห็นแค่ลูกค้า · แอดมิน/แผนกอื่น → เห็นทั้งคู่
const BorrowSourcePicker = ({ form, update, state, currentUser }) => {
  const perms = getPermissions(currentUser);
  const isBooth = (c) => c.type === 'อีเวนต์';
  // 🔮 โครงรองรับอนาคต: ผู้แทนเห็นเฉพาะลูกค้าของตัวเอง — เมื่อ customer มี ownerId
  // ให้กรอง: ไม่มี ownerId = เห็นทุกคน · มี ownerId = เจ้าของ/แอดมินเท่านั้น
  const visibleCustomers = state.customers.filter(c => !c.ownerId || c.ownerId === currentUser.id || perms.isAdmin);
  const allowed = perms.isAdmin ? ['booth', 'customer']
    : currentUser.deptKey === 'events' ? ['booth']
    : currentUser.deptKey === 'sales' ? ['customer']
    : ['booth', 'customer'];
  const selected = state.customers.find(c => c.id === form.customerId);
  const initCat = selected ? (isBooth(selected) ? 'booth' : 'customer') : allowed[0];
  const [cat, setCat] = React.useState(initCat);
  const effCat = allowed.includes(cat) ? cat : allowed[0];
  const items = visibleCustomers
    .filter(c => effCat === 'booth' ? isBooth(c) : !isBooth(c))
    .map(c => ({ id: c.id, name: c.name, sub: `${c.type} · เกรด ${c.tier || '—'}` }));
  return (
    <div className="field">
      <label className="field-label spread">
        <span>{allowed.length === 1 ? (allowed[0] === 'booth' ? 'บูธ / งานอีเว้นท์' : 'ลูกค้า') : 'ลูกค้า / บูธ'} <span className="req">*</span></span>
        {allowed.length > 1 && (
          <span style={{ display: 'inline-flex', background: 'var(--surface-2)', borderRadius: 6, padding: 2, border: '1px solid var(--border)' }}>
            {allowed.map(k => (
              <button key={k} type="button" onClick={() => { setCat(k); if (form.customerId) { const cur = state.customers.find(c => c.id === form.customerId); if (cur && ((k === 'booth') !== isBooth(cur))) update({ customerId: '' }); } }}
                style={{ padding: '3px 12px', borderRadius: 5, border: 'none', cursor: 'pointer', fontSize: 11.5, fontWeight: 600, background: effCat === k ? 'var(--brand)' : 'transparent', color: effCat === k ? 'white' : 'var(--ink-2)' }}>
                {k === 'booth' ? 'บูธ' : 'ลูกค้า'}
              </button>
            ))}
          </span>
        )}
      </label>
      <SearchSelect value={form.customerId} onChange={(v) => update({ customerId: v })} items={items}
        placeholder={effCat === 'booth' ? '-- เลือกบูธ / งานอีเว้นท์ (พิมพ์ค้นหาได้) --' : '-- เลือกลูกค้า (พิมพ์ค้นหาได้) --'}
        emptyText={effCat === 'booth' ? 'ไม่พบบูธ — เพิ่มได้ที่ ข้อมูลหลัก → ลูกค้า (ประเภท อีเวนต์)' : 'ไม่พบลูกค้า — เพิ่มได้ที่ ข้อมูลหลัก → ลูกค้า'} />
    </div>
  );
};

const CreateForm = ({ type, form, setForm, state, setState, currentUser }) => {
  // v3.1: dropdown + เพิ่มตัวเลือกได้ — ตัวช่วยผูก OptionSelect กับ state.optionLists
  const optAdd = (key) => (v) => setState && addOptionItem(state, setState, key, v);
  // หัวหน้า/ผู้จัดการ/ผอ. ยื่น OT แทนลูกน้องได้
  const canSubmitForOthers = currentUser && (currentUser.level === 'head' || currentUser.level === 'manager' || currentUser.level === 'director');
  const subordinates = canSubmitForOthers ? Object.values(state.users).filter(u =>
    u.id !== currentUser.id && u.deptKey === currentUser.deptKey &&
    (currentUser.level === 'head' ? (u.level === 'staff' && (!currentUser.team || u.team === currentUser.team))
    : currentUser.level === 'manager' ? (u.level === 'staff' || u.level === 'head')
    : (u.level !== 'director'))
  ).sort((a, b) => a.name.localeCompare(b.name, 'th')) : [];
  const update=(patch)=>setForm(f=>({...f,...patch}));
  const updateItem=(i,patch)=>{const items=[...form.items];items[i]={...items[i],...patch};update({items});};
  const addItem=()=>update({items:[...form.items,{sku:state.products[0]?.sku||'',qty:1,note:''}]});
  const delItem=(i)=>update({items:form.items.filter((_,idx)=>idx!==i)});
  const updateBd=(i,patch)=>{const breakdown=[...form.breakdown];breakdown[i]={...breakdown[i],...patch};update({breakdown});};
  const addBd=()=>update({breakdown:[...form.breakdown,{label:'',amount:0}]});
  const delBd=(i)=>update({breakdown:form.breakdown.filter((_,idx)=>idx!==i)});

  // Similar past requests — search by title or purpose, same type
  const similar = React.useMemo(() => {
    const q = (form.title + ' ' + form.purpose).toLowerCase().trim();
    if (q.length < 4) return [];
    const tokens = q.split(/\s+/).filter(t => t.length >= 2);
    return state.requests
      .filter(r => r.type === type && (r.status === 'progress' || r.status === 'done'))
      .map(r => {
        const text = (r.title + ' ' + (r.purpose || '')).toLowerCase();
        const matches = tokens.filter(t => text.includes(t)).length;
        return { req: r, score: matches };
      })
      .filter(x => x.score >= Math.min(2, tokens.length))
      .sort((a, b) => b.score - a.score).slice(0, 3);
  }, [form.title, form.purpose, type, state.requests]);

  const applySimilar = (r) => {
    const patch = { title: r.title, purpose: r.purpose };
    if (r.breakdown && r.breakdown.length) patch.breakdown = r.breakdown.map(b => ({ ...b }));
    if (r.items && r.items.length) patch.items = r.items.map(it => ({ sku: it.sku, qty: it.qty, note: '' }));
    if (r.venue) patch.venue = r.venue;
    if (r.attendees) patch.attendees = r.attendees;
    update(patch);
    window.toast(`นำข้อมูลจาก ${r.id} มาใช้แล้ว — โปรดปรับให้เข้ากับงานใหม่`, { level: 'info' });
  };

  return (
    <div className="col gap-16">
      {similar.length > 0 && (
        <div className="card" style={{ background: 'var(--brand-soft)', border: '1px solid var(--brand-soft-2)', padding: 14 }}>
          <div className="row gap-8 mb-8"><Icon name="zap" size={14} style={{ color: 'var(--brand-ink)' }} /><span className="text-sm medium" style={{ color: 'var(--brand-ink)' }}>พบคำขอที่คล้ายกัน ({similar.length})</span><span className="text-xs muted">— กดเพื่อใช้เป็นต้นแบบ</span></div>
          <div className="col gap-6">
            {similar.map(({ req: r, score }) => (
              <button key={r.id} type="button" className="row gap-10" style={{ padding: '8px 10px', border: '1px solid var(--border)', borderRadius: 8, background: 'var(--surface)', cursor: 'pointer', textAlign: 'left', width: '100%' }} onClick={() => applySimilar(r)}>
                <TypeIcon type={r.type} size={28} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="row gap-8"><span className="en tnum text-xs muted">{r.id}</span><span className="text-xs muted">{r.createdAt?.split(' ')[0]}</span></div>
                  <div className="text-sm medium" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.title}</div>
                </div>
                {r.amount > 0 && <span className="en tnum text-xs muted">{fmtBaht(r.amount)}</span>}
                <Icon name="arrowRight" size={12} className="muted" />
              </button>
            ))}
          </div>
        </div>
      )}
      <div className="grid grid-2">
        <div className="field" style={{gridColumn:'1/-1'}}><label className="field-label">หัวข้อ <span className="req">*</span></label><input className="input" value={form.title} onChange={(e)=>update({title:e.target.value})} placeholder="ระบุหัวข้อคำขอ"/></div>
        {(type==='withdrawal'||type==='expense'||type==='purchase'||type==='general')&&<div className="field"><label className="field-label">ครบกำหนด <span className="req">*</span></label><DateInput value={form.dueDate} onChange={(v)=>update({dueDate:v})}/></div>}
