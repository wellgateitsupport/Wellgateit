  <script type="text/babel" data-presets="react">
// ===== กล่องงานของฉัน (Inbox) =====
const InboxPage = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const [tab, setTab] = usePersistedState('inbox.tab', 'todo');
  const [rejectId, setRejectId] = React.useState(null);
  const [rejectReason, setRejectReason] = React.useState('');
  const presetReasons = useRejectReasons();
  // ====== Saved views (filter snapshots) ======
  const [views, setViews] = React.useState(() => getInboxViews());
  const [activeView, setActiveView] = usePersistedState('inbox.activeView', '');
  const [saveViewOpen, setSaveViewOpen] = React.useState(false);
  const [newViewName, setNewViewName] = React.useState('');
  const [typeFilter, setTypeFilter] = React.useState('all');
  const [overdueOnly, setOverdueOnly] = React.useState(false);
  React.useEffect(() => {
    const h = () => setViews(getInboxViews());
    window.addEventListener('fd-inbox-views-changed', h);
    return () => window.removeEventListener('fd-inbox-views-changed', h);
  }, []);
  // Apply saved view on mount or activeView change
  React.useEffect(() => {
    const v = views.find(x => x.id === activeView);
    if (v) {
      setTab(v.tab || 'todo');
      setTypeFilter(v.typeFilter || 'all');
      setOverdueOnly(!!v.overdueOnly);
    }
  }, [activeView, views.length]);
  const saveCurrentView = () => {
    if (!newViewName.trim()) return;
    const v = { id: 'v-' + Date.now(), name: newViewName.trim(), tab, typeFilter, overdueOnly };
    const next = [v, ...views.filter(x => x.name !== v.name)];
    setInboxViews(next); setActiveView(v.id);
    setSaveViewOpen(false); setNewViewName('');
    window.toast(`บันทึก View "${v.name}" แล้ว`, { level: 'success' });
  };
  const deleteView = (id) => {
    const next = views.filter(v => v.id !== id);
    setInboxViews(next);
    if (activeView === id) setActiveView('');
    window.toast('ลบ View แล้ว', { level: 'info' });
  };

  // ===== Snooze filter — ซ่อนคำขอที่ snooze ของผู้ใช้ปัจจุบัน =====
  const snoozeMap = useSnoozeMap(currentUser.id);
  const [showSnoozed, setShowSnoozed] = usePersistedState('inbox.showSnoozed', false);
  const notSnoozed = (r) => {
    const until = isSnoozedUntil(currentUser.id, r.id);
    return showSnoozed || !until;
  };
  const snoozedCount = Object.keys(snoozeMap).filter(id => isSnoozedUntil(currentUser.id, id)).length;

  const myApprovals = state.requests.filter(r => r.status === 'pending' && canApproveStep(r.flow[r.currentStep], currentUser.id)).filter(notSnoozed);
  // ผู้ขอที่ต้องเคลียร์ — รวม pending/progress (เผื่อ expense ยังไม่อนุมัติ)
  // 🐛FIX: exclude 'rejected' ด้วย — เดิมรายการที่โดนตีกลับเข้าทั้ง myClears และ myClearsRejected (ซ้ำ 2 แถว)
  const myClears = state.requests.filter(r => r.requester === currentUser.id && r.pendingClear && !r.clearingStatus && (r.status === 'progress' || r.status === 'done')).filter(notSnoozed);
  // ผู้ขอที่ส่งเคลียร์ไปแล้วและถูก reject — ต้องแก้แล้วส่งใหม่
  const myClearsRejected = state.requests.filter(r => r.requester === currentUser.id && r.clearingStatus === 'rejected').filter(notSnoozed);
  // บัญชี — รายการรอตรวจสอบ (ทุกคนใน accounting เห็น)
  const isAcc = currentUser.deptKey === 'accounting';
  const myVerify = isAcc ? state.requests.filter(r => r.clearingStatus === 'submitted').filter(notSnoozed) : [];
  const myRejected = state.requests.filter(r => r.requester === currentUser.id && r.status === 'rejected').filter(notSnoozed);
  // v3.2: คำขอที่ถูกตีกลับให้แก้ไข — ผู้ขอต้องแก้แล้วส่งใหม่
  const myRevisions = state.requests.filter(r => r.requester === currentUser.id && r.status === 'revision').filter(notSnoozed);
  // งานที่อนุมัติแล้วและรอแผนกผู้ขอ (รวมตัวเอง) กดรับเรื่อง
  const myToReceive = state.requests.filter(r => canReceiveRequest(r, currentUser, state.users)).filter(notSnoozed);
  // งานที่ผมรับแล้ว ยังไม่ส่ง
  const myInProgress = state.requests.filter(r => r.status === 'progress' && r.receivedAt && !r.completedAt && (r.receivedBy === currentUser.id || (state.users[r.requester]?.deptKey === currentUser.deptKey))).filter(notSnoozed);
  // 🐛FIX: dedupe by id — คำขอเดียวเข้าหลายเงื่อนไข (เช่น รับเรื่อง+เคลียร์) เดิมแสดงซ้ำ + key ชน
  const todo = [...new Map([...myApprovals, ...myRevisions, ...myToReceive, ...myInProgress, ...myClears, ...myClearsRejected, ...myVerify, ...myRejected].map(r => [r.id, r])).values()];
  // งานด่วน (high/critical) ในกลุ่ม todo — แยก list สำหรับ tab urgent
  const myUrgent = todo.filter(r => r.priority === 'high' || r.priority === 'critical');
  // "คำขอที่ฉันยื่น" — แสดงทุกคำขอที่ยังไม่จบ (pending → progress → rejected)
  // 🐛 เดิมกรองเฉพาะ 'pending' ทำให้พออนุมัติครบ (progress) คำขอหายจาก tab นี้
  const watching = state.requests.filter(r => r.requester === currentUser.id && r.status !== 'done');

  const quickApprove = (id) => {
    const target = state.requests.find(r => r.id === id);
    if (!target) return;
    // 🐛FIX undo: restore เฉพาะคำขอนี้ — ไม่ย้อน action อื่นที่ทำระหว่างรอ toast
    const snapshotReq = target;
    const newFlow = [...target.flow];
    newFlow[target.currentStep] = { ...newFlow[target.currentStep], status: 'approved', at: nowTh(), approvedBy: currentUser.id, signature: getSignature(currentUser.id) || '' };
    const n = target.currentStep + 1;
    setState({
      requests: state.requests.map(r => r.id === id ? { ...r, flow: newFlow, currentStep: n, status: n >= r.flow.length ? 'progress' : 'pending' } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'approve', refId: id, summary: 'อนุมัติด่วน (Inbox)' }, ...state.activities]
    });
    window.toast(`อนุมัติ ${id} เรียบร้อย`, { level: 'success', duration: 6000, action: { label: 'ย้อน', onClick: () => { setState(s => ({ requests: s.requests.map(r => r.id === id ? snapshotReq : r) })); window.toast('ยกเลิกการอนุมัติแล้ว', { level: 'info' }); } } });
  };
  const submitQuickReject = () => {
    if (!rejectId || !rejectReason.trim()) return;
    const target = state.requests.find(r => r.id === rejectId);
    if (!target) return;
    const newFlow = [...target.flow];
    newFlow[target.currentStep] = { ...newFlow[target.currentStep], status: 'rejected', at: nowTh(), comment: rejectReason };
    setState({
      requests: state.requests.map(r => r.id === rejectId ? { ...r, flow: newFlow, status: 'rejected' } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'reject', refId: rejectId, summary: 'ปฏิเสธจาก Inbox: ' + rejectReason }, ...state.activities]
    });
    setRejectId(null); setRejectReason('');
  };

  // Watching tab = สิ่งที่ฉันติดตาม (รวมของคนอื่น)
  const watchingExtra = state.requests.filter(r => (r.watchers || []).includes(currentUser.id) && r.requester !== currentUser.id);
  const watchingAll = [...watching, ...watchingExtra];

  const myClearsAll = [...myClears, ...myClearsRejected];
  const lists = { todo, urgent: myUrgent, approve: myApprovals, receive: myToReceive, work: myInProgress, clear: myClearsAll, verify: myVerify, watching: watchingAll };
  const rawList = lists[tab] || todo;
  // Apply Type filter + Overdue-only filter
  let list = rawList;
  if (typeFilter !== 'all') list = list.filter(r => r.type === typeFilter);
  if (overdueOnly) list = list.filter(r => { const s = slaInfo(r.dueDate); return s && (s.level === 'overdue' || s.level === 'today'); });
  // Sort
  const [sortBy, setSortBy] = usePersistedState('inbox.sortBy', 'deadline');
  const PRIO_W = { critical: 4, high: 3, normal: 2, low: 1 };
  const sortedList = [...list].sort((a, b) => {
    if (sortBy === 'deadline') {
      const da = parseTh(a.dueDate)?.getTime() || Infinity;
      const db = parseTh(b.dueDate)?.getTime() || Infinity;
      return da - db;
    }
    if (sortBy === 'amount') return (b.amount || 0) - (a.amount || 0);
    if (sortBy === 'priority') return (PRIO_W[b.priority] || 0) - (PRIO_W[a.priority] || 0);
    if (sortBy === 'age') {
      const da = parseTh(a.createdAt)?.getTime() || 0;
      const db = parseTh(b.createdAt)?.getTime() || 0;
      return da - db;
    }
    return 0;
  });
  list = sortedList;
  const canActOn = (r) => r.status === 'pending' && canApproveStep(r.flow[r.currentStep], currentUser.id);

  // ===== Bulk receive + Bulk approve/reject =====
  const [bulkSelected, setBulkSelected] = React.useState([]);
  const [bulkRejectOpen, setBulkRejectOpen] = React.useState(false);
  const [bulkRejectReason, setBulkRejectReason] = React.useState('');
  React.useEffect(() => { setBulkSelected([]); }, [tab]);
  const receivableInList = list.filter(r => canReceiveRequest(r, currentUser, state.users));
  const approvableInList = list.filter(r => canActOn(r));
  const toggleBulk = (id) => setBulkSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  const selectAllReceivable = () => setBulkSelected(receivableInList.map(r => r.id));
  const selectAllApprovable = () => setBulkSelected(approvableInList.map(r => r.id));
  const bulkReceive = () => {
    if (bulkSelected.length === 0) return;
    const snapshot = { requests: state.requests, activities: state.activities };
    const ids = new Set(bulkSelected);
    const acts = bulkSelected.map(id => ({ at: nowTh(), user: currentUser.id, action: 'qr-scan', refId: id, summary: 'รับเรื่อง (bulk)' }));
    setState({
      requests: state.requests.map(r => ids.has(r.id) ? { ...r, receivedAt: nowTh(), receivedBy: currentUser.id, workMode: 'continue', lastActivity: 'รับเรื่อง · กำลังดำเนินการ (bulk)' } : r),
      activities: [...acts, ...state.activities]
    });
    setBulkSelected([]);
    window.toast(`รับเรื่อง ${bulkSelected.length} รายการเรียบร้อย`, { level: 'success', duration: 6000, action: { label: 'ย้อน', onClick: () => { setState(snapshot); window.toast('ยกเลิกการรับเรื่องแล้ว', { level: 'info' }); } } });
  };
  const bulkApproveAll = () => {
    if (bulkSelected.length === 0) return;
    const snapshot = { requests: state.requests, activities: state.activities };
    const ids = new Set(bulkSelected);
    const acts = bulkSelected.map(id => ({ at: nowTh(), user: currentUser.id, action: 'approve', refId: id, summary: 'อนุมัติ (bulk จาก Inbox)' }));
    setState({
      requests: state.requests.map(r => {
        if (!ids.has(r.id)) return r;
        const newFlow = [...r.flow];
        newFlow[r.currentStep] = { ...newFlow[r.currentStep], status: 'approved', at: nowTh(), signature: getSignature(currentUser.id) || '' };
        const n = r.currentStep + 1;
        return { ...r, flow: newFlow, currentStep: n, status: n >= r.flow.length ? 'progress' : 'pending' };
      }),
      activities: [...acts, ...state.activities]
    });
    setBulkSelected([]);
    window.toast(`อนุมัติ ${bulkSelected.length} รายการ`, { level: 'success', duration: 6000, action: { label: 'ย้อน', onClick: () => { setState(snapshot); window.toast('ยกเลิกการอนุมัติแล้ว', { level: 'info' }); } } });
  };
  const submitBulkReject = () => {
    if (bulkSelected.length === 0 || !bulkRejectReason.trim()) return;
    const ids = new Set(bulkSelected);
    const acts = bulkSelected.map(id => ({ at: nowTh(), user: currentUser.id, action: 'reject', refId: id, summary: 'ปฏิเสธ (bulk): ' + bulkRejectReason }));
    setState({
      requests: state.requests.map(r => {
        if (!ids.has(r.id)) return r;
        const newFlow = [...r.flow];
        newFlow[r.currentStep] = { ...newFlow[r.currentStep], status: 'rejected', at: nowTh(), comment: bulkRejectReason };
        return { ...r, flow: newFlow, status: 'rejected' };
      }),
      activities: [...acts, ...state.activities]
    });
    setBulkSelected([]); setBulkRejectOpen(false); setBulkRejectReason('');
    window.toast(`ปฏิเสธ ${bulkSelected.length} รายการ`, { level: 'warning' });
  };

  // ===== Bulk snooze — snooze multiple at once =====
  const bulkSnoozeQuick = (hours) => {
    if (bulkSelected.length === 0) return;
    const until = new Date(Date.now() + hours * 3600000);
    bulkSelected.forEach(id => snoozeRequest(currentUser.id, id, until));
    window.toast(`Snooze ${bulkSelected.length} รายการเป็นเวลา ${hours >= 24 ? hours/24 + ' วัน' : hours + ' ชม.'}`, { level: 'info' });
    setBulkSelected([]);
  };

  // ===== Print filtered list =====
  const [printOpen, setPrintOpen] = React.useState(false);

  // CSV Export current visible list
  const exportInboxCSV = () => {
    const rows = list.map(r => {
      const u = state.users[r.requester];
      return [r.id, TYPE_LABEL[r.type]?.th || r.type, r.title, u?.name || r.requester, u?.dept || '', STATUS_LABEL[r.status]?.th || r.status, r.amount || 0, r.createdAt, r.dueDate, r.lastActivity || ''];
    });
    exportCSV(`inbox-${tab}-${new Date().toISOString().slice(0,10)}.csv`,
      ['รหัส', 'ประเภท', 'หัวข้อ', 'ผู้ขอ', 'แผนก', 'สถานะ', 'มูลค่า', 'สร้างเมื่อ', 'ครบกำหนด', 'กิจกรรมล่าสุด'],
      rows);
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title" style={{ fontWeight: 500 }}>กล่องงาน</h1>
          <div className="page-sub">{todo.length === 0 ? 'ไม่มีงานต้องจัดการ' : `${todo.length} เรื่องที่รอคุณดำเนินการ`}</div>
        </div>
        <div className="row gap-8">
          <button className="btn btn-outline btn-sm" onClick={() => setPrintOpen(true)} title="พิมพ์รายการที่แสดงอยู่"><Icon name="print" size={13} /> พิมพ์ ({list.length})</button>
          <button className="btn btn-outline btn-sm" onClick={exportInboxCSV} title={`ดาวน์โหลด ${list.length} รายการที่แสดงอยู่`}><Icon name="download" size={13} /> Export CSV ({list.length})</button>
          <button className="btn btn-primary" onClick={() => setState({ createOpen: true })}>
            <Icon name="plus" size={14} /> สร้างคำขอ
          </button>
        </div>
      </div>

      {/* Saved Views bar */}
      <div className="row gap-6 mb-12 flex-wrap" style={{ alignItems: 'center' }}>
        <span className="text-xs muted" style={{ marginRight: 4 }}><Icon name="bookmark" size={11} /> Views:</span>
        <button className={`chip ${activeView === '' ? 'active' : ''}`} onClick={() => { setActiveView(''); setTypeFilter('all'); setOverdueOnly(false); }} style={{ fontSize: 12 }}>ทั้งหมด</button>
        {views.map(v => (
          <span key={v.id} style={{ display: 'inline-flex', alignItems: 'center', gap: 2 }}>
            <button className={`chip ${activeView === v.id ? 'active' : ''}`} onClick={() => setActiveView(v.id)} style={{ fontSize: 12 }} title={`${v.tab} · ${v.typeFilter}${v.overdueOnly ? ' · เฉพาะเกินกำหนด' : ''}`}>
              <Icon name="filter" size={10} /> {v.name}
            </button>
            <button className="btn btn-ghost btn-sm" onClick={() => { if (confirm(`ลบ View "${v.name}"?`)) deleteView(v.id); }} style={{ height: 24, width: 24, padding: 0, color: 'var(--ink-4)' }} title="ลบ View นี้"><Icon name="x" size={10} /></button>
          </span>
        ))}
        <button className="chip" onClick={() => { setSaveViewOpen(true); setNewViewName(''); }} style={{ fontSize: 12, color: 'var(--brand-ink)' }}>
          <Icon name="plus" size={10} /> บันทึก View นี้
        </button>
        <div style={{ marginLeft: 'auto' }} className="row gap-6">
          <select className="select" style={{ height: 28, fontSize: 12, padding: '0 8px' }} value={sortBy} onChange={(e) => setSortBy(e.target.value)} title="เรียงลำดับ">
            <option value="deadline">⏰ ครบกำหนดเร็วสุด</option>
            <option value="amount">฿ มูลค่าสูงสุด</option>
            <option value="priority">★ ความเร่งด่วน</option>
            <option value="age">📅 เก่าสุดก่อน</option>
          </select>
          <select className="select" style={{ height: 28, fontSize: 12, padding: '0 8px' }} value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)}>
            <option value="all">ทุกประเภท</option>
            {Object.entries(TYPE_LABEL).map(([k, v]) => <option key={k} value={k}>{v.th}</option>)}
          </select>
          <button className={`chip ${overdueOnly ? 'active' : ''}`} onClick={() => setOverdueOnly(!overdueOnly)} style={{ fontSize: 12 }} title="แสดงเฉพาะที่เกินกำหนดหรือครบกำหนดวันนี้"><Icon name="warning" size={10} /> เฉพาะเกินกำหนด</button>
          {snoozedCount > 0 && (
            <button className={`chip ${showSnoozed ? 'active' : ''}`} onClick={() => setShowSnoozed(!showSnoozed)} style={{ fontSize: 12 }} title={`มี ${snoozedCount} รายการที่ถูก Snooze`}><Icon name="clock" size={10} /> {showSnoozed ? 'ซ่อน' : 'แสดง'} Snoozed ({snoozedCount})</button>
          )}
        </div>
      </div>

      {/* Bulk action bar — แสดงเมื่อ tab=receive และมีงานรับได้ */}
      {tab === 'receive' && receivableInList.length > 0 && (
        <div className="card card-pad mb-12" style={{ background: bulkSelected.length > 0 ? 'var(--brand-soft)' : 'var(--surface)', border: `1px solid ${bulkSelected.length > 0 ? 'var(--brand)' : 'var(--border)'}`, transition: 'background 0.15s' }}>
          <div className="row gap-12" style={{ alignItems: 'center', flexWrap: 'wrap' }}>
            <Icon name="truck" size={16} style={{ color: bulkSelected.length > 0 ? 'var(--brand-ink)' : 'var(--ink-3)' }} />
            <div className="flex-1">
              <div className="medium text-sm">{bulkSelected.length > 0 ? `เลือก ${bulkSelected.length}/${receivableInList.length} รายการ` : `รับเรื่องหลายงานพร้อมกัน — ${receivableInList.length} งานพร้อมรับ`}</div>
              <div className="text-xs muted mt-2">{bulkSelected.length > 0 ? 'กด "รับและทำต่อ" เพื่อรับทั้งหมดในคลิกเดียว' : 'ติ๊กช่องด้านซ้ายเพื่อเลือกหลายงาน หรือกด "เลือกทั้งหมด"'}</div>
            </div>
            {bulkSelected.length === 0 ? (
              <button className="btn btn-outline btn-sm" onClick={selectAllReceivable}><Icon name="check" size={12} /> เลือกทั้งหมด ({receivableInList.length})</button>
            ) : (
              <>
                <button className="btn btn-ghost btn-sm" onClick={() => setBulkSelected([])}>ยกเลิก</button>
                <button className="btn btn-primary btn-sm" onClick={bulkReceive}><Icon name="truck" size={12} /> รับและทำต่อ ({bulkSelected.length})</button>
              </>
            )}
          </div>
        </div>
      )}

      {/* Bulk approve/reject bar — แสดงเมื่อ tab=approve และมีงานรอ */}
      {tab === 'approve' && approvableInList.length > 0 && (
        <div className="card card-pad mb-12" style={{ background: bulkSelected.length > 0 ? 'var(--green-soft)' : 'var(--surface)', border: `1px solid ${bulkSelected.length > 0 ? 'var(--green)' : 'var(--border)'}`, transition: 'background 0.15s' }}>
          <div className="row gap-12" style={{ alignItems: 'center', flexWrap: 'wrap' }}>
            <Icon name="check" size={16} style={{ color: bulkSelected.length > 0 ? 'var(--green-ink)' : 'var(--ink-3)' }} />
            <div className="flex-1">
              <div className="medium text-sm">{bulkSelected.length > 0 ? `เลือก ${bulkSelected.length}/${approvableInList.length} รายการ` : `อนุมัติหลายงานพร้อมกัน — ${approvableInList.length} งานรอ`}</div>
              <div className="text-xs muted mt-2">{bulkSelected.length > 0 ? 'กด "อนุมัติทั้งหมด" / "ปฏิเสธทั้งหมด"' : 'ติ๊กช่องด้านซ้ายเพื่อเลือกหลายงาน หรือกด "เลือกทั้งหมด"'}</div>
            </div>
            {bulkSelected.length === 0 ? (
              <button className="btn btn-outline btn-sm" onClick={selectAllApprovable}><Icon name="check" size={12} /> เลือกทั้งหมด ({approvableInList.length})</button>
            ) : (
              <>
                <button className="btn btn-ghost btn-sm" onClick={() => setBulkSelected([])}>ยกเลิก</button>
                <button className="btn btn-outline btn-sm" onClick={() => bulkSnoozeQuick(24)} title="Snooze 1 วัน"><Icon name="clock" size={12} /> Snooze 1d</button>
                <button className="btn btn-danger btn-sm" onClick={() => setBulkRejectOpen(true)}><Icon name="x" size={12} /> ปฏิเสธทั้งหมด ({bulkSelected.length})</button>
                <button className="btn btn-success btn-sm" onClick={bulkApproveAll}><Icon name="check" size={12} /> อนุมัติทั้งหมด ({bulkSelected.length})</button>
              </>
            )}
          </div>
        </div>
      )}

      <div className="grid grid-4 mb-20">
        {[
          { lbl: '⚡ ด่วน', val: myUrgent.length, color: 'var(--red)', onClick: () => setTab('urgent') },
          { lbl: 'รอคุณพิจารณา', val: myApprovals.length, color: 'var(--amber)', onClick: () => setTab('approve') },
          { lbl: 'รอกดรับเรื่อง', val: myToReceive.length, color: 'var(--brand)', onClick: () => setTab('receive') },
          { lbl: isAcc ? `เคลียร์/ตรวจสอบ (บัญชี)` : 'รอเคลียร์เอกสาร', val: isAcc ? myClearsAll.length + myVerify.length : myClearsAll.length, color: 'var(--violet)', onClick: () => setTab(isAcc && myVerify.length > 0 ? 'verify' : 'clear') }
        ].map((k, i) => (
          <Glow key={i} style={{ padding: 18, background: 'var(--surface)', borderRadius: 12, border: '1px solid var(--border)', overflow: 'hidden', cursor: k.val > 0 ? 'pointer' : 'default' }} onClick={k.val > 0 ? k.onClick : undefined}>
            <div className="text-xs muted" style={{ marginBottom: 8 }}>{k.lbl}</div>
            <div className="en" style={{ fontSize: 32, fontWeight: 600, letterSpacing: '-0.02em', lineHeight: 1, color: k.val > 0 ? 'var(--ink)' : 'var(--ink-3)' }}>
              <CountUp value={k.val} />
            </div>
            <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 2, background: k.color, opacity: k.val > 0 ? 1 : 0.2, zIndex: 2 }}></div>
          </Glow>
        ))}
      </div>

      <div className="tabs" style={{ flexWrap: 'wrap' }}>
        <button className={`tab ${tab === 'todo' ? 'active' : ''}`} onClick={() => setTab('todo')}>ต้องทำ <span className="tab-count">{todo.length}</span></button>
        {myUrgent.length > 0 && <button className={`tab ${tab === 'urgent' ? 'active' : ''}`} onClick={() => setTab('urgent')} style={{ color: tab === 'urgent' ? 'var(--red-ink)' : 'var(--red-ink)', fontWeight: 600 }}>⚡ ด่วน <span className="tab-count" style={{ background: 'var(--red)', color: 'white' }}>{myUrgent.length}</span></button>}
        <button className={`tab ${tab === 'approve' ? 'active' : ''}`} onClick={() => setTab('approve')}>รออนุมัติ <span className="tab-count">{myApprovals.length}</span></button>
        <button className={`tab ${tab === 'receive' ? 'active' : ''}`} onClick={() => setTab('receive')}>รอรับเรื่อง <span className="tab-count">{myToReceive.length}</span></button>
        <button className={`tab ${tab === 'work' ? 'active' : ''}`} onClick={() => setTab('work')}>กำลังทำ <span className="tab-count">{myInProgress.length}</span></button>
        {myClearsAll.length > 0 && <button className={`tab ${tab === 'clear' ? 'active' : ''}`} onClick={() => setTab('clear')}>รอเคลียร์ <span className="tab-count" style={{ background: 'var(--violet)', color: 'white' }}>{myClearsAll.length}</span></button>}
        {isAcc && myVerify.length > 0 && <button className={`tab ${tab === 'verify' ? 'active' : ''}`} onClick={() => setTab('verify')}>รอตรวจสอบ <span className="tab-count" style={{ background: 'var(--violet)', color: 'white' }}>{myVerify.length}</span></button>}
        <button className={`tab ${tab === 'watching' ? 'active' : ''}`} onClick={() => setTab('watching')}>คำขอที่ฉันยื่น <span className="tab-count">{watchingAll.length}</span></button>
      </div>

      <div className="card" style={{ overflow: 'hidden' }}>
        {list.length === 0
          ? <div style={{ padding: 40 }}><Empty icon="check" title="กล่องว่าง" sub="ไม่มีงานที่ต้องทำตอนนี้" /></div>
          : (() => {
              const renderRow = (r) => {
                const canBulk = (tab === 'receive' && canReceiveRequest(r, currentUser, state.users)) || (tab === 'approve' && canActOn(r));
                const sel = bulkSelected.includes(r.id);
                return (
                  <div key={r.id} style={{ display: 'flex', alignItems: 'stretch', borderBottom: '1px solid var(--border)', background: sel ? 'var(--brand-soft)' : 'transparent' }}>
                    {canBulk && (
                      <label style={{ display: 'flex', alignItems: 'center', padding: '0 14px', cursor: 'pointer', background: sel ? 'transparent' : 'var(--surface-2)' }} onClick={(e) => e.stopPropagation()}>
                        <input type="checkbox" checked={sel} onChange={() => toggleBulk(r.id)} style={{ cursor: 'pointer' }} />
                      </label>
                    )}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <RequestRow req={r} users={state.users} onClick={() => setState({ route: 'detail', selectedId: r.id })} />
                    </div>
                    {canActOn(r) && (
                      <div className="row gap-6" style={{ padding: '0 16px', alignItems: 'center', borderLeft: '1px solid var(--border)', background: 'var(--surface-2)' }}>
                        <button className="btn btn-success btn-sm" title="อนุมัติด่วน" onClick={(e) => { e.stopPropagation(); quickApprove(r.id); }}><Icon name="check" size={12} /></button>
                        <button className="btn btn-danger btn-sm" title="ปฏิเสธ" onClick={(e) => { e.stopPropagation(); setRejectId(r.id); }}><Icon name="x" size={12} /></button>
                      </div>
                    )}
                  </div>
                );
              };
              const sectionHeader = (label, count, color) => (
                <div style={{ padding: '10px 18px', background: color, color: 'white', fontSize: 12, fontWeight: 700, letterSpacing: 0.3, display: 'flex', alignItems: 'center', gap: 8, borderBottom: '1px solid var(--border)' }}>
                  {label} <span style={{ background: 'rgba(255,255,255,0.25)', padding: '1px 8px', borderRadius: 10, fontSize: 11 }}>{count}</span>
                </div>
              );
              // แยก urgent/normal เฉพาะ tab=todo (เพื่อความชัดเจน) — tab อื่นแสดง list ปกติ
              const urgentInList = list.filter(r => r.priority === 'high' || r.priority === 'critical');
              const normalInList = list.filter(r => !(r.priority === 'high' || r.priority === 'critical'));
              const shouldSplit = (tab === 'todo' || tab === 'approve' || tab === 'receive') && urgentInList.length > 0 && normalInList.length > 0;
              if (!shouldSplit) return list.map(renderRow);
              return (
                <>
                  {sectionHeader('⚡ ด่วน', urgentInList.length, 'var(--red)')}
                  {urgentInList.map(renderRow)}
                  {sectionHeader('ปกติ', normalInList.length, 'var(--ink-3)')}
                  {normalInList.map(renderRow)}
                </>
              );
            })()
        }

      <Modal open={!!rejectId} onClose={() => { setRejectId(null); setRejectReason(''); }} title="ปฏิเสธคำขอ"
        footer={<><button className="btn btn-outline" onClick={() => { setRejectId(null); setRejectReason(''); }}>ยกเลิก</button><button className="btn btn-danger" onClick={submitQuickReject} disabled={!rejectReason.trim()}><Icon name="x" size={13} /> ยืนยันปฏิเสธ</button></>}>
        <div className="col gap-12">
          <div className="alert alert-amber"><Icon name="warning" size={14} style={{ marginTop: 1 }} /><div className="text-sm">คำขอ {rejectId} จะถูกตีกลับ — โปรดระบุเหตุผล</div></div>
          <div className="field">
            <label className="field-label">เหตุผลที่พบบ่อย — กดเลือก</label>
            <div className="row gap-6 flex-wrap">
              {presetReasons.map((r, i) => (
                <button key={i} type="button" className="chip" onClick={() => setRejectReason(rejectReason ? rejectReason + ' · ' + r : r)} style={{ cursor: 'pointer', fontSize: 12 }}>
                  <Icon name="plus" size={10} /> {r}
                </button>
              ))}
            </div>
          </div>
          <div className="field"><label className="field-label">เหตุผล <span className="req">*</span></label><textarea className="textarea" value={rejectReason} onChange={e => setRejectReason(e.target.value)} placeholder="ระบุเหตุผลที่ปฏิเสธ..." style={{ minHeight: 100 }} autoFocus /></div>
        </div>
      </Modal>

      <Modal open={printOpen} onClose={() => setPrintOpen(false)} wide title={`พิมพ์รายการ — ${list.length} คำขอ`}
        footer={<><button className="btn btn-outline" onClick={() => setPrintOpen(false)}>ปิด</button><button className="btn btn-primary" onClick={() => window.print()}><Icon name="print" size={13} /> พิมพ์</button></>}>
        <div id="print-doc" style={{ padding: 16, background: 'white', color: '#1a1a1a', fontFamily: 'var(--font-th)' }}>
          <div style={{ marginBottom: 16, paddingBottom: 12, borderBottom: '2px solid #1a1a1a' }}>
            <h2 style={{ margin: 0, fontSize: 18 }}>รายการคำขอ — กล่องงาน</h2>
            <div style={{ fontSize: 11, color: '#666', marginTop: 4 }}>
              ผู้พิมพ์: {currentUser.name} · {nowTh()} · แท็บ: {tab} · ประเภท: {typeFilter === 'all' ? 'ทุกประเภท' : (TYPE_LABEL[typeFilter]?.th || typeFilter)}
              {overdueOnly && ' · เฉพาะเกินกำหนด'}
            </div>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
            <thead>
              <tr style={{ background: '#f0f0f0' }}>
                <th style={{ padding: 6, textAlign: 'left', border: '1px solid #ccc' }}>รหัส</th>
                <th style={{ padding: 6, textAlign: 'left', border: '1px solid #ccc' }}>ประเภท</th>
                <th style={{ padding: 6, textAlign: 'left', border: '1px solid #ccc' }}>หัวข้อ</th>
                <th style={{ padding: 6, textAlign: 'left', border: '1px solid #ccc' }}>ผู้ขอ</th>
                <th style={{ padding: 6, textAlign: 'right', border: '1px solid #ccc' }}>มูลค่า</th>
                <th style={{ padding: 6, textAlign: 'left', border: '1px solid #ccc' }}>สถานะ</th>
                <th style={{ padding: 6, textAlign: 'left', border: '1px solid #ccc' }}>ครบกำหนด</th>
              </tr>
            </thead>
            <tbody>
              {list.map(r => {
                const u = state.users[r.requester];
                return (
                  <tr key={r.id}>
                    <td style={{ padding: 5, border: '1px solid #ccc', fontFamily: 'monospace' }}>{r.id}</td>
                    <td style={{ padding: 5, border: '1px solid #ccc' }}>{TYPE_LABEL[r.type]?.th || r.type}</td>
                    <td style={{ padding: 5, border: '1px solid #ccc' }}>{r.title}</td>
                    <td style={{ padding: 5, border: '1px solid #ccc' }}>{u?.name || r.requester}<div style={{ fontSize: 9, color: '#666' }}>{u?.dept || ''}</div></td>
                    <td style={{ padding: 5, border: '1px solid #ccc', textAlign: 'right', fontFamily: 'monospace' }}>{r.amount ? '฿' + r.amount.toLocaleString() : '—'}</td>
                    <td style={{ padding: 5, border: '1px solid #ccc' }}>{STATUS_LABEL[r.status]?.th || r.status}</td>
                    <td style={{ padding: 5, border: '1px solid #ccc' }}>{r.dueDate}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {list.length === 0 && <div style={{ textAlign: 'center', padding: 24, color: '#666' }}>ไม่มีรายการ</div>}
          <div style={{ marginTop: 16, paddingTop: 8, borderTop: '1px solid #ccc', fontSize: 9, color: '#666', textAlign: 'right' }}>
            FlowDesk · พิมพ์เมื่อ {nowTh()}
          </div>
        </div>
      </Modal>

      <Modal open={bulkRejectOpen} onClose={() => { setBulkRejectOpen(false); setBulkRejectReason(''); }} title={`ปฏิเสธ ${bulkSelected.length} คำขอพร้อมกัน`}
        footer={<><button className="btn btn-outline" onClick={() => { setBulkRejectOpen(false); setBulkRejectReason(''); }}>ยกเลิก</button><button className="btn btn-danger" onClick={submitBulkReject} disabled={!bulkRejectReason.trim()}><Icon name="x" size={13}/> ยืนยันปฏิเสธ {bulkSelected.length} รายการ</button></>}>
        <div className="col gap-12">
          <div className="alert alert-amber"><Icon name="warning" size={14} style={{ marginTop: 1 }} /><div className="text-sm">ปฏิเสธ {bulkSelected.length} คำขอด้วยเหตุผลเดียวกัน — โปรดตรวจสอบให้แน่ใจ</div></div>
          <div className="field">
            <label className="field-label">เหตุผลที่พบบ่อย</label>
            <div className="row gap-6 flex-wrap">
              {presetReasons.map((r, i) => (
                <button key={i} type="button" className="chip" onClick={() => setBulkRejectReason(bulkRejectReason ? bulkRejectReason + ' · ' + r : r)} style={{ cursor: 'pointer', fontSize: 12 }}>
                  <Icon name="plus" size={10} /> {r}
                </button>
              ))}
            </div>
          </div>
          <div className="field"><label className="field-label">เหตุผล <span className="req">*</span></label><textarea className="textarea" value={bulkRejectReason} onChange={e => setBulkRejectReason(e.target.value)} placeholder="ระบุเหตุผล..." style={{ minHeight: 100 }} autoFocus /></div>

      <Modal open={saveViewOpen} onClose={() => { setSaveViewOpen(false); setNewViewName(''); }} title="บันทึก View ปัจจุบัน"
        footer={<><button className="btn btn-outline" onClick={() => { setSaveViewOpen(false); setNewViewName(''); }}>ยกเลิก</button><button className="btn btn-primary" onClick={saveCurrentView} disabled={!newViewName.trim()}><Icon name="bookmark" size={14} /> บันทึก View</button></>}>
        <div className="col gap-12">
          <div className="alert alert-info"><Icon name="info" size={14} style={{ marginTop: 1 }} /><div className="text-sm">จะบันทึกการตั้งค่า: แท็บ <span className="medium">{tab}</span> · ประเภท <span className="medium">{typeFilter}</span>{overdueOnly && ' · เฉพาะเกินกำหนด'}</div></div>
          <div className="field">
            <label className="field-label">ชื่อ View <span className="req">*</span></label>
            <input className="input" placeholder="เช่น OT รออนุมัติเร่งด่วน" value={newViewName} onChange={(e) => setNewViewName(e.target.value)} autoFocus />

        </div>
      </Modal>
    </div>
  );
};

// ===== AI Insights =====
const InsightsPage = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const reqs = state.requests;

  // ===== Compute analytics =====
  const totalAmount = reqs.reduce((s, r) => s + (r.amount || 0), 0);
  const myApprovals = reqs.filter(r => r.status === 'pending' && canApproveStep(r.flow[r.currentStep], currentUser.id));
  const pending = reqs.filter(r => r.status === 'pending');
  const progress = reqs.filter(r => r.status === 'progress');
  const rejected = reqs.filter(r => r.status === 'rejected');
  const overdueAll = reqs.filter(r => { const s = slaInfo(r.dueDate); return s && s.level === 'overdue' && r.status !== 'rejected'; });
  const slaCompliance = reqs.length > 0 ? Math.round((reqs.length - overdueAll.length) / reqs.length * 100) : 100;

  // Trends — last 14 days
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const trend14 = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(today); d.setDate(d.getDate() - (13 - i));
    const ds = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    return reqs.filter(r => r.createdAt && r.createdAt.startsWith(ds)).length;
  });
  const amountTrend = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(today); d.setDate(d.getDate() - (13 - i));
    const ds = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    return reqs.filter(r => r.createdAt && r.createdAt.startsWith(ds)).reduce((s, r) => s + (r.amount || 0), 0);
  });

  // Budget by dept
  const deptBudget = {};
  Object.values(MOCK.DEPTS).forEach(d => { deptBudget[d.th] = { dept: d.th, deptKey: d.key, spent: 0, count: 0, budget: 500000 + Math.floor(Math.random() * 0) * 100000 }; });
  const fixedBudgets = { 'การตลาด': 1500000, 'ฝ่ายขาย': 1200000, 'อีเว้นท์': 800000, 'บัญชี': 400000, 'คอลเซ็นเตอร์': 350000, 'คลังสินค้า': 500000, 'จัดซื้อ': 700000, 'ธุรการ/ออฟฟิศ': 300000, 'ฝ่ายบุคคล': 400000 };
  Object.keys(deptBudget).forEach(k => { if (fixedBudgets[k]) deptBudget[k].budget = fixedBudgets[k]; });
  reqs.forEach(r => { const d = state.users[r.requester]?.dept; if (d && deptBudget[d]) { deptBudget[d].spent += (r.amount || 0); deptBudget[d].count++; } });
  const deptRows = Object.values(deptBudget).filter(d => d.spent > 0).sort((a, b) => b.spent / b.budget - a.spent / a.budget);

  // Approval bottlenecks
  const approverLoad = {};
  pending.forEach(r => {
    const uid = r.flow[r.currentStep]?.userId; if (!uid) return;
    approverLoad[uid] = approverLoad[uid] || { id: uid, count: 0, oldestDays: 0, totalAmount: 0 };
    approverLoad[uid].count++;
    approverLoad[uid].totalAmount += (r.amount || 0);
    const sla = slaInfo(r.dueDate); if (sla && sla.days > approverLoad[uid].oldestDays) approverLoad[uid].oldestDays = sla.days;
  });
  const bottlenecks = Object.values(approverLoad).sort((a, b) => b.count - a.count).slice(0, 5);

  // Anomalies — abnormally large requests
  const expenseByType = {};
  reqs.forEach(r => { if (r.amount > 0) { expenseByType[r.type] = expenseByType[r.type] || []; expenseByType[r.type].push(r.amount); } });
  const avgByType = {};
  Object.keys(expenseByType).forEach(t => { const a = expenseByType[t]; avgByType[t] = a.reduce((s, x) => s + x, 0) / a.length; });
  const anomalies = reqs.filter(r => r.amount > 0 && avgByType[r.type] && r.amount > avgByType[r.type] * 2 && r.status !== 'rejected').slice(0, 4);

  // Top requesters
  const requesterCount = {};
  reqs.forEach(r => { requesterCount[r.requester] = (requesterCount[r.requester] || 0) + 1; });
  const topRequesters = Object.entries(requesterCount).sort((a, b) => b[1] - a[1]).slice(0, 5);

  // Type distribution trend
  const typeStats = ['event','expense','borrow','purchase','overtime','leave','withdrawal','general'].map(t => ({
    type: t, label: TYPE_LABEL[t].th, color: TYPE_LABEL[t].color,
    count: reqs.filter(r => r.type === t).length,
    amount: reqs.filter(r => r.type === t).reduce((s, r) => s + (r.amount || 0), 0),
    approved: reqs.filter(r => r.type === t && (r.status === 'progress' || r.status === 'done')).length
  })).filter(t => t.count > 0).sort((a, b) => b.amount - a.amount);

  // Activity heatmap data
  const activityByDate = {};
  state.activities.forEach(a => { const dk = a.at.split(' ')[0]; activityByDate[dk] = (activityByDate[dk] || 0) + 1; });
  reqs.forEach(r => { const dk = r.createdAt?.split(' ')[0]; if (dk) activityByDate[dk] = (activityByDate[dk] || 0) + 1; });
  const heatGet = (d) => { const dk = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; return activityByDate[dk] || 0; };

  // ===== Smart insights generator =====
  const insights = [];
  if (overdueAll.length > 0) insights.push({ level: 'critical', icon: 'warning', title: `${overdueAll.length} คำขอเกินกำหนด ต้องเร่งดำเนินการ`, body: overdueAll.slice(0, 2).map(r => `${r.id} ${r.title}`).join(' · '), action: 'ดูทั้งหมด', route: 'approvals' });
  if (myApprovals.length > 0) insights.push({ level: 'warning', icon: 'inbox', title: `คุณมี ${myApprovals.length} คำขอที่ยังไม่ได้พิจารณา`, body: 'พิจารณาให้เร็วเพื่อไม่ให้เป็นคอขวด — กดเข้าหน้ารออนุมัติ', action: 'ไปดูคำขอ', route: 'approvals' });
  const overBudget = deptRows.filter(d => d.spent / d.budget > 0.8);
  if (overBudget.length > 0) insights.push({ level: 'warning', icon: 'wallet', title: `${overBudget.length} แผนกใช้งบเกิน 80%`, body: overBudget.slice(0, 3).map(d => `${d.dept} ${Math.round(d.spent/d.budget*100)}%`).join(' · ') });
  if (bottlenecks.length > 0 && bottlenecks[0].count >= 3) { const u = state.users[bottlenecks[0].id]; insights.push({ level: 'info', icon: 'user', title: `จุดคอขวด: ${u?.name || bottlenecks[0].id}`, body: `มี ${bottlenecks[0].count} คำขอรอพิจารณา รวม ${fmtBaht(bottlenecks[0].totalAmount)}` }); }
  if (anomalies.length > 0) insights.push({ level: 'info', icon: 'zap', title: `พบ ${anomalies.length} คำขอผิดปกติ`, body: 'มูลค่าสูงกว่าค่าเฉลี่ยของประเภทนี้ — ควรตรวจสอบเพิ่ม', action: 'ดูรายการ', anchor: 'anomalies' });
  const todayCount = trend14[trend14.length - 1];
  const yesterdayCount = trend14[trend14.length - 2] || 0;
  if (todayCount > 0 && todayCount > yesterdayCount * 1.5) insights.push({ level: 'success', icon: 'arrowUp', title: `คำขอวันนี้เพิ่มขึ้น ${Math.round((todayCount - yesterdayCount) / Math.max(yesterdayCount, 1) * 100)}%`, body: `${todayCount} รายการในวันนี้ (เมื่อวาน ${yesterdayCount})` });
  if (slaCompliance >= 80) insights.push({ level: 'success', icon: 'check', title: `SLA Compliance อยู่ที่ ${slaCompliance}%`, body: 'ระบบบริหารคำขอตามกำหนดได้ดี' });
  if (insights.length === 0) insights.push({ level: 'success', icon: 'check', title: 'ทุกอย่างเรียบร้อย', body: 'ไม่พบประเด็นที่ต้องดำเนินการเร่งด่วน' });

  const tone = {
    critical: { bg: 'var(--red-soft)', ink: 'var(--red-ink)', bd: 'var(--red)' },
    warning: { bg: 'var(--amber-soft)', ink: 'var(--amber-ink)', bd: 'var(--amber)' },
    info: { bg: 'var(--blue-soft)', ink: 'var(--blue-ink)', bd: 'var(--blue)' },
    success: { bg: 'var(--green-soft)', ink: 'var(--green-ink)', bd: 'var(--green)' }
  };

  // ===== SLA Breach analytics — by type + dept =====
  const slaCfg = useSLAConfig();
  const breachByType = {};
  const breachByDept = {};
  Object.keys(TYPE_LABEL).forEach(t => { breachByType[t] = { type: t, label: TYPE_LABEL[t].th, color: TYPE_LABEL[t].color, total: 0, breached: 0 }; });
  Object.values(MOCK.DEPTS).forEach(d => { breachByDept[d.key] = { deptKey: d.key, dept: d.th, total: 0, breached: 0 }; });
  reqs.forEach(r => {
    if (!r.receivedAt || r.workMode === 'close') return;
    const dl = computeWorkDeadline(r, slaCfg); if (!dl) return;
    const breached = r.status === 'done' && r.completedAt
      ? parseTh(r.completedAt) > dl.deadline
      : (r.status === 'progress' && new Date() > dl.deadline);
    if (breachByType[r.type]) { breachByType[r.type].total++; if (breached) breachByType[r.type].breached++; }
    const dk = state.users[r.requester]?.deptKey;
    if (dk && breachByDept[dk]) { breachByDept[dk].total++; if (breached) breachByDept[dk].breached++; }
  });
  const breachTypeRows = Object.values(breachByType).filter(x => x.total > 0)
    .map(x => ({ ...x, rate: Math.round(x.breached / x.total * 100) }))
    .sort((a, b) => b.rate - a.rate);
  const breachDeptRows = Object.values(breachByDept).filter(x => x.total > 0)
    .map(x => ({ ...x, rate: Math.round(x.breached / x.total * 100) }))
    .sort((a, b) => b.rate - a.rate);

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title" style={{ fontWeight: 500 }}>ข้อมูลเชิงลึก</h1>
          <div className="page-sub">สรุปจากคำขอ {reqs.length} รายการ · กิจกรรม {state.activities.length} ครั้ง</div>
        </div>
      </div>

      <div className="grid grid-4 mb-20">
        {[
          { lbl: 'คำขอ 14 วัน', val: trend14.reduce((s, x) => s + x, 0), spark: trend14, color: 'var(--brand)' },
          { lbl: 'มูลค่ารวม', val: fmtBaht(totalAmount), spark: amountTrend, color: 'var(--violet)' },
          { lbl: 'ตรงกำหนด', val: `${slaCompliance}%`, spark: null, color: slaCompliance >= 80 ? 'var(--green)' : 'var(--amber)' },
          { lbl: 'รอพิจารณา', val: pending.length, spark: null, color: pending.length > 5 ? 'var(--red)' : 'var(--amber)' }
        ].map((k, i) => (
          <Glow key={i} style={{ padding: 18, background: 'var(--surface)', borderRadius: 12, border: '1px solid var(--border)', overflow: 'hidden', cursor: 'default' }}>
            <div className="text-xs muted" style={{ marginBottom: 8 }}>{k.lbl}</div>
            <div className="row spread" style={{ alignItems: 'baseline', gap: 8 }}>
              <div className="en" style={{ fontSize: 26, fontWeight: 600, letterSpacing: '-0.02em', lineHeight: 1 }}>{k.val}</div>
              {k.spark && k.spark.some(v => v > 0) && <Sparkline data={k.spark} color={k.color} width={56} height={20} />}
            </div>
            <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 2, background: k.color, zIndex: 2 }}></div>
          </Glow>
        ))}
      </div>

      {/* Smart insight cards */}
      <h3 className="card-title mb-12">สิ่งที่ควรรู้</h3>
      <div className="grid grid-2 mb-20" style={{ gap: 12 }}>
        {insights.map((it, i) => {
          const t = tone[it.level];
          return (
            <div key={i} className="card" style={{ borderLeft: `3px solid ${t.bd}`, padding: 16, cursor: it.route ? 'pointer' : 'default' }}
              onClick={() => it.route && setState({ route: it.route })}>
              <div className="row gap-12" style={{ alignItems: 'flex-start' }}>
                <div style={{ width: 32, height: 32, borderRadius: 8, background: t.bg, color: t.ink, display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name={it.icon} size={16} /></div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="medium" style={{ fontSize: 13.5 }}>{it.title}</div>
                  <div className="text-xs muted mt-2" style={{ lineHeight: 1.5 }}>{it.body}</div>
                  {it.action && <div className="text-xs medium mt-4" style={{ color: t.ink }}>{it.action} →</div>}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Budget burn per department */}
      <div className="grid" style={{ gridTemplateColumns: '1.4fr 1fr', gap: 16, marginBottom: 20 }}>
        <div className="card card-pad">
          <div className="spread mb-16">
            <div>
              <h3 className="card-title">งบประมาณตามแผนก</h3>
              <div className="card-sub mt-2">เปรียบเทียบยอดใช้กับงบที่ตั้งไว้ — เรียงตาม %</div>
            </div>
            <span className="text-xs muted en">FY 2026</span>
          </div>
