const ApprovalsPage = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const [filter, setFilter] = usePersistedState('approvals.filter', 'mine');
  const [sortBy, setSortBy] = usePersistedState('approvals.sort', 'urgency');
  const all = state.requests.filter(r => r.status === 'pending');
  const mine = all.filter(r => canApproveStep(r.flow[r.currentStep], currentUser.id));
  const mineUrgent = mine.filter(r => r.priority === 'high' || r.priority === 'critical');
  let list = filter === 'mine' ? mine : filter === 'urgent' ? mineUrgent : all;
  const PRIO_W_AP = { critical: 4, high: 3, normal: 2, low: 1 };
  if (sortBy === 'urgency') {
    const score = (r) => { const s = slaInfo(r.dueDate); return s ? (s.level === 'overdue' ? -1000 - s.days : s.days) : 9999; };
    list = [...list].sort((a, b) => score(a) - score(b));
  } else if (sortBy === 'amount') {
    list = [...list].sort((a, b) => (b.amount || 0) - (a.amount || 0));
  } else if (sortBy === 'priority') {
    list = [...list].sort((a, b) => (PRIO_W_AP[b.priority] || 0) - (PRIO_W_AP[a.priority] || 0));
  }
  // เรียง: ด่วนขึ้นบนสุดเสมอ (เว้นแต่ user เลือก sort อื่นที่ override)
  if (filter !== 'urgent' && sortBy !== 'priority') {
    list = [...list].sort((a, b) => {
      const ah = (a.priority === 'high' || a.priority === 'critical') ? 1 : 0;
      const bh = (b.priority === 'high' || b.priority === 'critical') ? 1 : 0;
      return bh - ah;
    });
  }
  const [selected, setSelected] = React.useState(new Set());
  const [rejectModal, setRejectModal] = React.useState(false);
  const [rejectReason, setRejectReason] = React.useState('');
  const toggleSelected = (id) => { const next = new Set(selected); next.has(id) ? next.delete(id) : next.add(id); setSelected(next); };

  const bulkApprove = () => {
    const snapshot = { requests: state.requests, activities: state.activities };
    // 🐛FIX: เดิมไม่เช็คสิทธิ์ — ใครก็ได้เลือกทั้งหมดใน tab "ทั้งหมด" แล้วอนุมัติแทน ผอ./CEO ได้
    const approvableIds = new Set([...selected].filter(id => { const r = state.requests.find(x => x.id === id); return r && canApproveStep(r.flow[r.currentStep], currentUser.id); }));
    if (approvableIds.size === 0) { window.toast('ไม่มีรายการที่คุณมีสิทธิ์อนุมัติในที่เลือก', { level: 'warning' }); return; }
    const skipped = selected.size - approvableIds.size;
    const count = approvableIds.size;
    const next = state.requests.map(r => {
      if (!approvableIds.has(r.id)) return r;
      const newFlow = [...r.flow];
      newFlow[r.currentStep] = { ...newFlow[r.currentStep], status: 'approved', at: nowTh(), approvedBy: currentUser.id, signature: getSignature(currentUser.id) || '' };
      const n = r.currentStep + 1;
      return { ...r, flow: newFlow, currentStep: n, status: n >= r.flow.length ? 'progress' : 'pending' };
    });
    const acts = [...approvableIds].map(id => ({ at: nowTh(), user: currentUser.id, action: 'approve', refId: id, summary: 'อนุมัติคำขอ (bulk)' }));
    setState({ requests: next, activities: [...acts, ...state.activities] });
    setSelected(new Set());
    window.toast(`อนุมัติ ${count} คำขอเรียบร้อย${skipped > 0 ? ` (ข้าม ${skipped} รายการที่ไม่มีสิทธิ์)` : ''}`, { level: 'success', duration: 8000, action: { label: 'ย้อน', onClick: () => { setState(snapshot); window.toast('ยกเลิกการอนุมัติแล้ว', { level: 'info' }); } } });
  };
  const bulkReject = () => {
    if (!rejectReason.trim()) return;
    const snapshot = { requests: state.requests, activities: state.activities };
    // 🐛FIX: เช็คสิทธิ์เหมือน bulkApprove
    const rejectableIds = new Set([...selected].filter(id => { const r = state.requests.find(x => x.id === id); return r && canApproveStep(r.flow[r.currentStep], currentUser.id); }));
    if (rejectableIds.size === 0) { window.toast('ไม่มีรายการที่คุณมีสิทธิ์ปฏิเสธในที่เลือก', { level: 'warning' }); setRejectModal(false); return; }
    const count = rejectableIds.size;
    const next = state.requests.map(r => {
      if (!rejectableIds.has(r.id)) return r;
      const newFlow = [...r.flow];
      newFlow[r.currentStep] = { ...newFlow[r.currentStep], status: 'rejected', at: nowTh(), comment: rejectReason };
      return { ...r, flow: newFlow, status: 'rejected' };
    });
    const acts = [...rejectableIds].map(id => ({ at: nowTh(), user: currentUser.id, action: 'reject', refId: id, summary: 'ปฏิเสธคำขอ (bulk): ' + rejectReason }));
    setState({ requests: next, activities: [...acts, ...state.activities] });
    setSelected(new Set()); setRejectModal(false); setRejectReason('');
    window.toast(`ปฏิเสธ ${count} คำขอแล้ว`, { level: 'warning', duration: 8000, action: { label: 'ย้อน', onClick: () => { setState(snapshot); window.toast('ยกเลิกการปฏิเสธแล้ว', { level: 'info' }); } } });
  };

  const exportCSV = () => {
    const rows = [['ID', 'ประเภท', 'หัวข้อ', 'ผู้ขอ', 'แผนก', 'ยอด', 'ขั้นปัจจุบัน', 'ผู้พิจารณา', 'วันสร้าง', 'ครบกำหนด', 'สถานะ SLA']];
    list.forEach(r => {
      const u = state.users[r.requester]; const approver = state.users[r.flow[r.currentStep]?.userId];
      const sla = slaInfo(r.dueDate);
      rows.push([r.id, TYPE_LABEL[r.type]?.th || r.type, r.title, u?.name || '', u?.dept || '', r.amount || 0, `${r.currentStep + 1}/${r.flow.length} ${r.flow[r.currentStep]?.role || ''}`, approver?.name || '', r.createdAt, r.dueDate, sla?.label || '']);
    });
    downloadCSV(`รออนุมัติ-${nowTh().replace(/[/:\s]/g, '-')}.csv`, rows);
  };

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">รออนุมัติ</h1><div className="page-sub">{mine.length > 0 ? <>มี <span style={{color:'var(--red-ink)'}} className="medium">{mine.length}</span> รายการรออนุมัติของคุณ</> : 'ไม่มีคำขอรออนุมัติของคุณ'}</div></div>
        <div className="row gap-8">
          {selected.size > 0 && (<>
            <span className="text-sm muted">{selected.size} รายการ</span>
            <button className="btn btn-ghost btn-sm" onClick={() => setSelected(new Set())}>ยกเลิก</button>
            <button className="btn btn-danger btn-sm" onClick={() => setRejectModal(true)}><Icon name="x" size={13} /> ปฏิเสธ</button>
            <button className="btn btn-success btn-sm" onClick={bulkApprove}><Icon name="check" size={13} /> อนุมัติทั้งหมด</button>
          </>)}
          <button className="btn btn-outline btn-sm" onClick={exportCSV} disabled={list.length === 0}><Icon name="download" size={13} /> ส่งออก CSV</button>
        </div>
      </div>
      <div className="row spread mb-12">
        <div className="tabs" style={{ margin: 0 }}>
          <button className={`tab ${filter === 'mine' ? 'active' : ''}`} onClick={() => setFilter('mine')}>ของฉัน <span className="tab-count">{mine.length}</span></button>
          {mineUrgent.length > 0 && <button className={`tab ${filter === 'urgent' ? 'active' : ''}`} onClick={() => setFilter('urgent')} style={{ color: 'var(--red-ink)', fontWeight: 600 }}>⚡ ด่วน <span className="tab-count" style={{ background: 'var(--red)', color: 'white' }}>{mineUrgent.length}</span></button>}
          <button className={`tab ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>ทั้งหมด <span className="tab-count">{all.length}</span></button>
        </div>
        <div className="row gap-6">
          <span className="text-xs muted">เรียงตาม:</span>
          <select className="select" style={{ height: 30, fontSize: 12, width: 130 }} value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="urgency">ความเร่งด่วน (SLA)</option>
            <option value="priority">ระดับ Priority</option>
            <option value="amount">ยอดเงิน</option>
            <option value="created">วันที่สร้าง</option>
          </select>
        </div>
      </div>
      <div className="card" style={{ overflow: 'hidden' }}>
        {list.length === 0 ? <div style={{ padding: 40 }}><Empty icon="check" title="ไม่มีคำขอรออนุมัติ" sub="ทุกอย่างเดินหน้าได้" /></div> : (
          <table className="table"><thead><tr>
            <th style={{ width: 36 }}><input type="checkbox" checked={selected.size > 0 && selected.size === list.filter(r => canApproveStep(r.flow[r.currentStep], currentUser.id)).length} onChange={() => { const mine = list.filter(r => canApproveStep(r.flow[r.currentStep], currentUser.id)); if (selected.size === mine.length && mine.length > 0) setSelected(new Set()); else setSelected(new Set(mine.map(r => r.id))); }} title="เลือกเฉพาะรายการที่คุณมีสิทธิ์อนุมัติ" /></th>
            <th>คำขอ</th><th>ผู้ขอ</th><th>ประเภท</th><th>ยอด</th><th>ขั้น</th><th>ครบกำหนด · SLA</th><th></th>
          </tr></thead><tbody>
            {(() => {
              const renderRow = (r, opts = {}) => {
                const u = state.users[r.requester];
                const isUrgent = r.priority === 'high' || r.priority === 'critical';
                return (
                  <tr key={r.id} className="clickable" onClick={() => setState({ route: 'detail', selectedId: r.id })} style={{ background: isUrgent ? 'color-mix(in oklch, var(--red) 5%, var(--surface))' : undefined, borderLeft: isUrgent ? '3px solid var(--red)' : undefined }}>
                    <td onClick={(e) => e.stopPropagation()}><input type="checkbox" checked={selected.has(r.id)} onChange={() => toggleSelected(r.id)} /></td>
                    <td><div className="row gap-12"><TypeIcon type={r.type} size={28} /><div><div className="row gap-8"><span className="en tnum text-xs muted">{r.id}</span>{isUrgent && <span style={{ fontSize: 11, color: 'var(--red-ink)', fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: 2 }}><Icon name="flame" size={11} /> {r.priority === 'critical' ? 'วิกฤต' : 'เร่งด่วน'}{r.autoUrgent && ' ⚡'}</span>}</div><div className="medium" style={{ fontSize: 13 }}>{r.title}</div></div></div></td>
                    <td><div className="row gap-8"><Avatar user={u} size="sm" /><div className="text-sm">{u?.name.split(' ')[0]}</div></div></td>
                    <td><TypeBadge type={r.type} /></td>
                    <td className="num-cell">{fmtBaht(r.amount)}</td>
                    <td className="num-cell text-sm"><div>{r.currentStep + 1}/{r.flow.length}</div><div className="text-xs muted">{r.flow[r.currentStep]?.role}</div></td>
                    <td className="text-sm"><div className="col gap-2"><span className="num-cell">{r.dueDate}</span><SLABadge dueDate={r.dueDate} compact /></div></td>
                    <td><Icon name="chevronRight" size={14} className="muted-2" /></td>
                  </tr>
                );
              };
              const urgentList = list.filter(r => r.priority === 'high' || r.priority === 'critical');
              const normalList = list.filter(r => !(r.priority === 'high' || r.priority === 'critical'));
              const split = filter !== 'urgent' && urgentList.length > 0 && normalList.length > 0;
              if (!split) return list.map(r => renderRow(r));
              return (
                <>
                  <tr><td colSpan={8} style={{ background: 'var(--red)', color: 'white', padding: '8px 12px', fontSize: 12, fontWeight: 700 }}>⚡ ด่วน · {urgentList.length}</td></tr>
                  {urgentList.map(r => renderRow(r))}
                  <tr><td colSpan={8} style={{ background: 'var(--ink-3)', color: 'white', padding: '8px 12px', fontSize: 12, fontWeight: 700 }}>ปกติ · {normalList.length}</td></tr>
                  {normalList.map(r => renderRow(r))}
                </>
              );
            })()}
          </tbody></table>
        )}
      </div>

      <Modal open={rejectModal} onClose={() => setRejectModal(false)} title={`ปฏิเสธคำขอ ${selected.size} รายการ`}
        footer={<><button className="btn btn-outline" onClick={() => setRejectModal(false)}>ยกเลิก</button><button className="btn btn-danger" onClick={bulkReject} disabled={!rejectReason.trim()}><Icon name="x" size={13} /> ยืนยันปฏิเสธ</button></>}>
        <div className="col gap-12">
          <div className="alert alert-amber"><Icon name="warning" size={14} style={{ marginTop: 1 }} /><div className="text-sm">คำขอที่ปฏิเสธจะถูกตีกลับให้ผู้ขอแก้ไข — กรุณาระบุเหตุผลให้ชัดเจน</div></div>
          <div className="field"><label className="field-label">เหตุผล <span className="req">*</span></label>
            <textarea className="textarea" placeholder="ระบุเหตุผลในการปฏิเสธทั้งหมด..." value={rejectReason} onChange={e => setRejectReason(e.target.value)} style={{ minHeight: 100 }} />
          </div>
        </div>
      </Modal>
    </div>
  );
};

const MyRequestsPage = ({ ctx }) => {
  const { state, setState, currentUser } = ctx;
  const [filter, setFilter] = usePersistedState('myreq.status', 'all');
  const [type, setType] = usePersistedState('myreq.type', 'all');
  const [search, setSearch] = React.useState('');
  const [compareIds, setCompareIds] = React.useState([]);
  const [compareOpen, setCompareOpen] = React.useState(false);
  // Advanced filters
  const [dateFrom, setDateFrom] = React.useState('');
  const [dateTo, setDateTo] = React.useState('');
  const [amountMin, setAmountMin] = React.useState('');
  const [amountMax, setAmountMax] = React.useState('');
  const [sortBy, setSortBy] = usePersistedState('myreq.sortBy', 'newest');
  const [advancedOpen, setAdvancedOpen] = React.useState(false);
  let list = state.requests.filter(r => r.requester === currentUser.id);
  if (filter === 'urgent') list = list.filter(r => (r.priority === 'high' || r.priority === 'critical') && (r.status === 'pending' || r.status === 'progress'));
  else if (filter !== 'all') list = list.filter(r => r.status === filter);
  if (type !== 'all') list = list.filter(r => r.type === type);
  if (search.trim()) {
    const q = search.toLowerCase();
    list = list.filter(r => (r.id + r.title + (r.purpose || '')).toLowerCase().includes(q));
  }
  // Date range filter (on createdAt)
  if (dateFrom) {
    const fd = new Date(dateFrom);
    list = list.filter(r => { const d = parseTh(r.createdAt); return d && d >= fd; });
  }
  if (dateTo) {
    const td = new Date(dateTo); td.setHours(23, 59, 59, 999);
    list = list.filter(r => { const d = parseTh(r.createdAt); return d && d <= td; });
  }
  // Amount range filter
  if (amountMin !== '') list = list.filter(r => (r.amount || 0) >= Number(amountMin));
  if (amountMax !== '') list = list.filter(r => (r.amount || 0) <= Number(amountMax));
  // Sort
  const sortedList = [...list].sort((a, b) => {
    if (sortBy === 'newest') { const ad = parseTh(a.createdAt)?.getTime() || 0; const bd = parseTh(b.createdAt)?.getTime() || 0; return bd - ad; }
    if (sortBy === 'oldest') { const ad = parseTh(a.createdAt)?.getTime() || 0; const bd = parseTh(b.createdAt)?.getTime() || 0; return ad - bd; }
    if (sortBy === 'amount-desc') return (b.amount || 0) - (a.amount || 0);
    if (sortBy === 'amount-asc') return (a.amount || 0) - (b.amount || 0);
    if (sortBy === 'deadline') { const ad = parseTh(a.dueDate)?.getTime() || Infinity; const bd = parseTh(b.dueDate)?.getTime() || Infinity; return ad - bd; }
    if (sortBy === 'priority') {
      const w = { critical: 4, high: 3, normal: 2, low: 1 };
      return (w[b.priority] || 0) - (w[a.priority] || 0);
    }
    return 0;
  });
  list = sortedList;
  const activeFilters = [filter !== 'all', type !== 'all', search.trim(), dateFrom, dateTo, amountMin, amountMax].filter(Boolean).length;
  const clearFilters = () => { setFilter('all'); setType('all'); setSearch(''); setDateFrom(''); setDateTo(''); setAmountMin(''); setAmountMax(''); };

  const toggleCompare = (id) => {
    setCompareIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : prev.length >= 3 ? prev : [...prev, id]);
  };
  const compareReqs = compareIds.map(id => state.requests.find(r => r.id === id)).filter(Boolean);

  const counts = {
    all: state.requests.filter(r => r.requester === currentUser.id).length,
    urgent: state.requests.filter(r => r.requester === currentUser.id && (r.priority === 'high' || r.priority === 'critical') && (r.status === 'pending' || r.status === 'progress')).length,
    pending: state.requests.filter(r => r.requester === currentUser.id && r.status === 'pending').length,
    progress: state.requests.filter(r => r.requester === currentUser.id && r.status === 'progress').length,
    rejected: state.requests.filter(r => r.requester === currentUser.id && r.status === 'rejected').length,
    revision: state.requests.filter(r => r.requester === currentUser.id && r.status === 'revision').length,
  };

  const exportCSV = () => {
    const rows = [['ID', 'ประเภท', 'หัวข้อ', 'ยอด', 'สถานะ', 'ขั้น', 'วันสร้าง', 'ครบกำหนด', 'SLA']];
    list.forEach(r => {
      const sla = slaInfo(r.dueDate);
      rows.push([r.id, TYPE_LABEL[r.type]?.th || r.type, r.title, r.amount || 0, STATUS_LABEL[r.status]?.th || r.status, `${r.currentStep + 1}/${r.flow.length}`, r.createdAt, r.dueDate, sla?.label || '']);
    });
    downloadCSV(`คำขอของฉัน-${nowTh().replace(/[/:\s]/g, '-')}.csv`, rows);
  };

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">คำขอของฉัน</h1><div className="page-sub">รายการคำขอที่คุณส่งเข้าระบบ — {counts.all} รายการทั้งหมด</div></div>
        <div className="row gap-8">
          {compareIds.length >= 2 && <button className="btn btn-primary btn-sm" onClick={() => setCompareOpen(true)}><Icon name="copy" size={13} /> เทียบ {compareIds.length}</button>}
          {compareIds.length > 0 && <button className="btn btn-ghost btn-sm" onClick={() => setCompareIds([])}>ยกเลิก</button>}
          <button className="btn btn-outline btn-sm" onClick={exportCSV} disabled={list.length === 0}><Icon name="download" size={13} /> CSV</button>
          <button className="btn btn-primary" onClick={() => setState({ createOpen: true })}><Icon name="plus" size={14} /> สร้างคำขอ</button>
        </div>
      </div>
      <div className="card card-pad mb-12">
        <div className="row gap-12 flex-wrap" style={{ alignItems: 'center' }}>
          <div className="search" style={{ flex: 1, minWidth: 200, maxWidth: 320 }}>
            <Icon name="search" size={14} className="search-icon" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหา ID, หัวข้อ, รายละเอียด..." />
          </div>
          <select className="select" style={{ height: 32, fontSize: 12, padding: '0 10px', maxWidth: 200 }} value={sortBy} onChange={(e) => setSortBy(e.target.value)} title="เรียงลำดับ">
            <option value="newest">📅 ใหม่สุด</option>
            <option value="oldest">📅 เก่าสุด</option>
            <option value="amount-desc">฿ ยอดสูง→ต่ำ</option>
            <option value="amount-asc">฿ ยอดต่ำ→สูง</option>
            <option value="deadline">⏰ ครบกำหนดเร็วสุด</option>
            <option value="priority">⚡ ด่วนก่อน</option>
          </select>
          <button className={`btn btn-outline btn-sm ${advancedOpen || activeFilters > 0 ? '' : ''}`} onClick={() => setAdvancedOpen(!advancedOpen)} style={advancedOpen ? { background: 'var(--brand-soft)', borderColor: 'var(--brand)' } : {}}>
            <Icon name="filter" size={12} /> ตัวกรอง{activeFilters > 0 && <span className="badge badge-brand" style={{ marginLeft: 6 }}>{activeFilters}</span>}
          </button>
          {activeFilters > 0 && <button className="btn btn-ghost btn-sm" onClick={clearFilters} style={{ color: 'var(--red-ink)' }}><Icon name="x" size={11} /> ล้าง</button>}
          <span className="text-xs muted" style={{ marginLeft: 'auto' }}>{list.length} จาก {counts.all} รายการ</span>
        </div>
        {advancedOpen && (
          <div className="grid grid-4 mt-12" style={{ gap: 12, paddingTop: 12, borderTop: '1px solid var(--border)' }}>
            <div className="field">
              <label className="field-label">วันที่สร้าง — ตั้งแต่</label>
              <input type="date" className="input" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} />
            </div>
            <div className="field">
              <label className="field-label">วันที่สร้าง — ถึง</label>
              <input type="date" className="input" value={dateTo} onChange={(e) => setDateTo(e.target.value)} />
            </div>
            <div className="field">
              <label className="field-label">มูลค่า ตั้งแต่ (บาท)</label>
              <input type="number" className="input" value={amountMin} onChange={(e) => setAmountMin(e.target.value)} placeholder="0" />
            </div>
            <div className="field">
              <label className="field-label">มูลค่า ถึง (บาท)</label>
              <input type="number" className="input" value={amountMax} onChange={(e) => setAmountMax(e.target.value)} placeholder="∞" />
            </div>
          </div>
        )}
      </div>
      <div className="row gap-8 mb-16 flex-wrap">
        <span className="text-xs muted en" style={{ marginRight: 4 }}>STATUS</span>
        {[['all','ทั้งหมด',counts.all],['urgent','⚡ ด่วน',counts.urgent],['pending','รออนุมัติ',counts.pending],['revision','↩ ตีกลับ',counts.revision],['progress','กำลังดำเนินการ',counts.progress],['rejected','ปฏิเสธ',counts.rejected]].map(([k,lbl,n]) => {
          if ((k === 'urgent' || k === 'revision') && n === 0) return null;
          const isUrgentChip = k === 'urgent';
          return (
            <button key={k} className={`chip ${filter === k ? 'active' : ''}`} onClick={() => setFilter(k)} style={isUrgentChip ? { color: filter === k ? 'white' : 'var(--red-ink)', background: filter === k ? 'var(--red)' : undefined, borderColor: 'var(--red)' } : undefined}>{lbl}{n > 0 && <span className="en tnum" style={{ marginLeft: 5, opacity: 0.85 }}>{n}</span>}</button>
          );
        })}
        <span className="divider-v" style={{ height: 18, margin: '0 8px' }}></span>
        <span className="text-xs muted en" style={{ marginRight: 4 }}>TYPE</span>
        {[['all','ทั้งหมด'],['event','อีเว้นท์'],['general','อนุมัติทั่วไป'],['purchase','จัดซื้อ'],['overtime','OT'],['leave','ใบลา'],['withdrawal','เบิกตัดขาด'],['borrow','ยืม-คืน'],['expense','เบิกเงิน']].map(([k,lbl]) => (
          <button key={k} className={`chip ${type === k ? 'active' : ''}`} onClick={() => setType(k)}>{lbl}</button>
        ))}
      </div>
      <div className="card" style={{ overflow: 'hidden' }}>
        {list.length === 0 ? <div style={{ padding: 40 }}><Empty title="ไม่มีคำขอตามตัวกรอง" sub={search ? 'ลองเปลี่ยนคำค้นหา' : 'กดสร้างคำขอใหม่เพื่อเริ่ม'} /></div>
          : list.map(r => (
            <div key={r.id} style={{ display: 'flex', alignItems: 'stretch', borderBottom: '1px solid var(--border)' }}>
              <label style={{ padding: '0 14px', display: 'flex', alignItems: 'center', cursor: 'pointer', background: compareIds.includes(r.id) ? 'var(--brand-soft)' : 'transparent' }} onClick={(e) => e.stopPropagation()} title="เลือกเพื่อเปรียบเทียบ">
                <input type="checkbox" checked={compareIds.includes(r.id)} onChange={() => toggleCompare(r.id)} disabled={!compareIds.includes(r.id) && compareIds.length >= 3} />
              </label>
              <div style={{ flex: 1, minWidth: 0 }}>
                <RequestRow req={r} users={state.users} onClick={() => setState({ route: 'detail', selectedId: r.id })} showRequester={false} />
              </div>
            </div>
          ))
        }
      </div>

      <Modal open={compareOpen} onClose={() => setCompareOpen(false)} wide title={`เปรียบเทียบคำขอ (${compareReqs.length})`}
        footer={<><button className="btn btn-outline" onClick={() => setCompareOpen(false)}>ปิด</button><button className="btn btn-primary" onClick={() => { setCompareOpen(false); setCompareIds([]); }}>เคลียร์การเลือก</button></>}>
        <div style={{ overflowX: 'auto' }}>
          <table className="table">
            <thead><tr>
              <th>หัวข้อ</th>
              {compareReqs.map(r => <th key={r.id} style={{ minWidth: 220 }}><div className="col gap-4"><span className="en text-xs muted">{r.id}</span><TypeBadge type={r.type} /></div></th>)}
            </tr></thead>
            <tbody>
              <tr><td className="muted text-xs">ชื่อ</td>{compareReqs.map(r => <td key={r.id} className="medium text-sm">{r.title}</td>)}</tr>
              <tr><td className="muted text-xs">สถานะ</td>{compareReqs.map(r => <td key={r.id}><StatusBadge status={r.status} /></td>)}</tr>
              <tr><td className="muted text-xs">มูลค่า</td>{compareReqs.map(r => { const max = Math.max(...compareReqs.map(x => x.amount || 0)); const isMax = r.amount === max && max > 0; return <td key={r.id} className="num-cell" style={{ color: isMax ? 'var(--red-ink)' : 'var(--ink)', fontWeight: isMax ? 600 : 400 }}>{fmtBaht(r.amount)}{isMax && compareReqs.length > 1 && <span className="text-xs muted en"> (สูงสุด)</span>}</td>; })}</tr>
              <tr><td className="muted text-xs">วันสร้าง</td>{compareReqs.map(r => <td key={r.id} className="text-sm">{r.createdAt}</td>)}</tr>
              <tr><td className="muted text-xs">ครบกำหนด</td>{compareReqs.map(r => <td key={r.id} className="text-sm"><div className="col gap-2"><span>{r.dueDate}</span><SLABadge dueDate={r.dueDate} compact /></div></td>)}</tr>
              <tr><td className="muted text-xs">ขั้นปัจจุบัน</td>{compareReqs.map(r => <td key={r.id} className="text-sm">{r.currentStep + 1} / {r.flow.length}<div className="text-xs muted">{r.flow[r.currentStep]?.role}</div></td>)}</tr>
              <tr><td className="muted text-xs">ความเร่งด่วน</td>{compareReqs.map(r => <td key={r.id}>{r.priority === 'high' ? <span className="badge badge-red">เร่งด่วน</span> : <span className="text-xs muted">ปกติ</span>}</td>)}</tr>
              <tr><td className="muted text-xs">วัตถุประสงค์</td>{compareReqs.map(r => <td key={r.id} className="text-xs" style={{ verticalAlign: 'top' }}>{r.purpose}</td>)}</tr>
              <tr><td className="muted text-xs">เอกสารแนบ</td>{compareReqs.map(r => <td key={r.id} className="text-sm">{r.attachments} ไฟล์</td>)}</tr>
              <tr><td className="muted text-xs">ความคิดเห็น</td>{compareReqs.map(r => <td key={r.id} className="text-sm">{r.comments} ข้อความ</td>)}</tr>
            </tbody>
          </table>
        </div>
      </Modal>
    </div>
  );
};

Object.assign(window, { DashboardPage, ApprovalsPage, MyRequestsPage, RequestRow, DonutChart });
  </script>

  <!-- ===== Pages: Detail + Create ===== -->
  <script type="text/babel" data-presets="react">
const SEED_FILES = ['ใบเสนอราคา.pdf', 'สลิปโอนเงิน.jpg', 'ใบเสร็จ.pdf', 'รูปงานบูธ.jpg', 'รายงานยอดขาย.xlsx', 'เอกสารคืนของ.pdf', 'รายงานคืนสินค้า.xlsx', 'ภาพถ่ายงาน.jpg'];
const fileIcon = (name) => {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','png','gif','webp'].includes(ext)) return { icon: 'image', color: 'oklch(60% 0.16 25)' };
  if (['pdf'].includes(ext)) return { icon: 'file', color: 'oklch(55% 0.18 25)' };
  if (['xlsx','xls','csv'].includes(ext)) return { icon: 'file', color: 'oklch(55% 0.16 150)' };
  if (['doc','docx'].includes(ext)) return { icon: 'file', color: 'oklch(55% 0.16 240)' };
  return { icon: 'file', color: 'var(--ink-3)' };
};
const fmtFileSize = (b) => b < 1024 ? `${b} B` : b < 1024*1024 ? `${(b/1024).toFixed(1)} KB` : `${(b/1024/1024).toFixed(1)} MB`;

const AttachmentManager = ({ req, state, setState, currentUser }) => {
  // Seed initial files from req.attachments count if not present
  const initial = React.useMemo(() => {
    if (req.attachedFiles) return req.attachedFiles;
    const n = req.attachments || 0;
    return Array.from({ length: n }).map((_, i) => ({
      id: `${req.id}-f${i}`, name: SEED_FILES[i % SEED_FILES.length],
      size: 50000 + Math.floor(Math.random() * 0) + (i * 100000),
      uploadedBy: req.requester, uploadedAt: req.createdAt
    }));
  }, [req.id, req.attachedFiles, req.attachments, req.requester, req.createdAt]);

  const [dragOver, setDragOver] = React.useState(false);
  const inputRef = React.useRef(null);

  const updateFiles = (newFiles) => {
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, attachedFiles: newFiles, attachments: newFiles.length } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'import', refId: req.id, summary: `อัปโหลดไฟล์ ${newFiles.length - initial.length > 0 ? `${newFiles.length - initial.length} ไฟล์` : ''}` }, ...state.activities]
    });
  };

  const addFiles = (fileList) => {
    if (!fileList || fileList.length === 0) return;
    const newOnes = Array.from(fileList).map((f, i) => ({
      id: `${req.id}-f-${Date.now()}-${i}`,
      name: f.name, size: f.size,
      uploadedBy: currentUser.id, uploadedAt: nowTh()
    }));
    const next = [...initial, ...newOnes];
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, attachedFiles: next, attachments: next.length } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'import', refId: req.id, summary: `อัปโหลด ${newOnes.length} ไฟล์` }, ...state.activities]
    });
    window.toast(`อัปโหลด ${newOnes.length} ไฟล์เรียบร้อย`, { level: 'success' });
  };

  const removeFile = (id) => {
    const next = initial.filter(f => f.id !== id);
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, attachedFiles: next, attachments: next.length } : r)
    });
    window.toast('ลบไฟล์แล้ว', { level: 'info' });
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    addFiles(e.dataTransfer?.files);
  };

  return (
    <>
      <h3 className="card-title mt-24 mb-12 spread"><span><Icon name="paperclip" size={14} /> เอกสารแนบ ({initial.length})</span></h3>
      <div onDragOver={(e) => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={onDrop}
        style={{
          border: `2px dashed ${dragOver ? 'var(--brand)' : 'var(--border)'}`,
          background: dragOver ? 'var(--brand-soft)' : 'transparent',
          borderRadius: 10, padding: 14, transition: 'all 0.15s', marginBottom: 12
        }}>
        <input ref={inputRef} type="file" multiple style={{ display: 'none' }} onChange={(e) => { addFiles(e.target.files); e.target.value = ''; }} />
        <div className="row gap-12" style={{ alignItems: 'center', justifyContent: 'center', padding: 8 }}>
          <Icon name="upload" size={18} style={{ color: 'var(--brand-ink)' }} />
          <div>
            <div className="text-sm medium">ลากไฟล์มาวางที่นี่ หรือ <button className="btn btn-ghost btn-sm" style={{ height: 24, padding: '2px 8px', color: 'var(--brand-ink)' }} onClick={() => inputRef.current?.click()}>เลือกไฟล์</button></div>
            <div className="text-xs muted mt-2">รองรับ PDF, รูปภาพ, Excel, Word — ขนาดไม่เกิน 10MB</div>
          </div>
        </div>
      </div>
      {initial.length === 0 ? <div className="text-xs muted center" style={{ padding: 16 }}>ยังไม่มีเอกสารแนบ</div> : (
        <div className="grid grid-3">
          {initial.map(f => {
            const ic = fileIcon(f.name);
            const u = state.users[f.uploadedBy];
            return (
              <div key={f.id} className="row gap-10" style={{ padding: 10, border: '1px solid var(--border)', borderRadius: 8, background: 'var(--surface-2)', position: 'relative' }}>
                <div style={{ width: 36, height: 36, background: 'var(--brand-soft)', color: ic.color, borderRadius: 6, display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name={ic.icon} size={16} /></div>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div className="text-sm medium" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={f.name}>{f.name}</div>
                  <div className="text-xs muted">{fmtFileSize(f.size)} · {u?.name?.split(' ')[0] || 'ระบบ'}</div>
                </div>
                <button className="btn btn-ghost btn-sm btn-icon-only" onClick={() => removeFile(f.id)} title="ลบ" style={{ width: 24, height: 24 }}><Icon name="x" size={11} /></button>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
};

// ===== เอกสารใบขออนุมัติ พร้อมลายเซ็นดิจิตอล =====
const RequestDocument = ({ req, state, onClose }) => {
  const requester = state.users[req.requester];
  const allApproved = req.flow.every(s => s.status === 'approved');
  const anyRejected = req.flow.some(s => s.status === 'rejected');
  const typeLabel = TYPE_LABEL[req.type]?.th || req.type;
  const print = () => window.print();
  return (
    <div className="modal-backdrop no-print" onClick={onClose}>
      <div className="modal modal-wide" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 860 }}>
        <div className="modal-head no-print">
          <h3 className="modal-title"><Icon name="file" size={16} /> เอกสารใบขออนุมัติ — {req.id}</h3>
          <div className="row gap-8">
            <button className="btn btn-primary btn-sm" onClick={print}><Icon name="print" size={13} /> พิมพ์ / Save PDF</button>
            <button className="btn btn-ghost btn-icon-only" onClick={onClose}><Icon name="x" size={14} /></button>
          </div>
        </div>
        <div className="modal-body" style={{ background: 'white', padding: 0 }}>
          <div id="print-doc" style={{ padding: '40px 48px', background: 'white', color: '#1a1a1a', fontFamily: 'var(--font-th)' }}>
            {/* Header */}
            <div style={{ borderBottom: '3px double #1a1a1a', paddingBottom: 14, marginBottom: 18 }}>
              <div className="row spread">
                <div>
                  <div style={{ fontWeight: 700, fontSize: 20 }}>บริษัท เฮลท์เวลล์ จำกัด</div>
                  <div style={{ fontSize: 12, color: '#555' }}>HealthWell Co., Ltd. · FlowDesk Work Request System</div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: 11, color: '#666' }}>เลขที่เอกสาร</div>
                  <div className="en" style={{ fontWeight: 700, fontSize: 18, letterSpacing: '0.04em' }}>{req.id}</div>
                </div>
              </div>
            </div>

            {/* Document Title */}
            <div style={{ textAlign: 'center', marginBottom: 24 }}>
              <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 4 }}>ใบขออนุมัติ {typeLabel}</div>
              <div style={{ fontSize: 12, color: '#666' }}>วันที่สร้าง: {req.createdAt}</div>
              <div style={{ marginTop: 8 }}>
                {anyRejected ? (
                  <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: 4, background: '#fee', color: '#b91c1c', fontWeight: 600, fontSize: 13, border: '1px solid #f4b8b8' }}>✕ ถูกปฏิเสธ</span>
                ) : allApproved ? (
                  <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: 4, background: '#ecfdf5', color: '#047857', fontWeight: 600, fontSize: 13, border: '1px solid #a7f3d0' }}>✓ อนุมัติครบทุกขั้น</span>
                ) : (
                  <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: 4, background: '#fffbeb', color: '#b45309', fontWeight: 600, fontSize: 13, border: '1px solid #fde68a' }}>⏳ อยู่ระหว่างพิจารณา (ขั้นที่ {req.currentStep + 1}/{req.flow.length})</span>
                )}
              </div>

const BorrowItemsTable = ({ req, state, setState, currentUser }) => {
  const [editing, setEditing] = React.useState(false);
  const [drafts, setDrafts] = React.useState(() => req.items.map(it => ({ sold: it.sold || 0, returned: it.returned || 0, bonus: it.bonus || 0 })));
  const canEdit = req.type === 'borrow' && req.status === 'progress' && req.pendingClear &&
    (req.requester === currentUser.id || currentUser.deptKey === 'warehouse' || currentUser.deptKey === 'accounting');

  const setDraft = (i, patch) => setDrafts(d => d.map((x, idx) => idx === i ? { ...x, ...patch } : x));
  const startEdit = () => { setDrafts(req.items.map(it => ({ sold: it.sold || 0, returned: it.returned || 0, bonus: it.bonus || 0 }))); setEditing(true); };
  const cancelEdit = () => setEditing(false);
  const save = () => {
    const newItems = req.items.map((it, i) => {
      const max = it.qty;
      const sold = Math.max(0, Math.min(max, Number(drafts[i].sold) || 0));
      const returned = Math.max(0, Math.min(max - sold, Number(drafts[i].returned) || 0));
      const bonus = Math.max(0, Math.min(max - sold - returned, Number(drafts[i].bonus) || 0));
      return { ...it, sold, returned, bonus };
    });
    const allCleared = newItems.every(it => (it.sold + it.returned + it.bonus) >= it.qty);
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, items: newItems, pendingClear: !allCleared, lastActivity: 'อัปเดตยอด' } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'import', refId: req.id, summary: 'บันทึกยอด ขาย/คืน/แถม' }, ...state.activities]
    });
    setEditing(false);
  };

  return (
    <>
      <div className="spread mt-24 mb-12">
        <h3 className="card-title">รายการสินค้า</h3>
        {canEdit && !editing && <button className="btn btn-outline btn-sm" onClick={startEdit}><Icon name="edit" size={12} /> บันทึกการขาย/คืน/แถม</button>}
        {editing && <div className="row gap-6"><button className="btn btn-outline btn-sm" onClick={cancelEdit}>ยกเลิก</button><button className="btn btn-success btn-sm" onClick={save}><Icon name="check" size={12} /> บันทึก</button></div>}
      </div>
      <table className="table">
        <thead><tr><th>SKU</th><th>สินค้า</th><th className="right">จำนวน</th>{req.type==='borrow' && <><th className="right" style={{width:80}}>ขาย</th><th className="right" style={{width:80}}>คืน</th><th className="right" style={{width:80}}>แถม</th><th style={{minWidth:140}}>ความคืบหน้า</th></>}<th className="right">มูลค่า</th></tr></thead>
        <tbody>
          {req.items.map((it, i) => {
            const p = state.products.find(p => p.sku === it.sku);
            const draft = drafts[i] || { sold: 0, returned: 0, bonus: 0 };
            const inputStyle = { height: 28, textAlign: 'right', padding: '2px 6px', fontSize: 12 };
            return (
              <tr key={i}>
                <td className="num-cell text-xs">{it.sku}</td>
                <td><div className="medium">{p?.nameTh}</div></td>
                <td className="num-cell right">{it.qty}</td>
                {req.type === 'borrow' && <>
                  <td className="num-cell right" style={{color:'var(--green-ink)'}}>
                    {editing ? <input className="input" style={inputStyle} type="number" min="0" max={it.qty} value={draft.sold} onChange={e => setDraft(i, { sold: e.target.value })} /> : (it.sold || 0)}
                  </td>
                  <td className="num-cell right" style={{color:'var(--blue-ink)'}}>
                    {editing ? <input className="input" style={inputStyle} type="number" min="0" max={it.qty} value={draft.returned} onChange={e => setDraft(i, { returned: e.target.value })} /> : (it.returned || 0)}
                  </td>
                  <td className="num-cell right" style={{color:'var(--violet-ink)'}}>
                    {editing ? <input className="input" style={inputStyle} type="number" min="0" max={it.qty} value={draft.bonus} onChange={e => setDraft(i, { bonus: e.target.value })} /> : (it.bonus || 0)}
                  </td>
                  <td><SplitProgress taken={it.qty} sold={editing ? Number(draft.sold)||0 : (it.sold||0)} returned={editing ? Number(draft.returned)||0 : (it.returned||0)} bonus={editing ? Number(draft.bonus)||0 : (it.bonus||0)}/></td>
                </>}
                <td className="num-cell right">{fmtBaht((p?.price || 0) * it.qty)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </>
  );
};

      req.amount > 0 ? `▸ มูลค่ารวม: ฿${req.amount.toLocaleString()}` : null,
      req.priority === 'high' ? `▸ ความเร่งด่วน: ★ เร่งด่วน` : null,
      ``,
      `วัตถุประสงค์:`,
      req.purpose,
      ``,
      req.breakdown && req.breakdown.length > 0 ? `รายการ:\n${req.breakdown.map(b => `• ${b.label}: ฿${(b.amount||0).toLocaleString()}`).join('\n')}\n` : null,
      `Approval Flow:`,
      req.flow.map((s, i) => `${i + 1}. ${s.role} — ${state.users[s.userId]?.name || s.userId} [${s.status === 'approved' ? '✓ อนุมัติแล้ว' : s.status === 'rejected' ? '✕ ปฏิเสธ' : s.status === 'pending' ? '⏳ รอพิจารณา' : '○ รอคิว'}]`).join('\n'),
      ``,
      `จึงเรียนมาเพื่อโปรดพิจารณา`,
      ``,
      `ขอบคุณครับ/ค่ะ`,
      `${currentUser.name} (${currentUser.roleTh})`,
      `--`,
      `FlowDesk - ระบบคำขออนุมัติ`
    ].filter(Boolean);
    const body = lines.join('\n');
    try {
      navigator.clipboard?.writeText(body);
      window.toast('คัดลอกเนื้อหา Email แล้ว — paste ลงในโปรแกรมส่งเมล', { level: 'success', duration: 6000 });
    } catch (e) {
      window.toast('ไม่สามารถคัดลอกได้ — เปิด Console ดูข้อความ', { level: 'warning' });
      console.log('EMAIL BODY:\n', body);
    }
  };

  // ===== Snooze — ซ่อนคำขอนี้จาก Inbox ของฉันจนถึงวันที่กำหนด =====
  const [snoozeOpen, setSnoozeOpen] = React.useState(false);
  const [snoozeUntil, setSnoozeUntil] = React.useState('');
  const currentSnoozeUntil = isSnoozedUntil(currentUser.id, req.id);
  const doSnooze = () => {
    if (!snoozeUntil) return;
    const d = new Date(snoozeUntil + 'T09:00:00');
    if (isNaN(d.getTime())) { window.toast('วันที่ไม่ถูกต้อง', { level: 'warning' }); return; }
    snoozeRequest(currentUser.id, req.id, d);
    setSnoozeOpen(false); setSnoozeUntil('');
    window.toast(`เลื่อนการแจ้งเตือนจนถึง ${d.toLocaleDateString('th-TH')}`, { level: 'info' });
  };
  const doUnsnooze = () => {
    unsnoozeRequest(currentUser.id, req.id);
    window.toast('ยกเลิกการเลื่อนแจ้งเตือน', { level: 'success' });
  };
  const snoozePresets = [
    { label: '1 ชั่วโมง', offset: 3600000 },
    { label: 'พรุ่งนี้เช้า', offset: () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d.getTime() - Date.now(); } },
    { label: '3 วัน', offset: 3 * 86400000 },
    { label: '1 สัปดาห์', offset: 7 * 86400000 }
  ];
  const quickSnooze = (preset) => {
    const ms = typeof preset.offset === 'function' ? preset.offset() : preset.offset;
    const d = new Date(Date.now() + ms);
    snoozeRequest(currentUser.id, req.id, d);
    setSnoozeOpen(false);
    window.toast(`เลื่อนแจ้งเตือน ${preset.label} → ${d.toLocaleString('th-TH')}`, { level: 'info' });
  };

  // ===== Link related requests — เชื่อมโยงคำขอที่เกี่ยวข้อง =====
  const [linkOpen, setLinkOpen] = React.useState(false);
  const [linkQuery, setLinkQuery] = React.useState('');
  const linkedIds = req.linkedTo || [];
  const linkedReqs = linkedIds.map(id => state.requests.find(r => r.id === id)).filter(Boolean);
  // คำขอที่ link มาที่ฉัน (reverse)
  const linkedFromOthers = state.requests.filter(r => (r.linkedTo || []).includes(req.id));
  const addLink = (targetId) => {
    if (targetId === req.id) return;
    const next = [...new Set([...linkedIds, targetId])];
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, linkedTo: next } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'comment', refId: req.id, summary: `เชื่อมโยงกับ ${targetId}` }, ...state.activities]
    });
    setLinkQuery('');
    window.toast(`เชื่อมกับ ${targetId} แล้ว`, { level: 'success' });
  };
  const removeLink = (targetId) => {
    const next = linkedIds.filter(id => id !== targetId);
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, linkedTo: next } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'comment', refId: req.id, summary: `ยกเลิกการเชื่อมโยงกับ ${targetId}` }, ...state.activities]
    });
  };
  const linkCandidates = state.requests
    .filter(r => r.id !== req.id && !linkedIds.includes(r.id))
    .filter(r => !linkQuery || (r.id + r.title).toLowerCase().includes(linkQuery.toLowerCase()))
    .slice(0, 10);

  // ===== Reschedule — เจ้าของเลื่อนวันครบกำหนด =====
  const [rescheduleOpen, setRescheduleOpen] = React.useState(false);
  const [newDueDate, setNewDueDate] = React.useState('');
  const [rescheduleReason, setRescheduleReason] = React.useState('');
  const canReschedule = isOwner && (req.status === 'pending' || req.status === 'progress');
  const doReschedule = () => {
    if (!newDueDate || !isValidThDate(newDueDate)) { window.toast('กรุณาเลือกวันที่ในรูปแบบที่ถูกต้อง', { level: 'warning' }); return; }
    const oldDate = req.dueDate;
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, dueDate: newDueDate, lastActivity: `เลื่อนกำหนด → ${newDueDate}` } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'comment', refId: req.id, summary: `เลื่อนกำหนดจาก ${oldDate} → ${newDueDate}${rescheduleReason ? ' · ' + rescheduleReason : ''}` }, ...state.activities]
    });
    setRescheduleOpen(false); setNewDueDate(''); setRescheduleReason('');
    window.toast(`เลื่อนกำหนดจาก ${oldDate} → ${newDueDate}`, { level: 'success' });
  };

  // ===== Priority bump — owner เปลี่ยนระดับความเร่งด่วน =====
  const PRIORITIES = [
    { key: 'low', th: 'ต่ำ', color: 'var(--ink-3)' },
    { key: 'normal', th: 'ปกติ', color: 'var(--blue)' },
    { key: 'high', th: 'เร่งด่วน', color: 'var(--amber)' },
    { key: 'critical', th: 'วิกฤต', color: 'var(--red)' }
  ];
  const canBumpPriority = isOwner && (req.status === 'pending' || req.status === 'progress');
  const isAutoUrgentLocked = !!req.autoUrgent;
  const [priorityOpen, setPriorityOpen] = React.useState(false);
  const setPriority = (newP) => {
    if (newP === req.priority) { setPriorityOpen(false); return; }
    // 🔒 ถ้าระบบบังคับด่วนอัตโนมัติ — ห้ามลด priority ต่ำกว่า high
    if (isAutoUrgentLocked && (newP === 'normal' || newP === 'low')) {
      window.toast('คำขอนี้บังคับด่วนอัตโนมัติ — ห้ามเปลี่ยนเป็นปกติ/ต่ำ (เพราะกำหนดวันเร็วกว่า SLA)', { level: 'warning', duration: 6000 });
      setPriorityOpen(false);
      return;
    }
    const fromLabel = PRIORITIES.find(p => p.key === req.priority)?.th || req.priority || 'ปกติ';
    const toLabel = PRIORITIES.find(p => p.key === newP)?.th || newP;
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, priority: newP, lastActivity: `เปลี่ยนความเร่งด่วน → ${toLabel}` } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'comment', refId: req.id, summary: `เปลี่ยนความเร่งด่วน: ${fromLabel} → ${toLabel}` }, ...state.activities]
    });
    setPriorityOpen(false);
    window.toast(`เปลี่ยนความเร่งด่วน → ${toLabel}`, { level: newP === 'critical' || newP === 'high' ? 'warning' : 'success' });
  };

  // ===== Detect current approver OOO =====
  const currentApproverIds = currentStep ? (currentStep.userIds || (currentStep.userId ? [currentStep.userId] : [])) : [];
  const oooApprovers = currentApproverIds.filter(id => isUserOOO(id)).map(id => ({ id, user: state.users[id], ooo: getOOO(id) }));

  // ===== Nudge — ส่งเตือนผู้อนุมัติคนปัจจุบัน (เจ้าของคำขอเท่านั้น) =====
  const lastNudgeKey = `fd-nudge-${req.id}`;
  const canNudge = isOwner && req.status === 'pending' && currentStep && currentStep.userId;
  const doNudge = () => {
    if (!canNudge) return;
    const last = parseInt(localStorage.getItem(lastNudgeKey) || '0', 10);
    if (Date.now() - last < 60 * 60 * 1000) {
      const mins = Math.ceil((60 * 60 * 1000 - (Date.now() - last)) / 60000);
      window.toast(`เพิ่งส่งเตือนไปไม่นาน — รออีก ${mins} นาที จึงจะส่งใหม่ได้`, { level: 'warning' });
      return;
    }
    localStorage.setItem(lastNudgeKey, String(Date.now()));
    const approverIds = currentStep.userIds || (currentStep.userId ? [currentStep.userId] : []);
    const names = approverIds.map(id => state.users[id]?.name?.split(' ')[0] || id).join(', ');
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, lastActivity: `เตือนผู้อนุมัติ (${nowTh()})`, nudgedAt: nowTh(), nudgeCount: (r.nudgeCount || 0) + 1 } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'comment', refId: req.id, summary: `ส่งเตือนผู้อนุมัติ: ${names}` }, ...state.activities]
    });
    window.toast(`ส่งเตือน ${names} เรียบร้อย`, { level: 'success' });
  };

  // ===== Save as Template — ผู้ใช้บันทึก request นี้เป็น template ของตัวเอง =====
  const [tplModal, setTplModal] = React.useState(false);
  const [tplName, setTplName] = React.useState('');
  const doSaveTemplate = () => {
    if (!tplName.trim()) return;
    const tpl = {
      id: 't-' + Date.now(),
      name: tplName.trim(),
      type: req.type,
      preset: {
        title: req.title,
        purpose: req.purpose,
        priority: req.priority,
        amount: req.amount,
        breakdown: req.breakdown,
        items: req.items,
        venue: req.venue,
        attendees: req.attendees,
        otStart: req.otStart,
        otEnd: req.otEnd,
        leaveType: req.leaveType,
        hireRoleTh: req.hireRoleTh, hireDeptKey: req.hireDeptKey,
        hireLevel: req.hireLevel, hireCount: req.hireCount,
        hireSalaryMin: req.hireSalaryMin, hireSalaryMax: req.hireSalaryMax
      },
      createdBy: currentUser.id,
      createdAt: nowTh(),
      uses: 0
    };
    const list = getUserTemplates();
    setUserTemplates([tpl, ...list]);
    setTplModal(false); setTplName('');
    window.toast(`บันทึกแม่แบบ "${tpl.name}" เรียบร้อย`, { level: 'success' });
  };

  const doCancel = () => {
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, status: 'cancelled', lastActivity: 'ยกเลิกโดยผู้ขอ' } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'reject', refId: req.id, summary: 'ยกเลิกคำขอโดยผู้ขอ' }, ...state.activities]
    });
    setActionModal(null);
    window.toast(`ยกเลิก ${req.id} แล้ว`, { level: 'warning' });
  };

  const doClone = () => {
    const prefix = { withdrawal: 'WR', borrow: 'BR', expense: 'EX', event: 'EV', purchase: 'PO', overtime: 'OT', leave: 'LV', general: 'GN' }[req.type] || 'RQ';
    const newId = mintReqId(prefix, state.requests);
    const flow = MOCK.buildFlow(req.type, currentUser.id).map((s, i) => ({ ...s, status: i === 0 ? 'pending' : 'waiting', at: null, comment: null }));
    // 🐛FIX: เดิม ...req ลาก field สถานะปลายทางติดมาด้วย (receivedAt → รับเรื่องไม่ได้อีกเลย,
    // clearingStatus='verified' → ข้ามการเคลียร์, completedAt ปลอม ฯลฯ) — ล้างให้ครบ
    const cloneAutoUrgent = shouldAutoUrgent(req.type, req.dueDate);
    const clone = {
      ...req, id: newId, requester: currentUser.id, createdAt: nowTh(),
      status: 'pending', currentStep: 0, flow,
      title: req.title + ' (คัดลอก)', lastActivity: 'เพิ่งสร้าง',
      attachments: 0, attachedFiles: [], comments: 0, discussion: [],
      cleared: req.type === 'expense' ? 0 : undefined,
      pendingClear: req.type === 'borrow' || req.type === 'expense',
      receivedAt: undefined, receivedBy: undefined, completedAt: undefined, completedBy: undefined,
      workMode: undefined, clearingStatus: undefined, clearedSubmittedAt: undefined,
      clearedVerifiedAt: undefined, clearedVerifiedBy: undefined, clearingRejectReason: undefined,
      clearingRejectedAt: undefined, clearingRejectedBy: undefined,
      linkedTo: undefined, watchers: undefined, nudgeCount: undefined, updatedAt: undefined,
      priority: cloneAutoUrgent ? 'high' : (req.priority === 'critical' ? 'high' : req.priority),
      autoUrgent: cloneAutoUrgent || undefined
    };
    setState({
      requests: [clone, ...state.requests],
      activities: [{ at: nowTh(), user: currentUser.id, action: 'create', refId: newId, summary: `คัดลอกจาก ${req.id}` }, ...state.activities],
      selectedId: newId
    });
    setActionModal(null);
    window.toast(`สร้างคำขอใหม่ ${newId} จาก ${req.id} — โปรดตรวจสอบและแก้ไข`, { level: 'success' });
  };

  // ===== สร้างใบเบิก IOU จากคำขอนี้ (สำหรับ event/purchase ที่มี breakdown) =====
  const canCreateIOU = (req.type === 'event' || req.type === 'purchase') && req.breakdown && req.breakdown.length > 0;
  const doCreateIOU = () => {
    const newId = mintReqId('EX', state.requests);
    const flow = MOCK.buildFlow('expense', currentUser.id).map((s, i) => ({ ...s, status: i === 0 ? 'pending' : 'waiting', at: null, comment: null }));
    // Copy breakdown ทั้งหมด → amount = sum
    const breakdown = (req.breakdown || []).map(b => ({ label: b.label, amount: Number(b.amount) || 0 }));
    const amount = breakdown.reduce((s, b) => s + (b.amount || 0), 0);
    const iouDue = req.dueDate || req.eventStartDate;
    const iouAutoUrgent = shouldAutoUrgent('expense', iouDue);
    const iou = {
      id: newId, type: 'expense',
      title: `เบิก IOU สำหรับ: ${req.title}`,
      requester: currentUser.id,
      createdAt: nowTh(),
      dueDate: iouDue,
      priority: iouAutoUrgent ? 'high' : (req.priority || 'normal'),
      autoUrgent: iouAutoUrgent || undefined,
      status: 'pending',
      currentStep: 0,
      flow,
      breakdown,
      amount,
      purpose: `เบิกเงินสดล่วงหน้าสำหรับ ${TYPE_LABEL[req.type]?.th || req.type} — ${req.title}\n(เชื่อมจากคำขอ ${req.id})`,
      attachments: 0, comments: 0,
      attachedFiles: [], discussion: [],
      cleared: 0,
      pendingClear: true,
      lastActivity: 'เพิ่งสร้าง',
      linkedTo: [req.id]   // auto-link กลับไปคำขอต้นเรื่อง
    };
    // อัปเดต state — สร้าง IOU + เพิ่ม link ใน parent
    setState({
      requests: [iou, ...state.requests.map(r => r.id === req.id ? { ...r, linkedTo: [...new Set([...(r.linkedTo || []), newId])] } : r)],
      activities: [{ at: nowTh(), user: currentUser.id, action: 'create', refId: newId, summary: `สร้างใบเบิก IOU จาก ${req.id}` }, ...state.activities],
      selectedId: newId
    });
    window.toast(`สร้างใบเบิก IOU ${newId} (${fmtBaht(amount)}) จาก ${req.id} เรียบร้อย`, { level: 'success', duration: 6000 });
  };

  const doDelegate = () => {
    if (!delegateTo) return;
    const target = state.users[delegateTo];
    const newFlow = [...req.flow];
    const curStep = newFlow[req.currentStep];
    // 🐛FIX: step แบบหลายผู้อนุมัติ (userIds) — เดิมแก้แค่ userId ซึ่ง canApproveStep ไม่อ่าน → delegate ไร้ผล
    const newUserIds = curStep.userIds ? curStep.userIds.map(id => id === currentUser.id ? delegateTo : id) : undefined;
    newFlow[req.currentStep] = { ...curStep, userId: delegateTo, userIds: newUserIds, delegatedFrom: currentUser.id, role: curStep.role };
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, flow: newFlow, lastActivity: 'ส่งต่อการอนุมัติ' } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'import', refId: req.id, summary: `ส่งต่อการอนุมัติให้ ${target?.name}` }, ...state.activities]
    });
    setActionModal(null); setDelegateTo('');
    window.toast(`ส่งต่อการอนุมัติให้ ${target?.name} แล้ว`, { level: 'info' });
  };
  const doApprove = () => {
    // 🐛FIX undo: เก็บเฉพาะคำขอนี้ — เดิม restore ทั้ง state ทำให้ action อื่นที่ทำระหว่าง 8 วิ ถูกย้อนไปด้วย
    const snapshotReq = req;
    const undoThis = () => { setState(s => ({ requests: s.requests.map(r => r.id === snapshotReq.id ? snapshotReq : r) })); window.toast('ยกเลิกการอนุมัติแล้ว', { level: 'info' }); };
    const newFlow = [...req.flow];
    newFlow[req.currentStep] = { ...newFlow[req.currentStep], status: 'approved', at: nowTh(), approvedBy: currentUser.id, comment: actionComment || null, signature: getSignature(currentUser.id) || '' };
    const next = req.currentStep + 1;
    const isDone = next >= req.flow.length;
    // เพิ่ม activity 1 รายการสำหรับการอนุมัติ
    const acts = [{ at: nowTh(), user: currentUser.id, action: 'approve', refId: req.id, summary: 'อนุมัติคำขอ' }];
    // 🆕 ถ้าอนุมัติครบ — สร้าง activity broadcast แจ้งแผนกที่ต้องรับเรื่อง
    if (isDone) {
      const receiveDept = getReceiveDeptForReq({ ...req, status: 'progress' }, state.users);
      const deptTh = MOCK.DEPTS[receiveDept]?.th || receiveDept;
      acts.unshift({ at: nowTh(), user: currentUser.id, action: 'qr-scan', refId: req.id, summary: `อนุมัติครบ — แจ้งแผนก${deptTh} รอกดรับเรื่อง`, broadcast: receiveDept });
    }
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, flow: newFlow, currentStep: next, status: isDone ? 'progress' : 'pending', lastActivity: isDone ? `อนุมัติครบ · รอแผนก${MOCK.DEPTS[getReceiveDeptForReq({ ...req, status: 'progress' }, state.users)]?.th || ''}รับเรื่อง` : `ผ่านขั้น ${currentUser.name?.split(' ')[0]}` } : r),
      activities: [...acts, ...state.activities]
    });
    setActionModal(null); setActionComment('');
    if (isDone) {
      const receiveDept = getReceiveDeptForReq({ ...req, status: 'progress' }, state.users);
      const deptTh = MOCK.DEPTS[receiveDept]?.th || receiveDept;
      window.toast(`✅ อนุมัติครบ — แผนก${deptTh} จะเห็นเด้งให้รับเรื่อง`, {
        level: 'success', duration: 8000,
        action: { label: 'ย้อน', onClick: undoThis }
      });
    } else {
      window.toast(`อนุมัติ ${req.id} เรียบร้อย — ส่งต่อขั้นถัดไป`, {
        level: 'success', duration: 8000,
        action: { label: 'ย้อน', onClick: undoThis }
      });
    }
  };
  const doReject = () => {
    // 🐛FIX undo: restore เฉพาะคำขอนี้ (เหตุผลเดียวกับ doApprove)
    const snapshotReq = req;
    const undoThis = () => { setState(s => ({ requests: s.requests.map(r => r.id === snapshotReq.id ? snapshotReq : r) })); window.toast('ยกเลิกการปฏิเสธแล้ว', { level: 'info' }); };
    const newFlow = [...req.flow];
    newFlow[req.currentStep] = { ...newFlow[req.currentStep], status: 'rejected', at: nowTh(), comment: actionComment || 'ไม่ระบุเหตุผล' };
    setState({ requests: state.requests.map(r => r.id === req.id ? { ...r, flow: newFlow, status: 'rejected' } : r), activities: [{ at: nowTh(), user: currentUser.id, action: 'reject', refId: req.id, summary: 'ปฏิเสธคำขอ' }, ...state.activities] });
    setActionModal(null); setActionComment('');
    window.toast(`ปฏิเสธ ${req.id} แล้ว — แจ้งผู้ขอ`, {
      level: 'warning', duration: 8000,
      action: { label: 'ย้อน', onClick: undoThis }
    });
  };
  // v3.2: ตีกลับให้ผู้ขอแก้ไข (ไม่ใช่ปฏิเสธ) — บังคับใส่เหตุผล
  const doReturn = () => {
    if (!actionComment.trim()) return;
    const snapshotReq = req;
    const undoThis = () => { setState(s => ({ requests: s.requests.map(r => r.id === snapshotReq.id ? snapshotReq : r) })); window.toast('ยกเลิกการตีกลับแล้ว', { level: 'info' }); };
    const newFlow = [...req.flow];
    newFlow[req.currentStep] = { ...newFlow[req.currentStep], status: 'returned', at: nowTh(), comment: actionComment };
    setState({
      requests: state.requests.map(r => r.id === req.id ? { ...r, flow: newFlow, status: 'revision', reviseReason: actionComment, reviseBy: currentUser.id, reviseAt: nowTh(), lastActivity: `ตีกลับให้แก้ไข: ${actionComment.slice(0, 40)}` } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'reject', refId: req.id, summary: `ตีกลับให้แก้ไข: ${actionComment}` }, ...state.activities]
    });
    setActionModal(null); setActionComment('');
    window.toast(`↩ ตีกลับ ${req.id} ให้ผู้ขอแก้ไขแล้ว`, { level: 'warning', duration: 8000, action: { label: 'ย้อน', onClick: undoThis } });
  };
  // v3.2: ผู้ขอแก้ไขแล้วส่งขออนุมัติใหม่ — flow เริ่มนับใหม่จากขั้นแรก
  const [reviseForm, setReviseForm] = React.useState(null);
  React.useEffect(() => {
    if (actionModal === 'revise') setReviseForm({
      title: req.title || '', purpose: req.purpose || '', dueDate: req.dueDate || '',
      eventStartDate: req.eventStartDate || '', eventEndDate: req.eventEndDate || '',
      otDate: req.otDate || '', startDate: req.startDate || '', endDate: req.endDate || '',
      hireStartDate: req.hireStartDate || '',
      breakdown: req.breakdown ? req.breakdown.map(b => ({ ...b })) : null
    });
  }, [actionModal]);
  const doResubmit = () => {
    if (!reviseForm) return;
    const f = reviseForm;
    const newFlow = MOCK.buildFlow(req.type, req.requester).map((s, i) => ({ ...s, status: i === 0 ? 'pending' : 'waiting', at: null, comment: null }));
    const typeDate = req.type === 'event' ? f.eventStartDate : req.type === 'overtime' ? f.otDate : req.type === 'leave' ? f.startDate : req.type === 'hire' ? f.hireStartDate : f.dueDate;
    const effDue = typeDate || f.dueDate || req.dueDate;
    const reAutoUrgent = effDue ? shouldAutoUrgent(req.type, effDue) : false;
    const amount = f.breakdown ? f.breakdown.reduce((s, b) => s + (Number(b.amount) || 0), 0) : req.amount;
    setState({
      requests: state.requests.map(r => r.id === req.id ? {
        ...r, title: f.title || r.title, purpose: f.purpose || r.purpose,
        dueDate: effDue || r.dueDate,
        eventStartDate: req.type === 'event' ? f.eventStartDate : r.eventStartDate,
        eventEndDate: req.type === 'event' ? (f.eventEndDate || f.eventStartDate) : r.eventEndDate,
        otDate: req.type === 'overtime' ? f.otDate : r.otDate,
        startDate: req.type === 'leave' ? f.startDate : r.startDate,
        endDate: req.type === 'leave' ? f.endDate : r.endDate,
        hireStartDate: req.type === 'hire' ? f.hireStartDate : r.hireStartDate,
        breakdown: f.breakdown || r.breakdown, amount,
        flow: newFlow, currentStep: 0, status: 'pending',
        priority: reAutoUrgent ? 'high' : (r.autoUrgent && !reAutoUrgent ? 'normal' : r.priority),
        autoUrgent: reAutoUrgent || undefined,
        reviseReason: undefined, reviseBy: undefined, reviseAt: undefined,
        lastActivity: 'แก้ไขและส่งขออนุมัติใหม่'
      } : r),
      activities: [{ at: nowTh(), user: currentUser.id, action: 'create', refId: req.id, summary: 'แก้ไขและส่งขออนุมัติใหม่หลังถูกตีกลับ' }, ...state.activities]
    });
    setActionModal(null); setReviseForm(null);
    window.toast(`ส่ง ${req.id} ขออนุมัติใหม่แล้ว — เริ่มจากขั้นแรก`, { level: 'success' });
  };
  React.useEffect(() => {
    if (!canIAct) return;
    const handler = (e) => {
      // 🐛FIX: กัน Ctrl+A (select all) / Cmd+R (reload) โดน hijack เป็น approve/reject
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || actionModal) return;
      if (e.key === 'a' || e.key === 'A') { e.preventDefault(); setActionModal('approve'); }
      else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); setActionModal('reject'); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [canIAct, actionModal]);
  // คำขอไม่อยู่แล้ว (ลบ/merge จากเครื่องอื่น) — แสดงหลัง hooks รันครบ (กัน React #310)
  if (reqMissing) return (
    <div className="card card-pad center" style={{ padding: 60 }}>
      <div className="text-lg medium mb-8">ไม่พบคำขอ</div>
      <div className="text-sm muted mb-16">คำขอนี้อาจถูกลบหรือถูกแก้ไขจากเครื่องอื่น</div>
      <button className="btn btn-primary" onClick={() => setState({ route: 'my-requests', selectedId: null })}><Icon name="arrowLeft" size={13} /> กลับหน้าคำขอของฉัน</button>
    </div>
  );
  return (
    <div>
      <div className="row spread mb-12" style={{ fontSize: 12.5, color: 'var(--ink-3)' }}>
        <div className="row gap-8">
          <button className="btn btn-ghost btn-sm" onClick={() => setState({ route: 'my-requests' })} style={{ padding: '4px 8px', height: 26 }}><Icon name="arrowLeft" size={12} /> ย้อนกลับ</button>
          <span className="muted-2">·</span><span>คำขอ</span><Icon name="chevronRight" size={10} /><span className="en tnum">{req.id}</span>
        </div>
        <div className="row gap-6">
          <button className="btn btn-ghost btn-sm" onClick={() => { togglePin(req.id); window.toast(getPinned().includes(req.id) ? 'ปักหมุดแล้ว' : 'เลิกปักหมุดแล้ว', { level: 'info' }); }} style={{ height: 28 }} title="ปักหมุด">
            <Icon name={getPinned().includes(req.id) ? 'starFill' : 'star'} size={13} style={{ color: getPinned().includes(req.id) ? '#facc15' : 'inherit' }} /> ปักหมุด
          </button>
          <button className="btn btn-ghost btn-sm" onClick={() => setDocOpen(true)} style={{ height: 28 }} title="ดูเอกสารใบขออนุมัติ"><Icon name="file" size={13} /> เอกสาร</button>
          <button className="btn btn-ghost btn-sm" onClick={() => setActionModal('clone')} style={{ height: 28 }} title="คัดลอกเป็นคำขอใหม่"><Icon name="copy" size={13} /> คัดลอก</button>
          {canCreateIOU && <button className="btn btn-ghost btn-sm" onClick={doCreateIOU} style={{ height: 28, color: 'var(--violet-ink)' }} title="สร้างใบเบิกเงินสดล่วงหน้า (IOU) จากคำขอนี้ — copy breakdown ทั้งหมดมา"><Icon name="wallet" size={13} /> สร้างใบเบิก IOU</button>}
          <button className="btn btn-ghost btn-sm" onClick={() => setTplModal(true)} style={{ height: 28 }} title="บันทึกเป็นแม่แบบไว้ใช้ภายหลัง"><Icon name="bookmark" size={13} /> บันทึกเป็นแม่แบบ</button>
          <button className="btn btn-ghost btn-sm" onClick={toggleWatch} style={{ height: 28, color: isWatching ? 'var(--brand-ink)' : 'var(--ink-2)' }} title={isWatching ? `ยกเลิกติดตาม (${watchers.length} คนกำลังติดตาม)` : `เริ่มติดตาม (${watchers.length} คนกำลังติดตาม)`}><Icon name={isWatching ? 'starFill' : 'star'} size={13} style={{ color: isWatching ? '#facc15' : 'inherit' }} /> {isWatching ? `ติดตามอยู่ · ${watchers.length}` : `ติดตาม · ${watchers.length}`}</button>
          {canBumpPriority && (
            <div style={{ position: 'relative' }}>
              <button className="btn btn-ghost btn-sm" onClick={() => setPriorityOpen(!priorityOpen)} style={{ height: 28 }} title={isAutoUrgentLocked ? 'บังคับด่วนอัตโนมัติ — ลด priority ต่ำกว่า เร่งด่วน ไม่ได้' : 'เปลี่ยนความเร่งด่วน'}>
                <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: PRIORITIES.find(p => p.key === (req.priority || 'normal'))?.color, marginRight: 4 }}></span>
                {PRIORITIES.find(p => p.key === (req.priority || 'normal'))?.th || 'ปกติ'}{isAutoUrgentLocked && <span style={{ marginLeft: 4 }}>🔒</span>} <Icon name="chevronRight" size={10} style={{ transform: 'rotate(90deg)' }} />
              </button>
              {priorityOpen && (
                <div style={{ position: 'absolute', top: '100%', right: 0, marginTop: 4, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 8, boxShadow: 'var(--shadow-lg)', zIndex: 50, minWidth: 220 }} onMouseLeave={() => setPriorityOpen(false)}>
                  {isAutoUrgentLocked && <div className="text-xs" style={{ padding: '6px 12px', background: 'var(--red-soft)', color: 'var(--red-ink)', borderBottom: '1px solid var(--border)' }}>⚡ บังคับด่วนอัตโนมัติ — เลือกได้แค่ เร่งด่วน/วิกฤต</div>}
                  {PRIORITIES.map(p => {
                    const disabled = isAutoUrgentLocked && (p.key === 'normal' || p.key === 'low');
                    return (
                    <button key={p.key} className="dropdown-item" disabled={disabled} onClick={() => !disabled && setPriority(p.key)} style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: 'none', border: 'none', cursor: disabled ? 'not-allowed' : 'pointer', textAlign: 'left', color: disabled ? 'var(--ink-3)' : 'var(--ink)', opacity: disabled ? 0.5 : 1 }}>
                      <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: p.color }}></span>
                      <span className="text-sm">{p.th}{disabled && ' (ล็อค)'}</span>
                      {(req.priority || 'normal') === p.key && <Icon name="check" size={11} style={{ marginLeft: 'auto', color: 'var(--brand)' }} />}
                    </button>
                    );
                  })}
                </div>
              )}
            </div>
          )}
          {canReschedule && <button className="btn btn-ghost btn-sm" onClick={() => { setNewDueDate(req.dueDate); setRescheduleOpen(true); }} style={{ height: 28 }} title="เลื่อนวันครบกำหนด"><Icon name="calendar" size={13} /> เลื่อนกำหนด</button>}
          {currentSnoozeUntil ? (
            <button className="btn btn-ghost btn-sm" onClick={doUnsnooze} style={{ height: 28, color: 'var(--brand-ink)' }} title={`เลื่อนแจ้งเตือนถึง ${currentSnoozeUntil.toLocaleDateString('th-TH')} — กดเพื่อยกเลิก`}><Icon name="clock" size={13} /> Snoozed ถึง {currentSnoozeUntil.toLocaleDateString('th-TH')}</button>
          ) : (
            <button className="btn btn-ghost btn-sm" onClick={() => setSnoozeOpen(true)} style={{ height: 28 }} title="ซ่อนจาก Inbox ของฉันชั่วคราว"><Icon name="clock" size={13} /> Snooze</button>
          )}
          <button className="btn btn-ghost btn-sm" onClick={() => setLinkOpen(true)} style={{ height: 28 }} title={`คำขอที่เกี่ยวข้อง (${linkedReqs.length + linkedFromOthers.length})`}><Icon name="paperclip" size={13} /> เชื่อมโยง{linkedReqs.length + linkedFromOthers.length > 0 ? ` (${linkedReqs.length + linkedFromOthers.length})` : ''}</button>
          <button className="btn btn-ghost btn-sm" onClick={generateEmailBody} style={{ height: 28 }} title="คัดลอกเนื้อหา email สำหรับส่งต่อ"><Icon name="send" size={13} /> Email</button>
          {canNudge && <button className="btn btn-ghost btn-sm" onClick={doNudge} style={{ height: 28, color: 'var(--amber-ink)' }} title={req.nudgeCount ? `เคยเตือนแล้ว ${req.nudgeCount} ครั้ง` : 'ส่งเตือนผู้อนุมัติคนปัจจุบัน'}><Icon name="bell" size={13} /> เตือนผู้อนุมัติ{req.nudgeCount ? ` (${req.nudgeCount})` : ''}</button>}
          {canCancel && <button className="btn btn-ghost btn-sm" onClick={() => setActionModal('cancel')} style={{ height: 28, color: 'var(--red-ink)' }} title="ยกเลิกคำขอ"><Icon name="x" size={13} /> ยกเลิก</button>}
        </div>
      </div>
      <div className="card mb-16"><div style={{ padding: 22 }}>
        <div className="spread mb-12">
          <div className="row gap-16"><TypeIcon type={req.type} size={44} /><div>
            <div className="row gap-8 mb-4"><span className="en tnum text-sm muted">{req.id}</span><TypeBadge type={req.type} />{req.priority==='high'&&<span className="badge badge-red"><Icon name="flame" size={10}/> เร่งด่วน</span>}</div>
            <div className="text-xl bold" style={{ marginBottom: 4 }}>{req.title}</div>
            <div className="row gap-12 text-xs muted"><span><Avatar user={u} size="sm"/> {u?.name}</span>{req.submittedBy && req.submittedBy !== req.requester && (<span className="badge badge-brand"><Icon name="send" size={9}/> ยื่นโดย {state.users[req.submittedBy]?.name?.split(' ')[0] || req.submittedBy}</span>)}<span><Icon name="calendar" size={11}/> {req.createdAt}</span><span><Icon name="clock" size={11}/> ครบ {req.dueDate}</span></div>
          </div></div>
          <div className="col gap-8" style={{ alignItems: 'flex-end' }}><StatusDot status={req.status}/>{req.amount>0&&<div className="text-2xl en tnum bold">{fmtBaht(req.amount)}</div>}</div>
        </div>
        {/* OOO Warning — เตือนเมื่อผู้อนุมัติคนปัจจุบันไม่อยู่ */}
        {req.status === 'pending' && oooApprovers.length > 0 && (
          <div className="alert alert-amber" style={{marginTop:8, borderColor: 'var(--amber)'}}>
            <Icon name="bellOff" size={16} style={{marginTop:1, color:'var(--amber-ink)'}}/>
            <div className="flex-1">
              <div className="medium">⚠️ ผู้อนุมัติไม่อยู่ออฟฟิศ — {oooApprovers.map(o => o.user?.name).join(', ')}</div>
              <div className="text-xs muted mt-2">
                {oooApprovers.map((o, i) => {
                  const dl = o.ooo.delegate ? state.users[o.ooo.delegate] : null;
                  return (
                    <div key={i}>
                      {o.ooo.from && o.ooo.to ? `📅 ${o.ooo.from} – ${o.ooo.to} · ` : ''}
                      {dl ? <>มอบหมายให้ <span className="medium">{dl.name}</span> — แนะนำกด "ส่งต่อ" ไปยังคนนี้</> : 'ยังไม่ได้ระบุผู้รับมอบหมาย — แนะนำส่งต่อด้วยตนเอง'}
                      {o.ooo.message && <div className="muted" style={{fontStyle:'italic', marginTop:2}}>"{o.ooo.message}"</div>}
                    </div>
                  );
                })}
              </div>
            </div>
            {canIAct && oooApprovers[0]?.ooo?.delegate && (
              <button className="btn btn-amber btn-sm" onClick={() => { setDelegateTo(oooApprovers[0].ooo.delegate); setActionModal('delegate'); }} style={{background:'var(--amber)', color:'white', borderColor:'var(--amber)'}}><Icon name="send" size={12}/> ส่งต่อ {state.users[oooApprovers[0].ooo.delegate]?.name?.split(' ')[0]}</button>
            )}
          </div>
        )}

        {canIAct&&<div className="alert alert-amber" style={{marginTop:8}}>
          <Icon name="warning" size={16} style={{marginTop:1}}/>
          <div className="flex-1"><div className="medium">รออนุมัติของคุณ — ขั้นที่ {req.currentStep+1} ({currentStep.role})</div><div className="text-xs muted mt-2">ทางลัด: กด <kbd style={{padding:'1px 6px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:4,fontFamily:'var(--font-en)',fontSize:11}}>A</kbd> อนุมัติ · <kbd style={{padding:'1px 6px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:4,fontFamily:'var(--font-en)',fontSize:11}}>R</kbd> ปฏิเสธ</div></div>
          <button className="btn btn-ghost btn-sm" onClick={() => setActionModal('delegate')} title="ส่งต่อให้คนอื่นอนุมัติ"><Icon name="send" size={13}/> ส่งต่อ</button>
          <button className="btn btn-sm" onClick={() => setActionModal('return')} style={{ background: 'var(--amber)', color: 'white', borderColor: 'var(--amber)' }} title="ตีกลับให้ผู้ขอแก้ไขแล้วส่งขออนุมัติใหม่ (ต้องระบุเหตุผล)"><Icon name="arrowLeft" size={13}/> ตีกลับ</button>
          <button className="btn btn-danger btn-sm" onClick={() => setActionModal('reject')}><Icon name="x" size={13}/> ปฏิเสธ</button>
          <button className="btn btn-success btn-sm" onClick={() => setActionModal('approve')}><Icon name="check" size={13}/> อนุมัติ</button>
        </div>}

        {/* v3.2: คำขอถูกตีกลับ — ผู้ขอเห็นเหตุผล + แก้ไขแล้วส่งใหม่ได้ */}
        {req.status === 'revision' && (
          <div className="alert" style={{ marginTop: 8, background: 'var(--amber-soft)', borderColor: 'var(--amber)' }}>
            <Icon name="arrowLeft" size={16} style={{ marginTop: 1, color: 'var(--amber-ink)' }} />
            <div className="flex-1">
              <div className="medium" style={{ color: 'var(--amber-ink)' }}>↩ ถูกตีกลับให้แก้ไข โดย {state.users[req.reviseBy]?.name || req.reviseBy} · {req.reviseAt}</div>
              {req.reviseReason && <div className="text-sm mt-4" style={{ color: 'var(--amber-ink)', background: 'rgba(255,255,255,0.55)', padding: '6px 10px', borderRadius: 4 }}><strong>เหตุผล:</strong> {req.reviseReason}</div>}
              {isOwner && <div className="text-xs muted mt-4">แก้ไขข้อมูลตามเหตุผลข้างต้น แล้วส่งขออนุมัติใหม่ — สายอนุมัติจะเริ่มนับใหม่จากขั้นแรก</div>}
            </div>
            {isOwner && <button className="btn btn-primary btn-sm" onClick={() => setActionModal('revise')}><Icon name="edit" size={13}/> แก้ไขและส่งใหม่</button>}
          </div>
        )}

        {/* รอรับเรื่อง — แสดงให้ทุกคนในแผนกผู้ขอ */}
        {canReceive && (
          <div className="alert alert-amber" style={{marginTop:8}}>
            <Icon name="truck" size={16} style={{marginTop:1}}/>
            <div className="flex-1">
              <div className="medium">อนุมัติครบ — แผนก{MOCK.DEPTS[getReceiveDeptForReq(req, state.users)]?.th || 'ที่เกี่ยวข้อง'}กดรับเรื่อง</div>
              <div className="text-xs muted mt-2">
                <span className="medium">รับและทำต่อ</span> = เริ่มนับเวลาทำงาน รอกดส่งงาน · <span className="medium">รับและจบ</span> = ปิดงานทันที (ไม่ต้องดำเนินการเพิ่ม)
              </div>
            </div>
            <div className="row gap-6">
              <button className="btn btn-outline btn-sm" onClick={doReceiveClose} title="รับเรื่องและปิดงานเลย ไม่ต้องดำเนินการต่อ">
                <Icon name="check" size={13}/> รับและจบ
              </button>
              <button className="btn btn-primary btn-sm" onClick={doReceiveContinue} title="รับเรื่องและเริ่มดำเนินงานต่อ">
                <Icon name="truck" size={13}/> รับและทำต่อ
              </button>
            </div>
          </div>
        )}

        {/* รับเรื่องแล้ว — แสดง deadline + ปุ่มส่งงาน */}
        {req.status === 'progress' && req.receivedAt && req.status !== 'done' && (
          <div className="alert alert-info" style={{marginTop:8}}>
            <Icon name="clock" size={16} style={{marginTop:1}}/>
            <div className="flex-1">
              <div className="medium">กำลังดำเนินการ {req.receivedBy && `· รับโดย ${state.users[req.receivedBy]?.name?.split(' ')[0]}`}</div>
              <div className="text-xs muted mt-2">
                รับเรื่อง: {req.receivedAt}
                {workSLA && <> · กำหนดส่ง: <span style={{ color: workSLA.level === 'overdue' ? 'var(--red-ink)' : workSLA.level === 'urgent' ? 'var(--amber-ink)' : 'var(--ink-2)', fontWeight: 600 }}>{workSLA.label}</span></>}
              </div>
            </div>
            {canComplete && <button className="btn btn-success btn-sm" onClick={doComplete}><Icon name="check" size={13}/> ส่งงาน</button>}
          </div>
        )}

        {/* เสร็จสมบูรณ์ */}
        {req.status === 'done' && req.completedAt && (
          <div className="alert alert-green" style={{marginTop:8}}>
            <Icon name="check" size={16} style={{marginTop:1}}/>
            <div className="flex-1">
              <div className="medium">{req.workMode === 'close' ? 'รับและจบงานเรียบร้อย' : 'เสร็จสมบูรณ์'} · {req.completedAt}</div>
              {req.completedBy && <div className="text-xs muted mt-2">
                {req.workMode === 'close' ? 'ปิดทันทีตอนรับเรื่อง' : 'ส่งงาน'} โดย {state.users[req.completedBy]?.name}
                {req.workMode === 'close' && <span className="badge badge-brand" style={{marginLeft:6}}>ไม่นับ KPI ทำงาน</span>}
              </div>}
            </div>
